        <section class="wrapper">
            <div class="form signup">
                <header>Qeydiyyatdan kec</header>
                <form onsubmit="qeydiyyat(event)">
                    <input type="text" id="signupName" placeholder="Adınız" required />
                    <input type="email" id="signupEmail" placeholder="gmail" required />
                    <input type="password" id="signupPassword" placeholder="Parol" required />
                    <div class="checkbox">
                        <input type="checkbox" id="signupCheck"/>
                        <label for="signupCheck"> butun sertleri qebul edirem</label>
                    </div>
                    <input type="submit" value="Kec"/>
                </form>
            </div>
            <br><br>

<div id="g_id_onload"

</div>

            </div>
