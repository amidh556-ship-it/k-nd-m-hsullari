<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Az Operator</title>

    <link rel="stylesheet" href="bot.css">
</head>

<body>

    <div class="chat-container">

        <div class="chat-box" id="chat-box">

            <div class="bot-message">
                Salam, mən Kənd Məhsullarının botuyam 🤖
                Sizə necə kömək ola bilərəm?
            </div>

        </div>

        <div class="chat-input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Mesaj yaz..."
                class="chat-input"
            >

            <button
                id="send-btn"
                class="chat-btn">
                Göndər
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
