<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kənd məhsulları - Ağıllı dəstək</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f5}
header{background:#168b45;color:white;padding:17px;text-align:center;font-weight:bold}
#chat{height:calc(100dvh - 130px);overflow-y:auto;padding:14px;max-width:650px;margin:auto}
.msg{padding:12px;margin:9px 0;border-radius:12px;max-width:85%;overflow-wrap:anywhere;white-space:pre-wrap}
.bot{background:white}
.customer{background:#d8f8df;margin-left:auto}
.operator{background:#e4e7eb}
#bottom{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px;display:flex;gap:7px}
#input{flex:1;min-width:0;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:16px}
button{padding:12px;border:0;border-radius:9px;background:#168b45;color:white;font-weight:bold}
</style>
</head>
<body>

<header>🤖 Kənd məhsulları — Ağıllı dəstək</header>

<div id="chat">
 <div class="msg bot">Salam! 😊 Mən Kənd məhsullarının köməkçi botuyam.

Sifarişiniz, malınız, ödənişiniz və geri qaytarma haqqında suallarınızı yaza bilərsiniz.

Operatora qoşulmaq üçün operator istəyinizi 3 dəfə bildirin.</div>
</div>

<div id="bottom">
 <input id="input" placeholder="Mesajınızı yazın..." autocomplete="off">
 <button id="send">Göndər</button>
</div>

<script type="module">
import {initializeApp}
 from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getDatabase,ref,push,onChildAdded,get,query,orderByChild,equalTo
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app=initializeApp({
 apiKey:"AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",
 authDomain:"kendmehsullari-6a53d.firebaseapp.com",
 databaseURL:"https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",
 projectId:"kendmehsullari-6a53d",
 storageBucket:"kendmehsullari-6a53d.firebasestorage.app",
 messagingSenderId:"551607499773",
 appId:"1:551607499773:web:a84aa63dc5b55c38687794"
});

const db=getDatabase(app);
const messagesRef=ref(db,"messages");
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");

const email=(localStorage.getItem("userEmail")||"").toLowerCase().trim();

let operatorRequests=0;
let requestSent=false;
let lastOperatorMessage="";
let busy=false;

function show(text,cls="bot"){
 const el=document.createElement("div");
 el.className="msg "+cls;
 el.textContent=text;
 chat.appendChild(el);
 chat.scrollTop=chat.scrollHeight;
}

function normalize(s){
 return String(s||"")
 .toLocaleLowerCase("az")
 .replace(/[.,!?;:()[\]"']/g," ")
 .replace(/\s+/g," ")
 .trim();
}

function wantsOperator(t){
 return /(operator|operatör|agent|agente|agentə|canlı dəstək|canli destek)/i.test(t)
 && /(bağla|bagla|qoş|qos|istəyirəm|isteyirem|məni|meni|danış|danis|lazımdır|lazimdir|kömək|komek|birləşdir|birlesdir|istəyir|isteyir)/i.test(t);
}

function money(value){
 const n=Number(value);
 return Number.isFinite(n) ? n.toFixed(2)+" AZN" : "Məlumat yoxdur";
}

function dateText(value){
 if(!value)return "";
 const d=typeof value==="number" ? new Date(value) : new Date(value);
 if(Number.isNaN(d.getTime()))return "";
 return d.toLocaleDateString("az-AZ");
}

function productText(products){
 if(Array.isArray(products)){
  return products.map(p=>{
   if(typeof p==="string")return p;
   if(!p)return "";
   return (p.name||p.title||p.productName||p.mehsul||"Məhsul")+
    (p.quantity ? " × "+p.quantity : "");
  }).filter(Boolean).join(", ");
 }
 if(products && typeof products==="object"){
  return Object.values(products).map(p=>{
   if(typeof p==="string")return p;
   if(!p)return "";
   return (p.name||p.title||p.productName||"Məhsul")+
    (p.quantity ? " × "+p.quantity : "");
  }).filter(Boolean).join(", ");
 }
 return String(products||"Məhsul məlumatı yoxdur");
}

// Firebase-dən yalnız e-poçt sahəsi uyğun gələn qeydləri soruşur.
// Bu sorğunun işləməsi Firebase Database Rules-dan asılıdır.
async function readByEmail(path){
 if(!email)return [];
 const q=query(ref(db,path),orderByChild("email"),equalTo(email));
 const snap=await get(q);
 const rows=[];
 snap.forEach(child=>{
  rows.push({...child.val(),_key:child.key});
 });
 return rows;
}

async function getAccountData(){
 if(!email)throw new Error("LOGIN_REQUIRED");

 const [orders,returns]=await Promise.all([
  readByEmail("orders"),
  readByEmail("returnRequests")
 ]);

 return {orders,returns};
}

function orderSummary(o,index){
 const id=o.orderId||o._key||("Sifariş "+(index+1));
 const products=productText(o.products);
 const status=o.status||"Status qeyd edilməyib";
 const payment=o.paymentStatus||"Ödəniş statusu qeyd edilməyib";
 const tracking=o.trackingCode||"İzləmə kodu əlavə edilməyib";
 const total=o.total!=null ? money(o.total) : "Məbləğ qeyd edilməyib";
 const date=dateText(o.createdAt||o.date);

 return "📦 Sifariş: "+id+
  "\nMəhsul: "+products+
  "\nStatus: "+status+
  "\nÖdəniş: "+payment+
  "\nİzləmə kodu: "+tracking+
  "\nMəbləğ: "+total+
  (date ? "\nTarix: "+date : "");
}

function returnSummary(r){
 return "Geri qaytarma sorğusu:"+
  "\nMəhsul: "+productText(r.products||r.product||r.productName)+
  "\nStatus: "+(r.status||r.returnStatus||"Status qeyd edilməyib")+
  (r.orderId ? "\nSifariş: "+r.orderId : "");
}

async function answer(text){
 const t=normalize(text);

 if(/^(salam|salamlar|salam aleykum|aleykum salam|hello|hi|sa|salam bot)$/.test(t)){
  return "Salam! 😊 Sizə necə kömək edə bilərəm? Sifariş, mal, ödəniş, çatdırılma və geri qaytarma barədə yaza bilərsiniz.";
 }

 if(/^(necəsən|necesen|necəsiz|necesiz)$/.test(t)){
  return "Yaxşıyam, təşəkkür edirəm! 😊 Sizə necə kömək edim?";
 }

 const asksOrder=
  /(sifariş|sifaris|sifarişim|sifarishim|malım|malim|malımın|malimin|malım harda|malim harda|məhsulum|mehsulum|bağlamam|baglamam)/i.test(t);

 const asksPayment=
  /(ödəniş|odenis|pul|qəbz|qebz|bank|kart|ödəmişəm|odemisem|təsdiq|tesdiq)/i.test(t);

 const asksReturn=
  /(geri qaytar|qaytarma|qaytarmaq|qaytarım|qaytarim|pulumu geri|refund)/i.test(t);

 const asksStatus=
  /(harada|hardadır|hardadi|haradadır|çatıb|catib|gəlib|gelib|yoldadır|yoldadi|çatdırılıb|catdirilib|vəziyyət|veziyyet|status|nə vaxt|ne vaxt|nə yerdə|ne yerde|hazırdır|hazirdi)/i.test(t);

 const asksDelivery=
  /(çatdırılma|catdirilma|kuryer|çatdır|catdir|gətir|getir)/i.test(t);

 const asksAccount=
  /(hesabım|hesabim|profilim|mənim hesabım|menim hesabim|sifarişlərim|sifarislerim)/i.test(t);

 const asksProduct=
  /(məhsul|mehsul|mal|qiymət|qiymet|neçəyə|neceye|tato|maşın|masin)/i.test(t);

 // Sifariş, ödəniş, mal və geri qaytarma suallarında
 // əvvəlcə müştərinin öz məlumatlarını oxumağa çalışır.
 if(asksOrder||asksPayment||asksReturn||asksDelivery||asksAccount){
  if(!email){
   return "Sifariş və hesab məlumatlarını yoxlamaq üçün əvvəlcə saytınıza daxil olun. Sonra sualınızı yenidən yazın.";
  }

  try{
   const data=await getAccountData();
   const orders=data.orders;
   const returns=data.returns;

   if(asksReturn){
    const matchingReturns=returns.filter(r=>{
     const s=normalize((r.status||"")+" "+(r.returnStatus||""));
     return s!=="";
    });

    if(matchingReturns.length){
     return "Hesabınızdakı geri qaytarma məlumatları:\n\n"+
      matchingReturns.map(returnSummary).join("\n\n")+
      "\n\nBaşqa sifariş barədə soruşmaq istəyirsinizsə, sifariş nömrəsini yazın.";
    }

    const withReturns=orders.filter(o=>o.returnRequest);
    if(withReturns.length){
     return "Sifarişinizdəki geri qaytarma məlumatı:\n\n"+
      withReturns.map(o=>orderSummary(o,0)+"\nGeri qaytarma: "+
       (o.returnRequest.status||o.returnRequest.returnStatus||"Sorğu qeydi var")).join("\n\n");
    }

    return "Hesabınızda geri qaytarma sorğusu tapılmadı. Əvvəlcə sifarişlər bölməsində məhsulunuz üçün geri qaytarma seçiminin aktiv olub-olmadığını yoxlayın.";
   }

   if(!orders.length){
    return "Hesabınıza uyğun sifariş tapılmadı. Sayta daxil olduğunuz hesabın e-poçtunu və sifariş zamanı istifadə etdiyiniz hesabı yoxlayın.";
   }

   // Əgər müştəri sifariş nömrəsi yazıbsa, həmin sifarişi önə çıxarır.
   const orderIdMatch=text.match(/SIF-[A-Z0-9-]+/i);
   let chosen=orders;

   if(orderIdMatch){
    const found=orders.filter(o=>
     String(o.orderId||o._key||"").toLowerCase()===orderIdMatch[0].toLowerCase()
    );
    if(found.length)chosen=found;
   }

   const sorted=chosen.slice().sort((a,b)=>{
    const da=Number(a.createdAt||a.date||0);
    const dbb=Number(b.createdAt||b.date||0);
    return dbb-da;
   });

   if(asksPayment){
    return "Hesabınızdakı sifarişlərin ödəniş məlumatları:\n\n"+
     sorted.map((o,i)=>orderSummary(o,i)).join("\n\n")+
     "\n\nÖdəniş statusu bazada necə qeyd olunubsa, yuxarıda elə göstərilib.";
   }

   if(asksDelivery||asksStatus||asksOrder||asksAccount){
    return "Hesabınızdakı sifariş məlumatları:\n\n"+
     sorted.map((o,i)=>orderSummary(o,i)).join("\n\n")+
     "\n\nBu məlumatlar sifariş bazasında saxlanılan statuslara əsaslanır. Dəqiq çatdırılma tarixi qeyd edilməyibsə, onu təxmin edə bilmirəm.";
   }

  }catch(e){
   console.error("Hesab məlumatları oxunmadı:",e);
   return "Hesab məlumatlarını oxumaq mümkün olmadı. Firebase oxuma icazələrini və orders/returnRequests bölmələrində e-poçt sahəsinin mövcudluğunu yoxlamaq lazımdır.";
  }
 }

 if(asksProduct){
  return "Məhsul və qiymət haqqında kömək edim. 😊 Zəhmət olmasa, məhsulun dəqiq adını yazın. Məhsulun qiyməti məhsul səhifəsində göstərilən məlumatla yoxlanmalıdır.";
 }

 if(/(sağ ol|sag ol|təşəkkür|tesekkur|çox sağ ol|cox sag ol)/.test(t)){
  return "Buyurun! 😊 Başqa sualınız olsa, yaza bilərsiniz.";
 }

 if(/(kömək|komek|problem|işləmir|islemir|açılmır|acilmir)/.test(t)){
  return "Kömək etməyə hazıram. 😊 Problemi bir az ətraflı yazın ki, uyğun cavab verə bilim.";
 }

 return "Sualınızı başa düşməyə çalışıram. 😊 Sifariş, mal, ödəniş, çatdırılma və ya geri qaytarma ilə bağlı sualınızı daha ətraflı yaza bilərsiniz. Operator istəyirsinizsə, operatora qoşulmaq istəyinizi 3 dəfə bildirin.";
}

async function sendMessage(){
 if(busy)return;

 const text=input.value.trim();
 if(!text)return;

 input.value="";
 show(text,"customer");

 const t=normalize(text);

 if(wantsOperator(t)){
  operatorRequests++;

  if(operatorRequests<3){
   show("Operatora qoşulmaq istəyiniz qeydə alındı: "+operatorRequests+"/3. İstəsəniz, probleminizi də yaza bilərsiniz.");
   return;
  }

  if(!email){
   show("Operatora qoşulmaq üçün əvvəlcə hesabınıza daxil olun.");
   operatorRequests=0;
   return;
  }

  if(requestSent){
   show("⏳ Sorğunuz artıq göndərilib. Operatorumuz ən qısa zamanda sizinlə əlaqə saxlayacaq.");
   return;
  }

  try{
   await push(messagesRef,{
    type:"operator_request",
    sender:"customer",
    email,
    text:"Müştəri operatora qoşulmaq istəyir: "+text,
    message:"Müştəri operatora qoşulmaq istəyir: "+text,
    status:"waiting",
    time:Date.now(),
    createdAt:Date.now()
   });
   requestSent=true;
   show("⏳ Sizi operatora bağlayırıq. Zəhmət olmasa, gözləyin. Operatorumuz ən qısa zamanda sizinlə əlaqə saxlayacaq.");
  }catch(e){
   console.error(e);
   show("Sorğu göndərilmədi. Firebase bağlantısını yoxlayın və yenidən cəhd edin.");
  }
  return;
 }

 if(email){
  try{
   await push(messagesRef,{
    sender:"customer",
    email,
    text,
    message:text,
    time:Date.now(),
    createdAt:Date.now()
   });
  }catch(e){
   console.error("Mesaj Firebase-ə yazılmadı:",e);
  }
 }

 busy=true;
 send.disabled=true;
 send.textContent="...";
 try{
  const reply=await answer(text);
  show(reply);
 }catch(e){
  console.error(e);
  show("Cavab hazırlayarkən xəta baş verdi. Bir az sonra yenidən cəhd edin.");
 }finally{
  busy=false;
  send.disabled=false;
  send.textContent="Göndər";
 }
}

send.onclick=sendMessage;
input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

onChildAdded(messagesRef,snap=>{
 const d=snap.val();
 if(!d||!email)return;
 if(String(d.email||"").toLowerCase().trim()!==email)return;
 if(d.sender!=="agent"&&d.sender!=="operator")return;

 const msg=String(d.message||d.text||"");
 if(!msg||msg===lastOperatorMessage)return;
 lastOperatorMessage=msg;
 show("Operator: "+msg,"operator");
});
</script>
</body>
</html>
