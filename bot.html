<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kənd məhsulları - Dəstək</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f3f5}
header{background:#168b45;color:white;padding:17px;text-align:center;font-weight:bold}
#chat{height:calc(100dvh - 130px);overflow-y:auto;padding:14px;max-width:650px;margin:auto}
.msg{padding:12px;margin:9px 0;border-radius:12px;max-width:85%;overflow-wrap:anywhere}
.bot{background:white}
.customer{background:#d8f8df;margin-left:auto}
.operator{background:#e4e7eb}
#bottom{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px;display:flex;gap:7px}
#input{flex:1;min-width:0;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:16px}
button{padding:12px;border:0;border-radius:9px;background:#168b45;color:white;font-weight:bold}
</style>
</head>
<body>
<header>🤖 Kənd məhsulları — Dəstək</header>
<div id="chat">
<div class="msg bot">Salam! Sizə necə kömək edə bilərəm? Operator üçün “Məni operatora bağla” yazın.</div>
</div>
<div id="bottom">
<input id="input" placeholder="Mesajınızı yazın...">
<button id="send">Göndər</button>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,push,onChildAdded}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app=initializeApp({
 apiKey:"AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",
 authDomain:"kendmehsullari-6a53d.firebaseapp.com",
 databaseURL:"https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",
 projectId:"kendmehsullari-6a53d",
 storageBucket:"kendmehsullari-6a53d.firebasestorage.app",
 messagingSenderId:"551607499773",
 appId:"1:551607499773:web:a84aa63dc5b55c38687794"
});

const db=getDatabase(app);
const messagesRef=ref(db,"messages");
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");
const email=(localStorage.getItem("userEmail")||"").toLowerCase().trim();
let requestSent=false;

function show(text,cls="bot"){
 const el=document.createElement("div");
 el.className="msg "+cls;
 el.textContent=text;
 chat.appendChild(el);
 chat.scrollTop=chat.scrollHeight;
}

function normalize(s){
 return s.toLocaleLowerCase("az").replace(/[.,!?]/g," ").trim();
}

function wantsOperator(s){
 return /(operator|operatör|agent|agente|canlı dəstək|canli destek)/i.test(s)
 && /(bağla|bagla|qoş|qos|danış|danis|istəyirəm|isteyirem|lazımdır|lazimdir|məni|meni|kömək|komek)/i.test(s)
 || /məni operatora bağla|meni operatora bagla|məni agentə bağla|meni agente bagla|operatora bağla|operatöre bağla|operatorla danışmaq istəyirəm/i.test(s);
}

async function sendMessage(){
 const text=input.value.trim();
 if(!text)return;
 input.value="";
 show(text,"customer");

 if(wantsOperator(normalize(text))){
  if(!email){
   show("Operatora qoşulmaq üçün əvvəlcə hesabınıza daxil olun.");
   return;
  }
  if(requestSent){
   show("Sorğunuz göndərilib. Operatorun cavabını gözləyin.");
   return;
  }
  try{
   await push(messagesRef,{
    type:"operator_request",
    sender:"customer",
    email,
    text:"Müştəri operatorla danışmaq istəyir: "+text,
    message:"Müştəri operatorla danışmaq istəyir: "+text,
    status:"waiting",
    time:Date.now(),
    createdAt:Date.now()
   });
   requestSent=true;
   show("Operatora sorğu göndərildi. Zəhmət olmasa, cavabı gözləyin.");
  }catch(e){
   show("Sorğu göndərilmədi. Firebase bağlantısını yoxlayın.");
  }
  return;
 }

 show("Sizə kömək etməyə çalışaram. Operatorla danışmaq üçün “Məni operatora bağla” yazın.");
}

send.onclick=sendMessage;
input.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});

onChildAdded(messagesRef,snap=>{
 const d=snap.val();
 if(!d||!email)return;
 if(String(d.email||"").toLowerCase().trim()!==email)return;
 if(d.sender!=="agent"&&d.sender!=="operator")return;
 show("Operator: "+(d.message||d.text||""),"operator");
});
</script>
</body>
</html>
