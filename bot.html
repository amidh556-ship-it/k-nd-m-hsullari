<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kənd məhsulları - Operator</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
}

.chat{
    max-width:700px;
    margin:auto;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:white;
}

.header{
    background:#111827;
    color:white;
    padding:18px;
}

.header h2{
    margin:0;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
    background:#f8fafc;
}

.message{
    max-width:80%;
    padding:11px 14px;
    margin-bottom:10px;
    border-radius:14px;
    word-break:break-word;
}

.customer{
    background:#2563eb;
    color:white;
    margin-left:auto;
}

.agent{
    background:#e5e7eb;
    color:#111;
    margin-right:auto;
}

.sender{
    font-size:11px;
    opacity:.7;
    margin-bottom:5px;
}

audio{
    width:240px;
    max-width:100%;
}

.bottom{
    display:flex;
    gap:7px;
    padding:10px;
    border-top:1px solid #ddd;
}

#userInput{
    flex:1;
    min-width:0;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

#send{
    padding:0 14px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
}

#record{
    width:50px;
    border:0;
    border-radius:10px;
    background:#dc2626;
    color:white;
    font-size:20px;
}

#record.recording{
    background:#16a34a;
}
</style>
</head>

<body>

<div class="chat">

    <div class="header">
        <h2>💬 Kənd məhsulları</h2>
        <small>Operatorla əlaqə</small>
    </div>

    <div id="messages"></div>

    <div class="bottom">

        <input
            id="userInput"
            type="text"
            placeholder="Mesajınızı yazın..."
        >

        <button id="record" type="button">🎙️</button>

        <button id="send" type="button">Göndər</button>

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
    getStorage,
    ref as storageRef,
    uploadBytes,
    getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain:
    "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
    "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
    "kendmehsullari-6a53d",

    storageBucket:
    "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
    "551607499773",

    appId:
    "1:551607499773:web:a84aa63dc5b55c38687794"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);

const storage =
    getStorage(app);

const messagesRef =
    ref(db,"messages");


/* =========================
   ELEMENTLƏR
========================= */

const messages =
    document.getElementById("messages");

const input =
    document.getElementById("userInput");

const send =
    document.getElementById("send");

const record =
    document.getElementById("record");


/* =========================
   HESAB
========================= */

const customerEmail =
    localStorage.getItem("userEmail") || "";


/* =========================
   YAZILI MESAJ
========================= */

async function sendMessage(){

    const text =
        input.value.trim();

    if(!text) return;

    try{

        await push(
            messagesRef,
            {
                sender:"customer",
                type:"text",
                message:text,
                email:customerEmail,
                time:Date.now()
            }
        );

        input.value="";

    }catch(error){

        console.error(error);

        alert(
            "Mesaj göndərilmədi."
        );

    }

}


send.onclick =
sendMessage;


input.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Enter"){

            e.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   MESAJLARI GÖSTƏR
========================= */

onChildAdded(
    messagesRef,
    function(snapshot){

        const data =
            snapshot.val();

        if(!data) return;


        const box =
            document.createElement("div");

        const sender =
            document.createElement("div");

        sender.className =
            "sender";


        if(data.sender === "customer"){

            box.className =
                "message customer";

            sender.textContent =
                "Siz";

        }

        else if(data.sender === "agent"){

            box.className =
                "message agent";

            sender.textContent =
                "Operator";

        }

        else{

            return;

        }


        box.appendChild(sender);


        /* SƏS */

        if(data.type === "audio"){

            if(!data.audioURL) return;

            const audio =
                document.createElement("audio");

            audio.controls = true;

            audio.src =
                data.audioURL;

            box.appendChild(audio);

        }

        /* YAZI */

        else{

            const text =
                document.createElement("div");

            text.textContent =
                data.message || "";

            box.appendChild(text);

        }


        messages.appendChild(box);

        messages.scrollTop =
            messages.scrollHeight;

    }
);


/* =========================
   SƏS YAZMA
========================= */

let recorder = null;

let audioChunks = [];

let recording = false;


record.onclick =
async function(){

    if(!recording){

        try{

            const stream =
                await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true
                });


            audioChunks = [];


            recorder =
                new MediaRecorder(stream);


            recorder.ondataavailable =
                function(event){

                    if(event.data.size > 0){

                        audioChunks.push(
                            event.data
                        );

                    }

                };


            recorder.onstop =
                async function(){

                    stream
                    .getTracks()
                    .forEach(
                        track =>
                        track.stop()
                    );


                    const blob =
                        new Blob(
                            audioChunks,
                            {
                                type:
                                "audio/webm"
                            }
                        );


                    try{

                        record.textContent =
                            "⏳";


                        /* FIREBASE STORAGE */

                        const fileName =
                            "voice_" +
                            Date.now() +
                            ".webm";


                        const fileRef =
                            storageRef(
                                storage,
                                "voice/" +
                                fileName
                            );


                        await uploadBytes(
                            fileRef,
                            blob
                        );


                        const audioURL =
                            await getDownloadURL(
                                fileRef
                            );


                        /* MESAJI DATABASE-Ə YAZ */

                        await push(
                            messagesRef,
                            {
                                sender:
                                    "customer",

                                type:
                                    "audio",

                                audioURL:
                                    audioURL,

                                email:
                                    customerEmail,

                                time:
                                    Date.now()
                            }
                        );


                    }catch(error){

                        console.error(error);

                        alert(
                            "Səs göndərilmədi:\n" +
                            error.message
                        );

                    }


                    record.textContent =
                        "🎙️";

                };


            recorder.start();

            recording = true;

            record.classList.add(
                "recording"
            );

            record.textContent =
                "⏹️";


        }catch(error){

            console.error(error);

            alert(
                "Mikrofon icazəsi verilmədi."
            );

        }

    }

    else{

        recorder.stop();

        recording = false;

        record.classList.remove(
            "recording"
        );

    }

};

</script>

</body>
</html>
