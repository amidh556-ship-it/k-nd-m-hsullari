<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kənd məhsulları - Ağıllı dəstək</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f5}
header{background:#168b45;color:white;padding:17px;text-align:center;font-weight:bold}
#chat{height:calc(100dvh - 130px);overflow-y:auto;padding:14px;max-width:650px;margin:auto}
.msg{padding:12px;margin:9px 0;border-radius:12px;max-width:85%;overflow-wrap:anywhere;white-space:pre-wrap}
.bot{background:white}
.customer{background:#d8f8df;margin-left:auto}
.operator{background:#e4e7eb}
#bottom{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px;display:flex;gap:7px}
#input{flex:1;min-width:0;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:16px}
button{padding:12px;border:0;border-radius:9px;background:#168b45;color:white;font-weight:bold}
</style>
</head>

<body>
<header>🤖 Kənd məhsulları — Ağıllı dəstək</header>

<div id="chat">
<div class="msg bot">Salam! Mən Kənd məhsullarının köməkçi botuyam. 😊

Sifariş, çatdırılma, məhsullar, ödəniş və geri qaytarma haqqında suallarınızı yaza bilərsiniz.

Operator istəyirsinizsə, bunu 3 dəfə bildirin.</div>
</div>

<div id="bottom">
<input id="input" placeholder="Mesajınızı yazın..." autocomplete="off">
<button id="send">Göndər</button>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getDatabase,ref,push,onChildAdded}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app=initializeApp({
 apiKey:"AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",
 authDomain:"kendmehsullari-6a53d.firebaseapp.com",
 databaseURL:"https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",
 projectId:"kendmehsullari-6a53d",
 storageBucket:"kendmehsullari-6a53d.firebasestorage.app",
 messagingSenderId:"551607499773",
 appId:"1:551607499773:web:a84aa63dc5b55c38687794"
});

const db=getDatabase(app);
const messagesRef=ref(db,"messages");

const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");

const email=(localStorage.getItem("userEmail")||"").toLowerCase().trim();

let operatorRequests=0;
let requestSent=false;
let waitingForAddress=false;
let waitingForProduct=false;
let lastOperatorMessage="";

function show(text,cls="bot"){
 const el=document.createElement("div");
 el.className="msg "+cls;
 el.textContent=text;
 chat.appendChild(el);
 chat.scrollTop=chat.scrollHeight;
}

function normalize(s){
 return String(s||"")
 .toLocaleLowerCase("az")
 .replace(/[.,!?;:()[\]"]/g," ")
 .replace(/\s+/g," ")
 .trim();
}

function wantsOperator(s){
 return /(operator|operatör|agent|agente|agentə|operatora|operatöre|canlı dəstək|canli destek)/i.test(s)
 && /(bağla|bagla|qoş|qos|istəyirəm|isteyirem|məni|meni|danış|danis|lazımdır|lazimdir|istəyir|isteyir|kömək|komek|birləşdir|birlesdir)/i.test(s);
}

function answer(text){
 const t=normalize(text);

 if(/^(salam|salamlar|salam aleykum|aleykum salam|hello|hi|sa|salam bot)$/.test(t)){
  return "Salam! 😊 Sizə necə kömək edə bilərəm? Sifarişiniz, çatdırılma, məhsul və ya ödəniş haqqında sualınızı yaza bilərsiniz.";
 }

 if(/^(necəsən|necesen|necəsiz|necesiz)$/.test(t)){
  return "Yaxşıyam, təşəkkür edirəm! 😊 Sizə hansı məsələdə kömək edim?";
 }

 if(/(sifariş|sifaris).*(harad|vəziyyət|veziyyet|status|çat|cat|gəl|gel|yol)/.test(t) ||
    /(haradadır|haradadi|hardadır|hardadi|hara çatıb|hara catib|sifarişim|sifarishim)/.test(t)){
  waitingForAddress=true;
  return "Sifarişinizin vəziyyətini dəqiqləşdirməyə kömək edim. 😊 Zəhmət olmasa, sifariş zamanı qeyd etdiyiniz çatdırılma ünvanını yazın. Qeyd: Bu bot hazırda sifariş statusunu bazadan avtomatik yoxlamır; ünvanı yazmağınız sifarişinizin tapılmasına kömək edə bilər.";
 }

 if(waitingForAddress){
  waitingForAddress=false;
  return "Ünvanınızı qeyd etdiyiniz üçün təşəkkür edirəm. Sifarişin dəqiq vəziyyətini bu söhbətdən avtomatik yoxlaya bilmirəm. Operatora müraciət etmək istəyirsinizsə, “Məni operatora bağla” yazın.";
 }

 if(/(çatdırılma|catdirilma|çatdırılma haqqı|çatdirilma haqqi|kuryer|çatdırılma neçə|catdirilma nece)/.test(t)){
  return "Çatdırılma haqqında məlumatı sifarişinizin ünvanına və məhsula görə dəqiqləşdirmək lazımdır. Hansı məhsulu sifariş etmək istəyirsiniz və hansı əraziyə çatdırılmalıdır?";
 }

 if(/(məhsul|mehsul|mal).*(qiymət|qiymet|neçəyə|neceye|neçəyədir|neceyedir|var)/.test(t) ||
    /(qiymət|qiymet|neçəyə|neceye|neçəyədir|neceyedir)/.test(t)){
  waitingForProduct=true;
  return "Hansı məhsulun qiymətini öyrənmək istəyirsiniz? Məhsulun adını yazın. 😊";
 }

 if(waitingForProduct){
  waitingForProduct=false;
  return "Məhsulun adını qeyd etdiyiniz üçün təşəkkür edirəm. Hazırda bütün məhsulların qiymətlərini avtomatik bazadan yoxlama imkanım yoxdur. Məhsul səhifəsində qiymətə baxa və ya operatora müraciət edə bilərsiniz.";
 }

 if(/(geri qaytar|geri qaytarmaq|qaytarmaq|qaytarım|qaytarim|pulumu geri|refund)/.test(t)){
  return "Geri qaytarma üçün sifarişlər bölməsində uyğun sifarişi yoxlayın. Saytınızda geri qaytarma düyməsi aktivdirsə, məhsulu seçib səbəbi qeyd edin. Sorğunun nəticəsini operator da dəqiqləşdirə bilər.";
 }

 if(/(ödəniş|odenis|pul köçür|pul kocur|bank|qəbz|qebz|kartla|ödəmişəm|odemisem)/.test(t)){
  return "Ödənişlə bağlı kömək edim. 😊 Ödənişi etmisiniz, qəbzi göndərmək istəyirsiniz, yoxsa ödəniş təsdiqlənməyib?";
 }

 if(/(hesab|profil|giriş|giris|daxil ol|qeydiyyat|şifrə|sifre|parol)/.test(t)){
  return "Hesabınızla bağlı problem yaşayırsınızsa, zəhmət olmasa, problemin nə olduğunu yazın: giriş, qeydiyyat, şifrə, yoxsa profil məlumatları?";
 }

 if(/(məhsul|mehsul|tato|maşın|masin|qadın|qadin|kişi|kisi|ev üçün|ev ucun)/.test(t)){
  return "Məhsul haqqında kömək edə bilərəm. 😊 Hansı məhsulun adını, qiymətini və ya sifariş qaydasını öyrənmək istəyirsiniz? Dəqiq məlumatı məhsul səhifəsində yoxlamaq lazımdır.";
 }

 if(/(sağ ol|sag ol|təşəkkür|tesekkur|çox sağ ol|cox sag ol)/.test(t)){
  return "Buyurun! 😊 Başqa sualınız olsa, yazın.";
 }

 if(/(kömək|komek|problem|işləmir|islemir|açılmır|acilmir|bacarmıram|bacarmiram)/.test(t)){
  return "Kömək etməyə hazıram. 😊 Zəhmət olmasa, nə etmək istədiyinizi və hansı çətinliklə qarşılaşdığınızı bir az ətraflı yazın.";
 }

 return "Sizi başa düşməyə çalışıram. 😊 Zəhmət olmasa, sualınızı bir az ətraflı yazın. Sifariş, çatdırılma, ödəniş və geri qaytarma ilə bağlı kömək edə bilərəm. Dəqiq cavab tapa bilməsəm, operatora müraciət edə bilərsiniz.";
}

async function sendMessage(){
 const text=input.value.trim();
 if(!text)return;

 input.value="";
 show(text,"customer");

 const t=normalize(text);

 if(wantsOperator(t)){
  operatorRequests++;

  if(operatorRequests<3){
   show("Sizə kömək etməyə çalışaram. 😊 Operatora qoşulmaq istəyiniz qeydə alındı: "+operatorRequests+"/3. İstəsəniz, probleminizi də yaza bilərsiniz.");
   return;
  }

  if(!email){
   show("Operatora qoşulmaq üçün əvvəlcə hesabınıza daxil olun. Daxil olduqdan sonra operator istəyinizi 3 dəfə bildirin.");
   operatorRequests=0;
   return;
  }

  if(requestSent){
   show("⏳ Operator sorğunuz artıq göndərilib. Zəhmət olmasa, gözləyin. Operatorumuz ən qısa zamanda sizinlə əlaqə saxlayacaq.");
   return;
  }

  try{
   await push(messagesRef,{
    type:"operator_request",
    sender:"customer",
    email:email,
    text:"Müştəri operatora qoşulmaq istəyir: "+text,
    message:"Müştəri operatora qoşulmaq istəyir: "+text,
    status:"waiting",
    time:Date.now(),
    createdAt:Date.now()
   });

   requestSent=true;
   show("⏳ Sizi operatora bağlayırıq. Zəhmət olmasa, gözləyin. Operatorumuz ən qısa zamanda sizinlə əlaqə saxlayacaq.");
  }catch(e){
   console.error(e);
   show("Sorğu göndərilmədi. Firebase bağlantısını yoxlayın və yenidən cəhd edin.");
  }
  return;
 }

 // Müştərinin mesajını operatorun görə bilməsi üçün Firebase-ə yazılır.
 if(email){
  try{
   await push(messagesRef,{
    sender:"customer",
    email:email,
    text:text,
    message:text,
    time:Date.now(),
    createdAt:Date.now()
   });
  }catch(e){
   console.error("Mesaj Firebase-ə yazılmadı:",e);
  }
 }

 show(answer(text));
}

send.onclick=sendMessage;
input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

// Operator cavablarını müştəriyə göstərir.
onChildAdded(messagesRef,snap=>{
 const d=snap.val();
 if(!d||!email)return;
 if(String(d.email||"").toLowerCase().trim()!==email)return;
 if(d.sender!=="agent"&&d.sender!=="operator")return;

 const msg=String(d.message||d.text||"");
 if(!msg||msg===lastOperatorMessage)return;
 lastOperatorMessage=msg;
 show("Operator: "+msg,"operator");
});
</script>
</body>
</html>
