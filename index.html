<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kənd məhsulları</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f1ea;color:#252525;padding-bottom:85px}
header{background:#263b2b;padding:16px;color:white;border-radius:0 0 22px 22px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.logo{font-size:23px;font-weight:bold}
.logo span{color:#e8b84b}
.profile,.plus{width:44px;height:44px;border-radius:14px;background:#e8b84b;color:#263b2b;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:21px;border:0}
.search{display:flex;gap:9px}
.search a{background:white;color:#777;border-radius:13px;padding:15px;text-decoration:none;flex:1}
.categories{display:flex;gap:8px;overflow:auto;padding-top:14px}
.category{padding:9px 13px;border-radius:20px;background:#ffffff20;white-space:nowrap}
.category:first-child{background:#e8b84b;color:#263b2b}
.hero{background:#e8b84b;border-radius:22px;margin:15px;padding:22px}
.hero h1{font-size:26px;color:#263b2b}
.hero p{margin-top:9px;line-height:1.5}
.discount{margin:15px;background:white;padding:14px;border-radius:13px;font-weight:bold}
.heading{padding:12px 15px;font-size:22px;font-weight:bold}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 12px}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 3px 12px #0001;position:relative}
.photo{height:180px;background:#faf9f5;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:contain}
.info{padding:11px}
.name{font-size:16px;min-height:38px;line-height:20px}
.stars{color:#e5a91d;font-size:12px;margin-top:5px}
.price{font-size:21px;font-weight:bold;color:#263b2b;margin-top:9px}
.price small{font-size:13px}
.cart{display:block;width:calc(100% - 18px);background:#263b2b;color:white;text-align:center;padding:12px;margin:9px;border:0;border-radius:12px;font-size:13px;cursor:pointer}
.delete-product{display:none;width:calc(100% - 18px);background:#c62828;color:white;text-align:center;padding:11px;margin:0 9px 10px;border:0;border-radius:12px;font-size:14px;font-weight:bold;cursor:pointer}
#admin{display:none;background:white;margin:16px 12px;padding:16px;border-radius:18px;box-shadow:0 3px 12px #0001}
#admin h2{font-size:20px;color:#263b2b;margin-bottom:12px}
#admin input,#admin textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:9px;font-size:15px}
#admin button{padding:12px 15px;background:#263b2b;color:white;border:0;border-radius:10px;font-weight:bold;margin:4px 0}
#preview{width:100%;max-height:230px;object-fit:contain;background:#f4f1ea;border-radius:10px}
#status{font-size:13px;line-height:1.5;margin-top:8px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:white;display:flex;justify-content:space-around;align-items:center;box-shadow:0 -2px 10px #0001}
.bottom a{text-decoration:none;text-align:center;color:#69716b;font-size:11px}
.bottom i{display:block;font-size:21px;margin-bottom:5px}
.support{position:fixed;right:14px;bottom:85px;background:#e8b84b;color:#263b2b;width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:22px}
@media(max-width:380px){.photo{height:155px}.products{gap:8px;padding:0 8px}}
</style>
</head>

<body>
<header>
  <div class="head">
    <div class="logo">Kənd <span>məhsulları</span></div>
    <a class="profile" href="profile.html"><i class="fa-regular fa-user"></i></a>
  </div>

  <div class="search">
    <a href="axtar.html"><i class="fa-solid fa-magnifying-glass"></i> Nə axtarırsınız?</a>
    <button class="plus" onclick="openAdmin()" aria-label="Məhsul əlavə et">+</button>
  </div>

  <div class="categories">
    <div class="category">Hamısı</div>
    <div class="category">Qadın</div>
    <div class="category">Kişi</div>
    <div class="category">Ev</div>
    <div class="category">Zinət əşyaları</div>
    <div class="category">İdman</div>
  </div>
</header>

<div class="hero">
  <h1>Bizdən birbaşa sizə 🌿</h1>
  <p>Sevdiyin məhsulları rahat və təhlükəsiz sifariş et.</p>
  <p><b>20% çatdırılma endirimi</b></p>
</div>

<div class="discount">✓ Çatdırılmada 20% endirim　 ✓ 10% endirim</div>
<div class="heading">Məhsullar</div>
<div class="products" id="products"></div>

<section id="admin">
  <h2><i class="fa-solid fa-plus"></i> Yeni məhsul əlavə et</h2>

  <label>Məhsulun şəkilləri (bir neçə şəkil seçə bilərsən)</label>
  <input type="file" id="image" accept="image/*" multiple>
  <img id="preview" hidden alt="Şəkil önbaxışı">

  <label>Məhsulun adı</label>
  <input id="name" placeholder="Məsələn: Oyuncaq maşın">

  <label>Qiymət (AZN)</label>
  <input id="price" type="number" min="0.01" step="0.01" placeholder="3.80">

  <label>Məhsul haqqında</label>
  <textarea id="description" placeholder="Məhsulun təsviri"></textarea>

  <button type="button" onclick="addProduct()">Məhsulu əlavə et</button>
  <div id="status"></div>
</section>

<a href="bot.html" class="support"><i class="fa-solid fa-comment"></i></a>

<nav class="bottom">
  <a href="index.html"><i class="fa-solid fa-house"></i>Ana səhifə</a>
  <a href="axtar.html"><i class="fa-solid fa-magnifying-glass"></i>Axtar</a>
  <a href="sebet.html"><i class="fa-solid fa-cart-shopping"></i>Səbət</a>
  <a href="profile.html"><i class="fa-regular fa-user"></i>Profil</a>
</nav>

<!-- Firebase bağlantısı -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const ADMIN_EMAIL = "amid.h556@gmail.com";

const firebaseConfig = {
  apiKey: "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",
  authDomain: "kendmehsullari-6a53d.firebaseapp.com",
  databaseURL: "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",
  projectId: "kendmehsullari-6a53d",
  storageBucket: "kendmehsullari-6a53d.firebasestorage.app",
  messagingSenderId: "551607499773",
  appId: "1:551607499773:web:a84aa63dc5b55c38687794",
  measurementId: "G-2JZ105RRPH"
};

/* Cloudinary şəkil parametrləri */
const CLOUDINARY_NAME = "ikx7u2gf";
const CLOUDINARY_PRESET = "kendmehsullari";

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const productsRef = db.ref("products");

const PRODUCTS_KEY = "myProducts";
const imageInput = document.getElementById("image");

let selectedImages = [];
let sharedProducts = [];

const defaultProducts = [
  {
    id: "masin",
    name: "Maşın oyuncaq",
    price: 3.80,
    description: "Oyuncaq maşın",
    image: "foto.png"
  },
  {
    id: "tato",
    name: "Tato",
    price: 4.80,
    description: "Tato",
    image: "1.png"
  }
];

function isAdmin() {
  return (localStorage.getItem("userEmail") || "")
    .trim().toLowerCase() === ADMIN_EMAIL;
}

function openAdmin() {
  if (!isAdmin()) {
    alert("Məhsul əlavə etmək üçün idarəçi hesabına daxil ol.");
    return;
  }

  const box = document.getElementById("admin");
  box.style.display =
    box.style.display === "block" ? "none" : "block";

  if (box.style.display === "block") {
    box.scrollIntoView({ behavior: "smooth" });
  }
}

/* Əvvəllər bu telefonda saxlanmış məhsulları qoruyur */
function getSavedProducts() {
  try {
    const data = JSON.parse(
      localStorage.getItem(PRODUCTS_KEY) || "[]"
    );
    return Array.isArray(data) ? data : [];
  } catch (e) {
    return [];
  }
}

function getAllProducts() {
  return [
    ...defaultProducts,
    ...getSavedProducts(),
    ...sharedProducts
  ];
}

function getAccountCartKey() {
  const email = (localStorage.getItem("userEmail") || "")
    .trim().toLowerCase();

  if (!email) return null;

  return "cart_" + email.replace(/[^a-z0-9]/g, "_");
}

/* Şəkilləri oxuyur və önbaxış göstərir */
imageInput.addEventListener("change", async function () {
  selectedImages = [];

  const files = Array.from(imageInput.files || []);
  const status = document.getElementById("status");
  const preview = document.getElementById("preview");

  if (!files.length) {
    preview.hidden = true;
    return;
  }

  const imageFiles = files.filter(file =>
    file.type.startsWith("image/")
  );

  if (!imageFiles.length) {
    status.textContent = "Şəkil faylı seç.";
    imageInput.value = "";
    return;
  }

  if (imageFiles.length > 5) {
    status.textContent = "Ən çox 5 şəkil seçə bilərsən.";
    imageInput.value = "";
    return;
  }

  status.textContent = "Şəkillər hazırlanır...";

  try {
    for (const file of imageFiles) {
      if (file.size > 8 * 1024 * 1024) {
        throw new Error("Hər şəkil 8 MB-dan kiçik olmalıdır.");
      }

      const data = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Şəkil oxunmadı."));
        reader.readAsDataURL(file);
      });

      const compressed = await new Promise((resolve, reject) => {
        const img = new Image();

        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxSize = 800;
          const scale = Math.min(
            1,
            maxSize / Math.max(img.width, img.height)
          );

          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);

          canvas.getContext("2d").drawImage(
            img, 0, 0, canvas.width, canvas.height
          );

          resolve(canvas.toDataURL("image/jpeg", 0.7));
        };

        img.onerror = () =>
          reject(new Error("Şəkli açmaq olmadı."));

        img.src = data;
      });

      selectedImages.push(compressed);
    }

    preview.src = selectedImages[0];
    preview.hidden = false;
    status.textContent =
      selectedImages.length + " şəkil seçildi.";
  } catch (error) {
    selectedImages = [];
    preview.hidden = true;
    imageInput.value = "";
    status.textContent = error.message;
  }
});

/* Şəkilləri Cloudinary-yə yükləyir */
async function uploadImage(imageData) {
  const form = new FormData();
  form.append("file", imageData);
  form.append("upload_preset", CLOUDINARY_PRESET);

  const response = await fetch(
    "https://api.cloudinary.com/v1_1/" +
      CLOUDINARY_NAME + "/image/upload",
    {
      method: "POST",
      body: form
    }
  );

  const result = await response.json();

  if (!response.ok || !result.secure_url) {
    console.error("Cloudinary xətası:", result);
    throw new Error(
      result.error?.message || "Şəkli yükləmək olmadı."
    );
  }

  return result.secure_url;
}

/* Firebase-ə yeni məhsul yazır */
async function addProduct() {
  if (!isAdmin()) {
    alert("İdarəçi hesabına daxil olmalısan.");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const price = Number(document.getElementById("price").value);
  const description =
    document.getElementById("description").value.trim();
  const status = document.getElementById("status");
  const button = document.querySelector(
    '#admin button[onclick="addProduct()"]'
  );

  if (
    !name ||
    !Number.isFinite(price) ||
    price <= 0 ||
    !selectedImages.length
  ) {
    status.textContent =
      "Məhsulun adını, düzgün qiymətini və şəklini daxil et.";
    return;
  }

  try {
    button.disabled = true;
    status.textContent = "Şəkillər yüklənir...";

    const imageUrls = [];

    for (const image of selectedImages) {
      imageUrls.push(await uploadImage(image));
    }

    status.textContent = "Məhsul bazaya yazılır...";

    await productsRef.push({
      name: name,
      price: price,
      description: description,
      image: imageUrls[0],
      images: imageUrls,
      createdAt: Date.now()
    });

    status.textContent =
      "Məhsul Firebase-ə əlavə edildi.";

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("description").value = "";
    imageInput.value = "";
    selectedImages = [];
    document.getElementById("preview").hidden = true;

  } catch (error) {
    console.error(error);
    status.textContent =
      "Xəta: " + (error.message || "Məhsul əlavə olunmadı.");
  } finally {
    button.disabled = false;
  }
}

/* Firebase məhsulunu hamıdan silir */
async function deleteProduct(productId) {
  if (!isAdmin()) {
    alert("Məhsulu yalnız idarəçi silə bilər.");
    return;
  }

  const product = sharedProducts.find(
    p => String(p.id) === String(productId)
  );

  if (!product) {
    alert("Firebase məhsulu tapılmadı.");
    return;
  }

  if (!confirm(
    '"' + product.name + '" məhsulunu silmək istəyirsən?'
  )) return;

  try {
    await productsRef.child(productId).remove();
    document.getElementById("status").textContent =
      "Məhsul Firebase-dən silindi.";
  } catch (error) {
    console.error(error);
    alert("Məhsul silinmədi. Firebase qaydalarını yoxla.");
  }
}

/* Səbətə əlavə etmə sistemi */
function addToCart(productId) {
  const email = (localStorage.getItem("userEmail") || "")
    .trim().toLowerCase();

  if (!email) {
    alert("Səbətə məhsul əlavə etmək üçün əvvəlcə hesabına daxil ol.");
    window.location.href = "kent.html";
    return;
  }

  const product = getAllProducts().find(
    p => String(p.id) === String(productId)
  );

  if (!product) {
    alert("Məhsul tapılmadı.");
    return;
  }

  const key = getAccountCartKey();
  if (!key) return;

  let cart = [];

  try {
    const old = JSON.parse(localStorage.getItem(key) || "[]");
    if (Array.isArray(old)) cart = old;
  } catch (e) {
    cart = [];
  }

  const existing = cart.find(
    item => String(item.id) === String(product.id)
  );

  if (existing) {
    existing.quantity = (Number(existing.quantity) || 1) + 1;
    existing.name = product.name;
    existing.price = Number(product.price);
    existing.image = product.image;
  } else {
    cart.push({
      id: product.id,
      name: product.name,
      price: Number(product.price),
      image: product.image,
      quantity: 1
    });
  }

  try {
    localStorage.setItem(key, JSON.stringify(cart));
    window.location.href = "sebet.html";
  } catch (error) {
    alert("Səbət yadda saxlanmadı.");
  }
}

/* Məhsulları səhifədə göstərir */
function renderProducts() {
  const container = document.getElementById("products");
  container.innerHTML = "";

  getAllProducts().forEach(p => {
    const card = document.createElement("div");
    card.className = "card";

    const link = document.createElement("a");
    link.href = "al.html?id=" + encodeURIComponent(p.id);
    link.style.color = "inherit";
    link.style.textDecoration = "none";

    const photo = document.createElement("div");
    photo.className = "photo";

    const img = document.createElement("img");
    img.alt = p.name || "Məhsul";
    img.src = p.image ||
      "https://placehold.co/300x300?text=Mehsul";

    img.onerror = function () {
      this.onerror = null;
      this.src =
        "https://placehold.co/300x300?text=Sekil+yoxdur";
    };

    photo.appendChild(img);
    link.appendChild(photo);

    const info = document.createElement("div");
    info.className = "info";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = p.name || "Adsız məhsul";

    const stars = document.createElement("div");
    stars.className = "stars";
    stars.textContent = "★★★★★ ";

    const sold = document.createElement("span");
    sold.style.color = "#777";
    sold.textContent = "100+ satılıb";
    stars.appendChild(sold);

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = Number(p.price).toFixed(2) + " ";

    const small = document.createElement("small");
    small.textContent = "AZN";
    price.appendChild(small);

    info.append(name, stars, price);

    const button = document.createElement("button");
    button.className = "cart";
    button.type = "button";
    button.textContent = "🛒 Səbətə əlavə et";
    button.addEventListener("click", () => addToCart(p.id));

    card.append(link, info, button);

    if (isAdmin() && p.firebaseKey) {
      const del = document.createElement("button");
      del.type = "button";
      del.className = "delete-product";
      del.style.display = "block";
      del.textContent = "🗑️ Sil";
      del.addEventListener("click", () => deleteProduct(p.id));
      card.appendChild(del);
    }

    container.appendChild(card);
  });
}

/* Firebase dəyişəndə məhsullar bütün istifadəçilərdə yenilənir */
productsRef.on("value", snapshot => {
  sharedProducts = [];

  snapshot.forEach(child => {
    const data = child.val();

    if (data && typeof data === "object") {
      sharedProducts.push({
        ...data,
        id: child.key,
        firebaseKey: true
      });
    }
  });

  renderProducts();
}, error => {
  console.error("Firebase xətası:", error);
  document.getElementById("status").textContent =
    "Məhsullar yüklənmədi. Firebase bağlantısını və qaydalarını yoxla.";
});

renderProducts();
</script>

</body>
</html>
