<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Səbətim</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
.container{max-width:600px;margin:auto;padding:15px}
h1{background:white;padding:20px;margin:0 0 12px;border-radius:10px}
.cart-item{background:white;margin-bottom:10px;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center}
.cart-item img{width:90px;height:90px;object-fit:contain;border-radius:8px;background:#fafafa}
.info{flex:1;min-width:0}
.name{font-size:17px;font-weight:bold;overflow-wrap:anywhere}
.price{margin-top:6px;color:#2e7d32;font-weight:bold}
.quantity{display:flex;align-items:center;gap:10px;margin-top:10px}
.quantity button{width:34px;height:34px;border:0;border-radius:7px;background:#eee;font-size:21px}
.delete{margin-top:9px;padding:8px 12px;border:0;border-radius:7px;background:#e53935;color:white}
.total{background:white;margin-top:15px;padding:18px;border-radius:10px;font-size:20px;font-weight:bold}
.order{display:block;background:#2e7d32;color:white;text-align:center;padding:16px;margin-top:12px;border-radius:9px;text-decoration:none;font-weight:bold}
.empty{background:white;padding:35px 15px;text-align:center;border-radius:10px;font-size:18px}
.back{display:block;text-align:center;padding:20px;color:#222;text-decoration:none}
.login-warning{background:white;padding:25px;text-align:center;border-radius:10px}
.login-warning a{display:block;margin-top:15px;padding:14px;background:#2e7d32;color:white;text-decoration:none;border-radius:8px}
</style>
</head>
<body>
<div class="container">
<h1>🛒 Səbətim</h1>
<div id="cart"></div>
<div class="total">Ümumi: <span id="total">0.00</span> AZN</div>
<a id="orderButton" class="order" href="sifaris.html">📦 Sifariş et</a>
<a class="back" href="index.html">← Alış-verişə qayıt</a>
</div>

<script>
function getAccountKey(){
 const email=(localStorage.getItem("userEmail")||"").trim().toLowerCase();
 if(!email)return null;
 return "cart_"+email.replace(/[^a-z0-9]/g,"_");
}

function getCart(){
 const key=getAccountKey();
 if(!key)return [];
 try{
  const cart=JSON.parse(localStorage.getItem(key)||"[]");
  return Array.isArray(cart)?cart:[];
 }catch(e){return []}
}

function saveCart(cart){
 const key=getAccountKey();
 if(!key)return false;
 try{
  localStorage.setItem(key,JSON.stringify(cart));
  return true;
 }catch(e){
  alert("Səbət yadda saxlanmadı. Brauzer yaddaşı doludur.");
  return false;
 }
}

function showCart(){
 const box=document.getElementById("cart");
 const totalBox=document.getElementById("total");
 const orderButton=document.getElementById("orderButton");
 box.innerHTML="";
 const email=localStorage.getItem("userEmail");

 if(!email){
  box.innerHTML='<div class="login-warning">🔐 Səbəti görmək üçün hesabına daxil ol.<a href="kent.html">Hesaba giriş et</a></div>';
  totalBox.textContent="0.00";
  orderButton.style.display="none";
  return;
 }

 const cart=getCart();
 if(cart.length===0){
  box.innerHTML='<div class="empty">🛒 Səbətin boşdur</div>';
  totalBox.textContent="0.00";
  orderButton.style.display="none";
  return;
 }

 orderButton.style.display="block";
 let total=0;

 cart.forEach((item,index)=>{
  const quantity=Math.max(1,Number(item.quantity)||1);
  const price=Math.max(0,Number(item.price)||0);
  total+=price*quantity;

  const row=document.createElement("div");
  row.className="cart-item";

  const img=document.createElement("img");
  img.alt=item.name||"Məhsul";
  img.src=item.image||"";
  img.onerror=()=>{img.style.display="none"};

  const info=document.createElement("div");
  info.className="info";

  const name=document.createElement("div");
  name.className="name";
  name.textContent=item.name||"Məhsul";

  const priceEl=document.createElement("div");
  priceEl.className="price";
  priceEl.textContent=price.toFixed(2)+" AZN";

  const quantityBox=document.createElement("div");
  quantityBox.className="quantity";

  const minus=document.createElement("button");
  minus.type="button";
  minus.textContent="−";
  minus.onclick=()=>changeQuantity(index,-1);

  const count=document.createElement("b");
  count.textContent=quantity;

  const plus=document.createElement("button");
  plus.type="button";
  plus.textContent="+";
  plus.onclick=()=>changeQuantity(index,1);

  quantityBox.append(minus,count,plus);

  const del=document.createElement("button");
  del.className="delete";
  del.type="button";
  del.textContent="🗑️ Sil";
  del.onclick=()=>deleteItem(index);

  info.append(name,priceEl,quantityBox,del);
  row.append(img,info);
  box.appendChild(row);
 });

 totalBox.textContent=total.toFixed(2);
}

function changeQuantity(index,amount){
 const cart=getCart();
 if(!cart[index])return;

 const oldQuantity=Math.max(1,Number(cart[index].quantity)||1);
 const newQuantity=oldQuantity+amount;

 if(newQuantity<=0){
  cart.splice(index,1);
 }else{
  cart[index].quantity=newQuantity;
 }

 if(saveCart(cart))showCart();
}

function deleteItem(index){
 const cart=getCart();
 cart.splice(index,1);
 if(saveCart(cart))showCart();
}

showCart();
</script>
</body>
</html>
