<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kənd məhsulları</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f5f3;color:#222}
header{background:#176b37;color:white;padding:18px;text-align:center}
header h2{margin:0}
nav{display:flex;justify-content:space-around;background:white;padding:13px;position:sticky;top:0;z-index:2}
nav button{border:0;background:#e7f3e9;padding:10px;border-radius:8px;font-weight:bold}
h3{margin:12px}
#products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}
.card{background:white;padding:10px;border-radius:12px;box-shadow:0 2px 6px #0001}
.card img{width:100%;height:140px;object-fit:cover;border-radius:8px}
.card h3{margin:9px 0;font-size:16px}
.price{color:#176b37;font-size:18px;font-weight:bold;margin:8px 0}
button{cursor:pointer}
.add{width:100%;padding:10px;background:#176b37;color:white;border:0;border-radius:8px}
.remove{background:#ffe4e4;color:#a00;border:0;border-radius:6px;padding:7px}
#cartPage{display:none;padding:12px}
.cartitem{background:white;margin-bottom:10px;padding:12px;border-radius:10px}
.cartitem img{width:65px;height:65px;object-fit:cover;border-radius:8px}
.line{display:flex;align-items:center;gap:10px}
.total{background:white;padding:15px;border-radius:10px;font-size:20px;font-weight:bold}
#orderForm{display:none;background:white;padding:15px;border-radius:10px;margin-top:12px}
#orderForm input,#orderForm textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
.action{width:100%;padding:13px;background:#176b37;color:white;border:0;border-radius:8px;margin-top:10px}
#admin{display:none;background:white;margin:12px;padding:14px;border-radius:12px}
#admin input,#admin textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
#notice{text-align:center;padding:10px;color:#176b37}
</style>
</head>
<body>

<header>
<h2>🌿 Kənd məhsulları</h2>
<p>Kənddən süfrənizə</p>
</header>

<nav>
<button onclick="showProducts()">🏠 Məhsullar</button>
<button onclick="showCart()">🛒 Səbət (<span id="count">0</span>)</button>
</nav>

<div id="notice"></div>

<section id="productPage">
<h3>Məhsullar</h3>
<div id="products"></div>

<div id="admin">
<h3>➕ Yeni məhsul əlavə et</h3>
<input id="pname" placeholder="Məhsulun adı">
<input id="pprice" type="number" min="0.01" step="0.01" placeholder="Qiyməti (AZN)">
<textarea id="pdesc" placeholder="Məhsul haqqında məlumat"></textarea>
<input id="pimage" type="file" accept="image/*">
<button class="action" onclick="addProduct()">Məhsulu əlavə et</button>
<p>Bu forma yalnız bu cihazda saxlanılan idarəçi e-poçtu uyğun gəldikdə açılır.</p>
</div>
</section>

<section id="cartPage">
<h3>🛒 Mənim səbətim</h3>
<div id="cartItems"></div>
<div class="total">Ümumi: <span id="total">0.00</span> AZN</div>
<button class="action" onclick="openOrder()">Sifariş et</button>

<div id="orderForm">
<h3>Çatdırılma məlumatları</h3>
<input id="customerName" placeholder="Ad və soyad">
<input id="customerPhone" type="tel" placeholder="Telefon nömrəsi">
<textarea id="customerAddress" placeholder="Çatdırılma ünvanı"></textarea>
<button class="action" onclick="placeOrder()">Sifarişi təsdiqlə</button>
</div>
</section>

<script>
const ADMIN_EMAIL="amidh556@gmail.com";
const cartKey="kend_cart";
const productKey="kend_products";

let products=[
{id:"masin",name:"Maşın",price:3.80,desc:"Kənd məhsulu",image:"foto.png"},
{id:"tato",name:"Tato",price:4.80,desc:"Kənd məhsulu",image:"1.png"}
];

try{
const saved=JSON.parse(localStorage.getItem(productKey)||"[]");
products=products.concat(saved);
}catch(e){}

let cart={};
try{cart=JSON.parse(localStorage.getItem(cartKey)||"{}")}catch(e){cart={}}

function saveCart(){
localStorage.setItem(cartKey,JSON.stringify(cart));
}

function renderProducts(){
const box=document.getElementById("products");
box.innerHTML="";
box.style.gridTemplateColumns="repeat(2,minmax(0,1fr))";
products.forEach(p=>{
const card=document.createElement("div");
card.className="card";
const img=document.createElement("img");
img.src=p.image;
img.alt=p.name;
img.onerror=()=>{img.style.display="none"};
const name=document.createElement("h3");
name.textContent=p.name;
const desc=document.createElement("p");
desc.textContent=p.desc||"";
const price=document.createElement("div");
price.className="price";
price.textContent=Number(p.price).toFixed(2)+" AZN";
const btn=document.createElement("button");
btn.className="add";
btn.textContent="🛒 Səbətə əlavə et";
btn.onclick=()=>addToCart(p.id);
card.append(img,name,desc,price,btn);
box.appendChild(card);
});
updateCount();
}

function addToCart(id){
if(!cart[id])cart[id]=0;
cart[id]++;
saveCart();
updateCount();
document.getElementById("notice").textContent="✅ Məhsul səbətə əlavə edildi!";
}

function updateCount(){
document.getElementById("count").textContent=
Object.values(cart).reduce((a,b)=>a+b,0);
}

function showProducts(){
document.getElementById("productPage").style.display="block";
document.getElementById("cartPage").style.display="none";
document.getElementById("notice").textContent="";
}

function showCart(){
document.getElementById("productPage").style.display="none";
document.getElementById("cartPage").style.display="block";
document.getElementById("orderForm").style.display="none";
renderCart();
}

function renderCart(){
const box=document.getElementById("cartItems");
box.innerHTML="";
let total=0;
let hasItems=false;

products.forEach(p=>{
const qty=Number(cart[p.id]||0);
if(qty<=0)return;
hasItems=true;
total+=p.price*qty;

const item=document.createElement("div");
item.className="cartitem";
const line=document.createElement("div");
line.className="line";
const img=document.createElement("img");
img.src=p.image;
img.alt=p.name;
const details=document.createElement("div");
details.style.flex="1";
const title=document.createElement("strong");
title.textContent=p.name;
const cost=document.createElement("p");
cost.textContent=p.price.toFixed(2)+" AZN × "+qty+" = "+(p.price*qty).toFixed(2)+" AZN";
details.append(title,cost);
line.append(img,details);
const controls=document.createElement("div");
controls.style.marginTop="10px";
const minus=document.createElement("button");
minus.textContent="−";
minus.onclick=()=>changeQty(p.id,-1);
const quantity=document.createElement("span");
quantity.textContent="  "+qty+"  ";
const plus=document.createElement("button");
plus.textContent="+";
plus.onclick=()=>changeQty(p.id,1);
const remove=document.createElement("button");
remove.className="remove";
remove.textContent=" Sil";
remove.onclick=()=>{delete cart[p.id];saveCart();renderCart();updateCount()};
controls.append(minus,quantity,plus,remove);
item.append(line,controls);
box.appendChild(item);
});

document.getElementById("total").textContent=total.toFixed(2);
if(!hasItems)box.textContent="Səbət boşdur. Məhsullar bölməsindən məhsul əlavə et.";
updateCount();
}

function changeQty(id,delta){
cart[id]=Number(cart[id]||0)+delta;
if(cart[id]<=0)delete cart[id];
saveCart();
renderCart();
}

function openOrder(){
if(!Object.values(cart).some(q=>q>0)){
alert("Əvvəlcə səbətə məhsul əlavə et.");
return;
}
document.getElementById("orderForm").style.display="block";
}

function placeOrder(){
const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("customerPhone").value.trim();
const address=document.getElementById("customerAddress").value.trim();
if(!name||!phone||!address){
alert("Adını, telefonunu və ünvanını yaz.");
return;
}

const items=products.filter(p=>Number(cart[p.id]||0)>0).map(p=>({
name:p.name,price:p.price,quantity:cart[p.id]
}));
const total=items.reduce((sum,p)=>sum+p.price*p.quantity,0);

const order={
id:"SIF-"+Date.now(),
name,phone,address,items,total,
status:"Sifariş qəbul edildi",
createdAt:new Date().toISOString()
};

const orders=JSON.parse(localStorage.getItem("kend_orders")||"[]");
orders.push(order);
localStorage.setItem("kend_orders",JSON.stringify(orders));
cart={};
saveCart();
alert("Sifariş qeydə alındı! Sifariş nömrən: "+order.id);
document.getElementById("orderForm").style.display="none";
showProducts();
}

function addProduct(){
const name=document.getElementById("pname").value.trim();
const price=Number(document.getElementById("pprice").value);
const desc=document.getElementById("pdesc").value.trim();
const file=document.getElementById("pimage").files[0];

if(!name||price<=0||!desc||!file){
alert("Məhsulun adını, qiymətini, açıqlamasını və şəklini daxil et.");
return;
}
if(!file.type.startsWith("image/")){
alert("Şəkil faylı seç.");
return;
}
if(file.size>300*1024){
alert("Şəkil 300 KB-dan kiçik olmalıdır.");
return;
}

const reader=new FileReader();
reader.onload=()=>{
const p={id:"p"+Date.now(),name,price,desc,image:reader.result};
products.push(p);
try{
const saved=JSON.parse(localStorage.getItem(productKey)||"[]");
saved.push(p);
localStorage.setItem(productKey,JSON.stringify(saved));
}catch(e){
alert("Yaddaş dolub. Daha kiçik şəkil seç.");
products=products.filter(x=>x.id!==p.id);
return;
}
renderProducts();
alert("Məhsul əlavə edildi!");
};
reader.readAsDataURL(file);
}

if((localStorage.getItem("userEmail")||"").trim().toLowerCase()===ADMIN_EMAIL.toLowerCase()){
document.getElementById("admin").style.display="block";
}

renderProducts();
</script>
</body>
</html>
