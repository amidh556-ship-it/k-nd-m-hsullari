<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kənd məhsulları</title>
<link rel="stylesheet" href="kentli.css">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
.top{position:sticky;top:0;z-index:10;background:white;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 5px #ddd}
.logo{font-weight:bold;color:#16803c;font-size:18px}
.search{flex:1}
.search a{display:block;background:#f1f1f1;border-radius:20px;padding:11px;text-decoration:none;color:#666;font-size:14px}
.round{width:38px;height:38px;border-radius:50%;background:#16803c;color:white;display:flex;align-items:center;justify-content:center;text-decoration:none}
.categories{display:flex;gap:9px;overflow:auto;background:white;padding:12px}
.categories a{background:#e9f6ec;color:#16803c;text-decoration:none;padding:9px 13px;border-radius:20px;white-space:nowrap}
.banner{margin:12px;padding:20px;background:linear-gradient(120deg,#16803c,#63bb71);color:white;border-radius:13px}
.banner h2{margin:0 0 7px}
.section-title{margin:18px 12px 8px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px;padding-bottom:90px}
.product{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px #ddd}
.product img{width:100%;height:160px;object-fit:contain}
.product-info{padding:10px}
.product-name{font-weight:bold;margin-bottom:8px}
.price{font-size:18px;font-weight:bold;color:#16803c;margin-bottom:10px}
.buy{display:block;background:#16803c;color:white;text-align:center;padding:10px;text-decoration:none;border-radius:8px}
#adminPanel{display:none;margin:12px;padding:15px;background:white;border-radius:12px}
#adminPanel input{width:100%;padding:12px;margin:7px 0 12px}
#adminPanel button{width:100%;padding:12px;border:0;border-radius:8px;background:#16803c;color:white}
.delete{width:100%;padding:9px;margin-top:8px;border:0;border-radius:7px;background:#c62828;color:white}
#preview{display:none;width:120px;height:120px;object-fit:contain}
.empty{text-align:center;padding:25px;color:#777}
.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;justify-content:space-around;padding:10px 3px;box-shadow:0 -2px 5px #ddd}
.bottom a{text-decoration:none;color:#444;text-align:center;font-size:12px;flex:1}
.bottom span{display:block;font-size:20px;margin-bottom:3px}
.support{position:fixed;right:15px;bottom:75px;background:#16803c;color:white;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:23px}
</style>
</head>

<body>

<header class="top">
  <div class="logo">Kəndli</div>
  <div class="search"><a href="axtar.html">🔍 Nə axtarırsınız?</a></div>
  <a class="round" href="profile.html">👤</a>
</header>

<nav class="categories">
  <a href="index.html">Hamısı</a>
  <a href="axtar.html">Məhsullar</a>
  <a href="sebet.html">Səbət</a>
</nav>

<section class="banner">
  <h2>Kənd məhsulları 🌿</h2>
  <p>Sevdiyiniz məhsulları rahatlıqla sifariş edin.</p>
</section>

<section id="adminPanel">
  <h3>📦 İdarəçi paneli</h3>
  <p>Məhsulun adını, qiymətini və şəklini əlavə et.</p>
  <input id="pName" placeholder="Məhsulun adı">
  <input id="pPrice" type="number" min="0.01" step="0.01" placeholder="Qiymət (AZN)">
  <input id="pImage" type="file" accept="image/*">
  <img id="preview" alt="Şəkil önizləməsi">
  <button id="addBtn">➕ Məhsulu əlavə et</button>
</section>

<h3 class="section-title">Məhsullar</h3>
<div id="products" class="products">
  <div class="empty">Məhsullar yüklənir...</div>
</div>

<a class="support" href="bot.html">💬</a>

<nav class="bottom">
  <a href="index.html"><span>🏠</span>Ana səhifə</a>
  <a href="axtar.html"><span>🔎</span>Axtarış</a>
  <a href="sebet.html"><span>🛒</span>Səbət</a>
  <a href="profile.html"><span>👤</span>Profil</a>
</nav>

<script type="module">
import {initializeApp, getApps, getApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getDatabase, ref, get, set, push, remove, onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const ADMIN_EMAIL = "amidh365@gmail.com";

const firebaseConfig = {
  databaseURL: "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getDatabase(app);
const productsRef = ref(db, "products");

function isAdmin(){
  return (localStorage.getItem("userEmail") || "")
    .trim().toLowerCase() === ADMIN_EMAIL;
}

if(isAdmin()){
  document.getElementById("adminPanel").style.display = "block";
}

const fileInput = document.getElementById("pImage");
const preview = document.getElementById("preview");
let imageData = "";

fileInput.addEventListener("change",()=>{
  const file = fileInput.files[0];
  imageData = "";

  if(!file) return;

  if(!file.type.startsWith("image/")){
    alert("Şəkil seç.");
    fileInput.value = "";
    return;
  }

  if(file.size > 400 * 1024){
    alert("Şəkil 400 KB-dan kiçik olmalıdır.");
    fileInput.value = "";
    return;
  }

  const reader = new FileReader();
  reader.onload = ()=>{
    imageData = reader.result;
    preview.src = imageData;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

document.getElementById("addBtn").addEventListener("click",async()=>{
  if(!isAdmin()){
    alert("Bu əməliyyat yalnız idarəçi üçündür.");
    return;
  }

  const name = document.getElementById("pName").value.trim();
  const price = Number(document.getElementById("pPrice").value);

  if(!name || !Number.isFinite(price) || price <= 0 || !imageData){
    alert("Ad, qiymət və şəkil daxil et.");
    return;
  }

  try{
    const newRef = push(productsRef);
    await set(newRef,{
      id:newRef.key,
      name,
      price,
      image:imageData,
      createdAt:Date.now(),
      createdBy:ADMIN_EMAIL
    });

    alert("Məhsul əlavə edildi!");
    document.getElementById("pName").value = "";
    document.getElementById("pPrice").value = "";
    fileInput.value = "";
    preview.style.display = "none";
    imageData = "";
  }catch(error){
    console.error(error);
    alert("Məhsul əlavə olunmadı. Firebase icazələrini yoxla.");
  }
});

window.deleteProduct = async function(id){
  if(!isAdmin()) return;

  if(!confirm("Bu məhsulu silmək istəyirsən?")) return;

  try{
    await remove(ref(db,"products/"+id));
  }catch(error){
    console.error(error);
    alert("Silinmədi. Firebase icazələrini yoxla.");
  }
};

function renderProducts(data){
  const box = document.getElementById("products");
  box.innerHTML = "";

  const list = Object.values(data || {});

  if(list.length === 0){
    box.innerHTML = '<div class="empty">Hələ məhsul yoxdur.</div>';
    return;
  }

  list.forEach(p=>{
    const card = document.createElement("article");
    card.className = "product";

    const img = document.createElement("img");
    img.src = p.image || "";
    img.alt = p.name || "Məhsul";
    img.onerror = ()=>{img.style.display="none";};

    const info = document.createElement("div");
    info.className = "product-info";

    const name = document.createElement("div");
    name.className = "product-name";
    name.textContent = p.name || "Məhsul";

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = Number(p.price).toFixed(2)+" AZN";

    const buy = document.createElement("a");
    buy.className = "buy";
    buy.href = "al.html?id="+encodeURIComponent(p.id);
    buy.textContent = "Məhsula bax";

    info.append(name,price,buy);
    card.append(img,info);

    if(isAdmin()){
      const del = document.createElement("button");
      del.className = "delete";
      del.textContent = "🗑️ Məhsulu sil";
      del.onclick = ()=>deleteProduct(p.id);
      card.append(del);
    }

    box.append(card);
  });
}

onValue(productsRef,snapshot=>{
  renderProducts(snapshot.val());
},error=>{
  console.error(error);
  document.getElementById("products").innerHTML =
    '<div class="empty">Məhsullar yüklənmədi. Firebase qaydalarını yoxla.</div>';
});
</script>

</body>
</html>
