<!DOCTYPE html>
<html lang="az">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Səbətim</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        h1 {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 0;
        }

        .cart-item {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            gap: 12px;
        }

        .cart-item img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
        }

        .info {
            flex: 1;
        }

        .name {
            font-size: 18px;
            font-weight: bold;
        }

        .price {
            color: #2e7d32;
            font-weight: bold;
            margin-top: 7px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .quantity button {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 7px;
            font-size: 20px;
            background: #eee;
        }

        .delete {
            margin-top: 8px;
            border: none;
            border-radius: 7px;
            padding: 8px 12px;
            background: #e53935;
            color: white;
        }

        .total {
            background: white;
            padding: 18px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .order-button {
            display: block;
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            background: #2e7d32;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            padding: 20px;
            text-decoration: none;
            color: #222;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        🛒 Səbətim
    </h1>


    <div id="cart"></div>


    <div class="total">

        Ümumi:
        <span id="total">0</span>
        AZN

    </div>


    <!-- SİFARİŞ ET -->

    <a
        href="orders.html"
        class="order-button"
    >
        📦 Sifariş et
    </a>


    <a
        class="back"
        href="index.html"
    >
        ← Alış-verişə qayıt
    </a>


</div>


<script>


function getCart() {

    try {

        return JSON.parse(
            localStorage.getItem("cart")
        ) || [];

    } catch (e) {

        return [];

    }

}


function saveCart(cart) {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}


function showCart() {

    const cart =
        getCart();

    const box =
        document.getElementById("cart");

    const totalBox =
        document.getElementById("total");


    box.innerHTML = "";

    let total = 0;


    if (cart.length === 0) {

        box.innerHTML = `
            <div class="empty">
                🛒 Səbətin boşdur
            </div>
        `;

        totalBox.innerText = "0";

        return;

    }


    cart.forEach(function(item, index) {

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;


        total +=
            price * quantity;


        box.innerHTML += `

            <div class="cart-item">

                <img
                    src="${item.image || ''}"
                    alt="${item.name || 'Məhsul'}"
                >

                <div class="info">

                    <div class="name">
                        ${item.name || 'Məhsul'}
                    </div>

                    <div class="price">
                        ${price.toFixed(2)} AZN
                    </div>

                    <div class="quantity">

                        <button
                            onclick="minusItem(${index})"
                        >
                            −
                        </button>

                        <b>
                            ${quantity}
                        </b>

                        <button
                            onclick="plusItem(${index})"
                        >
                            +
                        </button>

                    </div>

                    <button
                        class="delete"
                        onclick="deleteItem(${index})"
                    >
                        🗑️ Sil
                    </button>

                </div>

            </div>

        `;

    });


    totalBox.innerText =
        total.toFixed(2);

}


function plusItem(index) {

    const cart =
        getCart();


    if (!cart[index]) {
        return;
    }


    cart[index].quantity =
        Number(cart[index].quantity || 0) + 1;


    saveCart(cart);

    showCart();

}


function minusItem(index) {

    const cart =
        getCart();


    if (!cart[index]) {
        return;
    }


    cart[index].quantity =
        Number(cart[index].quantity || 1) - 1;


    if (
        cart[index].quantity <= 0
    ) {

        cart.splice(index, 1);

    }


    saveCart(cart);

    showCart();

}


function deleteItem(index) {

    const cart =
        getCart();


    cart.splice(index, 1);


    saveCart(cart);

    showCart();

}


showCart();

</script>


</body>

</html>
