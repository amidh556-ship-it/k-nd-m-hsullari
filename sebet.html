<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Səbətim</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

h1 {
    background: white;
    padding: 20px;
    margin: 0 0 12px;
    border-radius: 10px;
}

.cart-item {
    background: white;
    margin-bottom: 10px;
    padding: 12px;
    border-radius: 10px;
    display: flex;
    gap: 12px;
    align-items: center;
}

.cart-item img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
}

.info {
    flex: 1;
}

.name {
    font-size: 17px;
    font-weight: bold;
}

.price {
    margin-top: 6px;
    color: #2e7d32;
    font-weight: bold;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
}

.quantity button {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 7px;
    background: #eee;
    font-size: 21px;
}

.delete {
    margin-top: 9px;
    padding: 8px 12px;
    border: none;
    border-radius: 7px;
    background: #e53935;
    color: white;
}

.total {
    background: white;
    margin-top: 15px;
    padding: 18px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
}

.order {
    display: block;
    background: #2e7d32;
    color: white;
    text-align: center;
    padding: 16px;
    margin-top: 12px;
    border-radius: 9px;
    text-decoration: none;
    font-weight: bold;
}

.empty {
    background: white;
    padding: 35px 15px;
    text-align: center;
    border-radius: 10px;
    font-size: 18px;
}

.back {
    display: block;
    text-align: center;
    padding: 20px;
    color: #222;
    text-decoration: none;
}

.login-warning {
    background: white;
    padding: 25px;
    text-align: center;
    border-radius: 10px;
}

.login-warning a {
    display: block;
    margin-top: 15px;
    padding: 14px;
    background: #2e7d32;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

</style>

</head>

<body>

<div class="container">

<h1>
🛒 Səbətim
</h1>

<div id="cart"></div>

<div
    class="total"
    id="totalBox"
>

Ümumi:
<span id="total">
0.00
</span>
AZN

</div>

<a
    id="orderButton"
    class="order"
    href="sifariş.html"
>

📦 Sifariş et

</a>

<a
    class="back"
    href="index.html"
>

← Alış-verişə qayıt

</a>

</div>


<script>


/* =========================
   AKTİV HESAB
========================= */

function getAccountKey() {

    const email =
        localStorage.getItem("userEmail");


    if (!email) {

        return null;

    }


    return email
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]/g, "_");

}


/* =========================
   SƏBƏTİ GÖTÜR
========================= */

function getCart() {

    const key =
        getAccountKey();


    if (!key) {

        return [];

    }


    try {

        return JSON.parse(

            localStorage.getItem(
                "cart_" + key
            )

        ) || [];

    } catch (error) {

        return [];

    }

}


/* =========================
   SƏBƏTİ YADDA SAXLA
========================= */

function saveCart(cart) {

    const key =
        getAccountKey();


    if (!key) {

        return;

    }


    localStorage.setItem(

        "cart_" + key,

        JSON.stringify(cart)

    );

}


/* =========================
   SƏBƏTİ GÖSTƏR
========================= */

function showCart() {

    const email =
        localStorage.getItem(
            "userEmail"
        );


    const box =
        document.getElementById(
            "cart"
        );


    const totalBox =
        document.getElementById(
            "total"
        );


    const orderButton =
        document.getElementById(
            "orderButton"
        );


    box.innerHTML = "";


    /*
       GİRİŞ EDİLMƏYİB
    */

    if (!email) {

        box.innerHTML = `

            <div class="login-warning">

                🔐 Səbəti görmək üçün
                əvvəlcə hesabına daxil ol.

                <a href="login.html">
                    Hesaba giriş et
                </a>

            </div>

        `;


        totalBox.innerText =
            "0.00";


        orderButton.style.display =
            "none";


        return;

    }


    const cart =
        getCart();


    /*
       SƏBƏT BOŞDUR
    */

    if (cart.length === 0) {

        box.innerHTML = `

            <div class="empty">

                🛒 Səbətin boşdur

            </div>

        `;


        totalBox.innerText =
            "0.00";


        orderButton.style.display =
            "none";


        return;

    }


    orderButton.style.display =
        "block";


    let total = 0;


    /*
       MƏHSULLAR
    */

    cart.forEach(
        function(item, index) {


            const quantity =
                Number(
                    item.quantity
                ) || 1;


            const price =
                Number(
                    item.price
                ) || 0;


            total +=
                price * quantity;


            box.innerHTML += `

                <div class="cart-item">

                    <img
                        src="${item.image || ''}"
                        alt="${item.name || 'Məhsul'}"
                    >

                    <div class="info">

                        <div class="name">

                            ${item.name || "Məhsul"}

                        </div>

                        <div class="price">

                            ${price.toFixed(2)}
                            AZN

                        </div>


                        <div class="quantity">

                            <button
                                onclick="minusItem(${index})"
                            >
                                −
                            </button>


                            <b>
                                ${quantity}
                            </b>


                            <button
                                onclick="plusItem(${index})"
                            >
                                +
                            </button>

                        </div>


                        <button
                            class="delete"
                            onclick="deleteItem(${index})"
                        >

                            🗑️ Sil

                        </button>

                    </div>

                </div>

            `;

        }
    );


    totalBox.innerText =
        total.toFixed(2);

}


/* =========================
   ARTIR
========================= */

function plusItem(index) {

    const cart =
        getCart();


    if (!cart[index]) {

        return;

    }


    cart[index].quantity =
        (Number(
            cart[index].quantity
        ) || 0) + 1;


    saveCart(cart);

    showCart();

}


/* =========================
   AZALT
========================= */

function minusItem(index) {

    const cart =
        getCart();


    if (!cart[index]) {

        return;

    }


    cart[index].quantity =
        (Number(
            cart[index].quantity
        ) || 1) - 1;


    if (
        cart[index].quantity <= 0
    ) {

        cart.splice(
            index,
            1
        );

    }


    saveCart(cart);

    showCart();

}


/* =========================
   SİL
========================= */

function deleteItem(index) {

    const cart =
        getCart();


    cart.splice(
        index,
        1
    );


    saveCart(cart);

    showCart();

}


/* =========================
   BAŞLA
========================= */

showCart();

</script>

</body>

</html>
