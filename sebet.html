<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Səbətim</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

h1 {
    padding: 15px;
}

.sifaris {
    background: white;
    margin: 15px;
    padding: 15px;
    border-radius: 12px;
}

.sifaris img {
    width: 150px;
    border-radius: 10px;
}

.qiymet {
    font-size: 20px;
    font-weight: bold;
}

.saygac {
    display: flex;
    align-items: center;
    margin-top: 15px;
}

.saygac button {
    width: 45px;
    height: 40px;
    border: 1px solid #ddd;
    background: white;
    font-size: 22px;
}

.say {
    width: 45px;
    text-align: center;
    font-size: 18px;
}

.sil {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: #ff4d00;
    color: white;
}
</style>
</head>

<body>

<h1>Sifarişlərim</h1>

<div id="sifarisler"></div>

<script>

let say = Number(localStorage.getItem("say_masin")) || 0;

function goster() {

    if (say <= 0) {
        document.getElementById("sifarisler").innerHTML =
        "<p style='padding:15px'>Sifariş yoxdur.</p>";
        return;
    }

    document.getElementById("sifarisler").innerHTML = `
        <div class="sifaris">

            <img src="foto.png">

            <h2>Məhsulun adı</h2>

            <div class="qiymet">10 AZN</div>

            <div class="saygac">

                <button onclick="azalt()">−</button>

                <span class="say">${say}</span>

                <button onclick="artir()">+</button>

            </div>

            <button class="sil" onclick="sil()">Sil</button>

        </div>
    `;
}

function artir() {
    say++;
    localStorage.setItem("say_masin", say);
    goster();
}

function azalt() {
    if (say > 0) {
        say--;
        localStorage.setItem("say_masin", say);
        goster();
    }
}

function sil() {
    say = 0;
    localStorage.removeItem("say_masin");
    goster();
}

goster();

</script>

</body>
</html>
