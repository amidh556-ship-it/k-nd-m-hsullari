<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Məhsul</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.mehsul {
    background: white;
    min-height: 100vh;
    padding: 15px;
}

.mehsul img {
    width: 100%;
    max-width: 400px;
    display: block;
    margin: auto;
    border-radius: 10px;
}

.ad {
    font-size: 20px;
    font-weight: bold;
    margin-top: 15px;
}

.qiymet {
    font-size: 25px;
    font-weight: bold;
    margin-top: 10px;
}

.al {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 25px;
    background: #ff4d00;
    color: white;
    font-size: 18px;
    font-weight: bold;
    margin-top: 25px;
}

.saygac {
    display: none;
    justify-content: center;
    align-items: center;
    margin-top: 25px;
}

.saygac button {
    width: 55px;
    height: 50px;
    border: none;
    background: white;
    font-size: 28px;
}

#say {
    width: 50px;
    height: 50px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="mehsul">

    <img id="mehsulSekli">

    <div class="ad" id="mehsulAdi">Məhsulun adı</div>

    <div class="qiymet">10 AZN</div>

    <button class="al" id="alBtn" onclick="al()">Al</button>

    <div class="saygac" id="saygac">

        <button onclick="azalt()">−</button>

        <span id="say">0</span>

        <button onclick="artir()">+</button>

    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id") || "mehsul";

const sayKey = "say_" + id;

let say = Number(localStorage.getItem(sayKey)) || 0;

document.getElementById("say").innerText = say;

if (say > 0) {
    document.getElementById("alBtn").style.display = "none";
    document.getElementById("saygac").style.display = "flex";
}

function al() {
    say = 1;
    yaddaSaxla();

    document.getElementById("alBtn").style.display = "none";
    document.getElementById("saygac").style.display = "flex";
}

function artir() {
    say++;
    yaddaSaxla();
}

function azalt() {
    if (say > 0) {
        say--;
        yaddaSaxla();
    }
}

function yaddaSaxla() {
    localStorage.setItem(sayKey, say);
    document.getElementById("say").innerText = say;
}

</script>

</body>
</html>
