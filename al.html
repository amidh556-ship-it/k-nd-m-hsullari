<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Məhsul - Kənd məhsulları</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f1;
    color:#202820;
    padding-bottom:100px;
}

.product-page{
    width:100%;
    max-width:650px;
    margin:auto;
    background:#f3f5f1;
}


/* =========================
   YUXARI
========================= */

.topbar{
    height:62px;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid #e2e5e0;
    position:relative;
    z-index:20;
}

.back-button,
.cart-top{
    width:42px;
    height:42px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:25px;
}

.back-button{
    color:#26382a;
    background:#eef2ed;
}

.cart-top{
    color:white;
    background:#26382a;
    font-size:20px;
}

.top-title{
    font-size:18px;
    font-weight:bold;
    color:#26382a;
}


/* =========================
   ŞƏKİL
========================= */

.gallery{
    position:relative;
    width:100%;
    height:420px;
    background:#ffffff;
    overflow:hidden;
}

.gallery-track{
    display:flex;
    width:100%;
    height:100%;
    transition:transform .3s ease;
}

.gallery-slide{
    min-width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ffffff;
}

.gallery-slide img{
    width:100%;
    height:100%;
    object-fit:contain;
}


/* =========================
   SAĞ SOL
========================= */

.gallery-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:#ffffff;
    color:#26382a;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
    font-size:30px;
    z-index:10;
}

.gallery-left{
    left:14px;
}

.gallery-right{
    right:14px;
}


/* =========================
   ŞƏKİL NÖMRƏSİ
========================= */

.photo-number{
    position:absolute;
    top:14px;
    right:14px;
    background:#26382a;
    color:white;
    padding:7px 12px;
    border-radius:18px;
    font-size:13px;
    z-index:10;
}


/* =========================
   NÖQTƏLƏR
========================= */

.dots{
    position:absolute;
    bottom:14px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:7px;
    z-index:10;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#b9c0b9;
}

.dot.active{
    width:22px;
    border-radius:10px;
    background:#26382a;
}


/* =========================
   ENDİRİM
========================= */

.discount-bar{
    display:flex;
    gap:25px;
    overflow:hidden;
    white-space:nowrap;
    background:#e8f2e6;
    padding:13px 17px;
}

.discount-bar span{
    color:#34743d;
    font-size:14px;
    font-weight:bold;
}


/* =========================
   MƏHSUL MƏLUMATI
========================= */

.product-info{
    background:#ffffff;
    margin-top:8px;
    padding:22px 18px 30px;
    border-radius:20px 20px 0 0;
}

.product-name{
    font-size:27px;
    font-weight:bold;
    color:#26382a;
    margin-bottom:13px;
}

.rating{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
}

.stars{
    color:#e5a928;
    font-size:18px;
    letter-spacing:1px;
}

.rating-number{
    color:#333;
    font-size:15px;
    font-weight:bold;
}

.sold{
    color:#858585;
    font-size:14px;
}

.separator{
    height:1px;
    background:#e8e8e8;
    margin:18px 0;
}

.product-price{
    color:#d87312;
    font-size:32px;
    font-weight:bold;
}

.discount-text{
    display:inline-block;
    margin-top:10px;
    padding:8px 12px;
    border-radius:10px;
    background:#fff3dd;
    color:#b5650c;
    font-size:14px;
    font-weight:bold;
}

.description-title{
    margin-top:23px;
    margin-bottom:8px;
    font-size:17px;
    font-weight:bold;
    color:#26382a;
}

.description{
    color:#6c746d;
    line-height:1.6;
    font-size:15px;
}


/* =========================
   SƏBƏT
========================= */

.cart-link{
    position:fixed;
    right:18px;
    bottom:95px;
    width:62px;
    height:62px;
    border-radius:18px;
    background:#26382a;
    color:white;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    box-shadow:0 4px 14px rgba(0,0,0,.22);
    z-index:1000;
}

.cart-button{
    position:fixed;
    bottom:15px;
    left:15px;
    right:15px;
    max-width:620px;
    margin:auto;
    height:62px;
    border:none;
    border-radius:18px;
    background:#e4b343;
    color:#26382a;
    font-size:19px;
    font-weight:bold;
    z-index:1100;
    box-shadow:0 4px 15px rgba(0,0,0,.18);
}

.cart-button:active{
    transform:scale(.98);
}


/* =========================
   TELEFON
========================= */

@media(max-width:380px){

    .gallery{
        height:370px;
    }

    .product-name{
        font-size:24px;
    }

    .product-price{
        font-size:28px;
    }

    .gallery-btn{
        width:40px;
        height:40px;
        font-size:27px;
    }

}

</style>

</head>


<body>

<div class="product-page">


    <!-- YUXARI -->

    <div class="topbar">

        <a
            href="index.html"
            class="back-button"
        >
            ‹
        </a>

        <div class="top-title">
            Məhsul
        </div>

        <a
            href="sebet.html"
            class="cart-top"
        >
            🛒
        </a>

    </div>


    <!-- =========================
         4 ŞƏKİL
    ========================= -->

    <div class="gallery">

        <div
            class="gallery-track"
            id="galleryTrack"
        >

            <div class="gallery-slide">
                <img src="1.png" alt="Məhsul 1">
            </div>

            <div class="gallery-slide">
                <img src="2.png" alt="Məhsul 2">
            </div>

            <div class="gallery-slide">
                <img src="3.png" alt="Məhsul 3">
            </div>

            <div class="gallery-slide">
                <img src="4.png" alt="Məhsul 4">
            </div>

        </div>


        <button
            class="gallery-btn gallery-left"
            onclick="previousImage()"
            type="button"
        >
            ‹
        </button>


        <button
            class="gallery-btn gallery-right"
            onclick="nextImage()"
            type="button"
        >
            ›
        </button>


        <div
            class="photo-number"
            id="photoNumber"
        >
            1 / 4
        </div>


        <div class="dots">

            <span
                class="dot active"
                onclick="goToImage(0)"
            ></span>

            <span
                class="dot"
                onclick="goToImage(1)"
            ></span>

            <span
                class="dot"
                onclick="goToImage(2)"
            ></span>

            <span
                class="dot"
                onclick="goToImage(3)"
            ></span>

        </div>

    </div>


    <!-- ENDİRİM -->

    <div class="discount-bar">

        <span>✓ 20% endirim</span>

        <span>✓ Sifarişlərdə 20%</span>

        <span>✓ Çatdırılma endirimi</span>

    </div>


    <!-- MƏHSUL -->

    <div class="product-info">

        <div
            id="productName"
            class="product-name"
        >
        </div>


        <div class="rating">

            <span class="stars">
                ★★★★☆
            </span>

            <span class="rating-number">
                4.7 ★
            </span>

            <span class="sold">
                • 487 ədəd satılıb
            </span>

        </div>


        <div class="separator"></div>


        <div
            id="productPrice"
            class="product-price"
        >
        </div>


        <div class="discount-text">
            🔥 Çatdırılmada 20% endirim
        </div>


        <div class="description-title">
            Məhsul haqqında
        </div>


        <div
            id="productDescription"
            class="description"
        >
        </div>

    </div>


</div>


<!-- SƏBƏT -->

<a
    class="cart-link"
    href="sebet.html"
>
    🛒
</a>


<button
    class="cart-button"
    onclick="addCurrentProduct()"
    type="button"
>
    🛒 Səbətə əlavə et
</button>


<script>


/* =========================
   MƏHSULLAR
========================= */

const products = {

    masin: {

        name: "Maşın oyuncaq",

        price: 3.80,

        images: [
            "foto.png",
            "foto2.png",
            "foto3.png",
            "foto4.png"
        ],

        description:
            "Keyfiyyətli məhsul."

    },


    tato: {

        name: "Tato",

        price: 4.80,

        images: [
            "1.png",
            "2.png",
            "3.png",
            "4.png"
        ],

        description:
            "Təbii və keyfiyyətli məhsul."

    }

};


/* =========================
   URL
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const productId =
    params.get("id");

const product =
    products[productId];


/* =========================
   MƏHSULU GÖSTƏR
========================= */

if(product){

    document.getElementById(
        "productName"
    ).innerText =
        product.name;


    document.getElementById(
        "productPrice"
    ).innerText =
        product.price.toFixed(2) + " AZN";


    document.getElementById(
        "productDescription"
    ).innerText =
        product.description;


    document.querySelector(
        ".gallery-slide:nth-child(1) img"
    ).src =
        product.images[0];


    document.querySelector(
        ".gallery-slide:nth-child(2) img"
    ).src =
        product.images[1];


    document.querySelector(
        ".gallery-slide:nth-child(3) img"
    ).src =
        product.images[2];


    document.querySelector(
        ".gallery-slide:nth-child(4) img"
    ).src =
        product.images[3];

}


/* =========================
   ŞƏKİL ÇEVİRMƏ
========================= */

let currentImage = 0;

const track =
    document.getElementById(
        "galleryTrack"
    );

const dots =
    document.querySelectorAll(
        ".dot"
    );

const photoNumber =
    document.getElementById(
        "photoNumber"
    );


function updateGallery(){

    track.style.transform =
        "translateX(-" +
        (currentImage * 100) +
        "%)";


    dots.forEach(
        function(dot,index){

            dot.classList.toggle(
                "active",
                index === currentImage
            );

        }
    );


    photoNumber.innerText =
        (currentImage + 1) + " / 4";

}


function nextImage(){

    currentImage++;

    if(currentImage >= 4){

        currentImage = 0;

    }

    updateGallery();

}


function previousImage(){

    currentImage--;

    if(currentImage < 0){

        currentImage = 3;

    }

    updateGallery();

}


function goToImage(index){

    currentImage = index;

    updateGallery();

}


/* =========================
   TELEFONDA SÜRÜŞDÜRMƏ
========================= */

let touchStartX = 0;

let touchEndX = 0;


track.addEventListener(
    "touchstart",
    function(e){

        touchStartX =
            e.changedTouches[0].screenX;

    }
);


track.addEventListener(
    "touchend",
    function(e){

        touchEndX =
            e.changedTouches[0].screenX;


        if(
            touchStartX - touchEndX > 50
        ){

            nextImage();

        }


        if(
            touchEndX - touchStartX > 50
        ){

            previousImage();

        }

    }
);


/* =========================
   HESAB AÇARI
========================= */

function getAccountKey(){

    const email =
        localStorage.getItem(
            "userEmail"
        );


    if(!email){

        return null;

    }


    return email
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]/g,
            "_"
        );

}


/* =========================
   SƏBƏTƏ ƏLAVƏ ET
========================= */

function addCurrentProduct(){

    const key =
        getAccountKey();


    if(!key){

        alert(
            "Əvvəlcə hesabına daxil ol."
        );


        window.location.href =
            "kent.html";

        return;

    }


    if(!product){

        alert(
            "Məhsul tapılmadı."
        );

        return;

    }


    let cart = [];


    try{

        cart =
            JSON.parse(
                localStorage.getItem(
                    "cart_" + key
                )
            ) || [];

    }catch(error){

        cart = [];

    }


    const existing =
        cart.find(
            function(item){

                return item.productId ===
                    productId;

            }
        );


    if(existing){

        existing.quantity =
            (Number(
                existing.quantity
            ) || 1) + 1;

    }

    else{

        cart.push({

            productId:
                productId,

            name:
                product.name,

            price:
                product.price,

            image:
                product.images[0],

            quantity:
                1

        });

    }


    localStorage.setItem(

        "cart_" + key,

        JSON.stringify(cart)

    );


    alert(
        "✅ " +
        product.name +
        " səbətə əlavə edildi!"
    );

}

</script>

</body>
</html>
