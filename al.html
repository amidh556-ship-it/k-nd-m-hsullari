<!DOCTYPE html>
<html lang="az">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Məhsul - Kənd məhsulları</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            color: #222;

        }


        .product-page {

            max-width: 600px;

            margin: auto;

            padding: 15px;

        }


        .product {

            background: white;

            border-radius: 12px;

            padding: 15px;

        }


        .product-image {

            width: 100%;

            max-height: 400px;

            object-fit: contain;

            border-radius: 10px;

        }


        .product-name {

            font-size: 24px;

            font-weight: bold;

            margin-top: 15px;

        }


        .product-price {

            font-size: 22px;

            color: #2e7d32;

            font-weight: bold;

            margin-top: 10px;

        }


        .description {

            color: #666;

            margin-top: 10px;

            line-height: 1.5;

        }


        .cart-button {

            width: 100%;

            padding: 15px;

            margin-top: 20px;

            border: none;

            border-radius: 9px;

            background: #2e7d32;

            color: white;

            font-size: 17px;

            font-weight: bold;

        }


        .cart-button:active {

            transform: scale(0.98);

        }


        .cart-link {

            display: block;

            text-align: center;

            margin-top: 15px;

            padding: 14px;

            background: white;

            border-radius: 9px;

            text-decoration: none;

            color: #222;

            font-weight: bold;

        }


        .back-link {

            display: block;

            text-align: center;

            padding: 20px;

            color: #222;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="product-page">


    <div class="product">


        <!-- MƏHSUL ŞƏKLİ -->

        <img

            class="product-image"

            id="productImage"

            src="foto.png"

            alt="Məhsul"

        >


        <!-- MƏHSUL ADI -->

        <div

            class="product-name"

            id="productName"

        >

            Kənd məhsulu

        </div>


        <!-- QİYMƏT -->

        <div

            class="product-price"

            id="productPrice"

        >

            10 AZN

        </div>


        <!-- AÇIQLAMA -->

        <div class="description">

            Təbii və keyfiyyətli kənd məhsulu.

        </div>


        <!-- SƏBƏTƏ ƏLAVƏ ET -->

        <button

            class="cart-button"

            onclick="addCurrentProduct()"

        >

            🛒 Səbətə əlavə et

        </button>


        <!-- SƏBƏTƏ GET -->

        <a

            class="cart-link"

            href="sebet.html"

        >

            🛒 Səbətimə bax

        </a>


    </div>


    <!-- GERİ -->

    <a

        class="back-link"

        href="index.html"

    >

        ← Alış-verişə qayıt

    </a>


</div>



<script>


/* =========================
   HESAB AÇARI
========================= */

function getAccountKey() {


    const email =

        localStorage.getItem(

            "userEmail"

        );


    if (!email) {

        return null;

    }


    return email

        .toLowerCase()

        .trim()

        .replace(

            /[^a-z0-9]/g,

            "_"

        );

}



/* =========================
   MƏHSUL MƏLUMATLARI
========================= */

const product = {


    id:

        "kendl-mhsul-1",


    name:

        "Kənd məhsulu",


    price:

        10,


    image:

        "foto.png"

};



/* =========================
   SƏBƏTƏ ƏLAVƏ ET
========================= */

function addCurrentProduct() {


    const key =

        getAccountKey();



    /* GİRİŞ YOXDURSA */

    if (!key) {


        alert(

            "🔐 Əvvəlcə hesabına giriş et."

        );


        window.location.href =

            "index.html";


        return;

    }



    /* HESABIN SƏBƏTİNİ GÖTÜR */

    let cart = [];


    try {


        cart =

            JSON.parse(

                localStorage.getItem(

                    "cart_" + key

                )

            ) || [];


    } catch (error) {


        cart = [];


    }



    /* EYNİ MƏHSULU TAP */

    const existing =

        cart.find(

            function(item) {


                return (

                    item.id ===

                    product.id

                );


            }

        );



    /* VARSA SAYINI ARTIR */

    if (existing) {


        existing.quantity =

            (

                Number(

                    existing.quantity

                ) || 0

            ) + 1;


    }


    /* YOXDURSA YENİ ƏLAVƏ ET */

    else {


        cart.push({


            id:

                product.id,


            name:

                product.name,


            price:

                product.price,


            image:

                product.image,


            quantity:

                1


        });


    }



    /* HESABIN SƏBƏTİNƏ YAZ */

    localStorage.setItem(


        "cart_" + key,


        JSON.stringify(cart)


    );



    alert(


        "✅ Məhsul səbətə əlavə edildi!"


    );

}



</script>


</body>

</html>
