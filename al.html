<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Məhsul - Kənd məhsulları</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
    padding-bottom:90px;
}

.product-page{
    width:100%;
    max-width:600px;
    margin:auto;
    background:white;
}

.product{
    background:white;
}


/* =========================
   ŞƏKİL GALEREYASI
========================= */

.gallery{
    position:relative;
    width:100%;
    height:430px;
    background:white;
    overflow:hidden;
}

.gallery-track{
    display:flex;
    width:100%;
    height:100%;
    transition:transform .3s ease;
}

.gallery-slide{
    min-width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.gallery-slide img{
    width:100%;
    height:100%;
    object-fit:contain;
}


/* SAĞ-SOL DÜYMƏLƏR */

.gallery-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.9);
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    font-size:28px;
    z-index:5;
    cursor:pointer;
}

.gallery-left{
    left:10px;
}

.gallery-right{
    right:10px;
}


/* NÖQTƏLƏR */

.dots{
    position:absolute;
    bottom:12px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:7px;
    z-index:5;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#aaa;
}

.dot.active{
    background:#111;
}


/* =========================
   ENDİRİM
========================= */

.discount-bar{
    display:flex;
    gap:20px;
    overflow:hidden;
    white-space:nowrap;
    background:#fff1df;
    padding:12px 20px;
    color:#278b35;
    font-size:15px;
    font-weight:bold;
}


/* =========================
   MƏHSUL MƏLUMATLARI
========================= */

.product-info{
    padding:20px;
}

.product-name{
    font-size:25px;
    font-weight:bold;
    margin-bottom:15px;
}

.rating{
    font-size:16px;
    color:#333;
}

.stars{
    letter-spacing:1px;
}

.sold{
    color:#777;
    margin-left:5px;
}

.product-price{
    font-size:28px;
    color:#e66b00;
    font-weight:bold;
    margin-top:15px;
}

.discount-text{
    margin-top:8px;
    color:#e66b00;
    font-size:15px;
    font-weight:bold;
}

.description{
    color:#666;
    margin-top:12px;
    line-height:1.5;
}


/* =========================
   SƏBƏT DÜYMƏSİ
========================= */

.cart-button{
    position:fixed;
    bottom:15px;
    left:20px;
    right:20px;
    max-width:560px;
    margin:auto;
    padding:17px;
    border:none;
    border-radius:35px;
    background:#ff7900;
    color:white;
    font-size:20px;
    font-weight:bold;
    z-index:1000;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.cart-button:active{
    transform:scale(.98);
}


/* =========================
   SƏBƏT DÜYMƏSİ
========================= */

.cart-link{
    position:fixed;
    right:18px;
    bottom:90px;
    width:105px;
    height:105px;
    border-radius:50%;
    background:#16a637;
    color:white;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:bold;
    z-index:900;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.cart-link span{
    font-size:30px;
}


/* =========================
   GERİ
========================= */

.back-link{
    display:block;
    padding:18px;
    text-align:center;
    color:#222;
    text-decoration:none;
}


/* TELEFON */

@media(max-width:380px){

    .gallery{
        height:380px;
    }

    .product-name{
        font-size:23px;
    }

}

</style>

</head>


<body>


<div class="product-page">

    <div class="product">


        <!-- =========================
             4 ŞƏKİL
        ========================= -->

        <div class="gallery">

            <div
                class="gallery-track"
                id="galleryTrack"
            >

                <div class="gallery-slide">
                    <img src="1.png" alt="Məhsul 1">
                </div>

                <div class="gallery-slide">
                    <img src="2.png" alt="Məhsul 2">
                </div>

                <div class="gallery-slide">
                    <img src="3.png" alt="Məhsul 3">
                </div>

                <div class="gallery-slide">
                    <img src="4.png" alt="Məhsul 4">
                </div>

            </div>


            <!-- SOL -->

            <button
                class="gallery-btn gallery-left"
                onclick="previousImage()"
                type="button"
            >
                ‹
            </button>


            <!-- SAĞ -->

            <button
                class="gallery-btn gallery-right"
                onclick="nextImage()"
                type="button"
            >
                ›
            </button>


            <!-- NÖQTƏLƏR -->

            <div class="dots">

                <span
                    class="dot active"
                    onclick="goToImage(0)"
                ></span>

                <span
                    class="dot"
                    onclick="goToImage(1)"
                ></span>

                <span
                    class="dot"
                    onclick="goToImage(2)"
                ></span>

                <span
                    class="dot"
                    onclick="goToImage(3)"
                ></span>

            </div>

        </div>


        <!-- =========================
             ENDİRİM
        ========================= -->

        <div class="discount-bar">

            <span>✓ 20% endirim</span>

            <span>▣ Sifarişlərdə 20% ENDİRİM</span>

            <span>✓ Gecikməyə görə</span>

        </div>


        <!-- =========================
             MƏHSUL
        ========================= -->

        <div class="product-info">

            <div
                id="productName"
                class="product-name"
            >
            </div>


            <div class="rating">

                <span class="stars">
                    ★★★★☆
                </span>

                <span>
                    4.7 ★
                </span>

                <span class="sold">
                    487 ədəd satılıb
                </span>

            </div>


            <div
                id="productPrice"
                class="product-price"
            >
            </div>


            <div class="discount-text">

                🔥 Çatdırılmada 20% endirim

            </div>


            <div
                id="productDescription"
                class="description"
            >
            </div>

        </div>


    </div>


    <a
        class="cart-link"
        href="sebet.html"
    >

        <span>🛒</span>

        Səbət

    </a>


    <button
        class="cart-button"
        onclick="addCurrentProduct()"
        type="button"
    >

        🛒 Səbətə əlavə et

    </button>


</div>


<script>


/* =========================
   MƏHSULLAR
========================= */

const products = {

    masin: {

        name: "Maşın oyuncaq",

        price: 3.80,

        images: [
            "foto.png",
            "foto2.png",
            "foto3.png",
            "foto4.png"
        ],

        description:
            "Keyfiyyətli məhsul."

    },


    tato: {

        name: "Tato",

        price: 4.80,

        images: [
            "1.png",
            "2.png",
            "3.png",
            "4.png"
        ],

        description:
            "Təbii və keyfiyyətli məhsul."

    }

};


/* =========================
   URL
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const productId =
    params.get("id");

const product =
    products[productId];


/* =========================
   MƏHSULU GÖSTƏR
========================= */

if(product){

    document.getElementById(
        "productName"
    ).innerText =
        product.name;


    document.getElementById(
        "productPrice"
    ).innerText =
        product.price.toFixed(2) + " AZN";


    document.getElementById(
        "productDescription"
    ).innerText =
        product.description;

}


/* =========================
   ŞƏKİL ÇEVİRMƏ
========================= */

let currentImage = 0;

const track =
    document.getElementById(
        "galleryTrack"
    );

const dots =
    document.querySelectorAll(
        ".dot"
    );


function updateGallery(){

    track.style.transform =
        "translateX(-" +
        (currentImage * 100) +
        "%)";


    dots.forEach(
        function(dot,index){

            dot.classList.toggle(
                "active",
                index === currentImage
            );

        }
    );

}


function nextImage(){

    currentImage++;

    if(currentImage >= 4){

        currentImage = 0;

    }

    updateGallery();

}


function previousImage(){

    currentImage--;

    if(currentImage < 0){

        currentImage = 3;

    }

    updateGallery();

}


function goToImage(index){

    currentImage = index;

    updateGallery();

}


/* =========================
   TELEFONDA SÜRÜŞDÜRMƏ
========================= */

let touchStartX = 0;

let touchEndX = 0;


track.addEventListener(
    "touchstart",
    function(e){

        touchStartX =
            e.changedTouches[0].screenX;

    }
);


track.addEventListener(
    "touchend",
    function(e){

        touchEndX =
            e.changedTouches[0].screenX;


        if(
            touchStartX - touchEndX > 50
        ){

            nextImage();

        }


        if(
            touchEndX - touchStartX > 50
        ){

            previousImage();

        }

    }
);


/* =========================
   HESAB AÇARI
========================= */

function getAccountKey(){

    const email =
        localStorage.getItem(
            "userEmail"
        );


    if(!email){

        return null;

    }


    return email
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]/g,
            "_"
        );

}


/* =========================
   SƏBƏTƏ ƏLAVƏ ET
========================= */

function addCurrentProduct(){

    const key =
        getAccountKey();


    if(!key){

        alert(
            "Əvvəlcə hesabına daxil ol."
        );


        window.location.href =
            "kent.html";

        return;

    }


    if(!product){

        alert(
            "Məhsul tapılmadı."
        );

        return;

    }


    let cart = [];


    try{

        cart =
            JSON.parse(
                localStorage.getItem(
                    "cart_" + key
                )
            ) || [];

    }catch(error){

        cart = [];

    }


    const existing =
        cart.find(
            function(item){

                return item.productId ===
                    productId;

            }
        );


    if(existing){

        existing.quantity =
            (Number(
                existing.quantity
            ) || 1) + 1;

    }

    else{

        cart.push({

            productId:
                productId,

            name:
                product.name,

            price:
                product.price,

            image:
                product.images[0],

            quantity:
                1

        });

    }


    localStorage.setItem(

        "cart_" + key,

        JSON.stringify(cart)

    );


    alert(
        "✅ " +
        product.name +
        " səbətə əlavə edildi!"
    );

}

</script>

</body>
</html>
