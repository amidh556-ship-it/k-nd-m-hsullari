<!DOCTYPE html><html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Məhsul - Kənd məhsulları</title><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.product-page{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.product{
    background:white;
    border-radius:12px;
    padding:15px;
}

.gallery{
    position:relative;
    width:100%;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    touch-action:pan-y;
}

.gallery img{
    width:100%;
    height:400px;
    object-fit:contain;
    display:block;
}

.gallery-button{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    color:white;
    font-size:25px;
    z-index:5;
}

.gallery-left{
    left:10px;
}

.gallery-right{
    right:10px;
}

.photo-count{
    position:absolute;
    right:12px;
    bottom:12px;
    background:rgba(0,0,0,.55);
    color:white;
    padding:6px 10px;
    border-radius:15px;
    font-size:13px;
    z-index:5;
}

.thumbnails{
    display:flex;
    gap:7px;
    margin-top:10px;
    overflow-x:auto;
}

.thumbnail{
    width:58px;
    height:58px;
    object-fit:cover;
    border-radius:7px;
    border:2px solid transparent;
    cursor:pointer;
    flex-shrink:0;
}

.thumbnail.active{
    border:2px solid #2e7d32;
}

.product-name{
    font-size:24px;
    font-weight:bold;
    margin-top:15px;
}

.product-price{
    font-size:22px;
    color:#2e7d32;
    font-weight:bold;
    margin-top:10px;
}

.description{
    color:#666;
    margin-top:10px;
    line-height:1.5;
}

.cart-button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:9px;
    background:#2e7d32;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.cart-button:active{
    transform:scale(.98);
}

.cart-link{
    display:block;
    text-align:center;
    margin-top:15px;
    padding:14px;
    background:white;
    border-radius:9px;
    text-decoration:none;
    color:#222;
    font-weight:bold;
}

.back-link{
    display:block;
    text-align:center;
    padding:20px;
    color:#222;
    text-decoration:none;
}

</style></head><body><div class="product-page"><div class="product"><div class="gallery"><button
class="gallery-button gallery-left"
onclick="oncekiSekil()"
type="button"

src="1.png"

<button

onclick="novbetiSekil()"
type="button"

❯

</button><div
    class="photo-count"
    id="photoCount"
>
    1 / 5
</div></div><div class="thumbnails"><img
class="thumbnail active"
src="1.png"
onclick="sekilSec(0)"

<img

src="2.png"
onclick="sekilSec(1)"

«»

<img
class="thumbnail"
src="3.png"
onclick="sekilSec(2)"

«»

<img
class="thumbnail"
src="4.png"
onclick="sekilSec(3)"

«»

<img

src="5.png"
onclick="sekilSec(4)"

«»

</div><div
    class="product-name"
    id="productName"
>
    Kənd məhsulu
</div><div
    class="product-price"
    id="productPrice"
>

</div><div class="description">
    Təbii və keyfiyyətli kənd məhsulu.
</div><button

</a></div><script>

/* =========================
   URL-DƏN MƏHSUL ID-Sİ
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const urlProductId =
    params.get("id") || "kend-mehsulu";


/* =========================
   HESAB AÇARI
========================= */

function getAccountKey(){

    const email =
        localStorage.getItem("userEmail");

    if(!email){
        return null;
    }

    return email
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]/g,"_");

}


/* =========================
   MƏHSULU FƏRQLƏNDİR
========================= */

if(urlProductId === "masin"){

    document.getElementById(
        "productName"
    ).innerText =
        "Maşın məhsulu";

    document.getElementById(
        "productPrice"
    ).innerText =
        "10 AZN";

}else{

    document.getElementById(
        "productName"
    ).innerText =
        "Kənd məhsulu";

    document.getElementById(
        "productPrice"
    ).innerText =
        "10 AZN";

}


/* =========================
   ŞƏKİLLƏR
========================= */

const sekiller = [

    "1.png",
    "2.png",
    "3.png",
    "4.png",
    "5.png"

];

let cariSekil = 0;


/* =========================
   ŞƏKLİ GÖSTƏR
========================= */

function sekliGoster(){

    document.getElementById(
        "productImage"
    ).src =
        sekiller[cariSekil];


    document.getElementById(
        "photoCount"
    ).innerText =
        (cariSekil + 1) +
        " / " +
        sekiller.length;


    document
    .querySelectorAll(".thumbnail")
    .forEach(function(item,index){

        item.classList.toggle(
            "active",
            index === cariSekil
        );

    });

}


/* =========================
   NÖVBƏTİ
========================= */

function novbetiSekil(){

    cariSekil++;

    if(
        cariSekil >= sekiller.length
    ){
        cariSekil = 0;
    }

    sekliGoster();

}


/* =========================
   ƏVVƏLKİ
========================= */

function oncekiSekil(){

    cariSekil--;

    if(cariSekil < 0){
        cariSekil =
            sekiller.length - 1;
    }

    sekliGoster();

}


/* =========================
   ŞƏKİL SEÇ
========================= */

function sekilSec(index){

    cariSekil = index;

    sekliGoster();

}


/* =========================
   SƏBƏTƏ ƏLAVƏ ET
========================= */

function addCurrentProduct(){

    const key =
        getAccountKey();


    if(!key){

        alert(
            "Əvvəlcə hesabına daxil ol."
        );

        window.location.href =
            "kent.html";

        return;

    }


    let cart = [];

    try{

        cart =
            JSON.parse(
                localStorage.getItem(
                    "cart_" + key
                )
            ) || [];

    }catch(error){

        cart = [];

    }


    const name =
        document.getElementById(
            "productName"
        ).innerText.trim();


    const priceText =
        document.getElementById(
            "productPrice"
        ).innerText;


    const price =
        parseFloat(
            priceText
            .replace(",", ".")
            .replace(/[^\d.]/g,"")
        ) || 0;


    const image =
        document.getElementById(
            "productImage"
        ).getAttribute("src");


    /*
       ƏSAS DÜZƏLİŞ:
       URL-dəki id məhsulun
       öz unikal ID-si olur.
    */

    const productId =
        urlProductId;


    const existing =
        cart.find(function(item){

            return item.productId ===
                productId;

        });


    if(existing){

        existing.quantity =
            (Number(existing.quantity) || 1)
            + 1;

    }else{

        cart.push({

            productId:
                productId,

            name:
                name,

            price:
                price,

            image:
                image,

            quantity:
                1

        });

    }


    localStorage.setItem(

        "cart_" + key,

        JSON.stringify(cart)

    );


    /*
       SƏBƏTƏ ƏLAVƏ EDƏNDƏ
       BİRBAŞA SƏBƏTƏ GET
    */

    window.location.href =
        "sebet.html";

}


/* =========================
   BAŞLA
========================= */

sekliGoster();

</script></body></html>
