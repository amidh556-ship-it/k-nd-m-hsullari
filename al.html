<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Məhsul - Kənd məhsulları</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.product-page{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.product{
    background:white;
    border-radius:12px;
    padding:15px;
}

.product-image{
    width:100%;
    height:400px;
    object-fit:contain;
    display:block;
    border-radius:10px;
    background:white;
}

.product-name{
    font-size:24px;
    font-weight:bold;
    margin-top:15px;
}

.product-price{
    font-size:22px;
    color:#2e7d32;
    font-weight:bold;
    margin-top:10px;
}

.description{
    color:#666;
    margin-top:10px;
    line-height:1.5;
}

.cart-button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:9px;
    background:#2e7d32;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.cart-button:active{
    transform:scale(.98);
}

.cart-link{
    display:block;
    text-align:center;
    margin-top:15px;
    padding:14px;
    background:#eee;
    border-radius:9px;
    text-decoration:none;
    color:#222;
    font-weight:bold;
}

.back-link{
    display:block;
    text-align:center;
    padding:20px;
    color:#222;
    text-decoration:none;
}

</style>

</head>

<body>


<div class="product-page">

    <div class="product">

        <img
            id="productImage"
            class="product-image"
            src=""
            alt="Məhsul"
        >

        <div
            id="productName"
            class="product-name"
        >
        </div>

        <div
            id="productPrice"
            class="product-price"
        >
        </div>

        <div
            id="productDescription"
            class="description"
        >
        </div>

        <button
            class="cart-button"
            onclick="addCurrentProduct()"
            type="button"
        >
            🛒 Səbətə əlavə et
        </button>

        <a
            class="cart-link"
            href="sebet.html"
        >
            🛒 Səbətimə bax
        </a>

    </div>


    <a
        class="back-link"
        href="index.html"
    >
        ← Alış-verişə qayıt
    </a>

</div>



<script>


/* =========================
   MƏHSULLAR
========================= */

const products = {

    masin: {

        name: "Maşın",

        price: 20,

        image: "foto.png",

        description:
            "Keyfiyyətli məhsul."

    },


    tato: {

        name: "Tato",

        price: 10,

        image: "1.png",

        description:
            "Təbii və keyfiyyətli kənd məhsulu."

    }

};



/* =========================
   URL-DƏN MƏHSULU TAP
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const productId =
    params.get("id");


const product =
    products[productId];



/* =========================
   MƏHSULU GÖSTƏR
========================= */

if(product){

    document.getElementById(
        "productImage"
    ).src =
        product.image;


    document.getElementById(
        "productName"
    ).innerText =
        product.name;


    document.getElementById(
        "productPrice"
    ).innerText =
        product.price + " AZN";


    document.getElementById(
        "productDescription"
    ).innerText =
        product.description;

}else{

    document.getElementById(
        "productName"
    ).innerText =
        "Məhsul tapılmadı";


    document.getElementById(
        "productDescription"
    ).innerText =
        "Bu məhsul mövcud deyil.";

}



/* =========================
   HESAB AÇARI
========================= */

function getAccountKey(){

    const email =
        localStorage.getItem(
            "userEmail"
        );


    if(!email){

        return null;

    }


    return email
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]/g,
            "_"
        );

}



/* =========================
   SƏBƏTƏ ƏLAVƏ ET
========================= */

function addCurrentProduct(){

    const key =
        getAccountKey();


    if(!key){

        alert(
            "Əvvəlcə hesabına daxil ol."
        );


        window.location.href =
            "kent.html";


        return;

    }


    if(!product){

        alert(
            "Məhsul tapılmadı."
        );


        return;

    }


    let cart = [];


    try{

        cart =
            JSON.parse(
                localStorage.getItem(
                    "cart_" + key
                )
            ) || [];

    }catch(error){

        cart = [];

    }



    /* =========================
       EYNİ MƏHSULU TAP
    ========================= */

    const existing =
        cart.find(
            function(item){

                return item.productId ===
                    productId;

            }
        );



    /* =========================
       VARSA SAYINI ARTIR
    ========================= */

    if(existing){

        existing.quantity =
            (Number(
                existing.quantity
            ) || 1) + 1;

    }


    /* =========================
       YOXDURSA YENİ ƏLAVƏ ET
    ========================= */

    else{

        cart.push({

            productId:
                productId,

            name:
                product.name,

            price:
                product.price,

            image:
                product.image,

            quantity:
                1

        });

    }



    /* =========================
       YADDA SAXLA
    ========================= */

    localStorage.setItem(

        "cart_" + key,

        JSON.stringify(cart)

    );



    alert(
        "✅ " +
        product.name +
        " səbətə əlavə edildi!"
    );

}

</script>

</body>

</html>
