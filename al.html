<!DOCTYPE html>
<html lang="az">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Məhsul - Kənd məhsulları</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f1ea;
    color:#222;
    padding-bottom:100px;
}

.product-page{
    width:100%;
    max-width:600px;
    margin:auto;
    background:white;
}

/* =========================
   QAYIT
========================= */

.back{
    display:block;
    padding:15px;
    color:#263b2b;
    text-decoration:none;
    font-weight:bold;
    background:white;
}

/* =========================
   ŞƏKİL GALEREYASI
========================= */

.gallery{
    position:relative;
    width:100%;
    height:430px;
    background:white;
    overflow:hidden;
}

.gallery-track{
    display:flex;
    width:100%;
    height:100%;
    transition:transform .3s ease;
}

.gallery-slide{
    min-width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.gallery-slide img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.gallery-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.95);
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    font-size:30px;
    z-index:5;
}

.gallery-left{
    left:10px;
}

.gallery-right{
    right:10px;
}

.dots{
    position:absolute;
    bottom:12px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:7px;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#aaa;
}

.dot.active{
    background:#263b2b;
}

/* =========================
   ENDİRİM
========================= */

.discount-bar{
    display:flex;
    gap:18px;
    overflow:hidden;
    white-space:nowrap;
    background:#fff;
    padding:13px 16px;
    color:#222;
    font-size:14px;
    font-weight:bold;
}

/* =========================
   MƏHSUL
========================= */

.product-info{
    padding:20px;
    background:white;
}

.product-name{
    font-size:26px;
    font-weight:bold;
}

.rating{
    margin-top:12px;
}

.stars{
    color:#e5a91d;
    letter-spacing:2px;
}

.sold{
    color:#777;
    margin-left:6px;
}

.product-price{
    margin-top:15px;
    font-size:28px;
    color:#263b2b;
    font-weight:bold;
}

.discount-text{
    margin-top:8px;
    color:#222;
    font-weight:bold;
}

.description{
    color:#666;
    margin-top:12px;
    line-height:1.5;
}

/* =========================
   SƏBƏT SAYI
========================= */

.quantity-box{
    margin-top:20px;
    display:flex;
    align-items:center;
    gap:15px;
}

.quantity-box button{
    width:42px;
    height:42px;
    border:0;
    border-radius:12px;
    background:#263b2b;
    color:white;
    font-size:24px;
}

.quantity-number{
    min-width:30px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

/* =========================
   SƏBƏTƏ ƏLAVƏ
========================= */

.cart-button{
    width:calc(100% - 40px);
    margin:10px 20px 20px;
    padding:17px;
    border:none;
    border-radius:30px;
    background:#263b2b;
    color:white;
    font-size:19px;
    font-weight:bold;
}

/* =========================
   RƏYLƏR
========================= */

.reviews{
    margin-top:10px;
    padding:20px;
    background:white;
}

.reviews h2{
    margin:0 0 18px;
    font-size:22px;
}

.star-select{
    display:flex;
    gap:5px;
    margin-bottom:15px;
}

.star-select span{
    font-size:32px;
    color:#ccc;
    cursor:pointer;
}

.star-select span.active{
    color:#e5a91d;
}

.review-input{
    width:100%;
    min-height:100px;
    border:1px solid #ccc;
    border-radius:14px;
    padding:12px;
    font-size:15px;
    resize:none;
}

.photo-label{
    display:block;
    margin-top:12px;
    padding:13px;
    border:1px dashed #999;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
    color:#263b2b;
    font-weight:bold;
}

#reviewPhoto{
    display:none;
}

.preview{
    margin-top:10px;
}

.preview img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:12px;
}

.review-submit{
    width:100%;
    margin-top:12px;
    padding:14px;
    border:0;
    border-radius:25px;
    background:#e8b84b;
    color:#263b2b;
    font-size:17px;
    font-weight:bold;
}

.review-list{
    margin-top:25px;
}

.review-item{
    padding:15px 0;
    border-top:1px solid #ddd;
}

.review-stars{
    color:#e5a91d;
    font-size:18px;
}

.review-text{
    margin-top:8px;
    line-height:1.4;
}

.review-photo{
    margin-top:10px;
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:12px;
}

/* =========================
   SƏBƏT
========================= */

.cart-link{
    position:fixed;
    right:18px;
    bottom:90px;
    width:85px;
    height:85px;
    border-radius:50%;
    background:#263b2b;
    color:white;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:bold;
    z-index:900;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
}

.cart-link span{
    font-size:27px;
}

@media(max-width:380px){

    .gallery{
        height:380px;
    }

    .product-name{
        font-size:23px;
    }

}

</style>

</head>

<body>

<div class="product-page">

<a href="index.html" class="back">‹ Geri</a>

<!-- ŞƏKİLLƏR -->

<div class="gallery">

    <div class="gallery-track" id="galleryTrack">

        <div class="gallery-slide">
            <img id="image1" src="1.png">
        </div>

        <div class="gallery-slide">
            <img id="image2" src="2.png">
        </div>

        <div class="gallery-slide">
            <img id="image3" src="3.png">
        </div>

        <div class="gallery-slide">
            <img id="image4" src="4.png">
        </div>

    </div>

    <button class="gallery-btn gallery-left"
            onclick="previousImage()">‹</button>

    <button class="gallery-btn gallery-right"
            onclick="nextImage()">›</button>

    <div class="dots">

        <span class="dot active" onclick="goToImage(0)"></span>
        <span class="dot" onclick="goToImage(1)"></span>
        <span class="dot" onclick="goToImage(2)"></span>
        <span class="dot" onclick="goToImage(3)"></span>

    </div>

</div>

<!-- ENDİRİM -->

<div class="discount-bar">

    <span>✓ 20% endirim</span>
    <span>✓ Sifarişlərdə 20% endirim</span>
    <span>✓ Çatdırılma endirimi</span>

</div>

<!-- MƏHSUL -->

<div class="product-info">

    <div id="productName" class="product-name"></div>

    <div class="rating">

        <span class="stars">★★★★★</span>

        <span>4.7 ★</span>

        <span class="sold">
            487 ədəd satılıb
        </span>

    </div>

    <div id="productPrice"
         class="product-price">
    </div>

    <div class="discount-text">
        🔥 Çatdırılmada 20% endirim
    </div>

    <div id="productDescription"
         class="description">
    </div>

    <!-- SAY -->

    <div class="quantity-box">

        <button onclick="minusQuantity()">−</button>

        <div id="quantity"
             class="quantity-number">
            0
        </div>

        <button onclick="plusQuantity()">+</button>

    </div>

</div>

<button
    class="cart-button"
    onclick="addCurrentProduct()">

    🛒 Səbətə əlavə et

</button>

<!-- RƏYLƏR -->

<div class="reviews">

    <h2>⭐ Müştəri rəyləri</h2>

    <div class="star-select">

        <span onclick="selectStar(1)">★</span>
        <span onclick="selectStar(2)">★</span>
        <span onclick="selectStar(3)">★</span>
        <span onclick="selectStar(4)">★</span>
        <span onclick="selectStar(5)">★</span>

    </div>

    <textarea
        id="reviewText"
        class="review-input"
        placeholder="Məhsul haqqında rəyinizi yazın...">
    </textarea>

    <label class="photo-label">

        🖼️ Şəkil əlavə et

        <input
            type="file"
            id="reviewPhoto"
            accept="image/*"
            onchange="previewPhoto(event)">

    </label>

    <div id="preview"
         class="preview">
    </div>

    <button
        class="review-submit"
        onclick="addReview()">

        Rəyi göndər

    </button>

    <div id="reviewList"
         class="review-list">
    </div>

</div>

<a href="sebet.html"
   class="cart-link">

    <span>🛒</span>
    Səbət

</a>

</div>

<script>

/* =========================
   MƏHSULLAR
========================= */

const products = {

    masin:{
        name:"Maşın oyuncaq",
        price:3.80,

        images:[
            "foto.png",
            "foto2.png",
            "foto3.png",
            "foto4.png"
        ],

        description:"Keyfiyyətli məhsul."
    },

    tato:{
        name:"Tato",
        price:4.80,

        images:[
            "1.png",
            "2.png",
            "3.png",
            "4.png"
        ],

        description:"Təbii və keyfiyyətli məhsul."
    }

};

/* =========================
   MƏHSULU TAP
========================= */

const params =
new URLSearchParams(window.location.search);

const productId =
params.get("id") || "tato";

const product =
products[productId];

/* =========================
   MƏLUMATLARI GÖSTƏR
========================= */

if(product){

    document.getElementById("productName")
    .innerText=product.name;

    document.getElementById("productPrice")
    .innerText=product.price.toFixed(2)+" AZN";

    document.getElementById("productDescription")
    .innerText=product.description;

    document.getElementById("image1").src=product.images[0];
    document.getElementById("image2").src=product.images[1];
    document.getElementById("image3").src=product.images[2];
    document.getElementById("image4").src=product.images[3];

}

/* =========================
   ŞƏKİL ÇEVİRMƏ
========================= */

let currentImage=0;

const track=
document.getElementById("galleryTrack");

const dots=
document.querySelectorAll(".dot");

function updateGallery(){

    track.style.transform=
    "translateX(-"+(currentImage*100)+"%)";

    dots.forEach(function(dot,index){

        dot.classList.toggle(
            "active",
            index===currentImage
        );

    });

}

function nextImage(){

    currentImage++;

    if(currentImage>=4){
        currentImage=0;
    }

    updateGallery();

}

function previousImage(){

    currentImage--;

    if(currentImage<0){
        currentImage=3;
    }

    updateGallery();

}

function goToImage(index){

    currentImage=index;
    updateGallery();

}

/* =========================
   SÜRÜŞDÜRMƏ
========================= */

let touchStartX=0;
let touchEndX=0;

track.addEventListener("touchstart",function(e){

    touchStartX=
    e.changedTouches[0].screenX;

});

track.addEventListener("touchend",function(e){

    touchEndX=
    e.changedTouches[0].screenX;

    if(touchStartX-touchEndX>50){
        nextImage();
    }

    if(touchEndX-touchStartX>50){
        previousImage();
    }

});

/* =========================
   HESAB AÇARI
========================= */

function getAccountKey(){

    const email=
    localStorage.getItem("userEmail");

    if(!email){
        return null;
    }

    return email
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]/g,"_");

}

/* =========================
   MƏHSUL AÇARI
========================= */

function getProductKey(){

    return "product_"+productId;

}

/* =========================
   SAY
========================= */

let quantity=0;

function loadQuantity(){

    const key=getAccountKey();

    if(!key){
        quantity=0;
        document.getElementById("quantity").innerText=0;
        return;
    }

    let cart=[];

    try{

        cart=JSON.parse(
            localStorage.getItem("cart_"+key)
        ) || [];

    }catch(e){

        cart=[];

    }

    const item=cart.find(function(x){

        return x.productId===productId;

    });

    quantity=item ?
    Number(item.quantity)||0 :
    0;

    document.getElementById("quantity")
    .innerText=quantity;

}

function plusQuantity(){

    quantity++;

    if(quantity>50){
        quantity=50;
    }

    saveQuantity();

}

function minusQuantity(){

    quantity--;

    if(quantity<0){
        quantity=0;
    }

    saveQuantity();

}

function saveQuantity(){

    const key=getAccountKey();

    if(!key){

        alert("Əvvəlcə hesabına daxil ol.");

        quantity=0;

        document.getElementById("quantity")
        .innerText=0;

        window.location.href="kent.html";

        return;

    }

    let cart=[];

    try{

        cart=JSON.parse(
            localStorage.getItem("cart_"+key)
        ) || [];

    }catch(e){

        cart=[];

    }

    const existing=
    cart.find(function(item){

        return item.productId===productId;

    });

    if(quantity===0){

        cart=
        cart.filter(function(item){

            return item.productId!==productId;

        });

    }

    else if(existing){

        existing.quantity=quantity;

    }

    else{

        cart.push({

            productId:productId,
            name:product.name,
            price:product.price,
            image:product.images[0],
            quantity:quantity

        });

    }

    localStorage.setItem(
        "cart_"+key,
        JSON.stringify(cart)
    );

    document.getElementById("quantity")
    .innerText=quantity;

}

/* =========================
   SƏBƏTƏ ƏLAVƏ
========================= */

function addCurrentProduct(){

    if(quantity===0){
        quantity=1;
    }

    saveQuantity();

    alert(
        "✅ "+product.name+
        " səbətə əlavə edildi!"
    );

}

/* =========================
   RƏY SİSTEMİ
========================= */

let selectedStar=0;
let selectedPhoto="";

function selectStar(number){

    selectedStar=number;

    const stars=
    document.querySelectorAll(".star-select span");

    stars.forEach(function(star,index){

        star.classList.toggle(
            "active",
            index<number
        );

    });

}

/* =========================
   ŞƏKİL SEÇ
========================= */

function previewPhoto(event){

    const file=
    event.target.files[0];

    if(!file){
        return;
    }

    const reader=
    new FileReader();

    reader.onload=function(e){

        selectedPhoto=e.target.result;

        document.getElementById("preview")
        .innerHTML=
        '<img src="'+
        selectedPhoto+
        '">';

    };

    reader.readAsDataURL(file);

}

/* =========================
   RƏY KEY
========================= */

function getReviewsKey(){

    return "reviews_"+productId;

}

/* =========================
   RƏY GÖNDƏR
========================= */

function addReview(){

    const text=
    document.getElementById("reviewText")
    .value.trim();

    if(selectedStar===0){

        alert("Zəhmət olmasa ulduz seç.");

        return;

    }

    if(text===""){

        alert("Rəyinizi yazın.");

        return;

    }

    let reviews=[];

    try{

        reviews=
        JSON.parse(
            localStorage.getItem(
                getReviewsKey()
            )
        ) || [];

    }catch(e){

        reviews=[];

    }

    reviews.push({

        stars:selectedStar,

        text:text,

        photo:selectedPhoto,

        date:new Date().toLocaleDateString(
            "az-AZ"
        )

    });

    localStorage.setItem(
        getReviewsKey(),
        JSON.stringify(reviews)
    );

    document.getElementById("reviewText")
    .value="";

    document.getElementById("reviewPhoto")
    .value="";

    document.getElementById("preview")
    .innerHTML="";

    selectedStar=0;
    selectedPhoto="";

    document.querySelectorAll(
        ".star-select span"
    ).forEach(function(star){

        star.classList.remove("active");

    });

    showReviews();

    alert("✅ Rəyiniz əlavə edildi.");

}

/* =========================
   RƏYLƏRİ GÖSTƏR
========================= */

function showReviews(){

    let reviews=[];

    try{

        reviews=
        JSON.parse(
            localStorage.getItem(
                getReviewsKey()
            )
        ) || [];

    }catch(e){

        reviews=[];

    }

    const list=
    document.getElementById("reviewList");

    if(reviews.length===0){

        list.innerHTML=
        "<p style='color:#777;'>Hələ rəy yoxdur.</p>";

        return;

    }

    list.innerHTML="";

    reviews.forEach(function(review){

        let stars="";

        for(let i=1;i<=5;i++){

            stars +=
            i<=review.stars ?
            "★" :
            "☆";

        }

        const item=
        document.createElement("div");

        item.className="review-item";

        item.innerHTML=

        '<div class="review-stars">'+
        stars+
        '</div>'+

        '<div class="review-text">'+
        escapeHTML(review.text)+
        '</div>'+

        (
            review.photo ?
            '<img class="review-photo" src="'+
            review.photo+
            '">' :
            ''
        )+

        '<div style="margin-top:7px;color:#888;font-size:12px;">'+
        review.date+
        '</div>';

        list.appendChild(item);

    });

}

/* =========================
   TƏHLÜKƏSİZ MƏTN
========================= */

function escapeHTML(text){

    const div=
    document.createElement("div");

    div.textContent=text;

    return div.innerHTML;

}

/* =========================
   BAŞLAYANDA
========================= */

loadQuantity();
showReviews();

</script>

</body>
</html>
