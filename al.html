<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Məhsul - Kənd məhsulları</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.product-page{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.product{
    background:white;
    border-radius:12px;
    padding:15px;
}


/* =========================
   ŞƏKİL QALEREYASI
========================= */

.gallery{
    position:relative;
    width:100%;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    touch-action:pan-y;
}

.gallery img{
    width:100%;
    height:400px;
    object-fit:contain;
    display:block;
}


/* SAĞ-SOL DÜYMƏLƏR */

.gallery-button{
    position:absolute;

    top:50%;
    transform:translateY(-50%);

    width:45px;
    height:45px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.45);

    color:white;

    font-size:25px;

    z-index:5;
}

.gallery-left{
    left:10px;
}

.gallery-right{
    right:10px;
}


/* 5 BALACA GÖSTƏRİCİ */

.photo-count{
    position:absolute;

    right:12px;
    bottom:12px;

    background:rgba(0,0,0,.55);

    color:white;

    padding:6px 10px;

    border-radius:15px;

    font-size:13px;

    z-index:5;
}


/* AŞAĞIDA 5 BALACA ŞƏKİL */

.thumbnails{
    display:flex;

    gap:7px;

    margin-top:10px;

    overflow-x:auto;
}

.thumbnail{
    width:58px;
    height:58px;

    object-fit:cover;

    border-radius:7px;

    border:2px solid transparent;

    cursor:pointer;

    flex-shrink:0;
}

.thumbnail.active{
    border:2px solid #2e7d32;
}


/* =========================
   MƏHSUL
========================= */

.product-name{
    font-size:24px;
    font-weight:bold;
    margin-top:15px;
}

.product-price{
    font-size:22px;
    color:#2e7d32;
    font-weight:bold;
    margin-top:10px;
}

.description{
    color:#666;
    margin-top:10px;
    line-height:1.5;
}

.cart-button{
    width:100%;
    padding:15px;
    margin-top:20px;

    border:none;
    border-radius:9px;

    background:#2e7d32;

    color:white;

    font-size:17px;
    font-weight:bold;
}

.cart-button:active{
    transform:scale(.98);
}

.cart-link{
    display:block;

    text-align:center;

    margin-top:15px;

    padding:14px;

    background:white;

    border-radius:9px;

    text-decoration:none;

    color:#222;

    font-weight:bold;
}

.back-link{
    display:block;

    text-align:center;

    padding:20px;

    color:#222;

    text-decoration:none;
}

</style>

</head>


<body>


<div class="product-page">

<div class="product">


<!-- =========================
     5 ŞƏKİLLİ QALEREYA
========================= -->

<div class="gallery" id="gallery">

        type="button"
    >
        ❮
    </button>


    <img
        id="productImage"
        src="1.png"
        alt="Məhsul"
    >


    <button
        class="gallery-button gallery-right"
        onclick="novbetiSekil()"
        type="button"
    >
        ❯
    </button>


    <div
        class="photo-count"
        id="photoCount"

<a

</div>


<a
    class="back-link"
    href="index.html"
>
    ← Alış-verişə qayıt
</a>


</div>
