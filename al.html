
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Məhsul - MAVROX Mall</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222;padding-bottom:100px}
.product-page{width:100%;max-width:600px;margin:auto;background:white}
.product{background:white}
.gallery{position:relative;width:100%;height:430px;background:white;overflow:hidden}
.gallery-track{display:flex;width:100%;height:100%;transition:transform .3s ease}
.gallery-slide{flex:0 0 100%;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.gallery-slide img{width:100%;height:100%;object-fit:contain}
.gallery-btn{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:none;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:28px;z-index:5;cursor:pointer}
.gallery-left{left:10px}
.gallery-right{right:10px}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:5}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa;cursor:pointer;border:0;padding:0}
.dot.active{background:#111}
.discount-bar{display:flex;gap:20px;overflow:hidden;white-space:nowrap;background:#fff1df;padding:12px 20px;color:#222;font-size:15px;font-weight:bold}
.product-info{padding:20px}
.product-name{font-size:25px;font-weight:bold;margin-bottom:15px}
.rating{font-size:16px;color:#333}
.stars{letter-spacing:1px}
.sold{color:#777;margin-left:5px}
.product-price{font-size:28px;color:#263b2b;font-weight:bold;margin-top:15px}
.old-product-price{color:#999;font-size:19px;text-decoration:line-through;margin-top:15px;margin-bottom:3px}
.discount-text{margin-top:8px;color:#222;font-size:15px;font-weight:bold}
.description{color:#666;margin-top:12px;line-height:1.5}
.cart-button{position:fixed;bottom:15px;left:20px;right:20px;max-width:560px;margin:auto;padding:17px;border:none;border-radius:35px;background:#263b2b;color:white;font-size:20px;font-weight:bold;z-index:1000;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.cart-button:active{transform:scale(.98)}
.cart-link{position:fixed;right:18px;bottom:90px;width:105px;height:105px;border-radius:50%;background:#e8b84b;color:#263b2b;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;font-weight:bold;z-index:900;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.cart-link span{font-size:30px}
.reviews{margin-top:10px;padding:20px;background:#f5f5f5}
.reviews-title{font-size:23px;font-weight:bold;margin-bottom:15px}
.review-form{background:white;padding:16px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.review-form h3{margin:0 0 12px}
.star-select{display:flex;gap:5px;margin-bottom:12px}
.star-select span{font-size:32px;color:#bbb;cursor:pointer}
.star-select span.active{color:#e5a91d}
.review-form textarea{width:100%;min-height:90px;resize:none;border:1px solid #ccc;border-radius:12px;padding:12px;font-size:15px;outline:none}
.photo-label{display:inline-block;margin-top:10px;padding:10px 14px;border:1px solid #263b2b;border-radius:12px;color:#263b2b;font-weight:bold;cursor:pointer}
#reviewPhoto{display:none}
#photoName{margin-top:7px;color:#777;font-size:13px}
.review-submit{width:100%;margin-top:12px;padding:13px;border:none;border-radius:12px;background:#263b2b;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.review-item{margin-top:15px;background:white;padding:15px;border-radius:15px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.review-user{font-weight:bold;font-size:16px}
.review-stars{color:#e5a91d;margin-top:5px}
.review-text{margin-top:9px;line-height:1.45;color:#444;overflow-wrap:anywhere}
.review-image{width:100%;max-height:300px;object-fit:contain;margin-top:10px;border-radius:12px;background:#f5f5f5}
.no-reviews{margin-top:15px;color:#777;text-align:center}
.error-message{padding:20px;color:#b42318;font-weight:bold}

/* BÜTÜN MƏHSULLAR */
.all-products{padding:20px;background:white;margin-top:12px}
.all-products-title{font-size:23px;font-weight:bold;margin-bottom:15px;color:#263b2b}
.all-products-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.other-card{background:#f8f8f8;border-radius:14px;overflow:hidden;text-decoration:none;color:#222;box-shadow:0 2px 8px #0001;display:block}
.other-card img{width:100%;height:155px;object-fit:contain;background:white;display:block}
.other-info{padding:10px}
.other-name{font-size:15px;min-height:36px;line-height:18px}
.other-price{color:#263b2b;font-size:19px;font-weight:bold;margin-top:8px}
.other-old-price{color:#999;font-size:12px;text-decoration:line-through;margin-top:5px}
.other-loading{grid-column:1/-1;text-align:center;padding:20px;color:#777}
@media(max-width:380px){
 .gallery{height:380px}
 .product-name{font-size:23px}
 .other-card img{height:140px}
}
</style>
</head>

<body>
<div class="product-page">

 <div class="product">
  <div class="gallery">
   <div class="gallery-track" id="galleryTrack"></div>
   <button class="gallery-btn gallery-left" id="prevButton" type="button">‹</button>
   <button class="gallery-btn gallery-right" id="nextButton" type="button">›</button>
   <div class="dots" id="galleryDots"></div>
  </div>

  <div class="discount-bar">
   <span>✓ 20% endirim</span>
   <span>▣ Sifarişlərdə 20% ENDİRİM</span>
   <span>✓ Gecikməyə görə</span>
  </div>

  <div class="product-info">
   <div id="productName" class="product-name">Məhsul yüklənir...</div>
   <div class="rating">
    <span class="stars">★★★★☆</span>
    <span>4.7 ★</span>
    <span class="sold">487 ədəd satılıb</span>
   </div>
   <div id="productPrice" class="product-price"></div>
   <div class="discount-text">🔥 Çatdırılmada 20% endirim</div>
   <div id="productDescription" class="description"></div>
   <div id="productError"></div>
  </div>
 </div>

 <section class="all-products">
  <div class="all-products-title">Bütün məhsullar</div>
  <div class="all-products-grid" id="allProductsGrid">
   <div class="other-loading">Məhsullar yüklənir...</div>
  </div>
 </section>

 <div class="reviews">
  <div class="reviews-title">Müştəri rəyləri</div>

  <div class="review-form">
   <h3>Rəy yaz</h3>
   <div class="star-select">
    <span onclick="selectStar(1)">★</span>
    <span onclick="selectStar(2)">★</span>
    <span onclick="selectStar(3)">★</span>
    <span onclick="selectStar(4)">★</span>
    <span onclick="selectStar(5)">★</span>
   </div>

   <textarea id="reviewText" placeholder="Məhsul haqqında fikrinizi yazın..."></textarea>
   <label class="photo-label" for="reviewPhoto">🖼️ Şəkil əlavə et</label>
   <input type="file" id="reviewPhoto" accept="image/*">
   <div id="photoName"></div>
   <button class="review-submit" onclick="sendReview()" type="button">Rəyi göndər</button>
  </div>

  <div id="reviewsList"></div>
 </div>

 <a class="cart-link" href="sebet.html"><span>🛒</span>Səbət</a>
 <button class="cart-button" onclick="addCurrentProduct()" type="button">🛒 Səbətə əlavə et</button>

</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getDatabase,ref,push,onValue,get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
 getStorage,ref as storageRef,uploadBytes,getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* FIREBASE AYARLARI */
const firebaseConfig={
 apiKey:"AIzaSyBDKe-57avB_Oajvq7PemHCl4LIxIv0ziY",
 authDomain:"kendmehsullari-6a53d.firebaseapp.com",
 databaseURL:"https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",
 projectId:"kendmehsullari-6a53d",
 storageBucket:"kendmehsullari-6a53d.firebasestorage.app",
 messagingSenderId:"551607499773",
 appId:"1:551607499773:web:a84aa63dc5b55c38687794",
 measurementId:"G-2JZ105RRPH"
};

const app=initializeApp(firebaseConfig);
const database=getDatabase(app);
const storage=getStorage(app);

/* KÖHNƏ MƏHSULLAR */
const defaultProducts={
 masin:{
  id:"masin",
  name:"Maşın oyuncaq",
  price:3.80,
  image:"foto.png",
  images:["foto.png"],
  description:"Keyfiyyətli məhsul."
 },
 tato:{
  id:"tato",
  name:"Tato",
  price:4.80,
  image:"1.png",
  images:["1.png"],
  description:"Təbii və keyfiyyətli məhsul."
 }
};

const params=new URLSearchParams(window.location.search);
const productId=params.get("id");

let product=null;
let currentImage=0;
let selectedStar=0;

const track=document.getElementById("galleryTrack");
const dotsContainer=document.getElementById("galleryDots");
const prevButton=document.getElementById("prevButton");
const nextButton=document.getElementById("nextButton");

/* ŞƏKİLLƏRİ HƏR FORMADA OXU */
function normalizeImages(data){
 let images=[];

 if(data && Array.isArray(data.images)){
  images=data.images;
 }else if(data && data.images && typeof data.images==="object"){
  images=Object.values(data.images);
 }

 images=images.filter(value=>
  typeof value==="string" && value.trim()!==""
 );

 if(!images.length && data && typeof data.image==="string"){
  images=[data.image];
 }

 if(!images.length && data && typeof data.imageUrl==="string"){
  images=[data.imageUrl];
 }

 return images;
}

/* MƏHSUL MƏLUMATLARINI NORMAL FORMAYA SAL */
function normalizeProduct(data,id){
 const images=normalizeImages(data);

 return {
  ...data,
  id:id,
  name:data.name||data.title||"Məhsul",
  price:Number(data.price)||0,
  discountPrice:data.discountPrice??null,
  images:images,
  image:images[0]||"",
  description:data.description||""
 };
}

function getFinalPrice(item){
 const oldPrice=Number(item.price)||0;
 const salePrice=Number(item.discountPrice);

 if(
  item.discountPrice!==null &&
  item.discountPrice!==undefined &&
  item.discountPrice!=="" &&
  Number.isFinite(salePrice) &&
  salePrice>0 &&
  salePrice<oldPrice
 ){
  return salePrice;
 }

 return oldPrice;
}

function showProductPrice(){
 const element=document.getElementById("productPrice");

 if(!product){
  element.innerText="";
  return;
 }

 const oldPrice=Number(product.price)||0;
 const finalPrice=getFinalPrice(product);

 if(finalPrice<oldPrice){
  element.innerHTML=
   '<div class="old-product-price">'+oldPrice.toFixed(2)+' AZN</div>'+
   '<div>'+finalPrice.toFixed(2)+' AZN</div>';
 }else{
  element.innerText=oldPrice.toFixed(2)+" AZN";
 }
}

/* QALEREYA */
function setupGallery(){
 track.innerHTML="";
 dotsContainer.innerHTML="";
 currentImage=0;

 let images=product ? normalizeImages(product) : [];

 if(!images.length){
  images=["foto.png"];
 }

 images.forEach((image,index)=>{
  const slide=document.createElement("div");
  slide.className="gallery-slide";

  const img=document.createElement("img");
  img.src=image;
  img.alt=product ? product.name : "Məhsul";

  img.onerror=function(){
   this.onerror=null;
   this.src="foto.png";
  };

  slide.appendChild(img);
  track.appendChild(slide);

  const dot=document.createElement("button");
  dot.type="button";
  dot.className="dot"+(index===0?" active":"");
  dot.addEventListener("click",()=>goToImage(index));
  dotsContainer.appendChild(dot);
 });

 const multiple=images.length>1;
 prevButton.style.display=multiple?"block":"none";
 nextButton.style.display=multiple?"block":"none";
 dotsContainer.style.display=multiple?"flex":"none";

 updateGallery();
}

function updateGallery(){
 track.style.transform="translateX(-"+(currentImage*100)+"%)";

 dotsContainer.querySelectorAll(".dot").forEach((dot,index)=>{
  dot.classList.toggle("active",index===currentImage);
 });
}

function nextImage(){
 const count=track.children.length;
 if(count<=1)return;
 currentImage=(currentImage+1)%count;
 updateGallery();
}

function previousImage(){
 const count=track.children.length;
 if(count<=1)return;
 currentImage=(currentImage-1+count)%count;
 updateGallery();
}

function goToImage(index){
 if(index<0||index>=track.children.length)return;
 currentImage=index;
 updateGallery();
}

prevButton.addEventListener("click",previousImage);
nextButton.addEventListener("click",nextImage);

let touchStartX=0;

track.addEventListener("touchstart",e=>{
 touchStartX=e.changedTouches[0].screenX;
},{passive:true});

track.addEventListener("touchend",e=>{
 const endX=e.changedTouches[0].screenX;
 if(touchStartX-endX>50)nextImage();
 if(endX-touchStartX>50)previousImage();
},{passive:true});

/* MƏHSULU SƏHİFƏDƏ GÖSTƏR */
function showProduct(){
 if(!product){
  document.getElementById("productName").innerText="Məhsul tapılmadı";
  document.getElementById("productError").className="error-message";
  document.getElementById("productError").innerText=
   "Məhsul tapılmadı. Ana səhifəyə qayıdıb yenidən seç.";
  document.getElementById("productDescription").innerText="";
  document.getElementById("productPrice").innerText="";
  setupGallery();
  return;
 }

 document.getElementById("productName").innerText=product.name;
 document.getElementById("productDescription").innerText=product.description||"";
 document.getElementById("productError").innerText="";

 showProductPrice();
 setupGallery();
 saveToHistory();
}

/* SİFARİŞ TARİXÇƏSİ */
function saveToHistory(){
 const email=localStorage.getItem("userEmail");
 if(!email||!product)return;

 const key=email.toLowerCase().trim().replace(/[^a-z0-9]/g,"_");
 let history=[];

 try{
  history=JSON.parse(localStorage.getItem("history_"+key)||"[]")||[];
 }catch(e){}

 history=history.filter(item=>
  String(item.productId)!==String(productId)
 );

 history.unshift({
  productId:productId,
  name:product.name,
  price:getFinalPrice(product),
  image:product.images[0]||product.image||"",
  time:Date.now()
 });

 try{
  localStorage.setItem("history_"+key,JSON.stringify(history.slice(0,30)));
 }catch(e){}
}

/* MƏHSULU FIREBASE-DƏN YÜKLƏ */
async function loadCurrentProduct(){
 if(!productId){
  showProduct();
  return;
 }

 document.getElementById("productName").innerText="Məhsul yüklənir...";

 try{
  const snapshot=await get(ref(database,"products/"+productId));

  if(snapshot.exists()){
   product=normalizeProduct(snapshot.val(),productId);
  }else if(defaultProducts[productId]){
   product=normalizeProduct(defaultProducts[productId],productId);
  }else{
   /* Köhnə telefonda saxlanmış məhsulu yoxla */
   try{
    const saved=JSON.parse(localStorage.getItem("myProducts")||"[]");
    if(Array.isArray(saved)){
     const found=saved.find(item=>String(item.id)===String(productId));
     if(found){
      product=normalizeProduct(found,productId);
     }
    }
   }catch(e){}
  }

  showProduct();

 }catch(error){
  console.error("Məhsul yüklənmə xətası:",error);

  document.getElementById("productName").innerText="Məhsul yüklənmədi";
  document.getElementById("productError").className="error-message";
  document.getElementById("productError").innerText=
   "Firebase bağlantısı alınmadı. İnternet və Firebase qaydalarını yoxla.";
 }
}

/* BÜTÜN MƏHSULLARI GÖSTƏR */
const allProductsGrid=document.getElementById("allProductsGrid");

function renderAllProducts(firebaseData){
 const all=[];

 Object.entries(defaultProducts).forEach(([id,item])=>{
  all.push(normalizeProduct(item,id));
 });

 if(firebaseData && typeof firebaseData==="object"){
  Object.entries(firebaseData).forEach(([id,data])=>{
   if(data && typeof data==="object"){
    all.push(normalizeProduct(data,id));
   }
  });
 }

 /* Təkrarları aradan qaldır */
 const unique=new Map();

 all.forEach(item=>{
  if(item.id){
   unique.set(String(item.id),item);
  }
 });

 allProductsGrid.innerHTML="";

 if(unique.size===0){
  allProductsGrid.innerHTML=
   '<div class="other-loading">Hələ məhsul yoxdur.</div>';
  return;
 }

 unique.forEach(item=>{
  const card=document.createElement("a");
  card.className="other-card";
  card.href="al.html?id="+encodeURIComponent(item.id);

  const img=document.createElement("img");
  img.src=item.images[0]||"foto.png";
  img.alt=item.name;

  img.onerror=function(){
   this.onerror=null;
   this.src="foto.png";
  };

  const info=document.createElement("div");
  info.className="other-info";

  const name=document.createElement("div");
  name.className="other-name";
  name.textContent=item.name;

  const oldPrice=Number(item.price)||0;
  const finalPrice=getFinalPrice(item);

  if(finalPrice<oldPrice){
   const old=document.createElement("div");
   old.className="other-old-price";
   old.textContent=oldPrice.toFixed(2)+" AZN";
   info.appendChild(old);
  }

  const price=document.createElement("div");
  price.className="other-price";
  price.textContent=finalPrice.toFixed(2)+" AZN";

  info.append(name,price);
  card.append(img,info);
  allProductsGrid.appendChild(card);
 });
}

onValue(ref(database,"products"),snapshot=>{
 renderAllProducts(snapshot.exists()?snapshot.val():{});
},error=>{
 console.error("Bütün məhsullar yüklənmədi:",error);
 allProductsGrid.innerHTML=
  '<div class="other-loading">Məhsulları yükləmək mümkün olmadı.</div>';
});

/* RƏYLƏR */
window.selectStar=function(star){
 selectedStar=star;

 document.querySelectorAll(".star-select span").forEach((el,index)=>{
  el.classList.toggle("active",index<star);
 });
};

document.getElementById("reviewPhoto").addEventListener("change",function(){
 document.getElementById("photoName").innerText=
  this.files.length?this.files[0].name:"";
});

window.sendReview=async function(){
 if(!product){
  alert("Məhsul tapılmadı.");
  return;
 }

 const text=document.getElementById("reviewText").value.trim();

 if(!selectedStar){
  alert("Ulduz seç.");
  return;
 }

 if(!text){
  alert("Rəyini yaz.");
  return;
 }

 const email=localStorage.getItem("userEmail")||"Anonim müştəri";
 const name=localStorage.getItem("userName")||email;
 const photoInput=document.getElementById("reviewPhoto");

 try{
  let imageUrl="";

  if(photoInput.files.length){
   const file=photoInput.files[0];
   const fileRef=storageRef(
    storage,
    "reviews/"+productId+"/"+Date.now()+"_"+file.name
   );

   await uploadBytes(fileRef,file);
   imageUrl=await getDownloadURL(fileRef);
  }

  await push(ref(database,"reviews/"+productId),{
   name:name,
   email:email,
   stars:selectedStar,
   text:text,
   image:imageUrl,
   time:Date.now()
  });

  alert("Rəyiniz göndərildi!");

  document.getElementById("reviewText").value="";
  photoInput.value="";
  document.getElementById("photoName").innerText="";
  window.selectStar(0);

 }catch(error){
  console.error("Rəy xətası:",error);
  alert("Rəy göndərilmədi. Firebase qaydalarını yoxla.");
 }
};

function escapeHtml(value){
 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function loadReviews(){
 if(!productId)return;

 onValue(ref(database,"reviews/"+productId),snapshot=>{
  const list=document.getElementById("reviewsList");
  list.innerHTML="";

  if(!snapshot.exists()){
   list.innerHTML='<div class="no-reviews">Hələ rəy yoxdur.</div>';
   return;
  }

  const reviews=Object.values(snapshot.val()).reverse();

  reviews.forEach(review=>{
   const item=document.createElement("div");
   item.className="review-item";

   let stars="";
   for(let i=1;i<=5;i++){
    stars+=i<=Number(review.stars)?"★":"☆";
   }

   const user=document.createElement("div");
   user.className="review-user";
   user.textContent=review.name||"Anonim";

   const starElement=document.createElement("div");
   starElement.className="review-stars";
   starElement.textContent=stars;

   const text=document.createElement("div");
   text.className="review-text";
   text.textContent=review.text||"";

   item.append(user,starElement,text);

   if(review.image){
    const image=document.createElement("img");
    image.className="review-image";
    image.src=review.image;
    image.alt="Müştəri rəyi şəkli";
    item.appendChild(image);
   }

   list.appendChild(item);
  });
 });
}

/* SƏBƏT */
function getAccountKey(){
 const email=localStorage.getItem("userEmail");
 if(!email)return null;

 return email.toLowerCase().trim().replace(/[^a-z0-9]/g,"_");
}

window.addCurrentProduct=function(){
 const key=getAccountKey();

 if(!key){
  alert("Əvvəlcə hesabına daxil ol.");
  window.location.href="kent.html";
  return;
 }

 if(!product){
  alert("Məhsul tapılmadı.");
  return;
 }

 let cart=[];

 try{
  cart=JSON.parse(localStorage.getItem("cart_"+key)||"[]")||[];
 }catch(e){}

 const finalPrice=getFinalPrice(product);

 const existing=cart.find(item=>
  String(item.productId||item.id)===String(productId)
 );

 if(existing){
  existing.quantity=(Number(existing.quantity)||1)+1;
  existing.name=product.name;
  existing.price=finalPrice;
  existing.image=product.images[0]||product.image||"";
 }else{
  cart.push({
   productId:productId,
   id:productId,
   name:product.name,
   price:finalPrice,
   image:product.images[0]||product.image||"",
   quantity:1
  });
 }

 try{
  localStorage.setItem("cart_"+key,JSON.stringify(cart));
  alert("✅ "+product.name+" səbətə əlavə edildi!");
 }catch(error){
  alert("Səbət yadda saxlanmadı.");
 }
};
