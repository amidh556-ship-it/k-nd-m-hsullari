<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kənd məhsulları</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .page {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        .product {
            background: white;
            padding: 15px;
            border-radius: 12px;
        }

        .product-image {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 10px;
        }

        .product-name {
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
        }

        .product-price {
            font-size: 22px;
            color: #2e7d32;
            font-weight: bold;
            margin-top: 10px;
        }

        .description {
            margin-top: 10px;
            color: #666;
        }

        .add-button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            border: none;
            border-radius: 9px;
            background: #2e7d32;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .cart-link {
            display: block;
            text-align: center;
            margin-top: 10px;
            padding: 15px;
            background: white;
            border-radius: 9px;
            color: #222;
            text-decoration: none;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            padding: 20px;
            color: #222;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="product">

        <img
            class="product-image"
            src="foto.png"
            alt="Kənd məhsulu"
        >

        <div class="product-name">
            Kənd məhsulu
        </div>

        <div class="product-price">
            10 AZN
        </div>

        <div class="description">
            Təbii və keyfiyyətli kənd məhsulu.
        </div>

        <button
            class="add-button"
            onclick="addToCart()"
        >
            🛒 Səbətə əlavə et
        </button>

        <a
            class="cart-link"
            href="sebet.html"
        >
            🛒 Səbətimə bax
        </a>

    </div>

    <a
        class="back"
        href="index.html"
    >
        ← Geri qayıt
    </a>

</div>


<script>

const product = {

    id: "kendl-mhsul-1",

    name: "Kənd məhsulu",

    price: 10,

    image: "foto.png"

};


function addToCart() {

    let cart = [];

    try {

        cart = JSON.parse(
            localStorage.getItem("cart")
        ) || [];

    } catch (e) {

        cart = [];

    }


    const existing = cart.find(
        item => item.id === product.id
    );


    if (existing) {

        existing.quantity =
            Number(existing.quantity || 0) + 1;

    } else {

        cart.push({

            id: product.id,

            name: product.name,

            price: product.price,

            image: product.image,

            quantity: 1

        });

    }


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    alert("✅ Məhsul səbətə əlavə edildi!");

}

</script>

</body>
</html>
