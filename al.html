<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Məhsul</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .mehsul {
            background: white;
            padding: 15px;
            min-height: 100vh;
        }

        .mehsul img {
            width: 100%;
            max-width: 400px;
            display: block;
            margin: auto;
            border-radius: 10px;
        }

        .ad {
            font-size: 20px;
            margin-top: 15px;
        }

        .qiymet {
            font-size: 25px;
            font-weight: bold;
            margin: 10px 0;
        }

        .saygac {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .saygac button {
            width: 45px;
            height: 45px;
            font-size: 25px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
        }

        #say {
            font-size: 22px;
            min-width: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="mehsul">

    <img src="foto.png">

    <div class="ad">Məhsulun adı</div>

    <div class="qiymet">10 AZN</div>

    <div class="saygac">
        <button onclick="azalt()">−</button>

        <span id="say">0</span>

        <button onclick="artir()">+</button>
    </div>

</div>

<script>
    let say = 0;

    function artir() {
        say++;
        document.getElementById("say").innerText = say;
    }

    function azalt() {
        if (say > 0) {
            say--;
        }
        document.getElementById("say").innerText = say;
    }
</script>

</body>
</html>
