<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Məhsul</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.mehsul {
    background: white;
    min-height: 100vh;
    padding: 15px;
}

.mehsul img {
    width: 100%;
    max-width: 400px;
    display: block;
    margin: auto;
    border-radius: 10px;
}

.ad {
    font-size: 20px;
    font-weight: bold;
    margin-top: 15px;
}

.qiymet {
    font-size: 25px;
    font-weight: bold;
    margin-top: 10px;
}

.al {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 25px;
    background: #ff4d00;
    color: white;
    font-size: 18px;
    font-weight: bold;
    margin-top: 25px;
}

.saygac {
    display: none;
    justify-content: center;
    align-items: center;
    margin-top: 25px;
}

.saygac button {
    width: 55px;
    height: 50px;
    border: none;
    background: white;
    font-size: 28px;
}

.saygac button:first-child {
    border-radius: 25px 0 0 25px;
}

.saygac button:last-child {
    border-radius: 0 25px 25px 0;
}

#say {
    width: 50px;
    height: 50px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="mehsul">

    <img src="foto.png">

    <div class="ad">Məhsulun adı</div>

    <div class="qiymet">10 AZN</div>

    <button class="al" id="alBtn" onclick="al()">Al</button>

    <div class="saygac" id="saygac">

        <button onclick="azalt()">−</button>

        <span id="say">1</span>

        <button onclick="artir()">+</button>

    </div>

</div>

<script>

let say = 1;

function al() {
    localStorage.setItem("mehsulSekli", "foto.png");
    localStorage.setItem("mehsulAdi", "Məhsulun adı");
    localStorage.setItem("mehsulQiymeti", "10 AZN");
    localStorage.setItem("mehsulSayi", say);

    window.location.href = "orders.html";
}
function artir() {
    say++;
    document.getElementById("say").innerText = say;
}

function azalt() {
    if (say > 0) {
        say--;
        document.getElementById("say").innerText = say;
    }
}

</script>

</body>
</html>
