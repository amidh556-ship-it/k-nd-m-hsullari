<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sifarişlərim - Kənd məhsulları</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.container{
    width:94%;
    max-width:700px;
    margin:15px auto 80px;
}

h1{
    text-align:center;
    font-size:23px;
    margin:15px 0 20px;
}

.order{
    background:white;
    border-radius:14px;
    margin-bottom:15px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.order-top{
    padding:15px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

.order-id{
    font-weight:bold;
    font-size:16px;
}

.customer{
    font-size:13px;
    color:#666;
    margin-top:5px;
}

.date{
    font-size:12px;
    color:#888;
    margin-top:5px;
}

.status{
    display:inline-block;
    margin-top:9px;
    padding:7px 11px;
    border-radius:20px;
    background:#eaf7ed;
    color:#16833a;
    font-size:13px;
    font-weight:bold;
}

.arrow{
    float:right;
    font-size:22px;
}

.details{
    display:none;
    padding:12px;
}

.product{
    border:1px solid #eee;
    border-radius:12px;
    padding:10px;
    margin-bottom:12px;
    background:#fff;
}

.product-main{
    display:flex;
    gap:10px;
}

.product img{
    width:85px;
    height:85px;
    object-fit:cover;
    border-radius:10px;
    background:#eee;
}

.product-info{
    flex:1;
}

.product-name{
    font-weight:bold;
    margin-bottom:6px;
}

.product-info div{
    font-size:14px;
    margin:4px 0;
}

.return-button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.return-button:active{
    transform:scale(.98);
}

.return-box{
    margin-top:12px;
    padding:12px;
    border-radius:12px;
    background:#fff8e8;
    border:1px solid #f0d99b;
}

.return-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
}

.return-reason{
    font-size:13px;
    margin-bottom:12px;
}

.return-address{
    background:white;
    border-radius:10px;
    padding:12px;
    border:1px solid #eee;
    line-height:1.7;
    font-size:14px;
}

.send-button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:12px;
    margin-top:10px;
    background:#ff6b00;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.sent-info{
    margin-top:10px;
    padding:10px;
    border-radius:10px;
    background:#eaf7ed;
    color:#16833a;
    font-size:14px;
    font-weight:bold;
}

.return-timeline{
    margin-top:14px;
}

.return-step{
    display:flex;
    align-items:center;
    gap:10px;
    margin:10px 0;
    color:#999;
    font-size:13px;
}

.return-circle{
    width:25px;
    height:25px;
    border-radius:50%;
    background:#ddd;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.return-step.active{
    color:#16833a;
    font-weight:bold;
}

.return-step.active .return-circle{
    background:#19a94b;
    color:white;
}

.total{
    padding:12px 5px;
    font-size:17px;
    font-weight:bold;
    border-top:1px solid #eee;
}

.tracking{
    padding:10px 5px;
    font-size:14px;
}

.tracking-code{
    font-weight:bold;
    color:#333;
}

.timeline{
    display:flex;
    justify-content:space-between;
    margin:18px 0;
    gap:4px;
}

.step{
    flex:1;
    text-align:center;
    position:relative;
}

.circle{
    width:24px;
    height:24px;
    border-radius:50%;
    background:#ddd;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
}

.step.active .circle{
    background:#18a94b;
    color:white;
}

.step-text{
    font-size:9px;
    margin-top:5px;
    color:#777;
}

.step.active .step-text{
    color:#16833a;
    font-weight:bold;
}

.admin-box{
    background:#f1f5ff;
    border:1px solid #d7e0ff;
    padding:12px;
    border-radius:12px;
    margin-top:12px;
}

.admin-title{
    font-weight:bold;
    margin-bottom:8px;
}

.admin-box select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    background:white;
}

.save-button{
    width:100%;
    border:0;
    padding:11px;
    margin-top:8px;
    border-radius:8px;
    background:#2167e8;
    color:white;
    font-weight:bold;
}

.empty{
    text-align:center;
    background:white;
    padding:30px;
    border-radius:14px;
}

.back{
    display:block;
    text-align:center;
    margin:20px;
    text-decoration:none;
    color:#2167e8;
}

.modal{
    display:none;
    position:fixed;
    z-index:9999;
    inset:0;
    background:rgba(0,0,0,.55);
    overflow-y:auto;
}

.modal-content{
    background:white;
    width:94%;
    max-width:500px;
    margin:30px auto;
    border-radius:18px;
    padding:18px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.modal-header h2{
    margin:0;
    font-size:20px;
}

.close{
    border:0;
    background:#eee;
    width:35px;
    height:35px;
    border-radius:50%;
    font-size:20px;
}

.modal-product{
    display:flex;
    gap:10px;
    padding:10px;
    background:#f7f7f7;
    border-radius:12px;
    margin-bottom:15px;
}

.modal-product img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:9px;
}

.reason{
    display:block;
    padding:12px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:10px;
    cursor:pointer;
}

.reason input{
    margin-right:8px;
}

.note{
    width:100%;
    min-height:80px;
    margin-top:10px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:10px;
    resize:vertical;
}

.submit-return{
    width:100%;
    margin-top:12px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#ff6b00;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.send-address-title{
    margin-top:15px;
    font-size:17px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>📦 Sifarişlərim</h1>

<!-- GERİ QAYTARMA MODALI -->
<div class="modal" id="returnModal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>↩️ Geri qaytarma</h2>
            <button class="close" onclick="closeReturnModal()">×</button>
        </div>

        <div class="modal-product">

            <img id="modalProductImage" src="" alt="Məhsul">

            <div>
                <b id="modalProductName">Məhsul</b>
                <div style="font-size:13px;color:#777;margin-top:5px;">
                    Geri qaytarma sorğusu
                </div>
            </div>

        </div>

        <b>Səbəbi seçin:</b>

        <label class="reason">
            <input type="radio" name="returnReason" value="Məhsul zədəlidir">
            Məhsul zədəlidir
        </label>

        <label class="reason">
            <input type="radio" name="returnReason" value="Məhsul sınıq gəlib">
            Məhsul sınıq gəlib
        </label>

        <label class="reason">
            <input type="radio" name="returnReason" value="Səhv məhsul göndərilib">
            Səhv məhsul göndərilib
        </label>

        <label class="reason">
            <input type="radio" name="returnReason" value="Məhsulu bəyənmədim">
            Məhsulu bəyənmədim
        </label>

        <label class="reason">
            <input type="radio" name="returnReason" value="Məhsul təsvirə uyğun deyil">
            Məhsul təsvirə uyğun deyil
        </label>

        <label class="reason">
            <input type="radio" name="returnReason" value="Məhsul işləmir">
            Məhsul işləmir
        </label>

        <label class="reason">
            <input type="radio" name="returnReason" value="Başqa səbəb">
            Başqa səbəb
        </label>

        <textarea
            id="returnNote"
            class="note"
            placeholder="Əlavə məlumat yazın..."
        ></textarea>

        <button class="submit-return" onclick="submitReturn()">
            ↩️ Geri qaytarma sorğusu göndər
        </button>

    </div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    update,
    push
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey: "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain: "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
    "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId: "kendmehsullari-6a53d",

    storageBucket:
    "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId: "551607499773",

    appId:
    "1:551607499773:web:a84aa63dc5b55c38687794"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


const ADMIN_EMAIL = "amidh365@gmail.com";

const currentEmail =
    (localStorage.getItem("userEmail") || "")
    .toLowerCase()
    .trim();

const isAdmin =
    currentEmail === ADMIN_EMAIL;


const orderStatuses = [
    "Sifariş qəbul edildi",
    "Hazırlanır",
    "Yola verildi",
    "Çatdırılır",
    "Çatdırıldı"
];


const returnStatuses = [

    "Sorğu qəbul edildi",

    "Məhsul göndərilməlidir",

    "Məhsul yoldadır",

    "Məhsul satıcıya çatdı",

    "Pul geri qaytarılır",

    "Pul geri qaytarıldı"

];


let allOrders = [];

let returnProducts = {};

let selectedOrderKey = null;

let selectedProductIndex = null;


window.toggleOrder = function(index){

    const el =
        document.getElementById("details-" + index);

    if(!el) return;

    if(el.style.display === "block"){

        el.style.display = "none";

    }else{

        el.style.display = "block";

    }

};


window.openReturnModal = function(orderKey, productIndex){

    const key =
        orderKey + "_" + productIndex;

    const product =
        returnProducts[key];

    if(!product) return;

    selectedOrderKey = orderKey;

    selectedProductIndex = productIndex;

    document.getElementById("modalProductName")
        .textContent = product.name;

    document.getElementById("modalProductImage")
        .src = product.image || "";

    document.getElementById("returnNote")
        .value = "";

    document
        .querySelectorAll('input[name="returnReason"]')
        .forEach(input => input.checked = false);

    document.getElementById("returnModal")
        .style.display = "block";

};


window.closeReturnModal = function(){

    document.getElementById("returnModal")
        .style.display = "none";

};


window.submitReturn = async function(){

    if(!selectedOrderKey || selectedProductIndex === null){

        alert("Məhsul seçilməyib.");

        return;

    }


    const selected =
        document.querySelector(
            'input[name="returnReason"]:checked'
        );


    if(!selected){

        alert("Zəhmət olmasa geri qaytarma səbəbini seçin.");

        return;

    }


    const reason = selected.value;

    const note =
        document.getElementById("returnNote").value.trim();


    const product =
        returnProducts[
            selectedOrderKey + "_" + selectedProductIndex
        ];


    const order =
        allOrders.find(
            x => x.firebaseKey === selectedOrderKey
        );


    if(!order || !product){

        alert("Sifariş tapılmadı.");

        return;

    }


    const now = Date.now();


    const requestRef =
        push(ref(db, "returnRequests"));


    const requestId =
        requestRef.key;


    const returnData = {

        requestId: requestId,

        status: "Sorğu qəbul edildi",

        reason: reason,

        note: note,

        email: currentEmail,

        createdAt: now,

        updatedAt: now

    };


    const requestData = {

        requestId: requestId,

        orderKey: selectedOrderKey,

        productIndex: selectedProductIndex,

        orderId: order.orderId || "",

        productName: product.name,

        productImage: product.image || "",

        email: currentEmail,

        reason: reason,

        note: note,

        status: "Sorğu qəbul edildi",

        createdAt: now,

        updatedAt: now

    };


    const updates = {};


    updates[
        "orders/" +
        selectedOrderKey +
        "/products/" +
        selectedProductIndex +
        "/returnRequest"
    ] = returnData;


    updates[
        "returnRequests/" +
        requestId
    ] = requestData;


    try{

        await update(
            ref(db),
            updates
        );


        closeReturnModal();

        alert(
            "Geri qaytarma sorğunuz qəbul edildi."
        );


    }catch(error){

        console.error(error);

        alert(
            "Sorğu göndərilmədi: " +
            error.message
        );

    }

};


window.sendProductBack = async function(
    orderKey,
    productIndex
){

    const order =
        allOrders.find(
            x => x.firebaseKey === orderKey
        );

    if(!order) return;


    const product =
        (order.products || [])[productIndex];

    if(!product || !product.returnRequest){

        return;

    }


    const returnInfo =
        product.returnRequest;


    const now = Date.now();


    const updates = {};


    updates[
        "orders/" +
        orderKey +
        "/products/" +
        productIndex +
        "/returnRequest/status"
    ] = "Məhsul yoldadır";


    updates[
        "orders/" +
        orderKey +
        "/products/" +
        productIndex +
        "/returnRequest/updatedAt"
    ] = now;


    if(returnInfo.requestId){

        updates[
            "returnRequests/" +
            returnInfo.requestId +
            "/status"
        ] = "Məhsul yoldadır";


        updates[
            "returnRequests/" +
            returnInfo.requestId +
            "/updatedAt"
        ] = now;

    }


    try{

        await update(
            ref(db),
            updates
        );


        alert(
            "Məhsulu göndərdiyiniz qeyd edildi."
        );


    }catch(error){

        alert(
            "Xəta baş verdi: " +
            error.message
        );

    }

};


window.saveReturnStatus = async function(
    orderKey,
    productIndex
){

    const select =
        document.getElementById(
            "return-select-" +
            orderKey +
            "-" +
            productIndex
        );


    if(!select) return;


    const newStatus =
        select.value;


    const order =
        allOrders.find(
            x => x.firebaseKey === orderKey
        );


    if(!order) return;


    const product =
        (order.products || [])[productIndex];


    if(!product || !product.returnRequest){

        return;

    }


    const returnInfo =
        product.returnRequest;


    const now = Date.now();

    const updates = {};


    updates[
        "orders/" +
        orderKey +
        "/products/" +
        productIndex +
        "/returnRequest/status"
    ] = newStatus;


    updates[
        "orders/" +
        orderKey +
        "/products/" +
        productIndex +
        "/returnRequest/updatedAt"
    ] = now;


    if(returnInfo.requestId){

        updates[
            "returnRequests/" +
            returnInfo.requestId +
            "/status"
        ] = newStatus;


        updates[
            "returnRequests/" +
            returnInfo.requestId +
            "/updatedAt"
        ] = now;

    }


    try{

        await update(
            ref(db),
            updates
        );


        alert(
            "Geri qaytarma statusı dəyişdirildi."
        );


    }catch(error){

        alert(
            "Xəta baş verdi: " +
            error.message
        );

    }

};


function getStatusIndex(status){

    const index =
        orderStatuses.indexOf(status);

    return index >= 0 ? index : 0;

}


function getReturnStatusIndex(status){

    const index =
        returnStatuses.indexOf(status);

    return index >= 0 ? index : 0;

}


function createTimeline(status){

    const current =
        getStatusIndex(status);


    return `
        <div class="timeline">

            ${orderStatuses.map((item,index)=>`

                <div class="step ${
                    index <= current ? "active" : ""
                }">

                    <div class="circle">
                        ${index <= current ? "✓" : ""}
                    </div>

                    <div class="step-text">
                        ${item}
                    </div>

                </div>

            `).join("")}

        </div>
    `;

}


function createReturnTimeline(returnInfo){

    const current =
        getReturnStatusIndex(
            returnInfo.status
        );


    return `
        <div class="return-timeline">

            ${returnStatuses.map((item,index)=>`

                <div class="return-step ${
                    index <= current ? "active" : ""
                }">

                    <div class="return-circle">
                        ${index <= current ? "✓" : ""}
                    </div>

                    <div>
                        ${item}
                    </div>

                </div>

            `).join("")}

        </div>
    `;

}


function renderReturnSection(
    order,
    product,
    productIndex
){

    const returnInfo =
        product.returnRequest;


    if(!returnInfo){

        return `
            <button
                class="return-button"
                onclick="openReturnModal(
                    '${order.firebaseKey}',
                    ${productIndex}
                )"
            >
                ↩️ Geri qaytarma
            </button>
        `;

    }


    const status =
        returnInfo.status ||
        "Sorğu qəbul edildi";


    let sendPart = "";


    if(
        status === "Məhsul göndərilməlidir"
    ){

        sendPart = `

            <div class="return-box">

                <div class="return-title">
                    📦 Məhsulu geri göndərin
                </div>

                <div class="return-reason">
                    <b>Səbəb:</b>
                    ${returnInfo.reason || ""}
                </div>

                <div class="return-address">

                    <b>Göndəriləcək məlumatlar</b>

                    <br>

                    <b>Kimdən:</b>
                    Amid Həmidov

                    <br>

                    <b>Ünvan:</b>
                    F.ƏMİROV 24

                    <br>

                    <b>İndeks:</b>
                    AZ 1020 TƏLƏBLİ

                    <br>

                    <b>Tel:</b>
                    0504535874

                </div>

                <button
                    class="send-button"
                    onclick="sendProductBack(
                        '${order.firebaseKey}',
                        ${productIndex}
                    )"
                >
                    📦 Məhsulu göndərdim
                </button>

            </div>

        `;

    }


    if(
        status === "Məhsul yoldadır"
    ){

        sendPart = `

            <div class="sent-info">
                🚚 Məhsul yoldadır.
                Satıcıya çatdıqda növbəti mərhələ başlayacaq.
            </div>

        `;

    }


    if(
        status === "Məhsul satıcıya çatdı"
    ){

        sendPart = `

            <div class="sent-info">
                📍 Məhsul satıcıya çatdı.
                💰 Pulun geri qaytarılması başlayacaq.
            </div>

        `;

    }


    if(
        status === "Pul geri qaytarılır"
    ){

        sendPart = `

            <div class="sent-info">
                💰 Pul geri qaytarılır.
            </div>

        `;

    }
