<!DOCTYPE html>
<html lang="az">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sifarişlərim</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

h1 {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

.order {
    background: white;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    cursor: pointer;
}

.order:active {
    transform: scale(0.98);
}

.product {
    display: flex;
    gap: 12px;
    margin-top: 12px;
}

.product img {
    width: 75px;
    height: 75px;
    object-fit: cover;
    border-radius: 8px;
}

.product-info {
    flex: 1;
}

.status {
    display: inline-block;
    margin-top: 8px;
    padding: 7px 10px;
    border-radius: 7px;
    background: #e8f5e9;
    color: #2e7d32;
    font-weight: bold;
}

.tracking {
    margin-top: 12px;
    padding: 12px;
    background: #f5f5f5;
    border-radius: 8px;
}

.total {
    margin-top: 12px;
    font-size: 18px;
    font-weight: bold;
}

.empty {
    background: white;
    padding: 35px;
    text-align: center;
    border-radius: 10px;
}

.back {
    display: block;
    background: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    text-decoration: none;
    color: #222;
}

</style>

</head>

<body>

<div class="container">

<h1>📦 Sifarişlərim</h1>

<div id="orders"></div>

<a class="back" href="index.html">
← Alış-verişə qayıt
</a>

</div>


<script>

function showOrders() {

    const box =
        document.getElementById("orders");

    let orders = [];

    try {

        orders =
            JSON.parse(
                localStorage.getItem("orders")
            ) || [];

    } catch (error) {

        orders = [];

    }


    box.innerHTML = "";


    if (orders.length === 0) {

        box.innerHTML = `
            <div class="empty">
                📦 Hələ sifarişiniz yoxdur.
            </div>
        `;

        return;
    }


    orders
        .slice()
        .reverse()
        .forEach(function(order, reverseIndex) {

            const realIndex =
                orders.length - 1 - reverseIndex;

            let firstProduct =
                order.products &&
                order.products.length
                    ? order.products[0]
                    : null;


            box.innerHTML += `

                <div
                    class="order"
                    onclick="openOrder(${realIndex})"
                >

                    <b>
                        📦 ${order.orderId || "Sifariş"}
                    </b>

                    <br>

                    <span class="status">
                        ${order.status || "Sifariş verildi"}
                    </span>

                    ${
                        firstProduct
                        ? `
                            <div class="product">

                                <img
                                    src="${firstProduct.image || ''}"
                                >

                                <div class="product-info">

                                    <b>
                                        ${firstProduct.name || "Məhsul"}
                                    </b>

                                    <br>

                                    Say:
                                    ${firstProduct.quantity || 1}

                                </div>

                            </div>
                        `
                        : ""
                    }


                    <div class="tracking">

                        🚚 İzləmə kodu:
                        <b>
                            ${order.trackingCode || "Yoxdur"}
                        </b>

                    </div>


                    <div class="total">

                        Ümumi:
                        ${Number(order.total || 0).toFixed(2)}
                        AZN

                    </div>


                    <small>
                        ${order.date || ""}
                    </small>

                </div>

            `;

        });

}


function openOrder(index) {

    localStorage.setItem(
        "selectedOrder",
        index
    );

    window.location.href =
        "order-detail.html";

}


showOrders();

</script>

</body>
</html>
