<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sifarişlərim</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

h1{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-top:0;
}

.order{
    background:white;
    border-radius:12px;
    margin-bottom:15px;
    overflow:hidden;
}

.order-top{
    padding:15px;
    cursor:pointer;
}

.order-id{
    font-weight:bold;
    font-size:17px;
}

.status{
    margin-top:7px;
    color:#2e7d32;
    font-weight:bold;
}

.arrow{
    float:right;
    font-size:20px;
}

.details{
    display:none;
    padding:15px;
    border-top:1px solid #eee;
}

.product{
    padding:14px 0;
    border-bottom:1px solid #eee;
}

.product-row{
    display:flex;
    gap:10px;
}

.product img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
}

.product-info{
    flex:1;
}

.return-button{
    display:block;
    width:100%;
    margin-top:12px;
    padding:13px;
    border:none;
    border-radius:9px;
    background:#ff6b00;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.return-button:active{
    opacity:.8;
}

.return-request{
    margin-top:10px;
    padding:11px;
    background:#fff3e0;
    color:#e65100;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
}

.total{
    font-size:19px;
    font-weight:bold;
    margin-top:10px;
}

.tracking{
    background:#f1f8e9;
    padding:12px;
    border-radius:8px;
    margin-top:12px;
}

.tracking-code{
    font-weight:bold;
    margin-top:5px;
}

.timeline{
    margin-top:18px;
}

.step{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-bottom:16px;
}

.circle{
    width:22px;
    height:22px;
    border-radius:50%;
    background:#ddd;
    flex-shrink:0;
}

.step.active .circle{
    background:#2e7d32;
}

.step-text{
    font-size:15px;
}

.step.active .step-text{
    color:#2e7d32;
    font-weight:bold;
}

.admin-box{
    background:#fff8e1;
    border:2px solid #ffca28;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
}

.admin-box select{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.admin-title{
    font-weight:bold;
}

.save-button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#2e7d32;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.empty{
    background:white;
    padding:35px 15px;
    border-radius:12px;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    padding:20px;
    color:#222;
    text-decoration:none;
}

.date{
    color:#777;
    font-size:14px;
    margin-top:10px;
}

.customer{
    background:#f5f5f5;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    font-size:14px;
}


/* GERİ QAYTARMA PƏNCƏRƏSİ */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:9999;
    padding:20px;
}

.modal-content{
    background:white;
    max-width:500px;
    margin:30px auto;
    padding:20px;
    border-radius:15px;
    max-height:90vh;
    overflow:auto;
}

.modal-content h2{
    margin-top:0;
}

.reason{
    display:block;
    padding:12px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:8px;
}

.reason input{
    margin-right:8px;
}

.note{
    width:100%;
    min-height:80px;
    margin-top:10px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.send-button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#ff6b00;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.close-button{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:0;
    border-radius:8px;
    background:#eee;
    font-size:15px;
}
</style>
</head>

<body>

<div class="container">

<h1>📦 Sifarişlərim</h1>

<div id="orders">
    ⏳ Sifarişlər yüklənir...
</div>

<a class="back" href="index.html">
← Alış-verişə qayıt
</a>

</div>


<!-- GERİ QAYTARMA PƏNCƏRƏSİ -->

<div class="modal" id="returnModal">

    <div class="modal-content">

        <h2>↩️ Geri qaytarma</h2>

        <p id="returnProductName"></p>

        <b>Səbəbi seç:</b>

        <label class="reason">
            <input type="radio" name="reason" value="Məhsul zədəlidir">
            Məhsul zədəlidir
        </label>

        <label class="reason">
            <input type="radio" name="reason" value="Məhsul sınıq gəlib">
            Məhsul sınıq gəlib
        </label>

        <label class="reason">
            <input type="radio" name="reason" value="Səhv məhsul göndərilib">
            Səhv məhsul göndərilib
        </label>

        <label class="reason">
            <input type="radio" name="reason" value="Balaca gəlib">
            Balaca gəlib
        </label>

        <label class="reason">
            <input type="radio" name="reason" value="Böyük gəlib">
            Böyük gəlib
        </label>

        <label class="reason">
            <input type="radio" name="reason" value="Məhsulu bəyənmədim">
            Məhsulu bəyənmədim
        </label>

        <label class="reason">
            <input type="radio" name="reason" value="Təsvirə uyğun deyil">
            Təsvirə uyğun deyil
        </label>

        <label class="reason">
            <input type="radio" name="reason" value="İşləmir">
            Məhsul işləmir
        </label>

        <label class="reason">
            <input type="radio" name="reason" value="Başqa səbəb">
            Başqa səbəb
        </label>

        <textarea
            id="returnNote"
            class="note"
            placeholder="Əlavə məlumat yazın..."
        ></textarea>

        <button
            class="send-button"
            onclick="sendReturnRequest()"
        >
            ↩️ Geri qaytarma sorğusunu göndər
        </button>

        <button
            class="close-button"
            onclick="closeReturnModal()"
        >
            Bağla
        </button>

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    update,
    push
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain:
        "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
        "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
        "kendmehsullari-6a53d",

    storageBucket:
        "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
        "551607499773",

    appId:
        "1:551607499773:web:a84aa63dc5b55c38687794"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


const ADMIN_EMAIL =
    "amidh365@gmail.com";


const currentEmail =
    (
        localStorage.getItem("userEmail")
        || ""
    )
    .toLowerCase()
    .trim();


const isAdmin =
    currentEmail === ADMIN_EMAIL;


const statuses = [

    "Sifariş qəbul edildi",
    "Hazırlanır",
    "Yola verildi",
    "Çatdırılır",
    "Çatdırıldı"

];


function getStatusIndex(status){

    if(!status){
        return 0;
    }

    const s =
        status.toLowerCase();

    if(s.includes("çatdırıldı")){
        return 4;
    }

    if(s.includes("çatdırılır")){
        return 3;
    }

    if(s.includes("yola")){
        return 2;
    }

    if(s.includes("hazırlanır")){
        return 1;
    }

    return 0;
}


const ordersBox =
    document.getElementById("orders");


onValue(
    ref(db,"orders"),
    function(snapshot){

        ordersBox.innerHTML = "";

        const data =
            snapshot.val();


        if(!data){

            ordersBox.innerHTML = `
                <div class="empty">
                    📦 Hələ sifariş yoxdur.
                </div>
            `;

            return;
        }


        let orders = [];


        Object.keys(data).forEach(function(key){

            const order =
                data[key];

            order.firebaseKey =
                key;

            orders.push(order);

        });


        if(!isAdmin){

            orders =
                orders.filter(function(order){

                    return (
                        String(order.email || "")
                        .toLowerCase()
                        .trim()
                        === currentEmail
                    );

                });

        }


        orders.sort(function(a,b){

            return (
                Number(b.createdAt || 0)
                -
                Number(a.createdAt || 0)
            );

        });


        if(orders.length === 0){

            ordersBox.innerHTML = `
                <div class="empty">
                    📦 Sifariş yoxdur.
                </div>
            `;

            return;
        }


        orders.forEach(function(order,index){

            renderOrder(
                order,
                index
            );

        });

    }
);


function renderOrder(order,index){

    const currentStatus =
        order.status ||
        "Sifariş qəbul edildi";


    const statusIndex =
        getStatusIndex(
            currentStatus
        );


    let productsHTML = "";


    const products =
        order.products || [];


    products.forEach(function(item,productIndex){

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;


        let returnHTML = "";


        if(item.returnRequest){

            returnHTML = `

                <div class="return-request">

                    ↩️ Geri qaytarma:
                    ${item.returnRequest.reason}

                    <br>

                    Status:
                    ${item.returnRequest.status}

                </div>

            `;

        }else{

            /* DÜYMƏ HƏR MƏHSULDA GÖRÜNÜR */

            returnHTML = `

                <button
                    type="button"
                    class="return-button"
                    onclick="openReturnModal(
                        '${order.firebaseKey}',
                        ${productIndex},
                        '${String(item.name || "Məhsul").replace(/'/g,"\\'")}'
                    )"
                >
                    ↩️ Geri qaytarma
                </button>

            `;

        }


        productsHTML += `

            <div class="product">

                <div class="product-row">

                    <img
                        src="${item.image || ''}"
                        alt="Məhsul"
                    >

                    <div class="product-info">

                        <b>
                            ${item.name || "Məhsul"}
                        </b>

                        <br>

                        ${quantity} ədəd

                        <br>

                        ${price.toFixed(2)}
                        AZN / ədəd

                    </div>

                </div>

                ${returnHTML}

            </div>

        `;

    });


    let timelineHTML = "";


    statuses.forEach(function(status,i){

        timelineHTML += `

            <div class="step ${
                i <= statusIndex
                ? "active"
                : ""
            }">

                <div class="circle"></div>

                <div class="step-text">
                    ${status}
                </div>

            </div>

        `;

    });


    let adminHTML = "";


    if(isAdmin){

        let optionsHTML = "";


        statuses.forEach(function(status){

            optionsHTML += `

                <option
                    value="${status}"
                    ${
                        status === currentStatus
                        ? "selected"
                        : ""
                    }
                >
                    ${status}
                </option>

            `;

        });


        adminHTML = `

            <div class="admin-box">

                <div class="admin-title">
                    🔐 Admin — Sifariş statusu
                </div>

                <select id="status-${index}">
                    ${optionsHTML}
                </select>

                <button
                    class="save-button"
                    onclick="saveStatus(
                        '${order.firebaseKey}',
                        ${index}
                    )"
                >
                    💾 Statusu yadda saxla
                </button>

            </div>

        `;

    }


    ordersBox.innerHTML += `

        <div class="order">

            <div
                class="order-top"
                onclick="toggleOrder(${index})"
            >

                <span class="arrow">▼</span>

                <div class="order-id">
                    📦 ${order.orderId || "Sifariş"}
                </div>

                <div class="status">
                    ${currentStatus}
                </div>

            </div>


            <div
                class="details"
                id="details-${index}"
            >

                ${
                    isAdmin
                    ? `
                    <div class="customer">

                        👤 <b>Müştəri:</b>
                        ${order.name || ""}

                        <br>

                        📧 <b>Gmail:</b>
                        ${order.email || ""}

                        <br>

                        📞 <b>Telefon:</b>
                        ${order.phone || ""}

                        <br>

                        📍 <b>Ünvan:</b>
                        ${order.address || ""}

                    </div>
                    `
                    : ""
                }


                ${productsHTML}


                <div class="total">

                    Ümumi:
                    ${Number(order.total || 0).toFixed(2)}
                    AZN

                </div>


                <div class="tracking">

                    <b>📍 İzləmə kodu</b>

                    <div class="tracking-code">

                        ${
                            order.trackingCode ||
                            "Hazırlanır"
                        }

                    </div>

                </div>


                <div class="timeline">

                    <b>
                        📦 Sifarişin vəziyyəti
                    </b>

                    <br><br>

                    ${timelineHTML}

                </div>


                ${adminHTML}


                <div class="date">

                    📅 ${order.date || ""}

                </div>

            </div>

        </div>

    `;

}


/* =========================
   GERİ QAYTARMA AÇ
========================= */

let selectedOrderKey = null;
let selectedProductIndex = null;


window.openReturnModal =
function(
    orderKey,
    productIndex,
    productName
){

    selectedOrderKey =
        orderKey;

    selectedProductIndex =
        productIndex;


    document.getElementById(
        "returnProductName"
    ).innerHTML =
        "📦 Məhsul: <b>" +
        productName +
        "</b>";


    document.getElementById(
        "returnModal"
    ).style.display =
        "block";


    document.body.style.overflow =
        "hidden";

};


window.closeReturnModal =
function(){

    document.getElementById(
        "returnModal"
    ).style.display =
        "none";


    document.body.style.overflow =
        "auto";

};


/* =========================
   GERİ QAYTARMA GÖNDƏR
========================= */

window.sendReturnRequest =
async function(){

    if(
        !selectedOrderKey ||
        selectedProductIndex === null
    ){

        alert("❌ Məhsul seçilməyib.");

        return;

    }


    const selected =
        document.querySelector(
            'input[name="reason"]:checked'
        );


    if(!selected){

        alert(
            "⚠️ Əvvəlcə səbəb seç."
        );

        return;

    }


    const note =
        document.getElementById(
            "returnNote"
        ).value.trim();


    const request = {

        orderKey:
            selectedOrderKey,

        productIndex:
            selectedProductIndex,

        email:
            currentEmail,

        reason:
            selected.value,

        note:
            note,

        status:
            "Sorğu göndərildi",

        createdAt:
            Date.now()

    };


    try{

        await update(

            ref(
                db,
                "orders/" +
                selectedOrderKey +
                "/products/" +
                selectedProductIndex
            ),

            {
                returnRequest:
                    request
            }

        );


        await push(

            ref(db,"returnRequests"),

            request

        );


        alert(
            "✅ Geri qaytarma sorğusu göndərildi!"
        );


        document.getElementById(
            "returnNote"
        ).value = "";


        document.querySelectorAll(
            'input[name="reason"]'
        ).forEach(function(r){

            r.checked = false;

        });


        closeReturnModal();


    }catch(error){

        console.error(error);

        alert(
            "❌ Geri qaytarma göndərilmədi.\n\n" +
            error.message
        );

    }

};


/* =========================
   STATUS YADDA SAXLA
========================= */

window.saveStatus =
async function(
    firebaseKey,
    index
){

    if(!isAdmin){

        alert(
            "❌ Bu əməliyyata icazən yoxdur."
        );

        return;

    }


    const select =
        document.getElementById(
            "status-" + index
        );


    if(!select){
        return;
    }


    try{

        await update(

            ref(
                db,
                "orders/" +
                firebaseKey
            ),

            {

                status:
                    select.value,

                updatedAt:
                    Date.now()

            }

        );


        alert(
            "✅ Status yadda saxlanıldı."
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Status dəyişmədi.\n\n" +
            error.message
        );

    }

};


/* =========================
   AÇ / BAĞLA
========================= */

window.toggleOrder =
function(index){

    const details =
        document.getElementById(
            "details-" + index
        );


    if(
        details.style.display ===
        "block"
    ){

        details.style.display =
            "none";

    }else{

        details.style.display =
            "block";

    }

};

</script>

</body>
</html>
