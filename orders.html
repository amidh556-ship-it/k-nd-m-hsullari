<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sifarişlərim - Kənd məhsulları</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.container{
    width:94%;
    max-width:700px;
    margin:15px auto 80px;
}

h1{
    text-align:center;
    font-size:23px;
    margin:15px 0 20px;
}

.order{
    background:#fff;
    border-radius:14px;
    margin-bottom:15px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.order-top{
    padding:15px;
    cursor:pointer;
}

.order-id{
    font-weight:bold;
    font-size:16px;
}

.customer{
    color:#666;
    font-size:13px;
    margin-top:6px;
}

.date{
    color:#888;
    font-size:12px;
    margin-top:5px;
}

.status{
    display:inline-block;
    margin-top:9px;
    padding:7px 11px;
    border-radius:20px;
    background:#e9f8ed;
    color:#16833a;
    font-size:13px;
    font-weight:bold;
}

.arrow{
    float:right;
    font-size:22px;
}

.details{
    display:none;
    padding:12px;
    border-top:1px solid #eee;
}

.product{
    border:1px solid #eee;
    border-radius:12px;
    padding:10px;
    margin-bottom:12px;
}

.product-main{
    display:flex;
    gap:10px;
}

.product img{
    width:85px;
    height:85px;
    object-fit:cover;
    border-radius:10px;
    background:#eee;
}

.product-info{
    flex:1;
}

.product-name{
    font-weight:bold;
    margin-bottom:8px;
}

.product-info div{
    font-size:14px;
    margin:4px 0;
}

.return-button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:12px;
    margin-top:10px;
    background:#111;
    color:#fff;
    font-size:15px;
    font-weight:bold;
}

.return-box{
    margin-top:12px;
    padding:12px;
    background:#fff8e8;
    border:1px solid #efd89b;
    border-radius:12px;
}

.return-title{
    font-weight:bold;
    font-size:16px;
    margin-bottom:10px;
}

.reason-text{
    font-size:13px;
    margin-bottom:10px;
}

.return-address{
    background:#fff;
    border:1px solid #eee;
    border-radius:10px;
    padding:12px;
    line-height:1.8;
    font-size:14px;
}

.send-button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:12px;
    margin-top:10px;
    background:#ff6b00;
    color:#fff;
    font-size:15px;
    font-weight:bold;
}

.return-step{
    display:flex;
    gap:10px;
    align-items:center;
    margin:10px 0;
    color:#aaa;
    font-size:13px;
}

.return-circle{
    width:25px;
    height:25px;
    min-width:25px;
    border-radius:50%;
    background:#ddd;
    display:flex;
    justify-content:center;
    align-items:center;
}

.return-step.active{
    color:#16833a;
    font-weight:bold;
}

.return-step.active .return-circle{
    background:#18a94b;
    color:#fff;
}

.timeline{
    display:flex;
    gap:3px;
    margin:15px 0;
}

.step{
    flex:1;
    text-align:center;
}

.circle{
    width:24px;
    height:24px;
    margin:auto;
    border-radius:50%;
    background:#ddd;
    display:flex;
    justify-content:center;
    align-items:center;
}

.step.active .circle{
    background:#18a94b;
    color:#fff;
}

.step-text{
    font-size:9px;
    color:#777;
    margin-top:5px;
}

.step.active .step-text{
    color:#16833a;
    font-weight:bold;
}

.total{
    border-top:1px solid #eee;
    padding:12px 4px;
    font-size:17px;
    font-weight:bold;
}

.tracking{
    padding:8px 4px;
    font-size:14px;
}

.admin-box{
    margin-top:12px;
    padding:12px;
    border-radius:12px;
    background:#f1f5ff;
    border:1px solid #d7e0ff;
}

.admin-title{
    font-weight:bold;
    margin-bottom:8px;
}

.admin-box select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    background:#fff;
}

.save-button{
    width:100%;
    border:0;
    border-radius:8px;
    padding:11px;
    margin-top:8px;
    background:#2167e8;
    color:#fff;
    font-weight:bold;
}

.empty{
    background:#fff;
    border-radius:14px;
    padding:30px;
    text-align:center;
}

.error{
    background:#fff0f0;
    color:#b00020;
    border-radius:12px;
    padding:15px;
    text-align:center;
    line-height:1.5;
}

.back{
    display:block;
    text-align:center;
    margin:20px;
    color:#2167e8;
    text-decoration:none;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(0,0,0,.55);
    overflow:auto;
}

.modal-content{
    width:94%;
    max-width:500px;
    margin:25px auto;
    background:#fff;
    border-radius:18px;
    padding:18px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    margin:0;
    font-size:20px;
}

.close{
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:#eee;
    font-size:20px;
}

.modal-product{
    display:flex;
    gap:10px;
    margin:15px 0;
    padding:10px;
    background:#f7f7f7;
    border-radius:12px;
}

.modal-product img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:9px;
}

.reason{
    display:block;
    padding:12px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:10px;
}

.reason input{
    margin-right:8px;
}

.note{
    width:100%;
    min-height:80px;
    margin-top:8px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:10px;
}

.submit-return{
    width:100%;
    border:0;
    border-radius:10px;
    padding:13px;
    margin-top:12px;
    background:#ff6b00;
    color:#fff;
    font-size:16px;
    font-weight:bold;
}

.return-label{
    background:#fff3cd;
    border:1px solid #f0d477;
    border-radius:10px;
    padding:12px;
    margin-bottom:12px;
    text-align:center;
    font-weight:bold;
    color:#7a5a00;
}

.return-photo{
    width:100%;
    display:block;
    border-radius:12px;
    border:1px solid #ddd;
    margin-bottom:12px;
}
</style>
</head>

<body>

<div class="container">

<h1>📦 Sifarişlərim</h1>

<div id="ordersList">

</div>

<a class="back" href="index.html">

</div>


<!-- GERİ QAYTARMA MODALI -->

<div class="modal" id="returnModal">

<div class="modal-content">

<div class="modal-header">

    <h2>↩️ Geri qaytarma</h2>

    <button
        class="close"

    >
        ×
    </button>

</div>

<div class="modal-product">

<img
    id="modalImage"

    alt="Məhsul"
>

<div>

    <b id="modalName">
        Məhsul
    </b>

    <div style="
        font-size:13px;
        color:#777;
        margin-top:5px;
    ">

    </div>

</div>

</div>

<b>Səbəbi seçin:</b>

<label class="reason">
<input

    value="Məhsul zədəlidir"
>

<label class="reason">

    name="reason"

>

<label class="reason">
<input
    type="radio"
    name="reason"
    value="Səhv məhsul göndərilib"
>
Səhv məhsul göndərilib
</label>

<label class="reason">
<input
    type="radio"
    name="reason"

>

>
Məhsul təsvirə uyğun deyil

<input

>

>

<textarea

</div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    update,
    push
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain:
    "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
    "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
    "kendmehsullari-6a53d",

    storageBucket:
    "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
    "551607499773",

    appId:
    "1:551607499773:web:a84aa63dc5b55c38687794"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


const ADMIN_EMAIL =
    "amidh365@gmail.com";


const currentEmail =
    (localStorage.getItem("userEmail") || "")
    .toLowerCase()
    .trim();


const isAdmin =
    currentEmail === ADMIN_EMAIL;


const orderStatuses = [

    "Sifariş qəbul edildi",

    "Hazırlanır",

    "Yola verildi",

    "Çatdırılır",

    "Çatdırıldı"

];


const returnStatuses = [

    "Sorğu qəbul edildi",

    "Məhsul göndərilməlidir",

    "Məhsul yoldadır",

    "Məhsul satıcıya çatdı",

    "Pul geri qaytarılır",

    "Pul geri qaytarıldı"

];


let orders = [];

let selectedOrderKey = null;

let selectedProductIndex = null;


/* SİFARİŞİ AÇ */

window.toggleOrder = function(index){

    const box =
        document.getElementById(
            "details-" + index
        );

    if(!box) return;

    box.style.display =
        box.style.display === "block"
        ? "none"
        : "block";
};


/* STATUS İNDEKSİ */

function statusIndex(status){

    const i =
        orderStatuses.indexOf(status);

    return i < 0 ? 0 : i;
}


/* GERİ QAYTARMA İNDEKSİ */

function returnIndex(status){

    const i =
        returnStatuses.indexOf(status);

    return i < 0 ? 0 : i;
}


/* SİFARİŞ TIMELINE */

function orderTimeline(status){

    const current =
        statusIndex(status);

    return `

    <div class="timeline">

        ${orderStatuses.map((x,i)=>`

            <div
                class="step ${
                    i <= current
                    ? "active"
                    : ""
                }"
            >

                <div class="circle">
                    ${
                        i <= current
                        ? "✓"
                        : ""
                    }
                </div>

                <div class="step-text">
                    ${x}
                </div>

            </div>

        `).join("")}

    </div>

    `;
}


/* GERİ QAYTARMA TIMELINE */

function returnTimeline(info){

    const current =
        returnIndex(info.status);

    return `

    <div>

        ${returnStatuses.map((x,i)=>`

            <div
                class="return-step ${
                    i <= current
                    ? "active"
                    : ""
                }"
            >

                <div class="return-circle">
                    ${
                        i <= current
                        ? "✓"
                        : ""
                    }
                </div>

                <div>
                    ${x}
                </div>

            </div>

        `).join("")}

    </div>

    `;
}


/* GERİ QAYTARMA MODALI */

window.openReturn =
function(orderKey, productIndex){

    selectedOrderKey =
        orderKey;

    selectedProductIndex =
        productIndex;


    const order =
        orders.find(
            x =>
            x.firebaseKey ===
            orderKey
        );


    if(!order) return;


    const products =
        Array.isArray(order.products)
        ? order.products
        : Object.values(
            order.products || {}
        );


    const product =
        products[productIndex];


    if(!product) return;


    document.getElementById(
        "modalName"
    ).textContent =
        product.name ||
        "Məhsul";


    document.getElementById(
        "modalImage"
    ).src =
        product.image ||
        "";


    document.getElementById(
        "returnNote"
    ).value = "";


    document.querySelectorAll(
        'input[name="reason"]'
    ).forEach(
        x =>
        x.checked = false
    );


    document.getElementById(
        "returnModal"
    ).style.display =
        "block";
};


/* MODALI BAĞLA */

window.closeReturnModal =
function(){

    document.getElementById(
        "returnModal"
    ).style.display =
        "none";
};


/* GERİ QAYTARMA SORĞUSU */

window.submitReturn =
async function(){

    if(!selectedOrderKey)
        return;


    const reason =
        document.querySelector(
            'input[name="reason"]:checked'
        );


    if(!reason){

        alert(
            "Səbəb seçin."
        );

        return;
    }


    const order =
        orders.find(
            x =>
            x.firebaseKey ===
            selectedOrderKey
        );


    if(!order) return;


    const products =
        Array.isArray(order.products)
        ? order.products
        : Object.values(
            order.products || {}
        );


    const product =
        products[selectedProductIndex];


    if(!product) return;


    const now =
        Date.now();


    const request =
        push(
            ref(
                db,
                "returnRequests"
            )
        );


    const requestId =
        request.key;


    const returnInfo = {

        requestId:

            requestId,

        status:

            "Sorğu qəbul edildi",

        reason:

            reason.value,

        note:

            document.getElementById(
                "returnNote"
            ).value.trim(),

        email:

            currentEmail,

        createdAt:

            now,

        updatedAt:

            now

    };


    const updates = {};


    updates[
        `orders/${selectedOrderKey}/products/${selectedProductIndex}/returnRequest`
    ] =
        returnInfo;


    updates[
        `returnRequests/${requestId}`
    ] = {

        ...returnInfo,

        orderKey:
            selectedOrderKey,

        productIndex:
            selectedProductIndex,

        orderId:
            order.orderId || "",

        productName:
            product.name || "",

        productImage:
            product.image || ""

    };


    try{

        await update(
            ref(db),
            updates
        );


        closeReturnModal();


        alert(
            "✅ Geri qaytarma sorğusu göndərildi."
        );


    }catch(error){

        alert(
            "Firebase xətası:\n" +
            error.message
        );

    }

};


/* MƏHSULU GÖNDƏRDİM */

window.productSent =
async function(
    orderKey,
    productIndex
){

    const order =
        orders.find(
            x =>
            x.firebaseKey ===
            orderKey
        );


    if(!order) return;


    const products =
        Array.isArray(order.products)
        ? order.products
        : Object.values(
            order.products || {}
        );


    const product =
        products[productIndex];


    if(
        !product ||
        !product.returnRequest
    )
        return;


    const info =
        product.returnRequest;


    const now =
        Date.now();


    const updates = {};


    updates[
        `orders/${orderKey}/products/${productIndex}/returnRequest/status`
    ] =
        "Məhsul yoldadır";


    updates[
        `orders/${orderKey}/products/${productIndex}/returnRequest/updatedAt`
    ] =
        now;


    if(info.requestId){

        updates[
            `returnRequests/${info.requestId}/status`
        ] =
            "Məhsul yoldadır";


        updates[
            `returnRequests/${info.requestId}/updatedAt`
        ] =
            now;

    }


    try{

        await update(
            ref(db),
            updates
        );


        alert(
            "🚚 Məhsul yoldadır olaraq qeyd edildi."
        );


    }catch(error){

        alert(
            "Xəta:\n" +
            error.message
        );

    }

};


/* ADMIN SİFARİŞ STATUSU */

window.saveStatus =
async function(orderKey){

    const select =
        document.getElementById(
            "status-" +
            orderKey
        );


    if(!select) return;


    try{

        await update(

            ref(
                db,
                "orders/" +
                orderKey
            ),

            {

                status:
                    select.value,

                updatedAt:
                    Date.now()

            }

        );


        alert(
            "✅ Sifariş statusu yadda saxlanıldı."
        );


    }catch(error){

        alert(
            "Xəta:\n" +
            error.message
        );

    }

};


/* ADMIN GERİ QAYTARMA STATUSU */

window.saveReturnStatus =
async function(
    orderKey,
    productIndex
){

    const select =
        document.getElementById(
            `return-${orderKey}-${productIndex}`
        );


    if(!select) return;


    const order =
        orders.find(
            x =>
            x.firebaseKey ===
            orderKey
        );


    if(!order) return;


    const products =
        Array.isArray(order.products)
        ? order.products
        : Object.values(
            order.products || {}
        );


    const product =
        products[productIndex];


    if(
        !product ||
        !product.returnRequest
    )
        return;


    const info =
        product.returnRequest;


    const now =
        Date.now();


    const updates = {};


    updates[
        `orders/${orderKey}/products/${productIndex}/returnRequest/status`
    ] =
        select.value;


    updates[
        `orders/${orderKey}/products/${productIndex}/returnRequest/updatedAt`
    ] =
        now;


    if(info.requestId){

        updates[
            `returnRequests/${info.requestId}/status`
        ] =
            select.value;


        updates[
            `returnRequests/${info.requestId}/updatedAt`
        ] =
            now;

    }


    try{

        await update(
            ref(db),
            updates
        );


        alert(
            "✅ Geri qaytarma statusı dəyişdirildi."
        );


    }catch(error){

        alert(
            "Xəta:\n" +
            error.message
        );

    }

};


/* GERİ QAYTARMA BÖLMƏSİ */

function returnSection(
    order,
    product,
    productIndex
){

    const info =
        product.returnRequest;


    /* HƏLƏ GERİ QAYTARMA YOXDUR */

    if(!info){

        return `

        <button
            class="return-button"
            onclick="
                event.stopPropagation();
                openReturn(
                    '${order.firebaseKey}',
                    ${productIndex}
                )
            "
        >
            ↩️ Geri qaytarma
        </button>

        `;

    }


    let sendBox = "";


    /* MƏHSUL GERİ GÖNDƏRİLMƏLİDİR */

    if(
        info.status ===
        "Məhsul göndərilməlidir"
    ){

        sendBox = `

        <div class="return-box">

            <div class="return-title">
                📦 Məhsulu geri göndərin
            </div>


            <div class="return-label">

                📌 Bu şəkli çap edin
                və malın üstünə
                yapışdırın.

            </div>


            <img
                class="return-photo"
                src="geri-gonderme.jpg"
                alt="Geri göndərmə ünvanı"
            >


            <div class="return-address">

                <b>Kimdən:</b>
                Amid Həmidov

                <br>

                <b>Ünvan:</b>
                F.ƏMİROV 24

                <br>

                <b>İndeks:</b>
                AZ 1020 TƏLƏBLİ

                <br>

                <b>Tel:</b>
                0504535874

            </div>


            <button
                class="send-button"
                onclick="
                    event.stopPropagation();
                    productSent(
                        '${order.firebaseKey}',
                        ${productIndex}
                    )
                "
            >
                📦 Məhsulu göndərdim
            </button>

        </div>

        `;

    }


    return `

    <div class="return-box">

        <div class="return-title">
            ↩️ Geri qaytarma
        </div>


        <div class="reason-text">

            <b>Səbəb:</b>

            ${info.reason || ""}

        </div>


        ${returnTimeline(info)}


        ${sendBox}


        ${
            info.status ===
            "Məhsul yoldadır"
            ? `

            <div style="
                margin-top:10px;
                padding:10px;
                border-radius:10px;
                background:#e9f8ed;
                color:#16833a;
            ">

                🚚 Məhsul yoldadır.

            </div>

            `
            : ""
        }


        ${
            info.status ===
            "Məhsul satıcıya çatdı"
            ? `

            <div style="
                margin-top:10px;
                padding:10px;
                border-radius:10px;
                background:#e9f8ed;
                color:#16833a;
            ">

                📍 Məhsul satıcıya çatdı.

                <br>

                💰 Pulun geri qaytarılması başlayır.

            </div>

            `
            : ""
        }


        ${
            info.status ===
            "Pul geri qaytarılır"
            ? `

            <div style="
                margin-top:10px;
                padding:10px;
                border-radius:10px;
                background:#e9f8ed;
                color:#16833a;
            ">

                💰 Pul geri qaytarılır.

            </div>

            `
            : ""
        }


        ${
            info.status ===
            "Pul geri qaytarıldı"
            ? `

            <div style="
                margin-top:10px;
                padding:10px;
                border-radius:10px;
                background:#e9f8ed;
                color:#16833a;
            ">

                ✅ Pul geri qaytarıldı.

            </div>

            `
            : ""
        }


        ${
            isAdmin
            ? `

            <div class="admin-box">

                <div class="admin-title">
                    🔧 Geri qaytarma statusı
                </div>


                <select
                    id="return-${order.firebaseKey}-${productIndex}"
                >

                    ${returnStatuses.map(x=>`

                        <option
                            value="${x}"
                            ${
                                x === info.status
                                ? "selected"
                                : ""
                            }
                        >
                            ${x}
                        </option>

                    `).join("")}

                </select>


                <button
                    class="save-button"
                    onclick="
                        event.stopPropagation();
                        saveReturnStatus(
                            '${order.firebaseKey}',
                            ${productIndex}
                        )
                    "
                >
                    Yadda saxla
                </button>

            </div>

            `
            : ""
        }

    </div>

    `;

}


/* SİFARİŞLƏRİ GÖSTƏR */

function renderOrders(){

    const list =
        document.getElementById(
            "ordersList"
        );


    if(!orders.length){

        list.innerHTML = `

            <div class="empty">

                📦 Sifariş tapılmadı.

            </div>

        `;

        return;

    }


    list.innerHTML =
        orders.map(
            (order,index)=>{

                const status =
                    order.status ||
                    "Sifariş qəbul edildi";


                const products =
                    Array.isArray(
                        order.products
                    )
                    ? order.products
                    : Object.values(
                        order.products || {}
                    );


                const productsHtml =
                    products.map(
                        (
                            product,
                            productIndex
                        )=>{

                            const price =
                                Number(
                                    product.price || 0
                                );


                            const quantity =
                                Number(
                                    product.quantity || 1
                                );


                            return `

                            <div class="product">

                                <div class="product-main">

                                    <img
                                        src="${
                                            product.image || ""
                                        }"
                                        alt="${
                                            product.name ||
                                            "Məhsul"
                                        }"
                                        onerror="
                                            this.style.display='none'
                                        "
                                    >


                                    <div class="product-info">

                                        <div class="product-name">

                                            ${
                                                product.name ||
                                                "Məhsul"
                                            }

                                        </div>


                                        <div>

                                            💰 Qiymət:

                                            ${
                                                price.toFixed(2)
                                            }

                                            AZN

                                        </div>


                                        <div>

                                            📦 Say:

                                            ${quantity}

                                        </div>


                                        <div>

                                            💵 Məbləğ:

                                            ${
                                                (
                                                    price *
                                                    quantity
                                                ).toFixed(2)
                                            }

                                            AZN

                                        </div>

                                    </div>

                                </div>


                                ${returnSection(
                                    order,
                                    product,
                                    productIndex
                                )}

                            </div>

                            `;

                        }
                    ).join("");


                return `

                <div class="order">


                    <div
                        class="order-top"
                        onclick="
                            toggleOrder(${index})
                        "
                    >

                        <div class="order-id">

                            📦 Sifariş:

                            ${
                                order.orderId ||
                                order.id ||
                                order.firebaseKey
                            }

                        </div>


                        ${
                            isAdmin
                            ? `

                            <div class="customer">

                                👤 ${
                                    order.name ||
                                    "Müştəri"
                                }

                                <br>

                                ✉️ ${
                                    order.email ||
                                    ""
                                }

                                <br>

                                📞 ${
                                    order.phone ||
                                    ""
                                }

                            </div>

                            `
                            : ""
                        }


                        <div class="date">

                            📅 ${
                                order.date ||
                                ""
                            }

                        </div>


                        <div class="status">

                            ${status}

                        </div>


                        <span class="arrow">
                            ›
                        </span>

                    </div>


                    <div
                        class="details"
                        id="details-${index}"
                    >

                        ${orderTimeline(status)}


                        ${productsHtml}


                        <div class="total">

                            💰 Cəmi:

                            ${
                                Number(
                                    order.total || 0
                                ).toFixed(2)
                            }

                            AZN

                        </div>


                        ${
                            order.trackingCode
                            ? `

                            <div class="tracking">

                                🚚 İzləmə kodu:

                                <b>
                                    ${
                                        order.trackingCode
                                    }
                                </b>

                            </div>

                            `
                            : ""
                        }


                        ${
                            order.address
                            ? `

                            <div class="tracking">

                                📍 Ünvan:

                                ${
                                    order.address
                                }

                            </div>

                            `
                            : ""
                        }


                        ${
                            isAdmin
                            ? `

                            <div class="admin-box">

                                <div class="admin-title">

                                    🔧 Sifariş statusunu dəyiş

                                </div>


                                <select
                                    id="status-${order.firebaseKey}"
                                >

                                    ${orderStatuses.map(
                                        x=>`

                                        <option
                                            value="${x}"
                                            ${
                                                x === status
                                                ? "selected"
                                                : ""
                                            }
                                        >
                                            ${x}
                                        </option>

                                    `
                                    ).join("")}

                                </select>


                                <button
                                    class="save-button"
                                    onclick="
                                        event.stopPropagation();
                                        saveStatus(
                                            '${order.firebaseKey}'
                                        )
                                    "
                                >
                                    Sifariş statusunu yadda saxla
                                </button>

                            </div>

                            `
                            : ""
                        }

                    </div>

                </div>

                `;

            }
        ).join("");

}


/* FIREBASE-DƏN SİFARİŞLƏR */

const ordersRef =
    ref(
        db,
        "orders"
    );


onValue(

    ordersRef,

    snapshot => {

        const data =
            snapshot.val();


        orders = [];


        if(data){

            Object.entries(data).forEach(
                ([key,value])=>{

                    if(!value)
                        return;


                    const order = {

                        ...value,

                        firebaseKey:
                            key

                    };


                    if(

                        isAdmin ||

                        String(
                            order.email || ""
                        )
                        .toLowerCase()
                        .trim()
                        ===
                        currentEmail

                    ){

                        orders.push(
                            order
                        );

                    }

                }
            );

        }


        orders.sort(

            (a,b)=>
                Number(
                    b.createdAt || 0
                )
                -
                Number(
                    a.createdAt || 0
                )

        );


        renderOrders();

    },


    error => {

        document.getElementById(
            "ordersList"
        ).innerHTML = `

            <div class="error">

                ❌ Sifarişləri yükləmək olmadı.

                <br><br>

                <b>Firebase xətası:</b>

                <br>

                ${error.message}

            </div>

        `;

    }

);

</script>
