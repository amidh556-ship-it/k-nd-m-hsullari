<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sifarişlərim</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

h1{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-top:0;
}

.order{
    background:white;
    border-radius:12px;
    margin-bottom:15px;
    overflow:hidden;
}

.order-top{
    padding:15px;
    cursor:pointer;
}

.order-id{
    font-weight:bold;
    font-size:17px;
}

.status{
    margin-top:7px;
    color:#2e7d32;
    font-weight:bold;
}

.arrow{
    float:right;
    font-size:20px;
}

.details{
    display:none;
    padding:15px;
    border-top:1px solid #eee;
}

.product{
    display:flex;
    gap:10px;
    padding:10px 0;
}

.product img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
}

.product-info{
    flex:1;
}

.total{
    font-size:19px;
    font-weight:bold;
    margin-top:10px;
}

.tracking{
    background:#f1f8e9;
    padding:12px;
    border-radius:8px;
    margin-top:12px;
}

.tracking-code{
    font-weight:bold;
    margin-top:5px;
}

.timeline{
    margin-top:18px;
}

.step{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-bottom:16px;
}

.circle{
    width:22px;
    height:22px;
    border-radius:50%;
    background:#ddd;
    flex-shrink:0;
}

.step.active .circle{
    background:#2e7d32;
}

.step-text{
    font-size:15px;
}

.step.active .step-text{
    color:#2e7d32;
    font-weight:bold;
}

.empty{
    background:white;
    padding:35px 15px;
    border-radius:12px;
    text-align:center;
}

.login{
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    padding:20px;
    color:#222;
    text-decoration:none;
}

.date{
    color:#777;
    font-size:14px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📦 Sifarişlərim</h1>

<div id="orders"></div>

<a class="back" href="index.html">
← Alış-verişə qayıt
</a>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey: "BURAYA_API_KEY",

    authDomain:
        "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
        "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
        "kendmehsullari-6a53d",

    storageBucket:
        "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
        "BURAYA_MESSAGING_SENDER_ID",

    appId:
        "BURAYA_APP_ID"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* =========================
   HESAB
========================= */

function getAccountKey(){

    const email =
        localStorage.getItem(
            "userEmail"
        );

    if(!email){
        return null;
    }

    return email
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]/g,
            "_"
        );
}


const accountKey =
    getAccountKey();


/* =========================
   STATUSLAR
========================= */

const statuses = [

    "Sifariş qəbul edildi",

    "Hazırlanır",

    "Yola verildi",

    "Çatdırılır",

    "Çatdırıldı"

];


function getStatusIndex(status){

    if(!status){
        return 0;
    }

    const s =
        status.toLowerCase();

    if(
        s.includes("çatdırıldı")
    ){
        return 4;
    }

    if(
        s.includes("çatdırılır")
    ){
        return 3;
    }

    if(
        s.includes("yola") ||
        s.includes("yoldadır")
    ){
        return 2;
    }

    if(
        s.includes("hazırlanır") ||
        s.includes("hazırlanıb")
    ){
        return 1;
    }

    return 0;
}


/* =========================
   SİFARİŞLƏRİ GÖSTƏR
========================= */

function showOrders(orders){

    const box =
        document.getElementById(
            "orders"
        );

    box.innerHTML = "";


    if(!orders){

        box.innerHTML = `

            <div class="empty">

                📦 Hələ sifarişin yoxdur.

            </div>

        `;

        return;
    }


    const list =
        Object.values(orders);


    if(list.length === 0){

        box.innerHTML = `

            <div class="empty">

                📦 Hələ sifarişin yoxdur.

            </div>

        `;

        return;
    }


    list
    .reverse()
    .forEach(function(order,index){

        const currentStatus =
            order.status ||
            "Sifariş qəbul edildi";


        const statusIndex =
            getStatusIndex(
                currentStatus
            );


        let productsHTML = "";


        const products =
            order.products || [];


        products.forEach(function(item){

            const quantity =
                Number(
                    item.quantity
                ) || 1;


            const price =
                Number(
                    item.price
                ) || 0;


            productsHTML += `

                <div class="product">

                    <img
                        src="${item.image || ''}"
                        alt="Məhsul"
                    >

                    <div class="product-info">

                        <b>
                            ${item.name || "Məhsul"}
                        </b>

                        <br>

                        ${quantity} ədəd

                        <br>

                        ${price.toFixed(2)}
                        AZN / ədəd

                    </div>

                </div>

            `;

        });


        let timelineHTML = "";


        statuses.forEach(
            function(status,i){

                const active =
                    i <= statusIndex
                    ? "active"
                    : "";


                timelineHTML += `

                    <div class="step ${active}">

                        <div class="circle"></div>

                        <div class="step-text">

                            ${status}

                        </div>

                    </div>

                `;

            }
        );


        box.innerHTML += `

            <div class="order">

                <div
                    class="order-top"
                    onclick="
                        toggleOrder(${index})
                    "
                >

                    <span class="arrow">
                        ▼
                    </span>

                    <div class="order-id">

                        📦
                        ${
                            order.orderId ||
                            "Sifariş"
                        }

                    </div>

                    <div class="status">

                        ${currentStatus}

                    </div>

                </div>


                <div
                    class="details"
                    id="details-${index}"
                >

                    ${productsHTML}


                    <div class="total">

                        Ümumi:

                        ${
                            Number(
                                order.total || 0
                            ).toFixed(2)
                        }

                        AZN

                    </div>


                    <div class="tracking">

                        <b>
                            📍 İzləmə kodu
                        </b>

                        <div class="tracking-code">

                            ${
                                order.trackingCode ||
                                "Hazırlanır"
                            }

                        </div>

                    </div>


                    <div class="timeline">

                        <b>
                            📦 Sifarişin vəziyyəti
                        </b>

                        <br><br>

                        ${timelineHTML}

                    </div>


                    <div class="date">

                        📅
                        ${
                            order.date || ""
                        }

                    </div>

                </div>

            </div>

        `;

    });

}


/* =========================
   AÇ / BAĞLA
========================= */

window.toggleOrder =
function(index){

    const details =
        document.getElementById(
            "details-" + index
        );


    if(!details){
        return;
    }


    if(
        details.style.display ===
        "block"
    ){

        details.style.display =
            "none";

    }else{

        details.style.display =
            "block";

    }

};


/* =========================
   GİRİŞ YOXLAMASI
========================= */

if(!accountKey){

    document.getElementById(
        "orders"
    ).innerHTML = `

        <div class="login">

            🔐 Sifarişlərini görmək üçün
            hesabına giriş et.

        </div>

    `;

}else{

    /* =====================
       FIREBASE-DƏN CANLI OXU
    ===================== */

    const ordersRef =
        ref(
            db,
            "orders/" + accountKey
        );


    onValue(
        ordersRef,
        function(snapshot){

            const data =
                snapshot.val();

            showOrders(data);

        },
        function(error){

            console.error(error);

            document.getElementById(
                "orders"
            ).innerHTML = `

                <div class="empty">

                    ❌ Sifarişlər yüklənmədi.

                </div>

            `;

        }
    );

}

</script>

</body>
</html>
