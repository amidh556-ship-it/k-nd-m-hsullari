<!DOCTYPE html>
<html lang="az">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sifariş et</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        .box {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-top: 6px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .product {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        .order-button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 9px;
            background: #2e7d32;
            color: white;
            font-size: 17px;
            font-weight: bold;
            margin-top: 15px;
        }

        .back {
            display: block;
            text-align: center;
            padding: 20px;
            color: #222;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="box">

        <h1>📦 Sifariş et</h1>

        <div id="products"></div>

        <div class="total">

            Ümumi:
            <span id="total">0</span>
            AZN

        </div>

    </div>


    <div class="box">

        <h2>👤 Çatdırılma məlumatları</h2>


        <label>
            Ad və soyad
        </label>

        <input
            type="text"
            id="fullName"
            placeholder="Adınız və soyadınız"
        >


        <label>
            Telefon
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="050 000 00 00"
        >


        <label>
            Çatdırılma ünvanı
        </label>

        <textarea
            id="address"
            placeholder="Ünvanınızı yazın"
        ></textarea>


        <button
            class="order-button"
            onclick="createOrder()"
        >

            ✅ Sifarişi təsdiqlə

        </button>

    </div>


    <a
        class="back"
        href="sebet.html"
    >

        ← Səbətə qayıt

    </a>


</div>


<script>


/*
================================
SƏBƏTİ GÖTÜR
================================
*/

function getCart() {

    try {

        return JSON.parse(
            localStorage.getItem("cart")
        ) || [];

    } catch (e) {

        return [];

    }

}


/*
================================
SƏBƏTDƏKİ MƏHSULLARI GÖSTƏR
================================
*/

function showProducts() {

    const cart =
        getCart();

    const box =
        document.getElementById("products");

    const totalBox =
        document.getElementById("total");


    box.innerHTML = "";

    let total = 0;


    if (cart.length === 0) {

        box.innerHTML =
            "<p>Səbət boşdur.</p>";

        totalBox.innerText = "0";

        return;

    }


    cart.forEach(function(item) {

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;

        total +=
            price * quantity;


        box.innerHTML += `

            <div class="product">

                <b>
                    ${item.name}
                </b>

                <br>

                Say:
                ${quantity}

                <br>

                ${price.toFixed(2)} AZN × ${quantity}

            </div>

        `;

    });


    totalBox.innerText =
        total.toFixed(2);

}


/*
================================
SİFARİŞ YARAT
================================
*/

function createOrder() {

    const cart =
        getCart();


    if (cart.length === 0) {

        alert(
            "❌ Səbət boşdur."
        );

        return;

    }


    const fullName =
        document
        .getElementById("fullName")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const address =
        document
        .getElementById("address")
        .value
        .trim();


    if (
        fullName === "" ||
        phone === "" ||
        address === ""
    ) {

        alert(
            "❌ Ad, telefon və ünvanı doldur."
        );

        return;

    }


    /*
    ÜMUMİ MƏBLƏĞ
    */

    let total = 0;


    cart.forEach(function(item) {

        total +=
            Number(item.price) *
            Number(item.quantity);

    });


    /*
    SİFARİŞ OBYEKTİ
    */

    const order = {

        id:
            Date.now(),

        date:
            new Date().toLocaleString("az-AZ"),

        userName:
            localStorage.getItem("userName") || fullName,

        userEmail:
            localStorage.getItem("userEmail") || "",

        fullName:
            fullName,

        phone:
            phone,

        address:
            address,

        products:
            cart,

        total:
            total,

        status:
            "Yeni sifariş"

    };


    /*
    KÖHNƏ SİFARİŞLƏR
    */

    let orders = [];


    try {

        orders =
            JSON.parse(
                localStorage.getItem("orders")
            ) || [];

    } catch (e) {

        orders = [];

    }


    /*
    YENİ SİFARİŞİ ƏLAVƏ ET
    */

    orders.push(order);


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    /*
    SƏBƏTİ BOŞALT
    */

    localStorage.removeItem("cart");


    alert(
        "✅ Sifarişiniz qəbul edildi!"
    );


    /*
    SİFARİŞLƏRİMƏ GET
    */

    window.location.href =
        "orders.html";

}


showProducts();

</script>


</body>

</html>
