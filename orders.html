<!DOCTYPE html>
<html lang="az">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sifarişlərim - Kənd məhsulları</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.header{
    background:white;
    padding:18px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #ddd;
    position:sticky;
    top:0;
    z-index:10;
}

.header h2{
    margin:0;
    font-size:22px;
}

.back{
    text-decoration:none;
    color:#111;
    font-size:25px;
}

#loading{
    text-align:center;
    padding:40px 20px;
    color:#777;
}

.order{
    background:white;
    margin:14px;
    padding:15px;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.order-number{
    font-weight:bold;
}

.order-date{
    color:#777;
    font-size:13px;
}

.product{
    display:flex;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.product:last-child{
    border-bottom:0;
}

.product img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:10px;
    background:#eee;
}

.product-info{
    flex:1;
}

.product-name{
    font-size:17px;
    font-weight:bold;
    margin-bottom:5px;
}

.product-price{
    color:#555;
    margin-bottom:8px;
}

.status{
    padding:8px 12px;
    border-radius:20px;
    background:#eaf7e8;
    color:#16851d;
    font-size:13px;
    display:inline-block;
}

.timeline{
    margin-top:15px;
    padding:12px;
    background:#fafafa;
    border-radius:12px;
}

.step{
    padding:8px 0;
    color:#aaa;
}

.step.active{
    color:#16851d;
    font-weight:bold;
}

.total{
    font-size:18px;
    font-weight:bold;
    margin-top:14px;
}

.return-button{
    width:100%;
    margin-top:12px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#111;
