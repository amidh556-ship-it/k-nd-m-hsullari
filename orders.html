<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sifarişlərim</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        h1 {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .order {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .order-number {
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            display: inline-block;
            margin-top: 8px;
            padding: 7px 10px;
            border-radius: 7px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
        }

        .customer {
            margin-top: 12px;
            line-height: 1.7;
        }

        .product {
            display: flex;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .product img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-info {
            flex: 1;
        }

        .total {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .empty {
            background: white;
            padding: 35px 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
        }

        .back {
            display: block;
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            color: #222;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📦 Sifarişlərim</h1>

    <div id="orders"></div>

    <a
        class="back"
        href="index.html"
    >
        ← Alış-verişə qayıt
    </a>

</div>


<script>

function showOrders() {

    const box =
        document.getElementById("orders");

    let orders = [];

    try {

        orders =
            JSON.parse(
                localStorage.getItem("orders")
            ) || [];

    } catch (error) {

        orders = [];

    }


    box.innerHTML = "";


    if (orders.length === 0) {

        box.innerHTML = `
            <div class="empty">
                📦 Hələ sifarişiniz yoxdur.
            </div>
        `;

        return;
    }


    /* ƏN SON SİFARİŞ YUXARIDA */

    orders.reverse();


    orders.forEach(function(order) {

        let productsHTML = "";


        if (
            order.products &&
            order.products.length > 0
        ) {

            order.products.forEach(function(item) {

                const quantity =
                    Number(item.quantity) || 1;

                const price =
                    Number(item.price) || 0;


                productsHTML += `

                    <div class="product">

                        <img
                            src="${item.image || ''}"
                            alt="${item.name || 'Məhsul'}"
                        >

                        <div class="product-info">

                            <b>
                                ${item.name || 'Məhsul'}
                            </b>

                            <br>

                            Say:
                            ${quantity}

                            <br>

                            ${price.toFixed(2)} AZN / ədəd

                        </div>

                    </div>

                `;

            });

        }


        box.innerHTML += `

            <div class="order">

                <div class="order-number">
                    📦 ${order.orderId || "Sifariş"}
                </div>

                <div class="status">
                    ${order.status || "Sifariş qəbul edildi"}
                </div>

                <div class="customer">

                    👤 ${order.name || ""}

                    <br>

                    📞 ${order.phone || ""}

                    <br>

                    📍 ${order.address || ""}

                    <br>

                    🕒 ${order.date || ""}

                </div>

                ${productsHTML}

                <div class="total">

                    Ümumi:
                    ${Number(order.total || 0).toFixed(2)}
                    AZN

                </div>

            </div>

        `;

    });

}


showOrders();

</script>

</body>
</html>
