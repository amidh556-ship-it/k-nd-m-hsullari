<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sifarişlərim - Kənd məhsulları</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
.header{background:white;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.header h2{margin:0;font-size:22px}
.back{text-decoration:none;color:#111;font-size:25px}
#loading{text-align:center;padding:40px 20px;color:#777}
.order{background:white;margin:14px;padding:15px;border-radius:15px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.order-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}
.order-number{font-weight:bold}
.order-date{color:#777;font-size:13px}
.product{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eee}
.product:last-child{border-bottom:0}
.product img{width:80px;height:80px;object-fit:cover;border-radius:10px;background:#eee}
.product-info{flex:1;min-width:0}
.product-name{font-size:17px;font-weight:bold;margin-bottom:5px}
.product-price{color:#555;margin-bottom:8px}
.status{padding:8px 12px;border-radius:20px;background:#eaf7e8;color:#16851d;font-size:13px;display:inline-block}
.timeline{margin-top:15px;padding:12px;background:#fafafa;border-radius:12px}
.step{padding:8px 0;color:#aaa}
.step.active{color:#16851d;font-weight:bold}
.total{font-size:18px;font-weight:bold;margin-top:14px}
.return-button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:#111;color:white;font-size:16px}
.wait-return{margin-top:12px;padding:12px;background:#f3f3f3;border-radius:10px;color:#666;font-size:14px;line-height:1.5}
.admin-box{margin-top:15px;padding:14px;background:#fff5d8;border-radius:12px}
.admin-box b{display:block;margin-bottom:8px}
.admin-box select,.admin-box input{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;margin-top:7px;font-size:15px}
.save-button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:8px;background:#16851d;color:white;font-size:15px;font-weight:bold}
.tracking-box{margin-top:12px;padding:12px;background:#f1f7ff;border-radius:10px;border:1px solid #dbeaff}
.tracking-title{font-weight:bold;margin-bottom:5px}
.tracking-code{font-size:17px;font-weight:bold;color:#145db2;word-break:break-all}
.return-status{margin-top:12px;padding:12px;background:#f2f2f2;border-radius:10px;overflow-wrap:anywhere}
.return-status b{display:block;margin-bottom:5px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;overflow-y:auto;padding:20px}
.modal-box{background:white;max-width:600px;margin:20px auto;border-radius:20px;padding:20px;position:relative}
.close{position:absolute;right:15px;top:15px;width:45px;height:45px;border:0;border-radius:50%;background:#eee;font-size:25px}
.modal-title{font-size:25px;font-weight:bold;margin-bottom:20px;padding-right:50px}
.return-product{display:flex;align-items:center;gap:12px;background:#f7f7f7;padding:12px;border-radius:15px;margin-bottom:20px}
.return-product img{width:120px;height:100px;object-fit:cover;border-radius:12px}
.reason-title{font-size:22px;font-weight:bold;margin:18px 0 10px}
.reason{border:1px solid #ddd;padding:16px;margin:10px 0;border-radius:14px;font-size:17px;cursor:pointer;display:block}
.reason input{margin-right:10px;width:20px;height:20px}
.extra{width:100%;min-height:120px;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px;resize:vertical;margin-top:12px}
.submit-return{width:100%;padding:15px;border:0;border-radius:12px;background:#111;color:white;font-size:17px;margin-top:12px}
.print-text{text-align:center;font-size:17px;font-weight:bold;margin:10px 0 15px}
.return-label{display:block;width:100%;max-width:450px;margin:0 auto 18px;border-radius:10px;border:1px solid #ddd;background:#000}
.address-box{background:#f5f5f5;padding:16px;border-radius:12px;line-height:1.8;font-size:16px;overflow-wrap:anywhere}
.send-button{width:100%;padding:15px;margin-top:15px;border:0;border-radius:12px;background:#16851d;color:white;font-size:17px;font-weight:bold}
.return-message{padding:14px;margin-top:12px;background:#eaf7e8;border-radius:12px;color:#16851d;font-weight:bold}
.empty{text-align:center;padding:60px 20px;color:#777}
</style>
</head>

<body>
<div class="header">
    <a class="back" href="index.html">←</a>
    <h2>Sifarişlərim</h2>
    <div style="width:25px"></div>
</div>

<div id="loading">Sifarişlər yoxlanılır...</div>
<div id="orders"></div>

<div id="returnModal" class="modal">
    <div class="modal-box">
        <button class="close" onclick="closeReturn()">×</button>
        <div id="modalTitle" class="modal-title">↩️ Geri qaytarma</div>
        <div id="returnContent"></div>
    </div>
</div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase, ref, onValue, update, push
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey:"AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",
    authDomain:"kendmehsullari-6a53d.firebaseapp.com",
    databaseURL:"https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",
    projectId:"kendmehsullari-6a53d",
    storageBucket:"kendmehsullari-6a53d.firebasestorage.app",
    messagingSenderId:"551607499773",
    appId:"1:551607499773:web:a84aa63dc5b55c38687794"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ADMIN_EMAIL = "amid.h556@gmail.com";
const currentEmail = (localStorage.getItem("userEmail") || "").toLowerCase().trim();
const isAdmin = currentEmail === ADMIN_EMAIL;
const ordersRef = ref(db,"orders");

let allOrders = {};

const RETURN_WAIT = 72 * 60 * 60 * 1000;

const orderStatuses = [
    "Məhsul yığılır",
    "Hazırdır",
    "Yoldadır",
    "Çatdırılır",
    "Çatdırıldı"
];

const returnStatuses = [
    "Sorğu qəbul edildi",
    "Məhsul göndərilməlidir",
    "Məhsul yoldadır",
    "Məhsul satıcıya çatdı",
    "Pul geri qaytarılır",
    "Pul geri qaytarıldı"
];

/* SİFARİŞİN YARADILMA VAXTINI OXU */
function getOrderTime(order) {
    const values = [
        order.createdAt,
        order.timestamp,
        order.createdAtMs,
        order.date
    ];

    for (const value of values) {
        if (value === undefined || value === null || value === "") continue;

        let time;

        if (typeof value === "number" || /^\d+$/.test(String(value))) {
            time = Number(value);

            if (time > 0 && time < 1000000000000) {
                time *= 1000;
            }
        } else {
            time = Date.parse(String(value));
        }

        if (Number.isFinite(time) && time > 0) return time;
    }

    return null;
}

/* 72 SAAT TAMAM OLMALIDIR */
function sifarisUcGunTamamdir(order) {
    const vaxt = getOrderTime(order);

    if (vaxt === null) return false;

    return Date.now() >= vaxt + RETURN_WAIT;
}

onValue(ordersRef, function(snapshot) {
    allOrders = snapshot.val() || {};
    renderOrders(allOrders);
}, function(error) {
    console.error(error);
    document.getElementById("loading").textContent =
        "Sifarişləri yükləmək mümkün olmadı.";
});

function renderOrders(data) {
    const container = document.getElementById("orders");
    const loading = document.getElementById("loading");

    container.innerHTML = "";

    let entries = Object.entries(data);

    if (!isAdmin) {
        entries = entries.filter(function(item) {
            const email = String(item[1]?.email || "").toLowerCase().trim();
            return currentEmail !== "" && email === currentEmail;
        });
    }

    loading.style.display = "none";

    if (entries.length === 0) {
        container.innerHTML = `
            <div class="empty">🛒<br><br>Hələ sifariş yoxdur.</div>
        `;
        return;
    }

    entries.reverse();

    entries.forEach(function(item) {
        container.insertAdjacentHTML(
            "beforeend",
            createOrder(item[0], item[1])
        );
    });
}

function createOrder(firebaseKey, order) {
    const products = Array.isArray(order.products)
        ? order.products
        : Object.values(order.products || {});

    let orderStatus = order.status || "Məhsul yığılır";

    if (orderStatus === "Sifariş qəbul edildi") {
        orderStatus = "Məhsul yığılır";
    }

    let productsHTML = "";

    products.forEach(function(product, index) {
        const name = product.name || product.title || "Məhsul";
        const image = product.image || product.img || "";
        const price = product.price ?? "0";
        const quantity = Number(product.quantity || 1);
        const returnRequest = product.returnRequest || null;

        let returnHTML = "";

        if (returnRequest) {
            returnHTML = returnInfo(firebaseKey, index, returnRequest);
        } else if (sifarisUcGunTamamdir(order)) {
            returnHTML = `
                <button class="return-button"
                    onclick="openReturn('${firebaseKey}',${index})">
                    ↩️ Geri qaytar
                </button>
            `;
        } else {
            returnHTML = `
                <div class="wait-return">
                    🕒 Geri qaytarma sifariş vaxtından 3 gün
                    (72 saat) keçdikdən sonra açılacaq.
                </div>
            `;
        }

        productsHTML += `
            <div class="product">
                <img src="${escapeHTML(image)}"
                     onerror="this.style.display='none'" alt="">
                <div class="product-info">
                    <div class="product-name">${escapeHTML(name)}</div>
                    <div class="product-price">
                        ${escapeHTML(String(price))} AZN × ${quantity}
                    </div>
                    <div class="status">
                        ${escapeHTML(returnRequest
                            ? returnRequest.status || "Geri qaytarma"
                            : orderStatus)}
                    </div>
                    ${returnHTML}
                </div>
            </div>
        `;
    });

    const total = order.total ?? order.totalPrice ?? order.amount ?? "0";

    let trackingHTML = "";

    if (order.trackingCode) {
        trackingHTML = `
            <div class="tracking-box">
                <div class="tracking-title">📦 İzləmə kodu</div>
                <div class="tracking-code">
                    ${escapeHTML(String(order.trackingCode))}
                </div>
            </div>
        `;
    }

    let adminHTML = "";

    if (isAdmin) {
        adminHTML = `
            <div class="admin-box">
                <b>⚙️ Sifariş idarəsi</b>
                <label>Status</label>
                <select id="status-${firebaseKey}">
                    ${orderStatuses.map(function(s) {
                        return `<option value="${s}" ${s === orderStatus ? "selected" : ""}>
                            ${s}
                        </option>`;
                    }).join("")}
                </select>

                <label style="display:block;margin-top:10px">📦 İzləmə kodu</label>
                <input type="text" id="tracking-${firebaseKey}"
                    value="${escapeHTML(String(order.trackingCode || ""))}"
                    placeholder="İzləmə kodunu yazın">

                <button class="save-button"
                    onclick="sendOrder('${firebaseKey}')">📤 Göndər</button>

                <button class="save-button" style="background:#555"
                    onclick="saveOrderStatus('${firebaseKey}')">
                    Statusu yalnız yadda saxla
                </button>
            </div>
        `;
    }

    const currentStep = orderStatuses.indexOf(orderStatus);

    return `
        <div class="order">
            <div class="order-top">
                <div>
                    <div class="order-number">📦 Sifariş</div>
                    <div class="order-date">
                        ${escapeHTML(String(order.date || order.createdAt || ""))}
                    </div>
                </div>
                <div class="status">${escapeHTML(orderStatus)}</div>
            </div>

            <div class="timeline">
                ${orderStatuses.map(function(s, i) {
                    const active = currentStep >= 0 && i <= currentStep;
                    return `<div class="step ${active ? "active" : ""}">
                        ${active ? "✓" : "○"} ${s}
                    </div>`;
                }).join("")}
            </div>

            ${trackingHTML}
            ${productsHTML}

            <div class="total">
                Cəmi: ${escapeHTML(String(total))} AZN
            </div>

            ${adminHTML}
        </div>
    `;
}

/* SİFARİŞİ GÖNDƏR */
window.sendOrder = async function(firebaseKey) {
    if (!isAdmin) {
        alert("Bu əməliyyat yalnız admin üçündür.");
        return;
    }

    const statusSelect = document.getElementById("status-" + firebaseKey);
    const trackingInput = document.getElementById("tracking-" + firebaseKey);

    if (!statusSelect || !trackingInput) {
        alert("Məlumat sahəsi tapılmadı.");
        return;
    }

    const selectedStatus = statusSelect.value;
    const trackingCode = trackingInput.value.trim();

    if (selectedStatus === "Hazırdır" && !trackingCode) {
        alert("Zəhmət olmasa izləmə kodunu yazın.");
        return;
    }

    try {
        await update(ref(db, "orders/" + firebaseKey), {
            status: selectedStatus,
            trackingCode: trackingCode,
            trackingSent: true,
            trackingSentAt: new Date().toISOString()
        });

        alert("✅ Sifariş məlumatları yadda saxlanıldı.");
    } catch (error) {
        console.error(error);
        alert("❌ Sifariş göndərilmədi.");
    }
};

window.saveOrderStatus = async function(firebaseKey) {
    if (!isAdmin) {
        alert("Bu əməliyyat yalnız admin üçündür.");
        return;
    }

    const select = document.getElementById("status-" + firebaseKey);
    if (!select) return;

    try {
        await update(ref(db, "orders/" + firebaseKey), {
            status: select.value
        });
        alert("Sifariş statusu yadda saxlanıldı.");
    } catch (error) {
        console.error(error);
        alert("Status yadda saxlanmadı.");
    }
};

/* GERİ QAYTARMA MƏLUMATI */
function returnInfo(firebaseKey, productIndex, info) {
    const status = info.status || "Sorğu qəbul edildi";

    let html = `
        <div class="return-status">
            <b>↩️ Geri qaytarma</b>
            Status: ${escapeHTML(status)}
    `;

    if (info.reason) {
        html += `<br>Səbəb: ${escapeHTML(info.reason)}`;
    }

    if (status === "Məhsul göndərilməlidir") {
        html += `
            <div style="margin-top:15px;padding-top:15px;border-top:1px solid #ddd">
                <b style="display:block;text-align:center;font-size:16px;margin-bottom:12px">
                    🖨️ Şəkili çap edin və malın üstünə vurun.
                </b>
                <img src="geri-gonderme.jpg" class="return-label"
                    alt="Geri qaytarma etiketi">

                <div class="address-box">
                    <b>Kimdən:</b> Amid Həmidov<br>
                    <b>Ünvan:</b> F.ƏMİROV 24<br>
                    <b>İndeks:</b> AZ 1020 TƏLƏBLİ<br>
                    <b>Tel:</b> 0504535874
                </div>

                <button class="send-button"
                    onclick="productSent('${firebaseKey}',${productIndex})">
                    📦 Məhsulu göndərdim
                </button>
            </div>
        `;
    }

    if (status === "Məhsul yoldadır") {
        html += `<div class="return-message">📦 Məhsul yoldadır.<br><br>Satıcı məhsulu gözləyir.</div>`;
    }

    if (status === "Məhsul satıcıya çatdı") {
        html += `<div class="return-message">📦 Məhsul satıcıya çatdı.</div>`;
    }

    if (status === "Pul geri qaytarılır") {
        html += `<div class="return-message">💰 Pul geri qaytarılır.</div>`;
    }

    if (status === "Pul geri qaytarıldı") {
        html += `<div class="return-message">✅ Pul geri qaytarıldı.</div>`;
    }

    if (isAdmin) {
        html += `
            <select id="return-${firebaseKey}-${productIndex}"
                style="width:100%;padding:10px;margin-top:12px;border-radius:8px;border:1px solid #ccc">
                ${returnStatuses.map(function(s) {
                    return `<option value="${s}" ${s === status ? "selected" : ""}>${s}</option>`;
                }).join("")}
            </select>

            <button class="save-button"
                onclick="saveReturnStatus('${firebaseKey}',${productIndex})">
                Geri qaytarma statusunu yadda saxla
            </button>
        `;
    }

    html += `</div>`;
    return html;
}

/* GERİ QAYTARMA PƏNCƏRƏSİ */
window.openReturn = function(firebaseKey, productIndex) {
    const order = allOrders[firebaseKey];
    if (!order) return;

    if (!sifarisUcGunTamamdir(order)) {
        alert("Geri qaytarmaq üçün sifarişdən 3 gün (72 saat) keçməlidir.");
        return;
    }

    const products = Array.isArray(order.products)
        ? order.products
        : Object.values(order.products || {});

    const product = products[productIndex];
    if (!product) return;

    const image = product.image || product.img || "";

    document.getElementById("modalTitle").textContent = "↩️ Geri qaytarma";

    document.getElementById("returnContent").innerHTML = `
        <div class="return-product">
            <img src="${escapeHTML(image)}"
                 onerror="this.style.display='none'" alt="">
            <div>
                <b style="font-size:20px">
                    ${escapeHTML(String(product.name || product.title || "Məhsul"))}
                </b>
                <br><br>Geri qaytarma səbəbi
            </div>
        </div>

        <div class="reason-title">Səbəbi seçin:</div>

        <label class="reason"><input type="radio" name="returnReason" value="Məhsul zədəlidir"> Məhsul zədəlidir</label>
        <label class="reason"><input type="radio" name="returnReason" value="Məhsul sınıq gəlib"> Məhsul sınıq gəlib</label>
        <label class="reason"><input type="radio" name="returnReason" value="Səhv məhsul göndərilib"> Səhv məhsul göndərilib</label>
        <label class="reason"><input type="radio" name="returnReason" value="Məhsulu bəyənmədim"> Məhsulu bəyənmədim</label>
        <label class="reason"><input type="radio" name="returnReason" value="Məhsul təsvirə uyğun deyil"> Məhsul təsvirə uyğun deyil</label>
        <label class="reason"><input type="radio" name="returnReason" value="Məhsul işləmir"> Məhsul işləmir</label>
        <label class="reason"><input type="radio" name="returnReason" value="Başqa səbəb"> Başqa səbəb</label>

        <textarea id="extraReason" class="extra" placeholder="Əlavə məlumat..."></textarea>

        <button class="submit-return"
            onclick="submitReturn('${firebaseKey}',${productIndex})">
            Davam et
        </button>
    `;

    document.getElementById("returnModal").style.display = "block";
};

/* GERİ QAYTARMA MÜRACİƏTİ YARAT */
window.submitReturn = async function(firebaseKey, productIndex) {
    const order = allOrders[firebaseKey];

    if (!order) {
        alert("Sifariş tapılmadı.");
        return;
    }

    if (!sifarisUcGunTamamdir(order)) {
        alert("Geri qaytarmaq üçün sifarişdən 3 gün (72 saat) keçməlidir.");
        closeReturn();
        return;
    }

    const email = String(order.email || "").toLowerCase().trim();

    if (!isAdmin && (!currentEmail || email !== currentEmail)) {
        alert("Bu sifariş üçün müraciət edə bilməzsiniz.");
        return;
    }

    const products = Array.isArray(order.products)
        ? order.products
        : Object.values(order.products || {});

    const product = products[productIndex];

    if (!product) {
        alert("Məhsul tapılmadı.");
        return;
    }

    if (product.returnRequest) {
        alert("Bu məhsul üçün artıq geri qaytarma müraciəti var.");
        return;
    }

    const selected = document.querySelector('input[name="returnReason"]:checked');

    if (!selected) {
        alert("Zəhmət olmasa səbəb seçin.");
        return;
    }

    const extra = document.getElementById("extraReason")?.value.trim() || "";

    const request = {
        status: "Məhsul göndərilməlidir",
        reason: selected.value,
        extra: extra,
        productName: product.name || product.title || "Məhsul",
        email: order.email || currentEmail,
        createdAt: new Date().toISOString()
    };

    const updates = {};
    const productPath = "orders/" + firebaseKey + "/products/" + productIndex + "/returnRequest";
    updates[productPath] = request;

    const newRequestRef = push(ref(db, "returnRequests"));
    updates["returnRequests/" + newRequestRef.key] = {
        ...request,
        orderKey: firebaseKey,
        productIndex: productIndex
    };

    try {
        await update(ref(db), updates);

        document.getElementById("modalTitle").textContent = "📦 Məhsulu geri göndərin";

        document.getElementById("returnContent").innerHTML = `
            <div class="print-text">🖨️ Şəkili çap edin və malın üstünə vurun.</div>

            <img src="geri-gonderme.jpg" class="return-label"
                alt="Geri göndərmə etiketi"
                onerror="this.style.display='none';document.getElementById('imageError').style.display='block'">

            <div id="imageError" style="display:none;background:#ffeaea;color:#b00000;padding:12px;border-radius:10px;margin-bottom:12px;text-align:center">
                ⚠️ geri-gonderme.jpg faylı tapılmadı.
            </div>

            <div class="address-box">
                <b>Kimdən:</b> Amid Həmidov<br>
                <b>Ünvan:</b> F.ƏMİROV 24<br>
                <b>İndeks:</b> AZ 1020 TƏLƏBLİ<br>
                <b>Tel:</b> 0504535874
            </div>

            <button class="send-button"
                onclick="productSent('${firebaseKey}',${productIndex})">
                📦 Məhsulu göndərdim
            </button>
        `;

    } catch (error) {
        console.error(error);
        alert("Xəta baş verdi. Yenidən cəhd edin.");
    }
};

/* MÜŞTƏRİ MƏHSULU GÖNDƏRDİ */
window.productSent = async function(firebaseKey, productIndex) {
    const order = allOrders[firebaseKey];

    if (!order) {
        alert("Sifariş tapılmadı.");
        return;
    }

    const products = Array.isArray(order.products)
        ? order.products
        : Object.values(order.products || {});

    if (!products[productIndex]?.returnRequest) {
        alert("Geri qaytarma müraciəti tapılmadı.");
        return;
    }

    const updates = {};

    updates["orders/" + firebaseKey + "/products/" + productIndex + "/returnRequest/status"] =
        "Məhsul yoldadır";

    try {
        await update(ref(db), updates);
        closeReturn();
        alert("Məhsulun yola verildiyi qeyd edildi.");
    } catch (error) {
        console.error(error);
        alert("Xəta baş verdi.");
    }
};

window.closeReturn = function() {
    document.getElementById("returnModal").style.display = "none";
};

document.getElementById("returnModal").addEventListener("click", function(event) {
    if (event.target === this) closeReturn();
});

function escapeHTML(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
