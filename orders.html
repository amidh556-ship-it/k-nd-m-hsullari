<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Sifarişlərim</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f5f5f5;

    color: #222;

}


.container {

    max-width: 600px;

    margin: auto;

    padding: 15px;

}


h1 {

    background: white;

    padding: 20px;

    border-radius: 12px;

    margin-top: 0;

}


.order {

    background: white;

    padding: 15px;

    border-radius: 12px;

    margin-bottom: 15px;

}


.order-header {

    display: flex;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 10px;

}


.order-id {

    font-weight: bold;

}


.status {

    color: #2e7d32;

    font-weight: bold;

}


.product {

    display: flex;

    gap: 10px;

    padding: 10px 0;

    border-top: 1px solid #eee;

}


.product img {

    width: 70px;

    height: 70px;

    object-fit: cover;

    border-radius: 8px;

}


.product-info {

    flex: 1;

}


.total {

    margin-top: 12px;

    font-size: 19px;

    font-weight: bold;

}


.tracking {

    margin-top: 12px;

    padding: 12px;

    background: #f1f8e9;

    border-radius: 8px;

}


.tracking b {

    display: block;

    margin-bottom: 5px;

}


.date {

    margin-top: 8px;

    color: #777;

    font-size: 14px;

}


.empty {

    background: white;

    padding: 35px 15px;

    border-radius: 12px;

    text-align: center;

    font-size: 18px;

}


.login {

    background: white;

    padding: 30px;

    border-radius: 12px;

    text-align: center;

}


.back {

    display: block;

    text-align: center;

    padding: 20px;

    color: #222;

    text-decoration: none;

}

</style>

</head>


<body>


<div class="container">


<h1>
📦 Sifarişlərim
</h1>


<div id="orders"></div>


<a
    class="back"
    href="index.html"
>
    ← Alış-verişə qayıt
</a>


</div>



<script>


/* =========================
   HESAB AÇARI
========================= */

function getAccountKey() {


    const email =

        localStorage.getItem(

            "userEmail"

        );


    if (!email) {

        return null;

    }


    return email

        .toLowerCase()

        .trim()

        .replace(

            /[^a-z0-9]/g,

            "_"

        );

}



/* =========================
   SİFARİŞLƏRİ GÖTÜR
========================= */

function getOrders() {


    const key =

        getAccountKey();


    if (!key) {

        return [];

    }


    try {


        return JSON.parse(

            localStorage.getItem(

                "orders_" + key

            )

        ) || [];


    } catch (error) {


        return [];

    }

}



/* =========================
   SİFARİŞLƏRİ GÖSTƏR
========================= */

function showOrders() {


    const box =

        document.getElementById(

            "orders"

        );


    box.innerHTML = "";


    const email =

        localStorage.getItem(

            "userEmail"

        );


    /* GİRİŞ YOXDUR */

    if (!email) {


        box.innerHTML = `

            <div class="login">

                🔐 Sifarişlərini görmək üçün
                hesabına giriş et.

            </div>

        `;


        return;

    }



    const orders =

        getOrders();



    /* SİFARİŞ YOXDUR */

    if (orders.length === 0) {


        box.innerHTML = `

            <div class="empty">

                📦 Hələ sifarişin yoxdur.

            </div>

        `;


        return;

    }



    /* YENİ SİFARİŞ ƏVVƏL GƏLSİN */

    orders

        .slice()

        .reverse()

        .forEach(

            function(order) {


                let productsHTML = "";



                const products =

                    order.products || [];



                products.forEach(

                    function(item) {


                        const quantity =

                            Number(

                                item.quantity

                            ) || 1;



                        const price =

                            Number(

                                item.price

                            ) || 0;



                        productsHTML += `

                            <div class="product">

                                <img

                                    src="${item.image || ''}"

                                    alt="Məhsul"

                                >


                                <div class="product-info">

                                    <b>

                                        ${item.name || "Məhsul"}

                                    </b>

                                    <br>

                                    ${quantity} ədəd

                                    <br>

                                    ${price.toFixed(2)} AZN / ədəd

                                </div>

                            </div>

                        `;

                    }

                );



                box.innerHTML += `

                    <div class="order">


                        <div class="order-header">


                            <div class="order-id">

                                ${order.orderId || "Sifariş"}

                            </div>


                            <div class="status">

                                ${order.status || "Sifariş qəbul edildi"}

                            </div>


                        </div>


                        ${productsHTML}



                        <div class="total">

                            Ümumi:

                            ${Number(

                                order.total || 0

                            ).toFixed(2)}

                            AZN

                        </div>



                        <div class="tracking">


                            <b>

                                📍 Sifarişi izləmə kodu

                            </b>


                            ${order.trackingCode || "Hazırlanır..."}


                        </div>



                        <div class="date">

                            📅 ${order.date || ""}

                        </div>


                    </div>

                `;

            }

        );

}


/* =========================
   BAŞLAT
========================= */

showOrders();

</script>


</body>

</html>
