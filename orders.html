<!DOCTYPE html><html lang="az"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sifarişlərim</title><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

h1{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-top:0;
}

.order{
    background:white;
    border-radius:12px;
    margin-bottom:15px;
    overflow:hidden;
}

.order-top{
    padding:15px;
    cursor:pointer;
}

.order-id{
    font-weight:bold;
    font-size:17px;
}

.status{
    margin-top:7px;
    color:#2e7d32;
    font-weight:bold;
}

.arrow{
    float:right;
    font-size:20px;
}

.details{
    display:none;
    padding:15px;
    border-top:1px solid #eee;
}

.product{
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.product-main{
    display:flex;
    gap:10px;
}

.product img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
}

.product-info{
    flex:1;
}

.return-button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ff6f00;
    border-radius:8px;
    background:white;
    color:#e65100;
    font-size:15px;
    font-weight:bold;
}

.return-button:active{
    background:#fff3e0;
}

.returned-box{
    margin-top:10px;
    padding:10px;
    background:#fff3e0;
    color:#e65100;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
}

.total{
    font-size:19px;
    font-weight:bold;
    margin-top:10px;
}

.tracking{
    background:#f1f8e9;
    padding:12px;
    border-radius:8px;
    margin-top:12px;
}

.tracking-code{
    font-weight:bold;
    margin-top:5px;
}

.timeline{
    margin-top:18px;
}

.step{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-bottom:16px;
}

.circle{
    width:22px;
    height:22px;
    border-radius:50%;
    background:#ddd;
    flex-shrink:0;
}

.step.active .circle{
    background:#2e7d32;
}

.step-text{
    font-size:15px;
}

.step.active .step-text{
    color:#2e7d32;
    font-weight:bold;
}

.admin-box{
    background:#fff8e1;
    border:2px solid #ffca28;
    padding:12px;
    border-radius:10px;
    margin-top:15px;
}

.admin-box select{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.admin-title{
    font-weight:bold;
}

.save-button{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:0;
    border-radius:8px;
    background:#2e7d32;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.empty{
    background:white;
    padding:35px 15px;
    border-radius:12px;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    padding:20px;
    color:#222;
    text-decoration:none;
}

.date{
    color:#777;
    font-size:14px;
    margin-top:10px;
}

.customer{
    background:#f5f5f5;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    font-size:14px;
}


/* =========================
   GERİ QAYTARMA PƏNCƏRƏSİ
========================= */

.return-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:9999;
    padding:20px;
    overflow:auto;
}

.return-box{
    background:white;
    max-width:500px;
    margin:40px auto;
    border-radius:15px;
    padding:20px;
}

.return-box h2{
    margin-top:0;
}

.return-product{
    background:#f5f5f5;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    font-weight:bold;
}

.reason{
    display:block;
    padding:13px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:9px;
    cursor:pointer;
    background:white;
}

.reason input{
    margin-right:8px;
}

.return-text{
    width:100%;
    min-height:80px;
    padding:12px;
    border:1px solid #ccc;
    border-radius:9px;
    margin-top:10px;
    font-size:15px;
    resize:vertical;
}

.send-return{
    width:100%;
    padding:14px;
    border:0;
    border-radius:9px;
    background:#e65100;
    color:white;
    font-size:16px;
    font-weight:bold;
    margin-top:12px;
}

.close-return{
    width:100%;
    padding:12px;
    border:0;
    border-radius:9px;
    background:#eee;
    color:#222;
    font-size:15px;
    margin-top:8px;
}

.return-success{
    background:#e8f5e9;
    color:#2e7d32;
    padding:12px;
    border-radius:9px;
    margin-top:10px;
    font-weight:bold;
}

</style></head><body><div class="container"><h1>📦 Sifarişlərim</h1><div id="orders">
    ⏳ Sifarişlər yüklənir...
</div><a class="back" href="index.html">
← Alış-verişə qayıt
</a></div><!-- =========================
     GERİ QAYTARMA PƏNCƏRƏSİ
========================= --><div
    class="return-modal"
    id="returnModal"
><div class="return-box">

    <h2>↩️ Geri qaytarma</h2>

    <div
        class="return-product"
        id="returnProduct"
    >
    </div>

    <b>Niyə geri qaytarmaq istəyirsiniz?</b>

    <label class="reason">
        <input
            type="radio"
            name="returnReason"
            value="Məhsul zədəlidir"
        >
        Məhsul zədəlidir
    </label>

    <label class="reason">
        <input
            type="radio"
            name="returnReason"
            value="Məhsul sınıq gəlib"
        >
        Məhsul sınıq gəlib
    </label>

    <label class="reason">
        <input
            type="radio"
            name="returnReason"
            value="Səhv məhsul göndərilib"
        >
        Səhv məhsul göndərilib
    </label>

    <label class="reason">
        <input
            type="radio"
            name="returnReason"
            value="Ölçüsü balacadır"
        >
        Ölçüsü balacadır
    </label>

    <label class="reason">
        <input
            type="radio"
            name="returnReason"
            value="Ölçüsü böyükdür"
        >
        Ölçüsü böyükdür
    </label>

    <label class="reason">
        <input
            type="radio"
            name="returnReason"
            value="Məhsulu bəyənmədim"
        >
        Məhsulu bəyənmədim
    </label>

    <label class="reason">
        <input
            type="radio"
            name="returnReason"
            value="Məhsul təsvirə uyğun deyil"
        >
        Məhsul təsvirə uyğun deyil
    </label>

    <label class="reason">
        <input
            type="radio"
            name="returnReason"
            value="Başqa səbəb"
        >
        Başqa səbəb
    </label>

    <textarea
        id="returnNote"
        class="return-text"
        placeholder="Əlavə məlumat yazın (istəyə görə)..."
    ></textarea>

    <button
        class="send-return"
        onclick="sendReturnRequest()"
    >
        ↩️ Geri qaytarma sorğusunu göndər
    </button>

    <button
        class="close-return"
        onclick="closeReturnModal()"
    >
        Bağla
    </button>

</div>

</div><script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    update,
    push
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain:
        "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
        "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
        "kendmehsullari-6a53d",

    storageBucket:
        "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
        "551607499773",

    appId:
        "1:551607499773:web:a84aa63dc5b55c38687794"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* =========================
   ADMIN
========================= */

const ADMIN_EMAIL =
    "amidh365@gmail.com";


const currentEmail =
    (
        localStorage.getItem("userEmail")
        || ""
    )
    .toLowerCase()
    .trim();


const isAdmin =
    currentEmail === ADMIN_EMAIL;


/* =========================
   STATUSLAR
========================= */

const statuses = [

    "Sifariş qəbul edildi",

    "Hazırlanır",

    "Yola verildi",

    "Çatdırılır",

    "Çatdırıldı"

];


function getStatusIndex(status){

    if(!status){
        return 0;
    }

    const s =
        status.toLowerCase();

    if(s.includes("çatdırıldı")){
        return 4;
    }

    if(s.includes("çatdırılır")){
        return 3;
    }

    if(
        s.includes("yola") ||
        s.includes("yoldadır")
    ){
        return 2;
    }

    if(
        s.includes("hazırlanır") ||
        s.includes("hazırlanıb")
    ){
        return 1;
    }

    return 0;
}


/* =========================
   SİFARİŞLƏR
========================= */

const ordersBox =
    document.getElementById("orders");


onValue(
    ref(db,"orders"),
    function(snapshot){

        ordersBox.innerHTML = "";

        const data =
            snapshot.val();


        if(!data){

            ordersBox.innerHTML = `
                <div class="empty">
                    📦 Hələ sifariş yoxdur.
                </div>
            `;

            return;
        }


        let orders = [];


        Object.keys(data).forEach(function(key){

            const order =
                data[key];

            order.firebaseKey =
                key;

            orders.push(order);

        });


        /* ADMIN = BÜTÜN SİFARİŞLƏR */

        if(!isAdmin){

            orders =
                orders.filter(function(order){

                    return (
                        String(order.email || "")
                        .toLowerCase()
                        .trim()
                        === currentEmail
                    );

                });

        }


        orders.sort(function(a,b){

            return (
                Number(b.createdAt || 0)
                -
                Number(a.createdAt || 0)
            );

        });


        if(orders.length === 0){

            ordersBox.innerHTML = `
                <div class="empty">
                    📦 Sifariş yoxdur.
                </div>
            `;

            return;
        }


        orders.forEach(function(order,index){

            renderOrder(
                order,
                index
            );

        });

    },
    function(error){

        console.error(error);

        ordersBox.innerHTML = `
            <div class="empty">
                ❌ Sifarişləri yükləmək olmadı.
                <br><br>
                Firebase bağlantısını yoxla.
            </div>
        `;

    }
);


/* =========================
   SİFARİŞİ GÖSTƏR
========================= */

function renderOrder(
    order,
    index
){

    const currentStatus =
        order.status ||
        "Sifariş qəbul edildi";


    const statusIndex =
        getStatusIndex(
            currentStatus
        );


    let productsHTML = "";


    const products =
        order.products || [];


    products.forEach(function(item,productIndex){

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;


        const returnInfo =
            item.returnRequest;


        let returnHTML = "";


        if(returnInfo){

            returnHTML = `

                <div class="returned-box">

                    ↩️ Geri qaytarma sorğusu:
                    ${returnInfo.reason}

                </div>

            `;

        }else if(!isAdmin){

            returnHTML = `

                <button
                    class="return-button"
                    onclick="openReturnModal(
                        '${order.firebaseKey}',
                        ${productIndex}
                    )"
                >

                    ↩️ Geri qaytarma

                </button>

            `;

        }


        productsHTML += `

            <div class="product">

                <div class="product-main">

                    <img
                        src="${item.image || ''}"
                        alt="Məhsul"
                    >

                    <div class="product-info">

                        <b>
                            ${item.name || "Məhsul"}
                        </b>

                        <br>

                        ${quantity} ədəd

                        <br>

                        ${price.toFixed(2)}
                        AZN / ədəd

                    </div>

                </div>

                ${returnHTML}

            </div>

        `;

    });


    let timelineHTML = "";


    statuses.forEach(function(status,i){

        const active =
            i <= statusIndex
            ? "active"
            : "";


        timelineHTML += `

            <div class="step ${active}">

                <div class="circle"></div>

                <div class="step-text">
                    ${status}
                </div>

            </div>

        `;

    });


    let adminHTML = "";


    /* =========================
       ADMIN STATUS DƏYİŞİKLİYİ
    ========================= */

    if(isAdmin){

        let optionsHTML = "";


        statuses.forEach(function(status){

            const selected =
                status === currentStatus
                ? "selected"
                : "";


            optionsHTML += `

                <option
                    value="${status}"
                    ${selected}
                >
                    ${status}
                </option>

            `;

        });


        adminHTML = `

            <div class="admin-box">

                <div class="admin-title">
                    🔐 Admin — Sifariş statusu
                </div>

                <select
                    id="status-${index}"
                >

                    ${optionsHTML}

                </select>

                <button
                    class="save-button"
                    onclick="saveStatus(
                        '${order.firebaseKey}',
                        ${index}
                    )"
                >

                    💾 Statusu yadda saxla

                </button>

            </div>

        `;

    }


    ordersBox.innerHTML += `

        <div class="order">

            <div
                class="order-top"
                onclick="toggleOrder(${index})"
            >

                <span class="arrow">
                    ▼
                </span>

                <div class="order-id">

                    📦
                    ${order.orderId || "Sifariş"}

                </div>

                <div class="status">

                    ${currentStatus}

                </div>

            </div>


            <div
                class="details"
                id="details-${index}"
            >

                ${
                    isAdmin
                    ? `
                    <div class="customer">

                        👤 <b>Müştəri:</b>
                        ${order.name || ""}

                        <br>

                        📧 <b>Gmail:</b>
                        ${order.email || ""}

                        <br>

                        📞 <b>Telefon:</b>
                        ${order.phone || ""}

                        <br>

                        📍 <b>Ünvan:</b>
                        ${order.address || ""}

                    </div>
                    `
                    : ""
                }


                ${productsHTML}


                <div class="total">

                    Ümumi:
                    ${Number(order.total || 0).toFixed(2)}
                    AZN

                </div>


                <div class="tracking">

                    <b>
                        📍 İzləmə kodu
                    </b>

                    <div class="tracking-code">

                        ${
                            order.trackingCode ||
                            "Hazırlanır"
                        }

                    </div>

                </div>


                <div class="timeline">

                    <b>
                        📦 Sifarişin vəziyyəti
                    </b>

                    <br><br>

                    ${timelineHTML}

                </div>


                ${adminHTML}


                <div class="date">

                    📅
                    ${order.date || ""}

                </div>

            </div>

        </div>

    `;

}


/* =========================
   GERİ QAYTARMA MODALI
========================= */

let selectedOrderKey = null;
let selectedProductIndex = null;


window.openReturnModal =
function(
    orderKey,
    productIndex
){

    selectedOrderKey =
        orderKey;

    selectedProductIndex =
        productIndex;


    document.getElementById(
        "returnModal"
    ).style.display =
        "block";


    document.getElementById(
        "returnNote"
    ).value = "";


    const radios =
        document.querySelectorAll(
            'input[name="returnReason"]'
        );


    radios.forEach(function(radio){

        radio.checked = false;

    });


    document.getElementById(
        "returnProduct"
    ).innerText =
        "Seçilmiş məhsul üçün geri qaytarma sorğusu";


    document.body.style.overflow =
        "hidden";

};


window.closeReturnModal =
function(){

    document.getElementById(
        "returnModal"
    ).style.display =
        "none";


    document.body.style.overflow =
        "auto";

};


/* =========================
   GERİ QAYTARMA SORĞUSU
========================= */

window.sendReturnRequest =
async function(){

    if(
        !selectedOrderKey ||
        selectedProductIndex === null
    ){

        alert(
            "❌ Məhsul seçilməyib."
        );

        return;

    }


    const selected =
        document.querySelector(
            'input[name="returnReason"]:checked'
        );


    if(!selected){

        alert(
            "⚠️ Zəhmət olmasa geri qaytarma səbəbini seç."
        );

        return;

    }


    const reason =
        selected.value;


    const note =
        document.getElementById(
            "returnNote"
        ).value.trim();


    try{

        const returnData = {

            reason:
                reason,

            note:
                note,

            email:
                currentEmail,

            status:
                "Sorğu göndərildi",

            createdAt:
                Date.now()

        };


        /*
           MƏHSULUN ÖZÜNƏ GERİ QAYTARMA
           MƏLUMATI YAZILIR
        */

        await update(

            ref(
                db,
                "orders/" +
                selectedOrderKey +
                "/products/" +
                selectedProductIndex
            ),

            {
                returnRequest:
                    returnData
            }

        );


        /*
           OPERATOR/ADMİN ÜÇÜN AYRICA
           GERİ QAYTARMA SORĞUSU
        */

        await push(

            ref(
                db,
                "returnRequests"
            ),

            {

                orderKey:
                    selectedOrderKey,

                productIndex:
                    selectedProductIndex,

                email:
                    currentEmail,

                reason:
                    reason,

                note:
                    note,

                status:
                    "Sorğu göndərildi",

                createdAt:
                    Date.now()

            }

        );


        alert(
            "✅ Geri qaytarma sorğunuz göndərildi."
        );


        closeReturnModal();


    }catch(error){

        console.error(error);

        alert(
            "❌ Sorğu göndərilmədi. Firebase qaydalarını yoxla."
        );

    }

};


/* =========================
   STATUSU FIREBASE-DƏ DƏYİŞ
========================= */

window.saveStatus =
async function(
    firebaseKey,
    index
){

    if(!isAdmin){

        alert(
            "❌ Bu əməliyyata icazən yoxdur."
        );

        return;

    }


    const select =
        document.getElementById(
            "status-" + index
        );


    if(!select){
        return;
    }


    const newStatus =
        select.value;


    try{

        await update(

            ref(
                db,
                "orders/" +
                firebaseKey
            ),

            {

                status:
                    newStatus,

                updatedAt:
                    Date.now()

            }

        );


        alert(
            "✅ Status yadda saxlanıldı: " +
            newStatus
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Status dəyişmədi. Firebase qaydalarını yoxla."
        );

    }

};


/* =========================
   AÇ / BAĞLA
========================= */

window.toggleOrder =
function(index){

    const details =
        document.getElementById(
            "details-" + index
        );


    if(!details){
        return;
    }


    if(
        details.style.display ===
        "block"
    ){

        details.style.display =
            "none";

    }else{

        details.style.display =
            "block";

    }

};

</script></body>
</html>
