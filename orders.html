<!DOCTYPE html>
<html lang="az">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sifarişlərim - Kənd məhsulları</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

.header{
    background:white;
    padding:18px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #ddd;
    position:sticky;
    top:0;
    z-index:10;
}

.header h2{
    margin:0;
    font-size:22px;
}

.back{
    text-decoration:none;
    color:#111;
    font-size:25px;
}

#loading{
    text-align:center;
    padding:40px 20px;
    color:#777;
}

.order{
    background:white;
    margin:14px;
    padding:15px;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.order-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.order-number{
    font-weight:bold;
}

.order-date{
    color:#777;
    font-size:13px;
}

.product{
    display:flex;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.product:last-child{
    border-bottom:0;
}

.product img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:10px;
    background:#eee;
}

.product-info{
    flex:1;
}

.product-name{
    font-size:17px;
    font-weight:bold;
    margin-bottom:5px;
}

.product-price{
    color:#555;
    margin-bottom:8px;
}

.status{
    padding:8px 12px;
    border-radius:20px;
    background:#eaf7e8;
    color:#16851d;
    font-size:13px;
    display:inline-block;
}

.timeline{
    margin-top:15px;
    padding:12px;
    background:#fafafa;
    border-radius:12px;
}

.step{
    padding:8px 0;
    color:#aaa;
}

.step.active{
    color:#16851d;
    font-weight:bold;
}

.total{
    font-size:18px;
    font-weight:bold;
    margin-top:14px;
}

.return-button{
    width:100%;
    margin-top:12px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:16px;
}

.admin-box{
    margin-top:15px;
    padding:14px;
    background:#fff5d8;
    border-radius:12px;
}

.admin-box b{
    display:block;
    margin-bottom:8px;
}

.admin-box select,
.admin-box input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    margin-top:7px;
    font-size:15px;
}

.save-button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#16851d;
    color:white;
    font-size:15px;
    font-weight:bold;
}

.tracking-box{
    margin-top:12px;
    padding:12px;
    background:#f1f7ff;
    border-radius:10px;
    border:1px solid #dbeaff;
}

.tracking-title{
    font-weight:bold;
    margin-bottom:5px;
}

.tracking-code{
    font-size:17px;
    font-weight:bold;
    color:#145db2;
    word-break:break-all;
}

.return-status{
    margin-top:12px;
    padding:12px;
    background:#f2f2f2;
    border-radius:10px;
}

.return-status b{
    display:block;
    margin-bottom:5px;
}


/* PƏNCƏRƏ */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    overflow-y:auto;
    padding:20px;
}

.modal-box{
    background:white;
    max-width:600px;
    margin:20px auto;
    border-radius:20px;
    padding:20px;
    position:relative;
}

.close{
    position:absolute;
    right:15px;
    top:15px;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#eee;
    font-size:25px;
}

.modal-title{
    font-size:25px;
    font-weight:bold;
    margin-bottom:20px;
    padding-right:50px;
}

.return-product{
    display:flex;
    align-items:center;
    gap:12px;
    background:#f7f7f7;
    padding:12px;
    border-radius:15px;
    margin-bottom:20px;
}

.return-product img{
    width:120px;
    height:100px;
    object-fit:cover;
    border-radius:12px;
}

.reason-title{
    font-size:22px;
    font-weight:bold;
    margin:18px 0 10px;
}

.reason{
    border:1px solid #ddd;
    padding:16px;
    margin:10px 0;
    border-radius:14px;
    font-size:17px;
    cursor:pointer;
    display:block;
}

.reason input{
    margin-right:10px;
    width:20px;
    height:20px;
}

.extra{
    width:100%;
    min-height:120px;
    padding:12px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
    resize:vertical;
    margin-top:12px;
}

.submit-return{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#111;
    color:white;
    font-size:17px;
    margin-top:12px;
}


/* İKİNCİ PƏNCƏRƏ */

.print-text{
    text-align:center;
    font-size:17px;
    font-weight:bold;
    margin:10px 0 15px;
}

.return-label{
    display:block;
    width:100%;
    max-width:450px;
    margin:0 auto 18px;
    border-radius:10px;
    border:1px solid #ddd;
    background:#000;
}

.address-box{
    background:#f5f5f5;
    padding:16px;
    border-radius:12px;
    line-height:1.8;
    font-size:16px;
}

.send-button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:12px;
    background:#16851d;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.return-message{
    padding:14px;
    margin-top:12px;
    background:#eaf7e8;
    border-radius:12px;
    color:#16851d;
    font-weight:bold;
}

.empty{
    text-align:center;
    padding:60px 20px;
    color:#777;
}

</style>

</head>

<body>

<div class="header">

    <a class="back" href="index.html">←</a>

    <h2>Sifarişlərim</h2>

    <div style="width:25px;"></div>

</div>

<div id="loading">
    Sifarişlər yoxlanılır...
</div>

<div id="orders"></div>


<!-- GERİ QAYTARMA PƏNCƏRƏSİ -->

<div id="returnModal" class="modal">

    <div class="modal-box">

        <button
            class="close"
            onclick="closeReturn()"
        >
            ×
        </button>

        <div
            id="modalTitle"
            class="modal-title"
        >
            ↩️ Geri qaytarma
        </div>

        <div id="returnContent"></div>

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue,
    update,
    push
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain:
    "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
    "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
    "kendmehsullari-6a53d",

    storageBucket:
    "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
    "551607499773",

    appId:
    "1:551607499773:web:a84aa63dc5b55c38687794"

};


const app =
initializeApp(firebaseConfig);


const db =
getDatabase(app);


/* SƏNİN ADMİN HESABIN */

const ADMIN_EMAIL =
"amid.h556@gmail.com";


const currentEmail =
(localStorage.getItem("userEmail") || "")
.toLowerCase()
.trim();


const isAdmin =
currentEmail === ADMIN_EMAIL;


const ordersRef =
ref(db,"orders");


let allOrders = {};


/*
YENİ SİFARİŞ MƏRHƏLƏLƏRİ

İLK MƏRHƏLƏ:
Məhsul yığılır

SONRA:
Hazırdır
Yoldadır
Çatdırılır
Çatdırıldı
*/

const orderStatuses = [

    "Məhsul yığılır",
    "Hazırdır",
    "Yoldadır",
    "Çatdırılır",
    "Çatdırıldı"

];


const returnStatuses = [

    "Sorğu qəbul edildi",
    "Məhsul göndərilməlidir",
    "Məhsul yoldadır",
    "Məhsul satıcıya çatdı",
    "Pul geri qaytarılır",
    "Pul geri qaytarıldı"

];


onValue(

    ordersRef,

    function(snapshot){

        const data =
        snapshot.val() || {};

        allOrders = data;

        renderOrders(data);

    },

    function(error){

        console.error(error);

        document.getElementById(
            "loading"
        ).innerHTML =
        "❌ Sifarişləri yükləmək mümkün olmadı.";

    }

);


function renderOrders(data){

    const container =
    document.getElementById("orders");

    const loading =
    document.getElementById("loading");


    container.innerHTML = "";


    let entries =
    Object.entries(data);


    /*
    MÜŞTƏRİ YALNIZ ÖZ SİFARİŞİNİ GÖRÜR.

    ADMİN BÜTÜN MÜŞTƏRİLƏRİN
    SİFARİŞİNİ GÖRÜR.
    */

    if(!isAdmin){

        entries =
        entries.filter(function(item){

            const order =
            item[1];

            const email =
            String(
                order?.email || ""
            )
            .toLowerCase()
            .trim();


            return email === currentEmail;

        });

    }


    loading.style.display =
    "none";


    if(entries.length === 0){

        container.innerHTML = `

            <div class="empty">

                🛒<br><br>

                Hələ sifariş yoxdur.

            </div>

        `;

        return;

    }


    entries.reverse();


    entries.forEach(function(item){

        const firebaseKey =
        item[0];

        const order =
        item[1];


        container.innerHTML +=
        createOrder(
            firebaseKey,
            order
        );

    });

}


function createOrder(
    firebaseKey,
    order
){

    const products =
    Array.isArray(order.products)
    ? order.products
    : Object.values(
        order.products || {}
    );


    /*
    KÖHNƏ SİFARİŞLƏR ÜÇÜN DƏ
    YENİ İLK STATUS GÖRÜNSÜN.
    */

    let orderStatus =
    order.status ||
    "Məhsul yığılır";


    /*
    KÖHNƏ "Sifariş qəbul edildi"
    STATUSU GƏLSƏ, ONU YENİ
    İLK MƏRHƏLƏYƏ ÇEVİRİRİK.
    */

    if(
        orderStatus ===
        "Sifariş qəbul edildi"
    ){

        orderStatus =
        "Məhsul yığılır";

    }


    let productsHTML = "";


    products.forEach(function(
        product,
        index
    ){

        const name =
        product.name ||
        product.title ||
        "Məhsul";


        const image =
        product.image ||
        product.img ||
        "";


        const price =
        product.price ||
        "0";


        const quantity =
        Number(
            product.quantity || 1
        );


        const returnRequest =
        product.returnRequest ||
        null;


        productsHTML += `

            <div class="product">

                <img
                    src="${escapeHTML(image)}"
                    onerror="
                        this.style.display='none'
                    "
                >

                <div class="product-info">

                    <div class="product-name">
                        ${escapeHTML(name)}
                    </div>

                    <div class="product-price">
                        ${escapeHTML(String(price))}
                        AZN × ${quantity}
                    </div>

                    <div class="status">

                        ${escapeHTML(
                            returnRequest
                            ? returnRequest.status || ""
                            : orderStatus
                        )}

                    </div>


                    ${
                        returnRequest
                        ?

                        returnInfo(
                            firebaseKey,
                            index,
                            returnRequest
                        )

                        :

                        `

                        <button
                            class="return-button"
                            onclick="
                                openReturn(
                                    '${firebaseKey}',
                                    ${index}
                                )
                            "
                        >
                            ↩️ Geri qaytar
                        </button>

                        `
                    }

                </div>

            </div>

        `;

    });


    const total =
    order.total ||
    order.totalPrice ||
    order.amount ||
    "0";


    /*
    İZLƏMƏ KODU
    */

    let trackingHTML = "";


    if(order.trackingCode){

        trackingHTML = `

            <div class="tracking-box">

                <div class="tracking-title">
                    📦 İzləmə kodu
                </div>

                <div class="tracking-code">
                    ${escapeHTML(
                        String(
                            order.trackingCode
                        )
                    )}
                </div>

            </div>

        `;

    }


    /*
    ADMİN PANELİ
    */

    let adminHTML = "";


    if(isAdmin){

        adminHTML = `

            <div class="admin-box">

                <b>
                    ⚙️ Sifariş idarəsi
                </b>


                <label>
                    Status
                </label>


                <select
                    id="status-${firebaseKey}"
                >

                    ${
                        orderStatuses.map(
                            function(s){

                                return `

                                    <option
                                        value="${s}"
                                        ${
                                            s === orderStatus
                                            ? "selected"
                                            : ""
                                        }
                                    >
                                        ${s}
                                    </option>

                                `;

                            }
                        ).join("")
                    }

                </select>


                <label
                    style="
                        display:block;
                        margin-top:10px;
                    "
                >
                    📦 İzləmə kodu
                </label>


                <input
                    type="text"
                    id="tracking-${firebaseKey}"
                    value="${
                        escapeHTML(
                            String(
                                order.trackingCode || ""
                            )
                        )
                    }"
                    placeholder="İzləmə kodunu yazın"
                >


                <button
                    class="save-button"
                    onclick="
                        sendOrder(
                            '${firebaseKey}'
                        )
                    "
                >
                    📤 Göndər
                </button>


                <button
                    class="save-button"
                    style="
                        background:#555;
                    "
                    onclick="
                        saveOrderStatus(
                            '${firebaseKey}'
                        )
                    "
                >
                    Statusu yalnız yadda saxla
                </button>

            </div>

        `;

    }


    return `

        <div class="order">

            <div class="order-top">

                <div>

                    <div class="order-number">
                        📦 Sifariş
                    </div>

                    <div class="order-date">
                        ${escapeHTML(
                            String(
                                order.date ||
                                order.createdAt ||
                                ""
                            )
                        )}
                    </div>

                </div>


                <div class="status">

                    ${escapeHTML(
                        orderStatus
                    )}

                </div>

            </div>


            <div class="timeline">

                ${
                    orderStatuses.map(
                        function(s){

                            const current =
                            orderStatuses.indexOf(
                                orderStatus
                            );

                            const step =
                            orderStatuses.indexOf(s);


                            return `

                                <div class="
                                    step
                                    ${
                                        step <= current
                                        ? "active"
                                        : ""
                                    }
                                ">

                                    ${
                                        step <= current
                                        ? "✓"
                                        : "○"
                                    }

                                    ${s}

                                </div>

                            `;

                        }
                    ).join("")
                }

            </div>


            ${trackingHTML}


            ${productsHTML}


            <div class="total">

                Cəmi:
                ${escapeHTML(String(total))}
                AZN

            </div>


            ${adminHTML}

        </div>

    `;

}


/* =========================
   ADMİN GÖNDƏR DÜYMƏSİ
   ========================= */

window.sendOrder =
async function(firebaseKey){

    if(!isAdmin){

        alert(
            "Bu əməliyyat yalnız admin üçündür."
        );

        return;

    }


    const statusSelect =
    document.getElementById(
        "status-" + firebaseKey
    );


    const trackingInput =
    document.getElementById(
        "tracking-" + firebaseKey
    );


    if(!statusSelect ||
       !trackingInput){

        alert(
            "Məlumat sahəsi tapılmadı."
        );

        return;

    }


    const selectedStatus =
    statusSelect.value;


    const trackingCode =
    trackingInput.value.trim();


    /*
    HAZIRDIR SEÇİLƏNDƏ
    İZLƏMƏ KODU MƏCBURİDİR.
    */

    if(
        selectedStatus === "Hazırdır" &&
        !trackingCode
    ){

        alert(
            "Zəhmət olmasa izləmə kodunu yazın."
        );

        return;

    }


    const path =
    "orders/" +
    firebaseKey;


    try{

        await update(

            ref(db,path),

            {

                status:
                selectedStatus,

                trackingCode:
                trackingCode,

                trackingSent:
                true,

                trackingSentAt:
                new Date().toISOString()

            }

        );


        alert(
            "✅ Sifariş göndərildi. İzləmə kodu yadda saxlanıldı."
        );


    }catch(error){

        console.error(error);

        alert(
            "❌ Sifariş göndərilmədi."
        );

    }

};


/* =========================
   ADMİN STATUSU YADDA SAXLA
   ========================= */

window.saveOrderStatus =
async function(firebaseKey){

    if(!isAdmin){

        alert(
            "Bu əməliyyat yalnız admin üçündür."
        );

        return;

    }


    const select =
    document.getElementById(
        "status-" + firebaseKey
    );


    if(!select) return;


    const path =
    "orders/" +
    firebaseKey;


    try{

        await update(

            ref(
                db,
                path
            ),

            {
                status:
                select.value
            }

        );


        alert(
            "Sifariş statusu yadda saxlanıldı."
        );


    }catch(error){

        console.error(error);

        alert(
            "Status yadda saxlanmadı."
        );

    }

};


/* =========================
   GERİ QAYTARMA MƏLUMATI
   ========================= */

function returnInfo(
    firebaseKey,
    productIndex,
    info
){

    const status =
    info.status ||
    "Sorğu qəbul edildi";


    let html = `

        <div class="return-status">

            <b>↩️ Geri qaytarma</b>

            Status:
            ${escapeHTML(status)}

    `;


    if(info.reason){

        html += `

            <br>

            Səbəb:
            ${escapeHTML(info.reason)}

        `;

    }


    if(status === "Məhsul göndərilməlidir"){

        html += `

            <div style="
                margin-top:15px;
                padding-top:15px;
                border-top:1px solid #ddd;
            ">

                <b style="
                    display:block;
                    text-align:center;
                    font-size:16px;
                    margin-bottom:12px;
                ">
                    🖨️ Şəkili çap edin və
                    malın üstünə vurun.
                </b>


                <img
                    src="geri-gonderme.jpg"
                    class="return-label"
                    alt="Geri qaytarma etiketi"
                >


                <div class="address-box">

                    <b>Kimdən:</b>
                    Amid Həmidov

                    <br>

                    <b>Ünvan:</b>
                    F.ƏMİROV 24

                    <br>

                    <b>İndeks:</b>
                    AZ 1020 TƏLƏBLİ

                    <br>

                    <b>Tel:</b>
                    0504535874

                </div>


                <button
                    class="send-button"
                    onclick="
                        productSent(
                            '${firebaseKey}',
                            ${productIndex}
                        )
                    "
                >
                    📦 Məhsulu göndərdim
                </button>

            </div>

        `;

    }


    if(status === "Məhsul yoldadır"){

        html += `

            <div class="return-message">

                📦 Məhsul yoldadır.

                <br><br>

                Satıcı məhsulu gözləyir.

            </div>

        `;

    }


    if(status === "Məhsul satıcıya çatdı"){

        html += `

            <div class="return-message">

                📦 Məhsul satıcıya çatdı.

            </div>

        `;

    }


    if(status === "Pul geri qaytarılır"){

        html += `

            <div class="return-message">

                💰 Pul geri qaytarılır.

            </div>

        `;

    }


    if(status === "Pul geri qaytarıldı"){

        html += `

            <div class="return-message">

                ✅ Pul geri qaytarıldı.

            </div>

        `;

    }


    if(isAdmin){

        html += `

            <select
                id="return-${firebaseKey}-${productIndex}"
                style="
                    width:100%;
                    padding:10px;
                    margin-top:12px;
                    border-radius:8px;
                    border:1px solid #ccc;
                "
            >

                ${
                    returnStatuses.map(
                        function(s){

                            return `

                                <option
                                    value="${s}"
                                    ${
                                        s === status
                                        ? "selected"
                                        : ""
                                    }
                                >
                                    ${s}
                                </option>

                            `;

                        }
                    ).join("")
                }

            </select>


            <button
                class="save-button"
                onclick="
                    saveReturnStatus(
                        '${firebaseKey}',
                        ${productIndex}
                    )
                "
            >
                Geri qaytarma statusunu yadda saxla
            </button>

        `;

    }


    html += `</div>`;


    return html;

}


/* =========================
   GERİ QAYTARMA PƏNCƏRƏSİ
   ========================= */

window.openReturn =
function(
    firebaseKey,
    productIndex
){

/* =========================

   ========================= */

window.submitReturn =
async function(
    firebaseKey,
    productIndex
){

    const selected =
    document.querySelector(
        'input[name="returnReason"]:checked'
    );


    if(!selected){

        alert(
            "Zəhmət olmasa səbəb seçin."
        );

        return;

    }


    const reason =
    selected.value;


    const extraElement =
    document.getElementById(
        "extraReason"
    );


    const extra =
    extraElement
    ? extraElement.value.trim()
    : "";


    const order =
    allOrders[firebaseKey];


    if(!order){

        alert("Sifariş tapılmadı.");

        return;

    }


    const products =
    Array.isArray(order.products)
    ? order.products
    : Object.values(
        order.products || {}
    );


    const product =
    products[productIndex];


    if(!product){

        alert("Məhsul tapılmadı.");

        return;

    }


    const request = {

        status:
        "Məhsul göndərilməlidir",

        reason:
        reason,

        extra:
        extra,

        productName:
        product.name ||
        product.title ||
        "Məhsul",

        email:
        order.email ||
        currentEmail,

        createdAt:
        new Date().toISOString()

    };


    const updates = {};


    const productPath =
    "orders/" +
    firebaseKey +
    "/products/" +
    productIndex +
    "/returnRequest";


    updates[productPath] =
    request;


    const newRequestRef =
    push(
        ref(db,"returnRequests")
    );


    const requestPath =
    "returnRequests/" +
    newRequestRef.key;


    updates[requestPath] = {

        ...request,

        orderKey:
        firebaseKey,

        productIndex:
        productIndex

    };


    try{

        await update(
            ref(db),
            updates
        );


        document.getElementById(
            "modalTitle"
        ).innerHTML =
        "📦 Məhsulu geri göndərin";


        document.getElementById(
            "returnContent"
        ).innerHTML = `

            <div class="print-text">

                🖨️ Şəkili çap edin və
                malın üstünə vurun.

            </div>


            <img
                src="geri-gonderme.jpg"
                class="return-label"
                alt="Geri göndərmə şəkli"
                onerror="
                    this.style.display='none';
                    document.getElementById('imageError').style.display='block';
                "
            >


            <div
                id="imageError"
                style="
                    display:none;
                    background:#ffeaea;
                    color:#b00000;
                    padding:12px;
                    border-radius:10px;
                    margin-bottom:12px;
                    text-align:center;
                "
            >
                ⚠️ geri-gonderme.jpg faylı tapılmadı.
            </div>


            <div class="address-box">

                <b>Kimdən:</b>
                Amid Həmidov

                <br>

                <b>Ünvan:</b>
                F.ƏMİROV 24

                <br>

                <b>İndeks:</b>
                AZ 1020 TƏLƏBLİ

                <br>

                <b>Tel:</b>
                0504535874

            </div>


            <button
                class="send-button"
                onclick="
                    productSent(
                        '${firebaseKey}',
                        ${productIndex}
                    )
                "
            >
                📦 Məhsulu göndərdim
            </button>

        `;


        document.getElementById(
            "returnModal"
        ).style.display =
        "block";


    }catch(error){

        console.error(error);

        alert(
            "Xəta baş verdi. Yenidən cəhd edin."
        );

    }

};


/* =========================

   ========================= */

window.productSent =
async function(
    firebaseKey,
    productIndex
){

    const updates = {};


    const path =
    "orders/" +
    firebaseKey +
    "/products/" +
    productIndex +
    "/returnRequest/status";


    updates[path] =
    "Məhsul yoldadır";


    try{

        await update(
            ref(db),
            updates
        );


        closeReturn();


        alert(
            "Məhsulun yola verildiyi qeyd edildi."
        );


    }catch(error){

        console.error(error);

        alert(
            "Xəta baş verdi."
        );

    }

};

window.saveReturnStatus =
async function(
    firebaseKey,
    productIndex
){

    if(!isAdmin) return;


    const select =
    document.getElementById(
        "return-" +
        firebaseKey +
        "-" +
        productIndex
    );


    if(!select) return;


    const path =
    "orders/" +
    firebaseKey +
    "/products/" +
    productIndex +
    "/returnRequest/status";


    const updates = {};


    updates[path] =
    select.value;


    try{

        await update(
            ref(db),
            updates
        );


        alert(
            "Geri qaytarma statusu yadda saxlanıldı."
        );


    }catch(error){

        console.error(error);

        alert(
            "Status dəyişdirilə bilmədi."
        );

    }

};

window.closeReturn =
function(){

    document.getElementById(
        "returnModal"
    ).style.display =
    "none";

};


/* HTML TƏHLÜKƏSİZLİYİ */

function escapeHTML(value){

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}
