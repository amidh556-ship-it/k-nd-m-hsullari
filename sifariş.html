<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Sifariş et</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.box{
    background:white;
    padding:18px;
    border-radius:12px;
    margin-bottom:15px;
}

.product{
    display:flex;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #ddd;
}

.product img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:8px;
}

.product-info{
    flex:1;
}

input,
textarea{
    width:100%;
    padding:13px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    height:90px;
    resize:none;
}

.total{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
}

button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:0;
    border-radius:9px;
    background:#2e7d32;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    padding:20px;
    color:#222;
    text-decoration:none;
}

.empty{
    padding:25px;
    text-align:center;
}

</style>

</head>


<body>

<div class="container">

<h1>📦 Sifariş et</h1>


<div class="box">

<h3>Sifariş etdiyiniz məhsullar</h3>

<div id="products"></div>

<div class="total">

Ümumi:
<span id="total">0.00</span> AZN

</div>

</div>


<div class="box">

<h3>Müştəri məlumatları</h3>


<input
    id="name"
    type="text"
    placeholder="Ad və soyad"
>


<input
    id="phone"
    type="tel"
    placeholder="Telefon nömrəsi"
>


<textarea
    id="address"
    placeholder="Ünvan"
></textarea>


<button
    onclick="placeOrder()"
>

✅ Sifarişi təsdiqlə

</button>

</div>


<a
    class="back"
    href="sebet.html"
>

← Səbətə qayıt

</a>

</div>



<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getDatabase,
    ref,
    push,
    set
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain:
        "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
        "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
        "kendmehsullari-6a53d",

    storageBucket:
        "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
        "551607499773",

    appId:
        "1:551607499773:web:a84aa63dc5b55c38687794"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);



/* =========================
   HESAB
========================= */

const email =
    localStorage.getItem("userEmail");


if(!email){

    alert(
        "Əvvəlcə hesabına giriş et."
    );

    window.location.href =
        "index.html";

}



/* =========================
   SƏBƏT AÇARI
========================= */

function getKey(){

    return email
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]/g,
            "_"
        );

}


const key =
    getKey();



/* =========================
   SƏBƏT
========================= */

function getCart(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "cart_" + key
            )
        ) || [];

    }catch(error){

        return [];

    }

}


const cart =
    getCart();


const productsBox =
    document.getElementById(
        "products"
    );


const totalBox =
    document.getElementById(
        "total"
    );


let total = 0;



/* =========================
   MƏHSULLARI GÖSTƏR
========================= */

if(cart.length === 0){

    productsBox.innerHTML = `

        <div class="empty">

            🛒 Səbət boşdur

        </div>

    `;

}else{

    cart.forEach(function(item){

        const quantity =
            Number(item.quantity) || 1;


        const price =
            Number(item.price) || 0;


        total +=
            price * quantity;


        productsBox.innerHTML += `

            <div class="product">

                <img
                    src="${item.image || ''}"
                    alt="Məhsul"
                >

                <div class="product-info">

                    <b>
                        ${item.name || "Məhsul"}
                    </b>

                    <br>

                    ${quantity} ədəd

                    <br>

                    ${price.toFixed(2)}
                    AZN / ədəd

                </div>

            </div>

        `;

    });

}


totalBox.innerText =
    total.toFixed(2);



/* =========================
   SİFARİŞ YARAT
========================= */

window.placeOrder =
async function(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const address =
        document
        .getElementById("address")
        .value
        .trim();



    if(cart.length === 0){

        alert(
            "🛒 Səbət boşdur."
        );

        return;

    }



    if(
        !name ||
        !phone ||
        !address
    ){

        alert(
            "Ad, telefon və ünvanı doldur."
        );

        return;

    }



    /* =========================
       SİFARİŞ MƏLUMATI
    ========================= */

    const order = {

        orderId:
            "SIF-" +
            Date.now(),

        email:
            email,

        name:
            name,

        phone:
            phone,

        address:
            address,

        products:
            cart,

        total:
            total,

        status:
            "Sifariş qəbul edildi",

        trackingCode:
            "TRK-" +
            Math.random()
            .toString(36)
            .substring(2,10)
            .toUpperCase(),

        date:
            new Date()
            .toLocaleString("az-AZ"),

        createdAt:
            Date.now()

    };



    try{

        /* =========================
           FIREBASE-A YAZ
        ========================= */

        const newOrder =
            push(
                ref(
                    db,
                    "orders"
                )
            );


        await set(
            newOrder,
            order
        );



        /* =========================
           TELEFONDA DA SAXLA
        ========================= */

        let oldOrders = [];


        try{

            oldOrders =
                JSON.parse(
                    localStorage.getItem(
                        "orders_" + key
                    )
                ) || [];

        }catch(error){

            oldOrders = [];

        }


        oldOrders.push(order);


        localStorage.setItem(

            "orders_" + key,

            JSON.stringify(
                oldOrders
            )

        );



        /* =========================
           SƏBƏTİ TƏMİZLƏ
        ========================= */

        localStorage.setItem(

            "cart_" + key,

            JSON.stringify([])

        );



        alert(
            "✅ Sifariş uğurla qəbul edildi!"
        );


        window.location.href =
            "orders.html";


    }catch(error){

        console.error(error);

        alert(
            "❌ Sifariş göndərilmədi. Firebase bağlantısını yoxla."
        );

    }

};

</script>

</body>

</html>
