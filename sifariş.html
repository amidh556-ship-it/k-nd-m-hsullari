<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifariş et</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 15px;
        }

        h1 {
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .product {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }

        .product img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-info {
            flex: 1;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            border: none;
            border-radius: 9px;
            background: #2e7d32;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            padding: 20px;
            color: #222;
            text-decoration: none;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📦 Sifariş et</h1>

    <div class="box">
        <h3>Sifariş etdiyiniz məhsullar</h3>
        <div id="products"></div>

        <div class="total">
            Ümumi: <span id="total">0.00</span> AZN
        </div>
    </div>

    <div class="box">

        <h3>Müştəri məlumatları</h3>

        <input
            type="text"
            id="name"
            placeholder="Ad və soyad"
        >

        <input
            type="tel"
            id="phone"
            placeholder="Telefon nömrəsi"
        >

        <textarea
            id="address"
            placeholder="Ünvan"
        ></textarea>

        <button onclick="placeOrder()">
            ✅ Sifarişi təsdiqlə
        </button>

    </div>

    <a class="back" href="sebet.html">
        ← Səbətə qayıt
    </a>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0",
    authDomain: "knd-mhsullari.firebaseapp.com",
    databaseURL: "https://knd-mhsullari-default-rtdb.firebaseio.com",
    projectId: "knd-mhsullari",
    storageBucket: "knd-mhsullari.firebasestorage.app",
    messagingSenderId: "000000000000",
    appId: "1:000000000000:web:000000000000"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);


/* =========================
   SƏBƏT
========================= */

function getCart() {

    try {

        return JSON.parse(
            localStorage.getItem("cart")
        ) || [];

    } catch (error) {

        return [];

    }

}


const cart = getCart();

const productsBox =
    document.getElementById("products");

const totalBox =
    document.getElementById("total");


let total = 0;


if (cart.length === 0) {

    productsBox.innerHTML = `
        <div class="empty">
            🛒 Səbət boşdur
        </div>
    `;

} else {

    cart.forEach(function(item) {

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;

        total += price * quantity;

        productsBox.innerHTML += `

            <div class="product">

                <img
                    src="${item.image || ''}"
                    alt="${item.name || 'Məhsul'}"
                >

                <div class="product-info">

                    <b>
                        ${item.name || 'Məhsul'}
                    </b>

                    <br>

                    ${quantity} ədəd

                    <br>

                    ${price.toFixed(2)} AZN / ədəd

                </div>

            </div>

        `;

    });

}


totalBox.innerText =
    total.toFixed(2);


/* =========================
   SİFARİŞ VER
========================= */

window.placeOrder = async function() {

    const name =
        document.getElementById("name")
        .value.trim();

    const phone =
        document.getElementById("phone")
        .value.trim();

    const address =
        document.getElementById("address")
        .value.trim();


    if (cart.length === 0) {

        alert("🛒 Səbət boşdur!");

        return;

    }


    if (!name || !phone || !address) {

        alert(
            "Zəhmət olmasa Ad, Telefon və Ünvanı doldur."
        );

        return;

    }


    const order = {

        orderId:
            "SIF-" +
            Date.now(),

        name: name,

        phone: phone,

        address: address,

        products: cart,

        total: total,

        status:
            "Sifariş qəbul edildi",

        date:
            new Date().toLocaleString("az-AZ")

    };


    try {

        /* Firebase-ə göndər */

        await push(
            ref(database, "orders"),
            order
        );


        /* orders.html üçün yadda saxla */

        let orders =
            JSON.parse(
                localStorage.getItem("orders")
            ) || [];


        orders.push(order);


        localStorage.setItem(
            "orders",
            JSON.stringify(orders)
        );


        /* Səbəti təmizlə */

        localStorage.removeItem("cart");


        alert(
            "✅ Sifarişiniz uğurla qəbul edildi!"
        );


        /* Sifarişlər səhifəsinə keç */

        window.location.href =
            "orders.html";


    } catch (error) {

        console.error(error);

        alert(
            "❌ Sifariş göndərilmədi. Firebase bağlantısını yoxla."
        );

    }

};

</script>

</body>
</html>
