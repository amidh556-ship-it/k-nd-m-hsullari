<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sifariş et</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

.box {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 15px;
}

h1 {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

.product {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
}

.product img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 8px;
}

.product-info {
    flex: 1;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    height: 90px;
    resize: none;
}

.total {
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    border: none;
    border-radius: 9px;
    background: #2e7d32;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

.back {
    display: block;
    text-align: center;
    padding: 20px;
    color: #222;
    text-decoration: none;
}

.empty {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 10px;
}

</style>

</head>

<body>

<div class="container">

<h1>📦 Sifariş et</h1>


<div class="box">

<h3>
Sifariş etdiyiniz məhsullar
</h3>

<div id="products"></div>

<div class="total">

Ümumi:
<span id="total">0.00</span>
AZN

</div>

</div>


<div class="box">

<h3>
Çatdırılma məlumatları
</h3>


<input
    type="text"
    id="name"
    placeholder="Ad və soyad"
>


<input
    type="tel"
    id="phone"
    placeholder="Telefon nömrəsi"
>


<textarea
    id="address"
    placeholder="Çatdırılma ünvanı"
></textarea>


<button onclick="placeOrder()">

📦 Sifarişi təsdiqlə və ödənişə keç

</button>

</div>


<a
    class="back"
    href="sebet.html"
>
← Səbətə qayıt
</a>

</div>


<script>

/* =========================
   SƏBƏT
========================= */

function getCart() {

    try {

        return JSON.parse(
            localStorage.getItem("cart")
        ) || [];

    } catch (error) {

        return [];

    }

}


const cart = getCart();

const productsBox =
    document.getElementById("products");

const totalBox =
    document.getElementById("total");


let total = 0;


/* =========================
   MƏHSULLAR
========================= */

if (cart.length === 0) {

    productsBox.innerHTML = `

        <div class="empty">

            🛒 Səbət boşdur

        </div>

    `;

} else {

    cart.forEach(function(item) {

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;

        total +=
            price * quantity;


        productsBox.innerHTML += `

            <div class="product">

                <img
                    src="${item.image || ''}"
                    alt="${item.name || 'Məhsul'}"
                >

                <div class="product-info">

                    <b>
                        ${item.name || "Məhsul"}
                    </b>

                    <br>

                    Say:
                    ${quantity}

                    <br>

                    ${price.toFixed(2)}
                    AZN / ədəd

                </div>

            </div>

        `;

    });

}


totalBox.innerText =
    total.toFixed(2);


/* =========================
   İZLƏMƏ KODU
========================= */

function createTrackingCode() {

    const random =
        Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();

    return "KND-" + random;

}


/* =========================
   SİFARİŞ NÖMRƏSİ
========================= */

function createOrderNumber() {

    return "SIF-" + Date.now();

}


/* =========================
   SİFARİŞ VER
========================= */

function placeOrder() {

    if (cart.length === 0) {

        alert("🛒 Səbət boşdur!");

        return;

    }


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const phone =
        document
        .getElementById("phone")
        .value
        .trim();


    const address =
        document
        .getElementById("address")
        .value
        .trim();


    if (
        name === "" ||
        phone === "" ||
        address === ""
    ) {

        alert(
            "Ad, telefon və ünvanı doldur."
        );

        return;

    }


    const order = {

        orderId:
            createOrderNumber(),

        trackingCode:
            createTrackingCode(),

        name:
            name,

        phone:
            phone,

        address:
            address,

        products:
            cart,

        total:
            total,

        status:
            "Sifariş verildi",

        step:
            1,

        paymentStatus:
            "Ödəniş gözlənilir",

        date:
            new Date().toLocaleString("az-AZ")

    };


    let orders = [];

    try {

        orders =
            JSON.parse(
                localStorage.getItem("orders")
            ) || [];

    } catch (error) {

        orders = [];

    }


    orders.push(order);


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    /* SON SİFARİŞİN İNDEKSİ */

    const selectedIndex =
        orders.length - 1;


    localStorage.setItem(
        "selectedOrder",
        selectedIndex
    );


    /* SƏBƏTİ TƏMİZLƏ */

    localStorage.removeItem("cart");


    /* ÖDƏNİŞ SƏHİFƏSİNƏ GET */

    window.location.href =
        "ödəniş.html";

}

</script>

</body>
</html>
