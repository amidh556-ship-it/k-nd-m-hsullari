<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Axtarış</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f7f6f1;
    font-family:Arial,sans-serif;
}

/* AXTARIŞ QUTUSU */

.search-box{
    width:92%;
    max-width:650px;
    margin:35px auto 20px;

    display:flex;
    align-items:center;

    background:white;

    border:1px solid #ccc;

    border-radius:30px;

    padding:5px 10px;

    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.search-box input{

    flex:1;

    border:none;

    outline:none;

    background:transparent;

    font-size:18px;

    padding:12px;
}

.search-box button{

    border:none;

    background:none;

    font-size:25px;

    cursor:pointer;

}


/* MƏHSULLAR */

#results{

    width:94%;

    max-width:700px;

    margin:10px auto;

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:12px;
}


.product{

    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 2px 8px rgba(0,0,0,0.10);

    cursor:pointer;
}


.product img{

    width:100%;

    height:180px;

    object-fit:contain;

    background:#f5f5f5;
}


.product-info{

    padding:12px;
}


.product-name{

    font-size:18px;

    font-weight:bold;

    margin-bottom:8px;
}


.product-price{

    font-size:18px;

    font-weight:bold;

    color:#263d31;
}


/* TAPILMADI */

.not-found{

    grid-column:1 / -1;

    text-align:center;

    font-size:18px;

    color:#777;

    padding:40px 10px;
}


/* TELEFON */

@media(max-width:500px){

    #results{

        grid-template-columns:repeat(2,1fr);

    }

    .product img{

        height:150px;

    }

    .product-name{

        font-size:16px;

    }

    .product-price{

        font-size:16px;

    }

}

</style>

</head>


<body>


<!-- AXTARIŞ -->

<div class="search-box">

    <input
        type="text"
        id="searchInput"
        placeholder="Məhsul axtar..."
        autocomplete="off"
    >

    <button onclick="searchProducts()">
        🔍
    </button>

</div>


<!-- NƏTİCƏLƏR -->

<div id="results"></div>


<script>


/* =========================
   MƏHSULLAR
========================= */

const products = [

    {
        name:"Maşın oyuncaq",

        price:"3.80 AZN",

        image:"https://raw.githubusercontent.com/amidh556-ship-it/k-nd-m-hsullari/main/file_00000000587c820a9a0c82fedaaa6d07.png",

        keywords:[
            "maşın",
            "masin",
            "oyuncaq",
            "avtomobil",
            "maşın oyuncaq"
        ]
    },


    {
        name:"Tato",

        price:"4.80 AZN",

        image:"",

        keywords:[
            "tato",
            "tattoo",
            "döymə",
            "doyme"
        ]
    }

];



/* =========================
   AXTARIŞ FUNKSİYASI
========================= */

function searchProducts(){

    const input =
        document.getElementById("searchInput");

    const text =
        input.value.trim().toLowerCase();

    const results =
        document.getElementById("results");


    results.innerHTML="";


    /* BOŞDURSA HEÇ NƏ GÖSTƏRMƏ */

    if(text===""){

        return;

    }


    /* MƏHSULU TAP */

    const found =
        products.filter(function(product){

            return (

                product.name
                .toLowerCase()
                .includes(text)

                ||

                product.keywords.some(function(keyword){

                    return keyword
                    .toLowerCase()
                    .includes(text);

                })

            );

        });


    /* MƏHSUL YOXDUR */

    if(found.length===0){

        results.innerHTML=`

            <div class="not-found">

                🔍 "<b>${text}</b>"
                üçün məhsul tapılmadı.

            </div>

        `;

        return;

    }


    /* MƏHSULLARI GÖSTƏR */

    found.forEach(function(product){

        const card =
            document.createElement("div");


        card.className="product";


        card.innerHTML=`

            ${
                product.image
                ?
                `<img
                    src="${product.image}"
                    alt="${product.name}"
                >`
                :
                `<div
                    style="
                    height:180px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#f5f5f5;
                    font-size:50px;
                    "
                >
                    🏷️
                </div>`
            }


            <div class="product-info">

                <div class="product-name">

                    ${product.name}

                </div>


                <div class="product-price">

                    ${product.price}

                </div>

            </div>

        `;


        /* MƏHSULA BASANDA ANA SƏHİFƏ */

        card.onclick=function(){

            window.location.href="index.html";

        };


        results.appendChild(card);

    });

}



/* =========================
   ENTER İLƏ AXTAR
========================= */

document
.getElementById("searchInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){

            searchProducts();

        }

    }
);



/* =========================
   YAZDIQCA AXTAR
========================= */

document
.getElementById("searchInput")
.addEventListener(
    "input",
    function(){

        searchProducts();

    }
);


</script>


</body>

</html>
