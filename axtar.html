<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axtarış</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.search-box {
    display: flex;
    width: 90%;
    max-width: 500px;
    margin: 80px auto;
    border: 1px solid #ccc;
    border-radius: 25px;
    padding: 5px 10px;
}

.search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    padding: 10px;
}

.search-box button {
    border: none;
    background: none;
    font-size: 22px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="search-box">
    <input type="text" placeholder="Axtar">
    <button>🔍</button>
</div>

</body>
</html>
