<div class="menu">

    <p onclick="showPage('orders')">
        Sifarişlərin
    </p>

    <p onclick="showPage('comments')">
        Yorumların
    </p>

    <p onclick="showPage('profil')">
        Profilin
    </p>

    <p onclick="showPage('history')">
        🕘 Tarixçə
    </p>

</div>


<div class="content">


    <!-- SİFARİŞLƏR -->

    <div id="orders" class="page">

        <h2>Sifarişlərin</h2>

        <p>
            Sifarişlər burada çıxacaq
        </p>

    </div>


    <!-- YORUMLAR -->

    <div id="comments" class="page">

        <h2>Yorumların</h2>

        <p>
            Yorumlar burada çıxacaq
        </p>

    </div>


    <!-- PROFİL -->

    <div id="profil" class="page">

        <h2>Profilin</h2>

        <p>
            Ad Soyad burada çıxacaq
        </p>

    </div>


    <!-- TARİXÇƏ -->

    <div id="history" class="page">

        <h2>🕘 Axtarış tarixçəsi</h2>

        <div id="historyList">

            <p>
                Tarixçə yüklənir...
            </p>

        </div>

    </div>


</div>


<script>

/* =========================
   SƏHİFƏ DƏYİŞDİRMƏ
========================= */

function showPage(pageId){

    const pages =
        document.querySelectorAll(".page");


    pages.forEach(function(page){

        page.style.display = "none";

    });


    const selected =
        document.getElementById(pageId);


    if(selected){

        selected.style.display = "block";

    }


    /* TARİXÇƏYƏ BASANDA YENİDƏN YÜKLƏ */

    if(pageId === "history"){

        loadHistory();

    }

}


/* =========================
   HESAB KEY
========================= */

function getHistoryKey(){

    const email =
        localStorage.getItem("userEmail");


    if(!email){

        return null;

    }


    return email
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]/g,
            "_"
        );

}


/* =========================
   TARİXÇƏ
========================= */

function loadHistory(){

    const list =
        document.getElementById("historyList");


    if(!list){

        return;

    }


    const email =
        localStorage.getItem("userEmail");


    if(!email){

        list.innerHTML = `
            <p>
                Hesabına daxil olmalısan.
            </p>
        `;

        return;

    }


    const key =
        getHistoryKey();


    if(!key){

        list.innerHTML = `
            <p>
                Hesab məlumatı tapılmadı.
            </p>
        `;

        return;

    }


    let history = [];


    /* TARİXÇƏNİ OXU */

    try{

        const saved =
            localStorage.getItem(
                "history_" + key
            );


        if(saved){

            history =
                JSON.parse(saved);

        }

    }catch(error){

        console.log(
            "Tarixçə oxunarkən xəta:",
            error
        );

        history = [];

    }


    /* TARİXÇƏ BOŞDUR */

    if(
        !Array.isArray(history)
        ||
        history.length === 0
    ){

        list.innerHTML = `
            
            <div style="
                background:white;
                padding:25px;
                border-radius:15px;
                text-align:center;
                color:#777;
                margin-top:15px;
            ">

                🕘

                <br><br>

                Hələ baxdığın məhsul yoxdur.

                <br><br>

                Məhsula daxil olduqda
                burada görünəcək.

            </div>

        `;

        return;

    }


    /* SİYAHINI TƏMİZLƏ */

    list.innerHTML = "";


    /* MƏHSULLARI GÖSTƏR */

    history.forEach(function(item){

        const div =
            document.createElement("div");


        div.style.background =
            "#fff";

        div.style.padding =
            "12px";

        div.style.marginBottom =
            "10px";

        div.style.borderRadius =
            "14px";

        div.style.display =
            "flex";

        div.style.alignItems =
            "center";

        div.style.gap =
            "12px";

        div.style.boxShadow =
            "0 2px 8px rgba(0,0,0,.08)";

        div.style.cursor =
            "pointer";


        const image =
            item.image || "";


        const name =
            item.name ||
            "Məhsul";


        const price =
            item.price !== undefined
            ?
            item.price + " AZN"
            :
            "";


        div.innerHTML = `

            <img
                src="${image}"
                style="
                    width:80px;
                    height:80px;
                    object-fit:contain;
                    border-radius:10px;
                    background:#f5f5f5;
                "
                onerror="
                    this.style.display='none';
                "
            >


            <div style="
                flex:1;
            ">

                <div style="
                    font-size:17px;
                    font-weight:bold;
                    color:#222;
                    margin-bottom:7px;
                ">

                    ${escapeHistoryText(name)}

                </div>


                <div style="
                    color:#263b2b;
                    font-weight:bold;
                ">

                    ${escapeHistoryText(price)}

                </div>


                <div style="
                    color:#999;
                    font-size:12px;
                    margin-top:6px;
                ">

                    Məhsula baxmısınız

                </div>

            </div>


            <div style="
                font-size:25px;
                color:#999;
            ">

                ›

            </div>

        `;


        /* MƏHSULA GERİ QAYIT */

        div.onclick = function(){

            if(item.productId){

                window.location.href =
                    "al.html?id=" +
                    encodeURIComponent(
                        item.productId
                    );

            }

        };


        list.appendChild(div);

    });

}


/* =========================
   TƏHLÜKƏSİZ MƏTN
========================= */

function escapeHistoryText(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   İLK AÇILIŞ
========================= */

showPage("profil");

</script>


<script src="profile.js"></script>
