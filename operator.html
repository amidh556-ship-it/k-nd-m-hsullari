
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kənd məhsulları — Operator</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#222}
header{background:#111827;color:white;padding:17px;text-align:center;font-size:20px;font-weight:bold}
.container{width:94%;max-width:700px;margin:18px auto}
.box{background:white;border-radius:15px;padding:16px;margin-bottom:15px;box-shadow:0 3px 12px #0001}
input{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:16px}
button{cursor:pointer;font-size:16px}
.login-btn,.logout{width:100%;padding:13px;border:0;border-radius:9px;color:white;font-weight:bold;margin-top:8px}
.login-btn{background:#16803c}
.logout{background:#d93025}
.hidden{display:none!important}
.email{font-weight:bold;overflow-wrap:anywhere}
.error{color:#c00;margin-top:10px}
.customer-row{padding:15px;border:1px solid #ddd;border-radius:12px;margin-top:12px;cursor:pointer;background:#fff}
.customer-row:active{background:#eaf5ec}
.preview{font-size:14px;color:#666;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-time{font-size:12px;color:#888;margin-top:5px}
#conversation{position:fixed;inset:0;background:#f3f4f6;z-index:1000;display:flex;flex-direction:column}
.chat-header{background:#111827;color:white;padding:12px;display:flex;align-items:center;gap:12px;min-height:65px}
.back-btn{background:transparent;color:white;border:0;font-size:25px;padding:5px 10px}
.chat-email{font-size:15px;overflow-wrap:anywhere;flex:1}
.messages{flex:1;overflow-y:auto;padding:12px;background:#f3f4f6}
.msg{max-width:88%;padding:12px;border-radius:13px;margin:9px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.customer{background:white;border:1px solid #ddd;margin-right:auto}
.msg.operator{background:#dff5df;margin-left:auto}
.msg small{display:block;font-size:11px;color:#777;margin-bottom:8px}
.send-area{display:flex;gap:8px;padding:10px;background:white;border-top:1px solid #ddd;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.send-area input{flex:1;min-width:0}
.send-area button{background:#16803c;color:white;border:0;border-radius:10px;padding:0 18px;font-weight:bold}
.empty{text-align:center;background:white;padding:20px;border-radius:12px}
</style>
</head>

<body>
<header>💬 Kənd məhsulları — Operator</header>

<div class="container">

<div id="loginBox" class="box">
<h2>Operator hesabına daxil olun</h2>
<form id="loginForm">
<input id="loginEmail" type="email" placeholder="Operator Gmail" required autocomplete="username">
<br><br>
<input id="loginPassword" type="password" placeholder="Parol" required autocomplete="current-password">
<button class="login-btn">Daxil ol</button>
</form>
<div id="loginError" class="error"></div>
</div>

<div id="panel" class="hidden">
<div class="box">
<b>Operator:</b>
<div id="operatorEmail" class="email"></div>
<button id="logout" class="logout">Çıxış</button>
</div>

<div class="box">
<h3>💬 Müştərilərlə yazışma</h3>
<input id="search" placeholder="Müştəri adı və ya emaili ilə axtar">
<div id="customerList" style="margin-top:12px">Yazışmalar yüklənir...</div>
</div>
</div>

</div>

<div id="conversation" class="hidden">
<div class="chat-header">
<button id="back" class="back-btn">‹</button>
<div id="chatEmail" class="chat-email"></div>
</div>
<div id="messages" class="messages"></div>
<form id="sendForm" class="send-area">
<input id="messageInput" placeholder="Mesajınızı yazın..." autocomplete="off" required>
<button type="submit">Göndər</button>
</form>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,push,get} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",
 authDomain:"kendmehsullari-6a53d.firebaseapp.com",
 databaseURL:"https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",
 projectId:"kendmehsullari-6a53d",
 storageBucket:"kendmehsullari-6a53d.firebasestorage.app",
 messagingSenderId:"551607499773",
 appId:"1:551607499773:web:a84aa63dc5b55c38687794"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const operators={
 "ttik66006@gmail.com":"ÖZ_ƏVVƏLKİ_PAROLUNU_YAZ",
 "amallizad72@gmail.com":"ÖZ_ƏVVƏLKİ_PAROLUNU_YAZ"
};

const $=id=>document.getElementById(id);
let currentOperator="";
let selectedEmail="";
let allMessages={};
let stopMessages=null;
let customerNames={};

// Müştəri adlarını Firebase-dən yüklə
async function loadCustomerNames(){
 customerNames={};

 try{
  const snap=await get(ref(db,"users"));

  if(snap.exists()){
   const users=snap.val();

   Object.values(users).forEach(user=>{
    if(!user||!user.email)return;

    const email=String(user.email).trim().toLowerCase();
    const name=user.name||user.displayName||user.fullName;

    if(name){
     customerNames[email]=String(name);
    }
   });
  }
 }catch(error){
  console.error("Müştəri adları yüklənmədi:",error);
 }
}

// Emailə uyğun müştəri adını tap
function getCustomerName(email){
 return customerNames[String(email).trim().toLowerCase()]||email;
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[c]));
}

function customerEmail(m){
 return String(m.email||m.userEmail||m.customerEmail||"").trim().toLowerCase();
}

function isOperator(m){
 return ["operator","agent","admin"].includes(
 String(m.sender||m.from||"").toLowerCase()
 );
}

$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const email=$("loginEmail").value.trim().toLowerCase();
 const password=$("loginPassword").value;

 if(!Object.prototype.hasOwnProperty.call(operators,email)){
  $("loginError").textContent="Bu email operator hesabı deyil.";
  return;
 }

 if(operators[email]!==password){
  $("loginError").textContent="Parol yanlışdır.";
  return;
 }

 currentOperator=email;
 $("operatorEmail").textContent=email;
 $("loginPassword").value="";
 $("loginError").textContent="";
 $("loginBox").classList.add("hidden");
 $("panel").classList.remove("hidden");

 await loadCustomerNames();

 if(!stopMessages){
  stopMessages=onValue(ref(db,"messages"),snap=>{
   allMessages=snap.val()||{};
   renderList();
   if(selectedEmail)renderConversation();
  },error=>{
   $("customerList").textContent="Mesajları yükləmək olmadı. Firebase qaydalarını yoxlayın.";
   console.error(error);
  });
 }
});

$("logout").addEventListener("click",()=>{
 if(stopMessages){stopMessages();stopMessages=null;}
 currentOperator="";
 selectedEmail="";
 allMessages={};
 customerNames={};
 $("panel").classList.add("hidden");
 $("loginBox").classList.remove("hidden");
 $("conversation").classList.add("hidden");
 $("customerList").innerHTML="";
 $("loginEmail").value="";
 $("loginPassword").value="";
});

function groupedMessages(){
 const groups={};

 Object.entries(allMessages).forEach(([id,m])=>{
  if(!m||typeof m!=="object")return;
  const email=customerEmail(m);
  if(!email)return;
  if(!groups[email])groups[email]=[];
  groups[email].push({id,...m});
 });

 for(const email in groups){
  groups[email].sort((a,b)=>
   Number(a.time||a.timestamp||a.createdAt||0)-
   Number(b.time||b.timestamp||b.createdAt||0)
  );
 }
 return groups;
}

function renderList(){
 const list=$("customerList");
 const groups=groupedMessages();
 const filter=$("search").value.trim().toLowerCase();

 const emails=Object.keys(groups)
  .filter(email=>
   email.includes(filter)||
   getCustomerName(email).toLowerCase().includes(filter)
  )
  .sort((a,b)=>{
   const aa=groups[a],bb=groups[b];
   return Number(bb.at(-1)?.time||bb.at(-1)?.timestamp||0)-
          Number(aa.at(-1)?.time||aa.at(-1)?.timestamp||0);
  });

 if(!emails.length){
  list.innerHTML='<div class="empty">Yazışma tapılmadı.</div>';
  return;
 }

 list.innerHTML=emails.map(email=>{
  const last=groups[email].at(-1);
  const text=last.message??last.text??last.content??"";
  const time=Number(last.time||last.timestamp||last.createdAt||0);
  const date=time?new Date(time).toLocaleString("az-AZ"):"";

  return `
   <div class="customer-row" data-email="${esc(email)}">
    <div class="email">👤 ${esc(getCustomerName(email))}</div>
    <div class="preview">${isOperator(last)?"Siz: ":""}${esc(text||"Mesaj")}</div>
    <div class="row-time">${esc(date)} · Söhbəti açmaq üçün basın</div>
   </div>`;
 }).join("");

 list.querySelectorAll(".customer-row").forEach(row=>{
  row.addEventListener("click",()=>{
   selectedEmail=row.dataset.email;
   $("chatEmail").textContent=getCustomerName(selectedEmail);
   $("conversation").classList.remove("hidden");
   renderConversation();
  });
 });
}

function renderConversation(){
 const groups=groupedMessages();
 const messages=groups[selectedEmail]||[];
 const box=$("messages");

 $("chatEmail").textContent=getCustomerName(selectedEmail);

 box.innerHTML=messages.map(m=>{
  const operator=isOperator(m);
  const text=m.message??m.text??m.content??"";
  const time=Number(m.time||m.timestamp||m.createdAt||0);
  const date=time?new Date(time).toLocaleString("az-AZ"):"";

  return `<div class="msg ${operator?"operator":"customer"}">
   <small>${operator?"Operator":"Müştəri"} ${esc(date)}</small>
   ${esc(text)}
  </div>`;
 }).join("")||'<div class="empty">Bu söhbətdə mesaj yoxdur.</div>';

 box.scrollTop=box.scrollHeight;
}

$("back").addEventListener("click",()=>{
 selectedEmail="";
 $("conversation").classList.add("hidden");
 renderList();
});

$("search").addEventListener("input",renderList);

$("sendForm").addEventListener("submit",async e=>{
 e.preventDefault();

 if(!currentOperator||!selectedEmail)return;

 const input=$("messageInput");
 const message=input.value.trim();
 if(!message)return;

 const button=e.submitter;
 button.disabled=true;

 const now=Date.now();

 try{
  await push(ref(db,"messages"),{
   sender:"agent",
   from:"operator",
   type:"text",
   message,
   text:message,
   email:selectedEmail,
   customerEmail:selectedEmail,
   operatorEmail:currentOperator,
   time:now,
   timestamp:now,
   createdAt:now
  });
  input.value="";
 }catch(error){
  console.error(error);
  alert("Mesaj göndərilmədi. Firebase Database qaydalarını yoxlayın.");
 }finally{
  button.disabled=false;
  input.focus();
 }
});
</script>
</body>
</html>
