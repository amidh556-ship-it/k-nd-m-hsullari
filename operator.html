<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Operator Paneli</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
}

#login{
    width:90%;
    max-width:400px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:18px;
    text-align:center;
}

#googleLogin{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#4285f4;
    color:white;
    font-size:16px;
}

#error{
    color:red;
    margin-top:15px;
}

#operatorPanel{
    width:95%;
    max-width:750px;
    margin:20px auto;
    background:white;
    border-radius:18px;
    overflow:hidden;
}

.header{
    background:#111827;
    color:white;
    padding:18px;
}

.header h2{
    margin:0 0 5px;
}

#status{
    padding:10px 15px;
    color:#666;
}

#notification{
    display:none;
    margin:10px;
    padding:15px;
    border-radius:12px;
    background:#fff3cd;
    color:#664d03;
    font-weight:bold;
}

#orders{
    padding:12px;
}

.order{
    background:#f8fafc;
    border:1px solid #ddd;
    border-radius:14px;
    padding:15px;
    margin-bottom:12px;
}

.order.new{
    border:2px solid #16a34a;
}

.order-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.order-info{
    line-height:1.6;
    font-size:14px;
}

.product-line{
    background:white;
    padding:8px;
    margin-top:6px;
    border-radius:8px;
    border:1px solid #eee;
}

#messages{
    height:350px;
    overflow-y:auto;
    padding:15px;
    background:#f8fafc;
}

.message{
    max-width:80%;
    padding:12px 14px;
    margin-bottom:10px;
    border-radius:14px;
    word-break:break-word;
}

.customer{
    background:#e5e7eb;
    color:#111;
    margin-right:auto;
}

.agent{
    background:#2563eb;
    color:white;
    margin-left:auto;
}

.sender{
    font-size:11px;
    opacity:.7;
    margin-bottom:5px;
}

.bottom{
    display:flex;
    gap:7px;
    padding:12px;
    border-top:1px solid #ddd;
}

#messageInput{
    flex:1;
    min-width:0;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

#sendMessage{
    padding:0 15px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
}

#recordButton{
    width:50px;
    border:0;
    border-radius:10px;
    background:#dc2626;
    color:white;
    font-size:20px;
}

#recordButton.recording{
    background:#16a34a;
}

#logout{
    margin:0 12px 15px;
    padding:10px 18px;
    border:0;
    border-radius:9px;
    background:#ef4444;
    color:white;
}

.section-title{
    padding:15px;
    margin:0;
    border-bottom:1px solid #ddd;
}

.empty{
    text-align:center;
    padding:25px;
    color:#777;
}

.status-select{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
}

</style>

</head>


<body>


<div id="login">

    <h2>👨‍💼 Operator paneli</h2>

    <p>Operator hesabına daxil olun.</p>

    <button id="googleLogin">
        Google ilə daxil ol
    </button>

    <div id="error"></div>

</div>



<div id="operatorPanel"
     style="display:none;">


    <div class="header">

        <h2>Operator 💬</h2>

        <p id="operatorEmail"></p>

    </div>


    <div id="status">
        🟢 Sistem aktivdir
    </div>


    <div id="notification">

        🔔 Yeni sifariş gəldi!

    </div>


    <h3 class="section-title">

        📦 Bütün müştəri sifarişləri

    </h3>


    <div id="orders">

        <div class="empty">

            Sifarişlər yüklənir...

        </div>

    </div>


    <h3 class="section-title">

        💬 Müştəri yazışmaları

    </h3>


    <div id="messages"></div>


    <div class="bottom">

        <input
            id="messageInput"
            type="text"
            placeholder="Mesajınızı yazın..."
        >

        <button
            id="recordButton"
            type="button">

            🎙️

        </button>


        <button
            id="sendMessage"
            type="button">

            Göndər

        </button>

    </div>


    <button id="logout">

        Çıxış

    </button>


</div>



<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    onValue,
    set,
    update
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain:
    "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
    "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
    "kendmehsullari-6a53d",

    storageBucket:
    "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
    "551607499773",

    appId:
    "1:551607499773:web:a84aa63dc5b55c38687794"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getDatabase(app);


const provider =
    new GoogleAuthProvider();



/* =========================
   OPERATOR HESABI
========================= */

const OPERATOR_EMAILS = [

    "amidh365@gmail.com"

];



/* =========================
   FIREBASE REFERANSLARI
========================= */

const messagesRef =
    ref(db,"messages");


const ordersRef =
    ref(db,"orders");


const operatorRef =
    ref(db,"operatorOnline");



/* =========================
   ELEMENTLƏR
========================= */

const login =
    document.getElementById("login");


const panel =
    document.getElementById("operatorPanel");


const errorBox =
    document.getElementById("error");


const emailText =
    document.getElementById("operatorEmail");


const messages =
    document.getElementById("messages");


const ordersBox =
    document.getElementById("orders");


const input =
    document.getElementById("messageInput");


const sendButton =
    document.getElementById("sendMessage");


const recordButton =
    document.getElementById("recordButton");


const notification =
    document.getElementById("notification");



let currentOperator = null;

let messagesStarted = false;

let ordersStarted = false;

let firstOrdersLoad = true;

let recorder = null;

let audioChunks = [];

let recording = false;



/* =========================
   GOOGLE GİRİŞ
========================= */

document
.getElementById("googleLogin")
.onclick =
async function(){

    try{

        const result =
            await signInWithPopup(
                auth,
                provider
            );


        const user =
            result.user;


        const email =
            (user.email || "")
            .toLowerCase()
            .trim();


        if(
            !OPERATOR_EMAILS.includes(email)
        ){

            await signOut(auth);


            errorBox.textContent =
                "Bu Gmail operator hesabı deyil.";


            return;

        }


        openOperator(user);


    }catch(error){

        console.error(error);


        errorBox.textContent =
            error.message;

    }

};



/* =========================
   PANELİ AÇ
========================= */

function openOperator(user){

    currentOperator =
        user;


    login.style.display =
        "none";


    panel.style.display =
        "block";


    emailText.textContent =
        "Operator: " +
        user.email;


    set(
        operatorRef,
        true
    );


    loadMessages();

    loadOrders();

}



/* =========================
   SİFARİŞLƏR
========================= */

function loadOrders(){

    if(ordersStarted)
        return;


    ordersStarted = true;


    onChildAdded(

        ordersRef,

        function(snapshot){

            const order =
                snapshot.val();


            if(!order)
                return;


            showOrder(
                snapshot.key,
                order
            );


            /*
              İlk dəfə səhifə açılarkən
              köhnə sifarişlər bildiriş
              verməsin.
            */

            if(firstOrdersLoad){

                return;

            }


            newOrderNotification(
                order
            );

        }

    );


    /*
      Mövcud sifarişlərin ilk
      yüklənməsini bitir.
    */

    setTimeout(
        function(){

            firstOrdersLoad =
                false;

        },
        1500
    );

}



/* =========================
   SİFARİŞ GÖSTƏR
========================= */

function showOrder(
    orderKey,
    order
){

    const old =
        document.getElementById(
            "order-" + orderKey
        );


    if(old)
        return;


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "order";


    div.id =
        "order-" +
        orderKey;


    let productsHTML =
        "";


    if(
        Array.isArray(
            order.products
        )
    ){

        order.products.forEach(
            function(product){

                const quantity =
                    Number(
                        product.quantity
                    ) || 1;


                const price =
                    Number(
                        product.price
                    ) || 0;


                productsHTML += `

                    <div class="product-line">

                        📦
                        <b>
                            ${escapeHTML(
                                product.name ||
                                "Məhsul"
                            )}
                        </b>

                        <br>

                        Say:
                        ${quantity}

                        <br>

                        Qiymət:
                        ${price.toFixed(2)}
                        AZN

                    </div>

                `;

            }
        );

    }



    div.innerHTML = `

        <div class="order-title">

            🔔 Sifariş:
            ${escapeHTML(
                order.orderId ||
                orderKey
            )}

        </div>


        <div class="order-info">

            👤
            <b>Müştəri:</b>
            ${escapeHTML(
                order.name || "-"
            )}

            <br>

            📧
            <b>Email:</b>
            ${escapeHTML(
                order.email || "-"
            )}

            <br>

            📞
            <b>Telefon:</b>
            ${escapeHTML(
                order.phone || "-"
            )}

            <br>

            📍
            <b>Ünvan:</b>
            ${escapeHTML(
                order.address || "-"
            )}

            <br>

            💰
            <b>Ümumi:</b>
            ${Number(
                order.total || 0
            ).toFixed(2)}
            AZN

            <br>

            🎫
            <b>İzləmə kodu:</b>
            ${escapeHTML(
                order.trackingCode || "-"
            )}

            <br>

            🕒
            ${escapeHTML(
                order.date || "-"
            )}

        </div>


        <div style="margin-top:10px;">

            <b>🛒 Məhsullar:</b>

            ${productsHTML}

        </div>


        <select
            class="status-select"
            data-order-key="${orderKey}"
        >

            <option value="Sifariş qəbul edildi">
                Sifariş qəbul edildi
            </option>

            <option value="Hazırlanır">
                Hazırlanır
            </option>

            <option value="Yola verildi">
                Yola verildi
            </option>

            <option value="Çatdırılır">
                Çatdırılır
            </option>

            <option value="Çatdırıldı">
                Çatdırıldı
            </option>

        </select>

    `;


    ordersBox.prepend(
        div
    );


    const select =
        div.querySelector(
            ".status-select"
        );


    select.value =
        order.status ||
        "Sifariş qəbul edildi";


    select.addEventListener(
        "change",
        async function(){

            const newStatus =
                this.value;


            try{

                await update(

                    ref(
                        db,
                        "orders/" +
                        orderKey
                    ),

                    {
                        status:
                            newStatus
                    }

                );


                alert(
                    "✅ Sifariş statusu dəyişdirildi."
                );


            }catch(error){

                console.error(error);


                alert(
                    "❌ Status dəyişdirilmədi."
                );

            }

        }
    );

}



/* =========================
   YENİ SİFARİŞ BİLDİRİŞİ
========================= */

function newOrderNotification(order){

    notification.style.display =
        "block";


    notification.innerHTML = `

        🔔 <b>Yeni sifariş gəldi!</b>

        <br>

        👤
        ${escapeHTML(
            order.name || "Müştəri"
        )}

        — 📦
        ${escapeHTML(
            order.orderId || "Sifariş"
        )}

        — 💰
        ${Number(
            order.total || 0
        ).toFixed(2)}
        AZN

    `;


    /*
      Telefon brauzer bildirişi
    */

    if(
        "Notification" in window &&
        Notification.permission ===
        "granted"
    ){

        new Notification(
            "🔔 Yeni sifariş gəldi!",
            {
                body:
                    (order.name || "Müştəri") +
                    " — " +
                    Number(
                        order.total || 0
                    ).toFixed(2) +
                    " AZN"
            }
        );

    }


    /*
      Səsli xəbərdarlıq
    */

    try{

        const audio =
            new Audio(
                "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA="
            );

        audio.play()
        .catch(
            function(){}
        );

    }catch(error){}


    setTimeout(
        function(){

            notification.style.display =
                "none";

        },
        10000
    );

}



/* =========================
   BİLDİRİŞ İCAZƏSİ
========================= */

async function requestNotificationPermission(){

    if(
        "Notification" in window &&
        Notification.permission ===
        "default"
    ){

        try{

            await Notification.requestPermission();

        }catch(error){}

    }

}



/* =========================
   MESAJLAR
========================= */

function loadMessages(){

    if(messagesStarted)
        return;


    messagesStarted = true;


    onChildAdded(

        messagesRef,

        function(snapshot){

            const data =
                snapshot.val();


            if(!data)
                return;


            if(
                data.sender !==
                "customer" &&
                data.sender !==
                "agent"
            ){

                return;

            }


            const message =
                document.createElement(
                    "div"
                );


            message.classList.add(
                "message"
            );


            if(
                data.sender ===
                "customer"
            ){

                message.classList.add(
                    "customer"
                );

            }else{

                message.classList.add(
                    "agent"
                );

            }


            message.innerHTML = `

                <div class="sender">

                    ${
                        data.sender ===
                        "customer"
                        ?
                        "Müştəri"
                        :
                        "Operator"
                    }

                </div>

                ${
                    escapeHTML(
                        data.text ||
                        ""
                    )
                }

            `;


            messages.appendChild(
                message
            );


            messages.scrollTop =
                messages.scrollHeight;

        }

    );

}



/* =========================
   MESAJ GÖNDƏR
========================= */

sendButton.onclick =
async function(){

    const text =
        input.value.trim();


    if(!text)
        return;


    try{

        await push(

            messagesRef,

            {

                sender:
                    "agent",

                text:
                    text,

                email:
                    currentOperator
                    ?
                    currentOperator.email
                    :
                    "",

                createdAt:
                    Date.now()

            }

        );


        input.value = "";


    }catch(error){

        console.error(error);


        alert(
            "❌ Mesaj göndərilmədi."
        );

    }

};



/* ENTER İLƏ GÖNDƏR */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendButton.click();

        }

    }
);



/* =========================
   SƏS YAZISI
========================= */

recordButton.onclick =
async function(){

    if(!navigator.mediaDevices)
        return;


    if(recording){

        if(recorder){

            recorder.stop();

        }

        return;

    }


    try{

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({
                audio:true
            });


        recorder =
            new MediaRecorder(
                stream
            );


        audioChunks = [];


        recorder.ondataavailable =
        function(event){

            if(event.data.size > 0){

                audioChunks.push(
                    event.data
                );

            }

        };


        recorder.onstop =
        function(){

            stream
            .getTracks()
            .forEach(
                track =>
                track.stop()
            );


            recording =
                false;


            recordButton
            .classList
            .remove(
                "recording"
            );


            recordButton.textContent =
                "🎙️";

        };


        recorder.start();


        recording =
            true;


        recordButton
        .classList
        .add(
            "recording"
        );


        recordButton.textContent =
            "⏹️";


    }catch(error){

        console.error(error);


        alert(
            "🎙️ Mikrofona icazə verilmədi."
        );

    }

};



/* =========================
   ÇIXIŞ
========================= */

document
.getElementById("logout")
.onclick =
async function(){

    try{

        await set(
            operatorRef,
            false
        );

        await signOut(
            auth
        );


        panel.style.display =
            "none";


        login.style.display =
            "block";


        messages.innerHTML =
            "";


        ordersBox.innerHTML =
            "";


        currentOperator =
            null;


    }catch(error){

        console.error(error);

    }

};



/* =========================
   AUTH YOXLA
========================= */

onAuthStateChanged(

    auth,

    function(user){

        if(!user)
            return;


        const email =
            (user.email || "")
            .toLowerCase()
            .trim();


        if(
            OPERATOR_EMAILS
            .includes(email)
        ){

            openOperator(
                user
            );

        }

    }

);



/* =========================
   HTML TƏHLÜKƏSİNDƏN QORUNMA
========================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   BİLDİRİŞ İCAZƏSİ
========================= */

requestNotificationPermission();


</script>

</body>

</html>
