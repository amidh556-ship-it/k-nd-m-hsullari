<title>Operator Paneli</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
}

#login{
    width:90%;
    max-width:400px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:18px;
    text-align:center;
}

#googleLogin{

#error{

#operatorPanel{

}

#messages{

}

.message{
    max-width:80%;
    padding:12px 14px;
    margin-bottom:10px;
    border-radius:14px;
    word-break:break-word;
}

.customer{
    background:#e5e7eb;
    color:#111;
    margin-right:auto;
}

.agent{
    background:#2563eb;
    color:white;
    margin-left:auto;
}

.sender{
    font-size:11px;
    opacity:.7;
    margin-bottom:5px;
}

audio{
    width:240px;
    max-width:100%;
}

.bottom{
    display:flex;
    gap:7px;
    padding:12px;
    border-top:1px solid #ddd;
}

#messageInput{
    flex:1;
    min-width:0;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

#sendMessage{
    padding:0 15px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
}

#recordButton{
    width:50px;
    border:0;
    border-radius:10px;
    background:#dc2626;
    color:white;
    font-size:20px;
}

#recordButton.recording{
    background:#16a34a;
}

#logout{
    margin:0 12px 15px;
    padding:10px 18px;
    border:0;
    border-radius:9px;
    background:#ef4444;
    color:white;
}
</style>

    <div class="bottom">

        <input

            type="text"

        >

        <button
            id="recordButton"
            type="button">
            🎙️
        </button>

        <button
            id="sendMessage"
            type="button">
            Göndər

    </div>

    <button id="logout">
        Çıxış

document.getElementById("googleLogin").onclick =
async function(){

    try{

        const result =
            await signInWithPopup(
                auth,
                provider
            );

        const user =
            result.user;

        const email =
            (user.email || "")
            .toLowerCase()
            .trim();

        if(
            !OPERATOR_EMAILS.includes(email)
        ){

            await signOut(auth);

            errorBox.textContent =
                "Bu Gmail operator hesabı deyil.";

            return;
        }

        openOperator(user);

    }catch(error){

        console.error(error);

        errorBox.textContent =
            error.message;

    }

};


/* PANEL */

    currentOperator = user;

    login.style.display = "none";

    panel.style.display = "block";

    emailText.textContent =
        "Operator: " + user.email;

    set(operatorRef,true);

    loadMessages();

}
