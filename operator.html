<!DOCTYPE html>
<html lang="az">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Operator Paneli</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
}

#login{
    width:90%;
    max-width:400px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

#googleLogin{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#4285f4;
    color:white;
    font-size:16px;
}

#error{
    margin-top:15px;
    color:#d32f2f;
    word-break:break-word;
}

#operatorPanel{
    width:95%;
    max-width:700px;
    margin:20px auto;
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.header{
    background:#111827;
    color:white;
    padding:18px;
}

.header h2{
    margin:0 0 5px;
}

.header p{
    margin:0;
    font-size:13px;
}

#status{
    padding:10px 15px;
    color:#666;
    font-size:13px;
}

#messages{
    height:450px;
    overflow-y:auto;
    padding:15px;
    background:#f8fafc;
}

.message{
    max-width:80%;
    padding:11px 14px;
    margin-bottom:10px;
    border-radius:14px;
    word-break:break-word;
}

.customer{
    background:#e5e7eb;
    color:#111;
    margin-right:auto;
}

.agent{
    background:#2563eb;
    color:white;
    margin-left:auto;
}

.sender{
    font-size:11px;
    opacity:.7;
    margin-bottom:5px;
}

audio{
    width:240px;
    max-width:100%;
}

.bottom{
    display:flex;
    gap:7px;
    padding:12px;
    border-top:1px solid #ddd;
}

#messageInput{
    flex:1;
    min-width:0;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
}

#sendMessage{
    padding:0 15px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
}

#recordButton{
    width:50px;
    border:0;
    border-radius:10px;
    background:#dc2626;
    color:white;
    font-size:20px;
}

#recordButton.recording{
    background:#16a34a;
}

#logout{
    margin:0 12px 15px;
    padding:10px 18px;
    border:0;
    border-radius:9px;
    background:#ef4444;
    color:white;
}

</style>

</head>

<body>


<div id="login">

    <h2>👨‍💼 Operator paneli</h2>

    <p>
        Operator hesabına daxil olun.
    </p>

    <button id="googleLogin">
        Google ilə daxil ol
    </button>

    <div id="error"></div>

</div>


<div id="operatorPanel"
     style="display:none;">

    <div class="header">

        <h2>Operator 💬</h2>

        <p id="operatorEmail"></p>

    </div>


    <div id="status">
        🟢 Yazışmalar aktivdir
    </div>


    <div id="messages"></div>


    <div class="bottom">

        <input
            id="messageInput"
            type="text"
            placeholder="Mesajınızı yazın..."
        >

        <button
            id="recordButton"
            type="button">
            🎙️
        </button>

        <button
            id="sendMessage"
            type="button">
            Göndər
        </button>

    </div>


    <button id="logout">
        Çıxış
    </button>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    set
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


import {
    getStorage,
    ref as storageRef,
    uploadBytes,
    getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain:
    "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
    "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
    "kendmehsullari-6a53d",

    storageBucket:
    "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
    "551607499773",

    appId:
    "1:551607499773:web:a84aa63dc5b55c38687794"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);

const storage =
    getStorage(app);

const provider =
    new GoogleAuthProvider();


/* =========================
   İKİ OPERATOR
========================= */

const OPERATOR_EMAILS = [

    "ttik66006@gmail.com",

    "amallizad72@gmail.com"

];


const messagesRef =
    ref(db,"messages");

const operatorRef =
    ref(db,"operatorOnline");


/* =========================
   ELEMENTLƏR
========================= */

const login =
    document.getElementById("login");

const panel =
    document.getElementById("operatorPanel");

const errorBox =
    document.getElementById("error");

const emailText =
    document.getElementById("operatorEmail");

const messages =
    document.getElementById("messages");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendMessage");

const recordButton =
    document.getElementById("recordButton");


let currentOperator = null;

let messagesStarted = false;

let recorder = null;

let audioChunks = [];

let recording = false;


/* =========================
   GOOGLE GİRİŞ
========================= */

document
.getElementById("googleLogin")
.onclick =
async function(){

    errorBox.textContent = "";

    try{

        const result =
            await signInWithPopup(
                auth,
                provider
            );


        const user =
            result.user;


        const email =
            (user.email || "")
            .trim()
            .toLowerCase();


        if(
            !OPERATOR_EMAILS.includes(
                email
            )
        ){

            await signOut(auth);

            errorBox.textContent =
                "Bu Gmail operator hesabı deyil.";

            return;

        }


        openOperator(user);


    }catch(error){

        console.error(error);

        errorBox.textContent =
            "Giriş xətası: " +
            error.message;

    }

};


/* =========================
   OPERATOR PANELİ
========================= */

function openOperator(user){

    currentOperator = user;

    login.style.display =
        "none";

    panel.style.display =
        "block";

    emailText.textContent =
        "Operator: " +
        user.email;

    set(
        operatorRef,
        true
    );

    loadMessages();

}


/* =========================
   MESAJLARI OXU
========================= */

function loadMessages(){

    if(messagesStarted)
        return;

    messagesStarted = true;


    onChildAdded(
        messagesRef,
        function(snapshot){

            const data =
                snapshot.val();

            if(!data)
                return;


            if(
                data.type === "audio" &&
                !data.audioURL
            )
                return;


            if(
                data.type !== "audio" &&
                !data.message
            )
                return;


            const box =
                document.createElement("div");

            const sender =
                document.createElement("div");


            if(
                data.sender ===
                "customer"
            ){

                box.className =
                    "message customer";

                sender.textContent =
                    "Müştəri";

            }

            else if(
                data.sender ===
                "agent"
            ){

                box.className =
                    "message agent";

                sender.textContent =
                    "Siz";

            }

            else{

                return;

            }


            sender.className =
                "sender";

            box.appendChild(sender);


            if(
                data.type === "audio"
            ){

                const audio =
                    document.createElement(
                        "audio"
                    );

                audio.controls = true;

                audio.src =
                    data.audioURL;

                box.appendChild(audio);

            }

            else{

                const text =
                    document.createElement(
                        "div"
                    );

                text.textContent =
                    data.message;

                box.appendChild(text);

            }


            messages.appendChild(box);

            messages.scrollTop =
                messages.scrollHeight;

        }
    );

}


/* =========================
   YAZILI MESAJ
========================= */

async function sendMessage(){

    const text =
        input.value.trim();

    if(
        !text ||
        !currentOperator
    )
        return;


    try{

        await push(
            messagesRef,
            {

                sender:
                    "agent",

                type:
                    "text",

                message:
                    text,

                email:
                    currentOperator.email,

                time:
                    Date.now()

            }
        );


        input.value = "";

        input.focus();


    }catch(error){

        alert(
            "Mesaj göndərilmədi."
        );

    }

}


sendButton.onclick =
    sendMessage;


input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================
   OPERATOR SƏSİ
========================= */

recordButton.onclick =
async function(){

    if(!recording){

        try{

            const stream =
                await navigator
                .mediaDevices
                .getUserMedia({
                    audio:true
                });


            audioChunks = [];


            recorder =
                new MediaRecorder(
                    stream
                );


            recorder.ondataavailable =
                function(event){

                    if(
                        event.data.size > 0
                    ){

                        audioChunks.push(
                            event.data
                        );

                    }

                };


            recorder.onstop =
                async function(){

                    stream
                    .getTracks()
                    .forEach(
                        track =>
                        track.stop()
                    );


                    const blob =
                        new Blob(
                            audioChunks,
                            {
                                type:
                                "audio/webm"
                            }
                        );


                    try{

                        recordButton.textContent =
                            "⏳";


                        const fileName =
                            "operator_" +
                            Date.now() +
                            ".webm";


                        const fileRef =
                            storageRef(
                                storage,
                                "voice/" +
                                fileName
                            );


                        await uploadBytes(
                            fileRef,
                            blob
                        );


                        const audioURL =
                            await getDownloadURL(
                                fileRef
                            );


                        await push(
                            messagesRef,
                            {

                                sender:
                                    "agent",

                                type:
                                    "audio",

                                audioURL:
                                    audioURL,

                                email:
                                    currentOperator.email,

                                time:
                                    Date.now()

                            }
                        );


                    }catch(error){

                        console.error(error);

                        alert(
                            "Səs göndərilmədi: " +
                            error.message
                        );

                    }


                    recordButton.textContent =
                        "🎙️";

                };


            recorder.start();

            recording = true;

            recordButton.classList.add(
                "recording"
            );

            recordButton.textContent =
                "⏹️";


        }catch(error){

            alert(
                "Mikrofon icazəsi verilmədi."
            );

        }

    }

    else{

        recorder.stop();

        recording = false;

        recordButton.classList.remove(
            "recording"
        );

        recordButton.textContent =
            "🎙️";

    }

};


/* =========================
   ÇIXIŞ
========================= */

document
.getElementById("logout")
.onclick =
async function(){

    await set(
        operatorRef,
        false
    );

    await signOut(auth);

    currentOperator = null;

    panel.style.display =
        "none";

    login.style.display =
        "block";

    messages.innerHTML =
        "";

    messagesStarted =
        false;

};


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            login.style.display =
                "block";

            panel.style.display =
                "none";

            return;

        }


        const email =
            (user.email || "")
            .trim()
            .toLowerCase();


        if(
            !OPERATOR_EMAILS.includes(
                email
            )
        ){

            await signOut(auth);

            return;

        }


        openOperator(user);

    }
);

</script>

</body>
</html>
