<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator paneli</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .header {
            background: #2196f3;
            color: white;
            padding: 15px;
            text-align: center;
        }

        #login {
            text-align: center;
            padding: 30px;
        }

        #chat {
            display: none;
            max-width: 600px;
            margin: auto;
            background: white;
            height: calc(100vh - 65px);
        }

        #messages {
            height: calc(100% - 70px);
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .customer {
            background: #e5e5e5;
            margin-right: auto;
        }

        .agent {
            background: #2196f3;
            color: white;
            margin-left: auto;
        }

        .send {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background: white;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        #sendButton,
        #loginButton {
            margin-left: 8px;
            padding: 12px 18px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>Operator paneli</h2>
</div>
