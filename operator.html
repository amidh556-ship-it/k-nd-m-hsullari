<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Operator Paneli</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    background:white;
    width:90%;
    max-width:400px;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 20px #ccc;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    font-size:16px;
    cursor:pointer;
}

.google{
    background:#4285f4;
    color:white;
    width:100%;
}

#panel{
    display:none;
    padding:15px;
    max-width:800px;
    margin:auto;
}

.top{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logout{
    background:#e53935;
    color:white;
}

.notification{
    background:#fff3cd;
    border:1px solid #ffcc00;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    display:none;
}

.order{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 3px 12px #ddd;
}

.order h3{
    margin-top:0;
}

.info{
    line-height:1.8;
}

.products{
    background:#f7f7f7;
    padding:12px;
    border-radius:12px;
    margin:12px 0;
}

.product{
    padding:8px 0;
    border-bottom:1px solid #ddd;
}

.product:last-child{
    border-bottom:0;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    margin-top:8px;
}

.start{
    width:100%;
    background:#111;
    color:white;
    margin-top:12px;
}

.start.started{
    background:#777;
}

.status-box{
    margin-top:15px;
    padding:15px;
    background:#f5f5f5;
    border-radius:15px;
}

.status-btn{
    width:100%;
    margin-top:8px;
    background:#2196f3;
    color:white;
}

.status-btn.active{
    background:#16a34a;
}

.empty{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.error{
    background:#ffdddd;
    color:#b00000;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    font-weight:bold;
}

.chat{
    background:white;
    padding:15px;
    border-radius:18px;
    margin-top:20px;
}

.messages{
    max-height:300px;
    overflow:auto;
    margin-bottom:10px;
}

.message{
    padding:10px;
    margin:7px 0;
    border-radius:10px;
    background:#eee;
}

.message.agent{
    background:#d9fdd3;
}

.chat-row{
    display:flex;
    gap:8px;
}

.chat-row input{
    margin:0;
}

.chat-row button{
    background:#111;
    color:white;
}
</style>
</head>

<body>

<div class="login" id="loginPage">

    <div class="login-box">

        <h2>Operator Paneli</h2>

        <p>Operator hesabı ilə daxil olun</p>

        <button class="google" id="googleLogin">
            Google ilə daxil ol
        </button>

    </div>

</div>


<div id="panel">

    <div class="top">

        <div>
            <b>Operator</b>
            <br>
            <span id="operatorEmail"></span>
        </div>

        <button class="logout" id="logout">
            Çıxış
        </button>

    </div>


    <div class="notification" id="notification"></div>

    <div id="firebaseError"></div>


    <h2 style="margin-bottom:15px;">
        📦 Sifarişlər
    </h2>

    <div id="orders">

        <div class="empty">
            Sifarişlər gözlənilir...
        </div>

    </div>


    <div class="chat">

        <h3>Müştəri mesajları</h3>

        <div class="messages" id="messages"></div>

        <div class="chat-row">

            <input
                id="messageInput"
                placeholder="Mesaj yaz..."
            >

            <button id="sendMessage">
                Göndər
            </button>

        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain:
    "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
    "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
    "kendmehsullari-6a53d",

    storageBucket:
    "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
    "551607499773",

    appId:
    "1:551607499773:web:a84aa63dc5b55c38687794"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);

const provider =
new GoogleAuthProvider();


const OPERATOR_EMAIL =
"amidh365@gmail.com";


const ordersRef =
ref(db,"orders");

const messagesRef =
ref(db,"messages");


const loginPage =
document.getElementById("loginPage");

const panel =
document.getElementById("panel");

const ordersDiv =
document.getElementById("orders");

const notification =
document.getElementById("notification");

const operatorEmail =
document.getElementById("operatorEmail");

const firebaseError =
document.getElementById("firebaseError");


let ordersLoaded = false;
let messagesLoaded = false;


/* GOOGLE GİRİŞ */

document
.getElementById("googleLogin")
.addEventListener(
"click",
async()=>{

    try{

        const result =
        await signInWithPopup(
            auth,
            provider
        );

        const email =
        (result.user.email || "")
        .toLowerCase()
        .trim();


        if(email !== OPERATOR_EMAIL){

            alert(
                "Bu hesab operator hesabı deyil."
            );

            await signOut(auth);

            return;
        }


        openPanel(result.user);


    }catch(error){

        alert(
            "Giriş xətası:\n" +
            error.message
        );

    }

});


/* AUTH */

onAuthStateChanged(
auth,
user=>{

    if(!user) return;

    const email =
    (user.email || "")
    .toLowerCase()
    .trim();


    if(email === OPERATOR_EMAIL){

        openPanel(user);

    }

});


/* PANEL */

function openPanel(user){

    loginPage.style.display =
    "none";

    panel.style.display =
    "block";

    operatorEmail.textContent =
    user.email;


    if(!ordersLoaded){

        ordersLoaded = true;

        loadOrders();

    }


    if(!messagesLoaded){

        messagesLoaded = true;

        loadMessages();

    }

}


/* ÇIXIŞ */

document
.getElementById("logout")
.addEventListener(
"click",
async()=>{

    await signOut(auth);

    ordersLoaded = false;
    messagesLoaded = false;

    panel.style.display =
    "none";

    loginPage.style.display =
    "flex";

});


/* =========================
   SİFARİŞLƏR
========================= */

function loadOrders(){

    ordersDiv.innerHTML = `

        <div class="empty">
            📦 Sifarişlər yüklənir...
        </div>

    `;


    onChildAdded(

        ordersRef,

        snapshot=>{

            const order =
            snapshot.val();


            if(!order) return;


            /* ilk sifariş gələndə
               yüklənir yazısını sil */

            const empty =
            ordersDiv.querySelector(
                ".empty"
            );

            if(empty){

                empty.remove();

            }


            showOrder(
                snapshot.key,
                order
            );


            showNewOrderNotification(
                order
            );

        },

        error=>{

            console.error(
                "ORDERS ERROR:",
                error
            );


            firebaseError.innerHTML = `

                <div class="error">

                    ❌ Sifarişləri Firebase-dən
                    oxumaq mümkün olmadı.

                    <br><br>

                    Xəta:
                    ${escapeHTML(
                        error.message
                    )}

                </div>

            `;

        }

    );

}


/* BİLDİRİŞ */

function showNewOrderNotification(order){

    notification.style.display =
    "block";


    notification.innerHTML = `

        🔔 <b>Yeni sifariş gəldi!</b>

        <br><br>

        Müştəri:
        ${escapeHTML(
            order.name || "Ad yoxdur"
        )}

        <br>

        Sifariş:
        ${escapeHTML(
            order.orderId || ""
        )}

        <br>

        Məbləğ:
        ${escapeHTML(
            String(order.total || "0")
        )}
        AZN

    `;

}


/* SİFARİŞİ GÖSTƏR */

function showOrder(key,order){

    const card =
    document.createElement("div");

    card.className =
    "order";


    let productsHTML = "";


    if(Array.isArray(order.products)){

        order.products.forEach(
        product=>{

            productsHTML += `

                <div class="product">

                    <b>
                    ${escapeHTML(
                        product.name ||
                        product.title ||
                        "Məhsul"
                    )}
                    </b>

                    <br>

                    Say:
                    ${escapeHTML(
                        String(
                            product.quantity || 1
                        )
                    )}

                    <br>

                    Qiymət:
                    ${escapeHTML(
                        String(
                            product.price || "0"
                        )
                    )}
                    AZN

                </div>

            `;

        });

    }


    card.innerHTML = `

        <h3>
            🛒 Sifariş
        </h3>


        <div class="info">

            <b>Sifariş:</b>
            ${escapeHTML(
                order.orderId || ""
            )}

            <br>

            <b>Müştəri:</b>
            ${escapeHTML(
                order.name || ""
            )}

            <br>

            <b>Email:</b>
            ${escapeHTML(
                order.email || ""
            )}

            <br>

            <b>Telefon:</b>
            ${escapeHTML(
                order.phone || ""
            )}

            <br>

            <b>Ünvan:</b>
            ${escapeHTML(
                order.address || ""
            )}

            <br>

            <b>Məbləğ:</b>
            ${escapeHTML(
                String(order.total || "0")
            )}
            AZN

        </div>


        <div class="products">

            <b>📦 Məhsullar:</b>

            ${productsHTML}

        </div>


        <label>

            <b>
                📍 İzləmə kodu
            </b>

        </label>


        <input
            class="tracking"
            value="${escapeHTML(
                order.trackingCode || ""
            )}"
            placeholder="Məsələn: AZ123456789"
        >


        <button class="start">

            BAŞLA

        </button>


        <div class="status-box">

            <b>Status:</b>

            <div
                class="current-status"
                style="
                    margin-top:8px;
                    font-size:18px;
                    font-weight:bold;
                "
            >

                ${escapeHTML(
                    order.status ||
                    "Sifariş qəbul edildi"
                )}

            </div>


            <button
                class="status-btn"
                data-status="Sifariş qəbul edildi"
            >
                📥 Sifariş qəbul edildi
            </button>


            <button
                class="status-btn"
                data-status="Hazırlanır"
            >
                📦 Hazırlanır
            </button>


            <button
                class="status-btn"
                data-status="Göndərildi"
            >
                🚚 Göndərildi
            </button>


            <button
                class="status-btn"
                data-status="Çatdırılır"
            >
                🛵 Çatdırılır
            </button>


            <button
                class="status-btn"
                data-status="Çatdırıldı"
            >
                ✅ Çatdırıldı
            </button>

        </div>

    `;


    ordersDiv.prepend(card);


    const trackingInput =
    card.querySelector(".tracking");


    const startButton =
    card.querySelector(".start");


    const currentStatus =
    card.querySelector(
        ".current-status"
    );


    /* BAŞLA */

    startButton.addEventListener(
    "click",
    async()=>{

        const tracking =
        trackingInput.value.trim();


        if(!tracking){

            alert(
                "Əvvəlcə izləmə kodunu yaz."
            );

            return;

        }


        try{

            await update(

                ref(
                    db,
                    "orders/" + key
                ),

                {

                    trackingCode:
                    tracking,

                    status:
                    "Sifariş qəbul edildi",

                    started:
                    true,

                    startedAt:
                    Date.now()

                }

            );


            currentStatus.textContent =
            "Sifariş qəbul edildi";


            startButton.textContent =
            "BAŞLADI ✓";


            startButton.classList.add(
                "started"
            );


            alert(
                "✅ Sifariş başladı."
            );


        }catch(error){

            alert(
                "❌ Xəta:\n" +
                error.message
            );

        }

    });


    /* STATUSLAR */

    const statusButtons =
    card.querySelectorAll(
        ".status-btn"
    );


    statusButtons.forEach(
    button=>{

        button.addEventListener(
        "click",
        async()=>{

            const status =
            button.dataset.status;


            try{

                await update(

                    ref(
                        db,
                        "orders/" + key
                    ),

                    {

                        status:
                        status,

                        trackingCode:
                        trackingInput.value.trim()

                    }

                );


                currentStatus.textContent =
                status;


                statusButtons.forEach(
                btn=>{

                    btn.classList.remove(
                        "active"
                    );

                });


                button.classList.add(
                    "active"
                );


            }catch(error){

                alert(
                    "❌ Status dəyişmədi:\n" +
                    error.message
                );

            }

        });

    });

}


/* =========================
   MESAJLAR
========================= */

function loadMessages(){

    const messages =
    document.getElementById(
        "messages"
    );


    onChildAdded(

        messagesRef,

        snapshot=>{

            const data =
            snapshot.val();


            if(!data) return;


            if(
                data.sender !== "customer" &&
                data.sender !== "agent"
            ){

                return;

            }


            const div =
            document.createElement(
                "div"
            );


            div.className =
            "message " +
            (
                data.sender === "agent"
                ? "agent"
                : ""
            );


            div.innerHTML = `

                <b>

                    ${
                        data.sender === "agent"
                        ? "Operator"
                        : "Müştəri"
                    }

                </b>

                <br>

                ${escapeHTML(
                    data.text || ""
                )}

            `;


            messages.appendChild(div);


            messages.scrollTop =
            messages.scrollHeight;

        },

        error=>{

            console.error(
                "MESSAGES ERROR:",
                error
            );

        }

    );

}


/* OPERATOR MESAJ */

document
.getElementById("sendMessage")
.addEventListener(
"click",
async()=>{

    const input =
    document.getElementById(
        "messageInput"
    );


    const text =
    input.value.trim();


    if(!text) return;


    try{

        await push(

            messagesRef,

            {

                sender:
                "agent",

                text:
                text,

                email:
                OPERATOR_EMAIL,

                createdAt:
                Date.now()

            }

        );


        input.value = "";


    }catch(error){

        alert(
            "Mesaj göndərilmədi:\n" +
            error.message
        );

    }

});


/* ENTER */

document
.getElementById("messageInput")
.addEventListener(
"keydown",
event=>{

    if(event.key === "Enter"){

        document
        .getElementById(
            "sendMessage"
        )
        .click();

    }

});


/* ESCAPE */

function escapeHTML(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
