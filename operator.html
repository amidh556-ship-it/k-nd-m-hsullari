<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator paneli</title>
</head>

<body>

<div id="login">
  <h2>Operator paneli</h2>
  <p>Operator hesabına daxil olun.</p>
  <button id="googleLogin">Google ilə daxil ol</button>
</div>

<div id="operatorPanel" style="display:none;">
  <h2>Operator paneli açıldı ✅</h2>
  <p id="operatorEmail"></p>

  <hr>

  <div id="messages"></div>

  <input id="messageInput" type="text" placeholder="Mesaj yaz...">
  <button id="sendMessage">Göndər</button>

  <br><br>

  <button id="logout">Çıxış</button>
</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",
  authDomain: "kendmehsullari-6a53d.firebaseapp.com",
  databaseURL: "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",
  projectId: "kendmehsullari-6a53d",
  storageBucket: "kendmehsullari-6a53d.firebasestorage.app",
  messagingSenderId: "551607499773",
  appId: "1:551607499773:web:a84aa63dc5b55c38687794"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const login = document.getElementById("login");
const panel = document.getElementById("operatorPanel");
const emailText = document.getElementById("operatorEmail");


document.getElementById("googleLogin").onclick = async () => {

  try {

    const result = await signInWithPopup(auth, provider);

    const user = result.user;

    console.log("Google hesabı:", user.email);

    if (user.email === "ttik66006@gmail.com") {

      login.style.display = "none";
      panel.style.display = "block";

      emailText.textContent =
        "Operator hesabı: " + user.email;

    } else {

      await signOut(auth);

      alert("Bu hesab operator hesabı deyil.");

    }

  } catch (error) {

    console.error(error);

    alert(
      "Giriş xətası: " +
      error.code +
      "\n" +
      error.message
    );

  }

};


document.getElementById("logout").onclick = async () => {

  await signOut(auth);

  panel.style.display = "none";
  login.style.display = "block";

};

</script>

</body>
</html>
