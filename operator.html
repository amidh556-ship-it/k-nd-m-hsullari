<!DOCTYPE html>
<html lang="az">

<head>

<meta

    content="width=device-width, initial-scale=1.0"
>

<title>Operator - Kənd məhsulları</title>

<style>

}

body{

    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{

    padding:18px;

}

.container{

}

.login-box,
.order-card,

.login-box{

.google-btn{

    font-size:16px;
    font-weight:bold;

}

.user-box{

}

.user-email{

}

.logout{

    border:0;
    border-radius:9px;
    background:#d93025;

.order-title{

    margin-bottom:12px;
}

.info{

}

.products{
    margin-top:15px;
    padding-top:12px;
    border-top:1px solid #ddd;
}

.product{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid #eee;
}

.total{
    font-size:18px;
    font-weight:bold;
    margin-top:12px;
}

.shipping{
    margin-top:18px;
    padding:15px;
    background:#f3f7ff;
    border-radius:12px;

.shipping-title{
    font-size:17px;

    margin-bottom:12px;
}

input{
    width:100%;

    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:9px;

.start-btn,
.send-btn{

}

.status-box{
    margin-top:15px;
    padding-top:15px;

}

.status-title{

    margin-bottom:10px;
}

.status-btn{
    width:100%;
    padding:12px;
    margin:5px 0;
    border:0;
    border-radius:9px;
    background:#e9e9e9;

    font-weight:bold;
}

.empty{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

    font-size:19px;

    margin-bottom:12px;
}

.customer-chat{
    border:1px solid #ddd;
    border-radius:12px;

    margin-bottom:12px;
}

.message-list{
    max-height:300px;
    overflow-y:auto;
    background:#f5f5f5;
    padding:10px;

    margin-bottom:10px;
}

.msg{
    padding:8px 10px;
    border-radius:10px;
    margin:6px 0;
    max-width:85%;
    word-break:break-word;
}

.msg.customer{
    background:white;
    border:1px solid #ddd;
}

.msg.operator{
    background:#dff5df;
    margin-left:auto;
}

.chat-input{
    display:flex;
    gap:7px;
}

.chat-input input{
    margin:0;
    flex:1;
}

.chat-input button{
    width:90px;
    border:0;
    border-radius:9px;
    background:#16803c;
    color:white;
    font-weight:bold;
}

</style>

</head>

<body>


<header>
    🛠️ Kənd məhsulları — Operator
</header>


<div class="container">


    <div
        id="loginBox"
        class="login-box"
    >

        <h2>
            Operator hesabına daxil olun
        </h2>

        <p>
            Operator Gmail hesabınızı seçin.
        </p>

        <button
            class="google-btn"
            id="googleLogin"
        >
            🔵 Google ilə daxil ol
        </button>

    </div>



    <div
        id="panel"
        class="hidden"
    >


        <div class="user-box">

            <b>Operator:</b>

            <div
                class="user-email"
                id="operatorEmail"
            ></div>


            <button
                class="logout"
                id="logoutBtn"
            >
                Çıxış
            </button>

        </div>



        <div id="orders"></div>



        <div class="chat-box">

            <div class="chat-title">
                💬 Müştərilərlə danışıq
            </div>

            <div id="chats">
                Müştərilər yoxlanılır...
            </div>

        </div>


    </div>


</div>



<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue,
    push,
    update
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



const firebaseConfig = {

    apiKey:
    "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain:
    "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
    "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
    "kendmehsullari-6a53d",

    storageBucket:
    "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
    "551607499773",

    appId:
    "1:551607499773:web:a84aa63dc5b55c38687794"

};



const app =
initializeApp(firebaseConfig);


const db =
getDatabase(app);


const auth =
getAuth(app);


const provider =
new GoogleAuthProvider();



/* =========================
   OPERATOR GMAIL-LƏRİ
========================= */

const OPERATOR_EMAILS = [

    "amallizad72@gmail.com",

    "ttiktok66006@gmail.com"

];



function isOperator(email){

    if(!email){

        return false;

    }

    return OPERATOR_EMAILS.includes(
        email.toLowerCase().trim()
    );

}



/* =========================
   ELEMENTLƏR
========================= */

const loginBox =
document.getElementById(
    "loginBox"
);


const panel =
document.getElementById(
    "panel"
);


const ordersDiv =
document.getElementById(
    "orders"
);


const chatsDiv =
document.getElementById(
    "chats"
);


const operatorEmail =
document.getElementById(
    "operatorEmail"
);



/* =========================
   GOOGLE GİRİŞ
========================= */

document
.getElementById("googleLogin")
.addEventListener(
    "click",
    async () => {

        try{

            const result =
            await signInWithPopup(
                auth,
                provider
            );


            const user =
            result.user;


            if(
                !user.email ||
                !isOperator(user.email)
            ){

                await signOut(auth);


                alert(
                    "Bu Gmail operator hesabı deyil."
                );


                return;

            }


            showPanel(user);

        }
        catch(error){

            console.error(error);


            alert(
                "Giriş alınmadı:\n" +
                error.message
            );

        }

    }
);



/* =========================
   AUTH YOXLANIŞI
========================= */

onAuthStateChanged(
    auth,
    user => {

        if(
            user &&
            user.email &&
            isOperator(user.email)
        ){

            showPanel(user);

        }
        else{

            loginBox.classList.remove(
                "hidden"
            );

            panel.classList.add(
                "hidden"
            );

        }

    }
);



/* =========================
   PANELİ AÇ
========================= */

function showPanel(user){

    loginBox.classList.add(
        "hidden"
    );


    panel.classList.remove(
        "hidden"
    );


    operatorEmail.textContent =
    user.email;


    loadOrders();


    loadChats();

}



/* =========================
   ÇIXIŞ
========================= */

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    async () => {

        await signOut(auth);

    }
);



/* =========================
   HTML TƏHLÜKƏSİZLİYİ
========================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



/* =========================
   SİFARİŞLƏRİ GƏTİR
========================= */

function loadOrders(){

    onValue(
        ref(db,"orders"),
        snapshot => {

            ordersDiv.innerHTML = "";


            if(!snapshot.exists()){

                ordersDiv.innerHTML = `

                    <div class="empty">
                        Hələ sifariş yoxdur.
                    </div>

                `;

                return;

            }


            const data =
            snapshot.val();


            const entries =
            Object.entries(data);


            entries.reverse();


            entries.forEach(
                ([key,order]) => {

                    createOrderCard(
                        key,
                        order
                    );

                }
            );

        }
    );

}



/* =========================
   SİFARİŞ KARTI
========================= */

function createOrderCard(
    key,
    order
){

    const currentStatus =
    order.status ||
    "Məhsul yığılır";


    let productsHTML = "";


    const products =
    Array.isArray(order.products)
    ? order.products
    : Object.values(
        order.products || {}
    );


    products.forEach(
        product => {

            const name =
            product.name ||
            product.title ||
            "Məhsul";


            const qty =
            Number(
                product.quantity || 1
            );


            const price =
            Number(
                product.price || 0
            );


            productsHTML += `

                <div class="product">

                    <span>
                        ${escapeHTML(name)}
                        × ${qty}
                    </span>

                    <b>
                        ${(price * qty).toFixed(2)}
                        AZN
                    </b>

                </div>

            `;

        }
    );



    const card =
    document.createElement(
        "div"
    );


    card.className =
    "order-card";



    card.innerHTML = `

        <div class="order-title">

            📦 Sifariş

            ${escapeHTML(
                order.orderId || key
            )}

        </div>


        <div class="info">

            <b>Müştəri:</b>
            ${escapeHTML(
                order.name || "-"
            )}

            <br>


            <b>Gmail:</b>
            ${escapeHTML(
                order.email || "-"
            )}

            <br>


            <b>Telefon:</b>
            ${escapeHTML(
                order.phone || "-"
            )}

            <br>


            <b>Ünvan:</b>
            ${escapeHTML(
                order.address || "-"
            )}

            <br>


            <b>Tarix:</b>
            ${escapeHTML(
                order.date || "-"
            )}

            <br>


            <b>Status:</b>
            ${escapeHTML(
                currentStatus
            )}

        </div>



        <div class="products">

            <b>🛒 Məhsullar:</b>

            ${productsHTML}


            <div class="total">

                Ümumi:

                ${Number(
                    order.total || 0
                ).toFixed(2)}

                AZN

            </div>

        </div>



        <div class="shipping">

            <div class="shipping-title">
                🚚 Sifarişi hazırlamaq
            </div>


            <label>
                📬 Poçt kodu
            </label>


            <input
                class="postal-code"
                placeholder="Poçt kodunu yaz"
                value="${escapeHTML(
                    order.postalCode || ""
                )}"
            >



            <label>
                🔎 İzləmə kodu
            </label>


            <input
                class="tracking-code"
                placeholder="İzləmə kodunu yaz"
                value="${escapeHTML(
                    order.trackingCode || ""
                )}"
            >



            <button
                class="start-btn"
            >
                📦 BAŞLA
            </button>



            <div class="status-box">

                <div class="status-title">
                    📍 Sifariş statusu
                </div>



                <button
                    class="status-btn"
                    data-status="Məhsul yığılır"
                >
                    🟡 Məhsul yığılır
                </button>



                <button
                    class="status-btn"
                    data-status="Hazırdır"
                >
                    🟢 Hazırdır
                </button>



                <button
                    class="status-btn"
                    data-status="Yoldadır"
                >
                    🚚 Yoldadır
                </button>



                <button
                    class="status-btn"
                    data-status="Çatdırılır"
                >
                    🚴 Çatdırılır
                </button>



                <button
                    class="status-btn"
                    data-status="Çatdırıldı"
                >
                    ✅ Çatdırıldı
                </button>

            </div>

        </div>

    `;



    ordersDiv.appendChild(
        card
    );



    const postalInput =
    card.querySelector(
        ".postal-code"
    );


    const trackingInput =
    card.querySelector(
        ".tracking-code"
    );


    const startBtn =
    card.querySelector(
        ".start-btn"
    );



    /* =========================
       BAŞLA
    ========================= */

    startBtn.addEventListener(
        "click",
        async () => {

            try{

                await update(
                    ref(
                        db,
                        "orders/" + key
                    ),
                    {

                        status:
                        "Məhsul yığılır",

                        postalCode:
                        postalInput.value.trim(),

                        trackingCode:
                        trackingInput.value.trim(),

                        started:
                        true,

                        startedAt:
                        Date.now(),

                        updatedAt:
                        Date.now()

                    }
                );


                alert(
                    "✅ Məhsul yığılır statusu göndərildi."
                );

            }
            catch(error){

                console.error(error);


                alert(
                    "Xəta: " +
                    error.message
                );

            }

        }
    );



    /* =========================
       STATUS DÜYMƏLƏRİ
    ========================= */

    card
    .querySelectorAll(
        ".status-btn"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                async () => {

                    const status =
                    button.dataset.status;


                    try{

                        await update(
                            ref(
                                db,
                                "orders/" + key
                            ),
                            {

                                status:
                                status,

                                postalCode:
                                postalInput.value.trim(),

                                trackingCode:
                                trackingInput.value.trim(),

                                updatedAt:
                                Date.now()

                            }
                        );


                        alert(
                            "✅ Status müştəriyə göndərildi."
                        );

                    }
                    catch(error){

                        console.error(error);


                        alert(
                            "Status dəyişmədi: " +
                            error.message
                        );

                    }

                }
            );

        }
    );

}



/* =========================
   MÜŞTƏRİ MESAJLARI
========================= */

function loadChats(){

    onValue(
        ref(db,"messages"),
        snapshot => {

            chatsDiv.innerHTML = "";


            if(!snapshot.exists()){

                chatsDiv.innerHTML = `

                    <div class="empty">
                        Hələ mesaj yoxdur.
                    </div>

                `;

                return;

            }


            const data =
            snapshot.val();


            const groups = {};



            Object.entries(data)
            .forEach(
                ([key,message]) => {

                    const email =
                    String(
                        message.email ||
                        message.userEmail ||
                        message.customerEmail ||
                        "namelum"
                    )
                    .toLowerCase()
                    .trim();



                    if(!groups[email]){

                        groups[email] = [];

                    }



                    groups[email].push({

                        key:key,

                        ...message

                    });

                }
            );



            Object.entries(groups)
            .forEach(
                ([email,messages]) => {

                    createChat(
                        email,
                        messages
                    );

                }
            );

        }
    );

}



/* =========================
   CHAT YARAT
========================= */

function createChat(
    email,
    messages
){

    const box =
    document.createElement(
        "div"
    );


    box.className =
    "customer-chat";



    let html = `

        <b>
            👤 ${escapeHTML(email)}
        </b>


        <div
            class="message-list"
        >

    `;



    messages
    .sort(
        (a,b) =>

        Number(
            a.timestamp ||
            a.createdAt ||
            0
        )

        -

        Number(
            b.timestamp ||
            b.createdAt ||
            0
        )
    )
    .forEach(
        message => {

            const from =
            String(
                message.from ||
                message.sender ||
                ""
            ).toLowerCase();


            const isOperator =
            from === "operator" ||
            from === "admin";



            html += `

                <div class="
                    msg
                    ${
                        isOperator
                        ? "operator"
                        : "customer"
                    }
                ">

                    ${escapeHTML(
                        message.text ||
                        message.message ||
                        ""
                    )}

                </div>

            `;

        }
    );



    html += `

        </div>


        <div class="chat-input">

            <input
                class="reply-input"
                placeholder="Müştəriyə yaz..."
            >


            <button
                class="reply-btn"
