<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

#login {
    text-align: center;
    padding: 30px;
}

#chat {
    display: none;
    max-width: 600px;
    margin: auto;
    height: 100vh;
    background: white;
}

#messages {
    height: calc(100vh - 80px);
    overflow-y: auto;
    padding: 15px;
}

.message {
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    max-width: 80%;
}

.customer {
    background: #e5e5e5;
}

.agent {
    background: #2196f3;
    color: white;
    margin-left: auto;
}

.send {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ddd;
}

#messageInput {
    flex: 1;
    padding: 12px;
}

#sendButton {
    padding: 12px 18px;
}
</style>
</head>

<body>

<div id="login">
    <h2>Operator</h2>
    <p>Google hesabı yoxlanılır...</p>
</div>

<div id="chat">

    <div id="messages"></div>

    <div class="send">
        <input id="messageInput" placeholder="Mesaj yaz...">
        <button id="sendButton">Göndər</button>
    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",
    authDomain: "kendmehsullari-6a53d.firebaseapp.com",
    databaseURL: "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",
    projectId: "kendmehsullari-6a53d",
    storageBucket: "kendmehsullari-6a53d.firebasestorage.app",
    messagingSenderId: "551607499773",
    appId: "1:551607499773:web:a84aa63dc5b55c38687794"
};


const OPERATOR_EMAIL = "ttik66006@gmail.com";

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);

const login = document.getElementById("login");

const chat = document.getElementById("chat");

const messages = document.getElementById("messages");

const input = document.getElementById("messageInput");

const send = document.getElementById("sendButton");


onAuthStateChanged(auth, async (user) => {

    if (!user) {

        login.innerHTML =
            "<h2>Operator hesabına daxil ol</h2><p>Əvvəl Google hesabına daxil olmalısan.</p>";

        return;
    }


    if (
        user.email &&
        user.email.toLowerCase() ===
        OPERATOR_EMAIL.toLowerCase()
    ) {

        login.style.display = "none";

        chat.style.display = "block";


        await set(
            ref(db, "operatorOnline"),
            true
        );


        onChildAdded(
            ref(db, "messages"),
            (snapshot) => {

                const data = snapshot.val();

                if (!data || !data.message) return;

                const div =
                    document.createElement("div");

                div.className =
                    "message " +
                    (data.sender === "agent"
                        ? "agent"
                        : "customer");

                div.textContent =
                    (data.sender === "agent"
                        ? "Siz: "
                        : "Müştəri: ")
                    + data.message;

                messages.appendChild(div);

                messages.scrollTop =
                    messages.scrollHeight;
            }
        );

    } else {

        login.innerHTML =
            "<h2>Bu hesab operator deyil.</h2>";

    }

});


send.onclick = async () => {

    const message =
        input.value.trim();

    if (!message) return;

    await push(
        ref(db, "messages"),
        {
            message: message,
            sender: "agent",
            email: OPERATOR_EMAIL,
            time: Date.now()
        }
    );

    input.value = "";

};

</script>

</body>
</html>
