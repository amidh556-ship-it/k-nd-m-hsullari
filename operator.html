<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Paneli</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    #login {
      width: 90%;
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,.12);
    }

    #googleLogin {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #4285f4;
      color: white;
      font-size: 16px;
    }

    #operatorPanel {
      width: 95%;
      max-width: 700px;
      margin: 20px auto;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 25px rgba(0,0,0,.12);
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
    }

    .header h2 {
      margin: 0 0 5px;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      opacity: .8;
    }

    #messages {
      height: 450px;
      overflow-y: auto;
      padding: 15px;
      background: #f8fafc;
    }

    .message {
      max-width: 80%;
      padding: 11px 14px;
      margin-bottom: 10px;
      border-radius: 14px;
      word-break: break-word;
    }

    .customer {
      background: #e5e7eb;
      color: #111;
      margin-right: auto;
    }

    .agent {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }

    .sender {
      font-size: 11px;
      opacity: .7;
      margin-bottom: 4px;
    }

    .bottom {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    #sendMessage {
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 15px;
    }

    #logout {
      margin: 0 12px 15px;
      padding: 10px 18px;
      border: 0;
      border-radius: 9px;
      background: #ef4444;
      color: white;
    }

    #status {
      padding: 8px 15px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div id="login">
  <h2>Operator paneli</h2>
  <p>Operator hesabına daxil olun.</p>

  <br>

  <button id="googleLogin">
    Google ilə daxil ol
  </button>
</div>


<div id="operatorPanel" style="display:none;">

  <div class="header">
    <h2>Operator 💬</h2>
    <p id="operatorEmail"></p>
  </div>

  <div id="status">
    Yazışmalar aktivdir
  </div>

  <div id="messages"></div>

  <div class="bottom">

    <input
      id="messageInput"
      type="text"
      placeholder="Mesajınızı yazın..."
    >

    <button id="sendMessage">
      Göndər
    </button>

  </div>

  <button id="logout">
    Çıxış
  </button>

</div>


<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  onChildAdded,
  set
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",
  authDomain: "kendmehsullari-6a53d.firebaseapp.com",
  databaseURL: "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",
  projectId: "kendmehsullari-6a53d",
  storageBucket: "kendmehsullari-6a53d.firebasestorage.app",
  messagingSenderId: "551607499773",
  appId: "1:551607499773:web:a84aa63dc5b55c38687794"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

const provider = new GoogleAuthProvider();


const messagesRef = ref(db, "messages");

const operatorRef = ref(db, "operatorOnline");


const login = document.getElementById("login");

const panel = document.getElementById("operatorPanel");

const emailText = document.getElementById("operatorEmail");

const messages = document.getElementById("messages");

const input = document.getElementById("messageInput");

const sendButton = document.getElementById("sendMessage");

const status = document.getElementById("status");


let messagesStarted = false;


/* GOOGLE GİRİŞ */

document.getElementById("googleLogin").onclick = async () => {

  try {

    const result =
      await signInWithPopup(auth, provider);

    const user = result.user;

    if (user.email !== "ttik66006@gmail.com") {

      await signOut(auth);

      alert("Bu hesab operator hesabı deyil.");

      return;
    }

    openOperator(user);

  } catch (error) {

    console.error(error);

    alert(
      "Google girişində xəta oldu:\n" +
      error.message
    );

  }

};


/* OPERATOR PANELİNİ AÇ */

function openOperator(user) {

  login.style.display = "none";

  panel.style.display = "block";

  emailText.textContent =
    "Operator: " + user.email;

  status.textContent =
    "Yazışmalar aktivdir";

  /* OPERATOR ONLAYN */

  set(operatorRef, true);

  loadMessages();

}


/* MESAJLARI OXU */

function loadMessages() {

  if (messagesStarted) return;

  messagesStarted = true;


  onChildAdded(messagesRef, (snapshot) => {

    const data = snapshot.val();

    if (!data) return;


    const messageText =
      data.message || data.text || "";


    if (messageText === "") return;


    const messageDiv =
      document.createElement("div");

    const senderDiv =
      document.createElement("div");

    const textDiv =
      document.createElement("div");


    if (data.sender === "customer") {

      messageDiv.className =
        "message customer";

      senderDiv.className =
        "sender";

      senderDiv.textContent =
        "Müştəri";

    }


    else if (data.sender === "agent") {

      messageDiv.className =
        "message agent";

      senderDiv.className =
        "sender";

      senderDiv.textContent =
        "Siz";

    }


    else {

      return;

    }


    textDiv.textContent =
      messageText;


    messageDiv.appendChild(senderDiv);

    messageDiv.appendChild(textDiv);

    messages.appendChild(messageDiv);


    messages.scrollTop =
      messages.scrollHeight;

  });

}


/* OPERATOR MESAJ GÖNDƏRİR */

async function sendMessage() {

  const text =
    input.value.trim();

  if (text === "") return;


  try {

    await push(messagesRef, {

      message: text,

      sender: "agent",

      email: "ttik66006@gmail.com",

      time: Date.now()

    });


    input.value = "";

    input.focus();


  } catch (error) {

    console.error(error);

    alert(
      "Mesaj göndərilmədi:\n" +
      error.message
    );

  }

}


sendButton.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* ÇIXIŞ */

document.getElementById("logout").onclick =
async () => {

  await set(operatorRef, false);

  await signOut(auth);

  panel.style.display = "none";

  login.style.display = "block";

  messages.innerHTML = "";

  messagesStarted = false;

};


/* GİRİŞ ARTIQ VARSA */

onAuthStateChanged(auth, (user) => {

  if (!user) {

    login.style.display = "block";

    panel.style.display = "none";

    return;

  }


  if (user.email === "ttik66006@gmail.com") {

    openOperator(user);

  }

});

</script>

</body>
</html>
