<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Operator - Kənd məhsulları</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:18px;
    text-align:center;
    font-size:21px;
    font-weight:bold;
}

.container{
    width:94%;
    max-width:700px;
    margin:20px auto;
}

.login-box,
.order-card{
    background:white;
    border-radius:15px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
}

.login-box{
    text-align:center;
}

.google-btn{
    width:100%;
    border:0;
    border-radius:10px;
    padding:14px;
    background:#4285f4;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.hidden{
    display:none !important;
}

.order-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.info{
    line-height:1.7;
    font-size:15px;
}

.products{
    margin-top:15px;
    padding-top:12px;
    border-top:1px solid #ddd;
}

.product{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid #eee;
}

.total{
    font-size:18px;
    font-weight:bold;
    margin-top:12px;
}

.shipping{
    margin-top:18px;
    padding:15px;
    background:#f3f7ff;
    border-radius:12px;
}

.shipping-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:12px;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:9px;
    font-size:15px;
    outline:none;
}

.start-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#111;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.start-btn.started{
    background:#16803c;
}

.status-box{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #ddd;
}

.status-title{
    font-weight:bold;
    margin-bottom:10px;
}

.status-btn{
    width:100%;
    padding:12px;
    margin:5px 0;
    border:0;
    border-radius:9px;
    background:#e9e9e9;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.status-btn.active{
    background:#16803c;
    color:white;
}

.empty{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.logout{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:0;
    border-radius:9px;
    background:#d93025;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.user-box{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:18px;
}

.user-email{
    font-size:14px;
    color:#555;
}
</style>
</head>

<body>

<header>
    🛠️ Kənd məhsulları — Operator
</header>

<div class="container">

    <div id="loginBox" class="login-box">
        <h2>Operator hesabına daxil olun</h2>
        <p>Yalnız operator Gmail-i ilə giriş mümkündür.</p>

        <button class="google-btn" id="googleLogin">
            🔵 Google ilə daxil ol
        </button>
    </div>

    <div id="panel" class="hidden">

        <div class="user-box">
            <b>Operator:</b>
            <div class="user-email" id="operatorEmail"></div>

            <button class="logout" id="logoutBtn">
                Çıxış
            </button>
        </div>

        <div id="orders"></div>

    </div>

</div>

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue,
    update
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain:
    "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
    "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
    "kendmehsullari-6a53d",

    storageBucket:
    "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
    "551607499773",

    appId:
    "1:551607499773:web:a84aa63dc5b55c38687794"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();


/* YENİ OPERATOR GMAIL */

const OPERATOR_EMAIL =
"salamsagol040825@gmail.com";


const loginBox =
document.getElementById("loginBox");

const panel =
document.getElementById("panel");

const ordersDiv =
document.getElementById("orders");

const operatorEmail =
document.getElementById("operatorEmail");


/* GOOGLE GİRİŞİ */

document
.getElementById("googleLogin")
.addEventListener("click", async () => {

    try{

        const result =
        await signInWithPopup(
            auth,
            provider
        );

        const user =
        result.user;

        if(
            !user.email ||
            user.email.toLowerCase()
            !== OPERATOR_EMAIL.toLowerCase()
        ){

            await signOut(auth);

            alert(
                "Bu Gmail operator hesabı deyil."
            );

            return;
        }

        showPanel(user);

    }catch(error){

        console.error(error);

        alert(
            "Giriş alınmadı: " +
            error.message
        );

    }

});


/* AUTH YOXLANIŞI */

onAuthStateChanged(
    auth,
    user => {

        if(
            user &&
            user.email &&
            user.email.toLowerCase()
            === OPERATOR_EMAIL.toLowerCase()
        ){

            showPanel(user);

        }else{

            loginBox.classList.remove("hidden");

            panel.classList.add("hidden");

        }

    }
);


/* PANEL */

function showPanel(user){

    loginBox.classList.add("hidden");

    panel.classList.remove("hidden");

    operatorEmail.textContent =
    user.email;

    loadOrders();

}


/* ÇIXIŞ */

document
.getElementById("logoutBtn")
.addEventListener("click", async () => {

    await signOut(auth);

});


/* HTML TƏHLÜKƏSİZLİYİ */

function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";

    }

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* SİFARİŞLƏRİ GƏTİR */

function loadOrders(){

    const ordersRef =
    ref(db,"orders");

    onValue(
        ordersRef,
        snapshot => {

            ordersDiv.innerHTML = "";

            if(!snapshot.exists()){

                ordersDiv.innerHTML =
                `
                <div class="empty">
                    Hələ sifariş yoxdur.
                </div>
                `;

                return;
            }


            const data =
            snapshot.val();


            const entries =
            Object.entries(data);


            entries.reverse();


            entries.forEach(
                ([key,order]) => {

                    createOrderCard(
                        key,
                        order
                    );

                }
            );

        },
        error => {

            console.error(error);

            ordersDiv.innerHTML =
            `
            <div class="empty">
                Sifarişləri oxumaq mümkün olmadı.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
            `;

        }
    );

}


/* SİFARİŞ KARTI */

function createOrderCard(key,order){

    const started =
    order.started === true;


    const currentStatus =
    order.status ||
    "Sifariş qəbul edildi";


    let productsHTML = "";


    if(
        Array.isArray(order.products) &&
        order.products.length
    ){

        order.products.forEach(product => {

            const name =
            product.name ||
            "Məhsul";

            const qty =
            Number(product.quantity || 1);

            const price =
            Number(product.price || 0);

            productsHTML +=
            `
            <div class="product">

                <span>
                    ${escapeHTML(name)}
                    × ${qty}
                </span>

                <b>
                    ${(price * qty).toFixed(2)} AZN
                </b>

            </div>
            `;

        });

    }else{

        productsHTML =
        `
        <div>
            Məhsul məlumatı yoxdur.
        </div>
        `;

    }


    const card =
    document.createElement("div");

    card.className =
    "order-card";


    card.innerHTML =
    `

    <div class="order-title">
        📦 Sifariş
        ${escapeHTML(order.orderId || key)}
    </div>


    <div class="info">

        <b>Müştəri:</b>
        ${escapeHTML(order.name || "-")}
        <br>

        <b>Gmail:</b>
        ${escapeHTML(order.email || "-")}
        <br>

        <b>Telefon:</b>
        ${escapeHTML(order.phone || "-")}
        <br>

        <b>Ünvan:</b>
        ${escapeHTML(order.address || "-")}
        <br>

        <b>Tarix:</b>
        ${escapeHTML(order.date || "-")}

    </div>


    <div class="products">

        <b>🛒 Məhsullar:</b>

        ${productsHTML}

        <div class="total">
            Ümumi:
            ${Number(order.total || 0).toFixed(2)} AZN
        </div>

    </div>


    <div class="shipping">

        <div class="shipping-title">
            🚚 Sifarişi hazırlamaq
        </div>


        <label>
            📬 Poçt kodu
        </label>

        <input
            class="postal-code"
            placeholder="Poçt kodunu yaz"
            value="${started ? escapeHTML(order.postalCode || "") : ""}"
        >


        <label>
            🔎 İzləmə kodu
        </label>

        <input
            class="tracking-code"
            placeholder="İzləmə kodunu yaz"
            value="${started ? escapeHTML(order.trackingCode || "") : ""}"
        >


        <button
            class="start-btn ${started ? "started" : ""}"
        >
            ${started ? "✅ BAŞLADI" : "🚀 BAŞLA"}
        </button>


        <div
            class="status-box"
            style="display:${started ? "block" : "none"};"
        >

            <div class="status-title">
                📍 Sifariş statusu
            </div>


            <button
                class="status-btn ${currentStatus === "Hazırlandı" ? "active" : ""}"
                data-status="Hazırlandı"
            >
                Hazırlandı
            </button>


            <button
                class="status-btn ${currentStatus === "Göndərildi" ? "active" : ""}"
                data-status="Göndərildi"
            >
                Göndərildi
            </button>


            <button
                class="status-btn ${currentStatus === "Yoldadır" ? "active" : ""}"
                data-status="Yoldadır"
            >
                Yoldadır
            </button>


            <button
                class="status-btn ${currentStatus === "Çatdırılır" ? "active" : ""}"
                data-status="Çatdırılır"
            >
                Çatdırılır
            </button>


            <button
                class="status-btn ${currentStatus === "Çatdırıldı" ? "active" : ""}"
                data-status="Çatdırıldı"
            >
                Çatdırıldı
            </button>

        </div>

    </div>

    `;


    ordersDiv.appendChild(card);


    const startBtn =
    card.querySelector(".start-btn");


    const statusBox =
    card.querySelector(".status-box");


    const postalInput =
    card.querySelector(".postal-code");


    const trackingInput =
    card.querySelector(".tracking-code");


    /* BAŞLA */

    startBtn.addEventListener(
        "click",
        async () => {

            const postalCode =
            postalInput.value.trim();

            const trackingCode =
            trackingInput.value.trim();


            if(!postalCode){

                alert(
                    "Əvvəl poçt kodunu yaz."
                );

                postalInput.focus();

                return;
            }


            if(!trackingCode){

                alert(
                    "Əvvəl izləmə kodunu yaz."
                );

                trackingInput.focus();

                return;
            }


            try{

                await update(
                    ref(db,"orders/" + key),
                    {

                        postalCode:
                        postalCode,

                        trackingCode:
                        trackingCode,

                        started:
                        true,

                        startedAt:
                        Date.now(),

                        status:
                        "Hazırlandı",

                        updatedAt:
                        Date.now()

                    }
                );


                statusBox.style.display =
                "block";


                startBtn.textContent =
                "✅ BAŞLADI";


                startBtn.classList.add(
                    "started"
                );


                alert(
                    "Sifariş başladı."
                );


            }catch(error){

                console.error(error);

                alert(
                    "Saxlama xətası: " +
                    error.message
                );

            }

        }
    );


    /* STATUS DÜYMƏLƏRİ */

    card
    .querySelectorAll(".status-btn")
    .forEach(button => {

        button.addEventListener(
            "click",
            async () => {

                const status =
                button.dataset.status;


                try{

                    await update(
                        ref(
                            db,
                            "orders/" + key
                        ),
                        {

                            status:
                            status,

                            updatedAt:
                            Date.now()

                        }
                    );


                    card
                    .querySelectorAll(
                        ".status-btn"
                    )
                    .forEach(btn => {

                        btn.classList.remove(
                            "active"
                        );

                    });


                    button.classList.add(
                        "active"
                    );


                }catch(error){

                    console.error(error);

                    alert(
                        "Status dəyişmədi: " +
                        error.message
                    );

                }

            }
        );

    });

}

</script>

</body>
</html>
