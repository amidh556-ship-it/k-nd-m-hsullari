<!DOCTYPE html><html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Operator Paneli</title><style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
}

.login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    width:90%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 20px #ccc;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    font-size:16px;
    cursor:pointer;
}

.google{
    width:100%;
    background:#4285f4;
    color:white;
}

#panel{
    display:none;
    max-width:800px;
    margin:auto;
    padding:15px;
}

.top{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logout{
    background:#e53935;
    color:white;
}

.notification{
    display:none;
    background:#fff3cd;
    border:1px solid #ffcc00;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

.order{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:20px;
    box-shadow:0 3px 12px #ddd;
}

.order h3{
    margin-top:0;
}

.info{
    line-height:1.8;
}

.products{
    background:#f7f7f7;
    padding:12px;
    border-radius:12px;
    margin:12px 0;
}

.product{
    padding:8px 0;
    border-bottom:1px solid #ddd;
}

.product:last-child{
    border-bottom:0;
}

/* POÇT KODU */
.tracking-area{
    margin-top:18px;
    padding:18px;
    background:#e8f4ff;
    border:3px solid #2196f3;
    border-radius:16px;
}

.tracking-area h3{
    margin:0 0 10px 0;
    color:#1565c0;
}

.tracking{
    width:100%;
    padding:15px;
    border:2px solid #2196f3;
    border-radius:10px;
    font-size:18px;
    outline:none;
    background:white;
}

.start{
    width:100%;
    margin-top:12px;
    background:#111;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.start.started{
    background:#16a34a;
}

/* STATUS */
.status-box{
    margin-top:18px;
    padding:15px;
    background:#f5f5f5;
    border-radius:15px;
}

.current-status{
    margin-top:10px;
    padding:12px;
    background:white;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
}

.status-btn{
    width:100%;
    margin-top:8px;
    background:#2196f3;
    color:white;
}

.status-btn.active{
    background:#16a34a;
}

.status-btn:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.empty{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.error{
    background:#ffdddd;
    color:#b00000;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    font-weight:bold;
    word-break:break-word;
}

.chat{
    background:white;
    padding:15px;
    border-radius:18px;
    margin-top:20px;
}

.messages{
    max-height:300px;
    overflow:auto;
    margin-bottom:10px;
}

.message{
    padding:10px;
    margin:7px 0;
    border-radius:10px;
    background:#eee;
}

.message.agent{
    background:#d9fdd3;
}

.chat-row{
    display:flex;
    gap:8px;
}

.chat-row input{
    margin:0;
    flex:1;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
}

.chat-row button{
    background:#111;
    color:white;
}

</style></head><body><div class="login" id="loginPage"><div class="login-box">

    <h2>Operator Paneli</h2>

    <p>Operator hesabı ilə daxil olun</p>

    <button class="google" id="googleLogin">
        Google ilə daxil ol
    </button>

</div>

</div><div id="panel"><div class="top">

    <div>
        <b>Operator</b>
        <br>
        <span id="operatorEmail"></span>
    </div>

    <button class="logout" id="logout">
        Çıxış
    </button>

</div>


<div class="notification" id="notification"></div>

<div id="firebaseError"></div>


<h2>📦 Bütün sifarişlər</h2>

<div id="orders">

    <div class="empty">
        Sifarişlər yüklənir...
    </div>

</div>


<div class="chat">

    <h3>💬 Müştəri mesajları</h3>

    <div class="messages" id="messages"></div>

    <div class="chat-row">

        <input
            id="messageInput"
            placeholder="Mesaj yaz..."
        >

        <button id="sendMessage">
            Göndər
        </button>

    </div>

</div>

</div><script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getDatabase,
    ref,
    push,
    onValue,
    update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain:
    "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
    "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
    "kendmehsullari-6a53d",

    storageBucket:
    "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
    "551607499773",

    appId:
    "1:551607499773:web:a84aa63dc5b55c38687794"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

const provider = new GoogleAuthProvider();


const OPERATOR_EMAIL = "amidh365@gmail.com";


const ordersRef = ref(db,"orders");

const messagesRef = ref(db,"messages");


const loginPage =
document.getElementById("loginPage");

const panel =
document.getElementById("panel");

const ordersDiv =
document.getElementById("orders");

const operatorEmail =
document.getElementById("operatorEmail");

const firebaseError =
document.getElementById("firebaseError");


let ordersLoaded = false;
let messagesLoaded = false;


/* GOOGLE GİRİŞ */

document
.getElementById("googleLogin")
.addEventListener("click",async()=>{

    try{

        const result =
        await signInWithPopup(
            auth,
            provider
        );

        const email =
        (result.user.email || "")
        .toLowerCase()
        .trim();

        if(email !== OPERATOR_EMAIL){

            alert(
                "Bu hesab operator hesabı deyil."
            );

            await signOut(auth);

            return;
        }

        openPanel(result.user);

    }catch(error){

        alert(
            "Giriş xətası:\n\n" +
            error.message
        );

    }

});


/* AUTH */

onAuthStateChanged(auth,user=>{

    if(!user) return;

    const email =
    (user.email || "")
    .toLowerCase()
    .trim();

    if(email === OPERATOR_EMAIL){

        openPanel(user);

    }

});


/* PANEL */

function openPanel(user){

    loginPage.style.display = "none";

    panel.style.display = "block";

    operatorEmail.textContent =
    user.email;


    if(!ordersLoaded){

        ordersLoaded = true;

        loadOrders();

    }


    if(!messagesLoaded){

        messagesLoaded = true;

        loadMessages();

    }

}


/* ÇIXIŞ */

document
.getElementById("logout")
.addEventListener("click",async()=>{

    await signOut(auth);

    ordersLoaded = false;
    messagesLoaded = false;

    panel.style.display = "none";

    loginPage.style.display = "flex";

});


/* =========================
   BÜTÜN SİFARİŞLƏR
========================= */

function loadOrders(){

    ordersDiv.innerHTML = `
        <div class="empty">
            📦 Sifarişlər yüklənir...
        </div>
    `;


    onValue(
        ordersRef,
        snapshot=>{

            ordersDiv.innerHTML = "";

            const data = snapshot.val();


            if(!data){

                ordersDiv.innerHTML = `
                    <div class="empty">
                        📦 Sifariş yoxdur.
                    </div>
                `;

                return;

            }


            let count = 0;


            Object.entries(data).forEach(
            ([key,order])=>{

                if(!order) return;

                count++;

                showOrder(key,order);

            });


            if(count === 0){

                ordersDiv.innerHTML = `
                    <div class="empty">
                        📦 Sifariş yoxdur.
                    </div>
                `;

            }

        },
        error=>{

            firebaseError.innerHTML = `
                <div class="error">
                    ❌ Firebase xətası:
                    <br><br>
                    ${escapeHTML(error.message)}
                </div>
            `;

        }
    );

}


/* =========================
   SİFARİŞ KARTI
========================= */

function showOrder(key,order){

    const card =
    document.createElement("div");

    card.className = "order";


    let productsHTML = "";


    if(Array.isArray(order.products)){

        order.products.forEach(product=>{

            productsHTML += `

                <div class="product">

                    <b>
                        ${escapeHTML(
                            product.name ||
                            product.title ||
                            "Məhsul"
                        )}
                    </b>

                    <br>

                    Say:
                    ${escapeHTML(
                        String(
                            product.quantity || 1
                        )
                    )}

                    <br>

                    Qiymət:
                    ${escapeHTML(
                        String(
                            product.price || "0"
                        )
                    )}
                    AZN

                </div>

            `;

        });

    }


    const started =
    order.started === true;


    card.innerHTML = `

        <h3>🛒 Sifariş</h3>


        <div class="info">

            <b>Sifariş kodu:</b>
            ${escapeHTML(order.orderId || "")}

            <br>

            <b>Müştəri:</b>
            ${escapeHTML(order.name || "")}

            <br>

            <b>Email:</b>
            ${escapeHTML(order.email || "")}

            <br>

            <b>Telefon:</b>
            ${escapeHTML(order.phone || "")}

            <br>

            <b>Ünvan:</b>
            ${escapeHTML(order.address || "")}

            <br>

            <b>Məbləğ:</b>
            ${escapeHTML(
                String(order.total || "0")
            )}
            AZN

        </div>


        <div class="products">

            <b>📦 Məhsulu yığ:</b>

            <br><br>

            ${
                productsHTML ||
                "Məhsul məlumatı yoxdur."
            }

        </div>


        <!-- ÇOX AÇIQ POÇT KODU HİSSƏSİ -->

        <div class="tracking-area">

            <h3>📮 POÇT / İZLƏMƏ KODU</h3>

            <input
                type="text"
                class="tracking"
                placeholder="Məsələn: AZ123456789"
                value="${escapeHTML(
                    order.trackingCode || ""
                )}"
            >

            <button
                type="button"
                class="start"
            >
                ${
                    started
                    ? "✅ BAŞLADI"
                    : "🚀 BAŞLA"
                }
            </button>

        </div>


        <!-- STATUSLAR -->

        <div class="status-box">

            <b>📍 Sifarişin statusu</b>

            <div class="current-status">
                ${escapeHTML(
                    order.status ||
                    "Sifariş qəbul olundu"
                )}
            </div>


            <button
                type="button"
                class="status-btn"
                data-status="Sifariş qəbul olundu"
                ${started ? "" : "disabled"}
            >
                📥 Sifariş qəbul olundu
            </button>


            <button
                type="button"
                class="status-btn"
                data-status="Hazırlanır"
                ${started ? "" : "disabled"}
            >
                📦 Hazırlanır
            </button>


            <button
                type="button"
                class="status-btn"
                data-status="Göndərildi"
                ${started ? "" : "disabled"}
            >
                🚚 Göndərildi
            </button>


            <button
                type="button"
                class="status-btn"
                data-status="Çatdırılır"
                ${started ? "" : "disabled"}
            >
                🛵 Çatdırılır
            </button>


            <button
                type="button"
                class="status-btn"
                data-status="Çatdırıldı"
                ${started ? "" : "disabled"}
            >
                ✅ Çatdırıldı
            </button>

        </div>

    `;


    ordersDiv.appendChild(card);


    const trackingInput =
    card.querySelector(".tracking");

    const startButton =
    card.querySelector(".start");

    const currentStatus =
    card.querySelector(".current-status");

    const statusButtons =
    card.querySelectorAll(".status-btn");


    /* =========================
       BAŞLA
    ========================= */

    startButton.addEventListener(
    "click",
    async()=>{

        const tracking =
        trackingInput.value.trim();


        if(!tracking){

            alert(
                "❌ Poçt / izləmə kodunu yaz!"
            );

            trackingInput.focus();

            return;

        }


        try{

            await update(
                ref(
                    db,
                    "orders/" + key
                ),
                {
                    trackingCode: tracking,

                    status:
                    "Sifariş qəbul olundu",

                    started: true,

                    startedAt: Date.now()
                }
            );


            startButton.textContent =
            "✅ BAŞLADI";

            startButton.classList.add(
                "started"
            );


            currentStatus.textContent =
            "Sifariş qəbul olundu";


            statusButtons.forEach(btn=>{

                btn.disabled = false;

            });


            alert(
                "✅ BAŞLADI! İzləmə kodu yadda saxlanıldı."
            );


        }catch(error){

            alert(
                "❌ BAŞLA işləmədi:\n\n" +
                error.message
            );

        }

    });


    /* =========================
       STATUS DƏYİŞ
    ========================= */

    statusButtons.forEach(button=>{

        button.addEventListener(
        "click",
        async()=>{

            const tracking =
            trackingInput.value.trim();


            if(!tracking){

                alert(
                    "❌ Əvvəlcə poçt / izləmə kodunu yaz."
                );

                return;

            }


            const status =
            button.dataset.status;


            try{

                await update(
                    ref(
                        db,
                        "orders/" + key
                    ),
                    {
                        status: status,

                        trackingCode:
                        tracking,

                        updatedAt:
                        Date.now()
                    }
                );


                currentStatus.textContent =
                status;


                statusButtons.forEach(btn=>{

                    btn.classList.remove(
                        "active"
                    );

                });


                button.classList.add(
                    "active"
                );


            }catch(error){

                alert(
                    "❌ Status dəyişmədi:\n\n" +
                    error.message
                );

            }

        });

    });


    /* AKTİV STATUS */

    statusButtons.forEach(button=>{

        if(
            button.dataset.status ===
            order.status
        ){

            button.classList.add("active");

        }

    });

}


/* =========================
   MESAJLAR
========================= */

function loadMessages(){

    const messages =
    document.getElementById("messages");


    onValue(
        messagesRef,
        snapshot=>{

            messages.innerHTML = "";

            const data =
            snapshot.val();


            if(!data) return;


            Object.values(data).forEach(item=>{

                if(!item) return;


                if(
                    item.sender !== "customer" &&
                    item.sender !== "agent"
                ){

                    return;

                }


                const div =
                document.createElement("div");


                div.className =
                "message " +
                (
                    item.sender === "agent"
                    ? "agent"
                    : ""
                );


                div.innerHTML = `

                    <b>
                        ${
                            item.sender === "agent"
                            ? "Operator"
                            : "Müştəri"
                        }
                    </b>

                    <br>

                    ${escapeHTML(
                        item.text || ""
                    )}

                `;


                messages.appendChild(div);

            });


            messages.scrollTop =
            messages.scrollHeight;

        }
    );

}


/* =========================
   OPERATOR MESAJI
========================= */

document
.getElementById("sendMessage")
.addEventListener(
"click",
async()=>{

    const input =
    document.getElementById(
        "messageInput"
    );


    const text =
    input.value.trim();


    if(!text) return;


    try{

        await push(
            messagesRef,
            {
                sender:"agent",

                text:text,

                email:OPERATOR_EMAIL,

                createdAt:Date.now()
            }
        );


        input.value = "";


    }catch(error){

        alert(
            "❌ Mesaj göndərilmədi:\n" +
            error.message
        );

    }

});


/* ENTER */

document
.getElementById("messageInput")
.addEventListener(
"keydown",
event=>{

    if(event.key === "Enter"){

        document
        .getElementById("sendMessage")
        .click();

    }

});


/* ESCAPE */

function escapeHTML(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script></body>
</html>
