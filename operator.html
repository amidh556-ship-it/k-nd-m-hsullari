<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operator - Kənd məhsulları</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#222}
header{background:#111827;color:white;padding:18px;text-align:center;font-size:20px;font-weight:bold}
.container{width:94%;max-width:700px;margin:20px auto}
.login-box,.user-box,.chat-box{background:white;border-radius:15px;padding:18px;margin-bottom:18px;box-shadow:0 3px 12px #0001}
input{width:100%;padding:13px;margin:7px 0;border:1px solid #ccc;border-radius:9px;font-size:15px}
button{cursor:pointer}
.login-btn,.logout{width:100%;padding:13px;border:0;border-radius:9px;color:white;font-size:16px;font-weight:bold;margin-top:7px}
.login-btn{background:#16803c}
.logout{background:#d93025}
.hidden{display:none!important}
.user-email{margin-top:6px;color:#555;font-size:14px}
.chat-title{font-size:19px;font-weight:bold;margin-bottom:12px}
.customer-chat{border:1px solid #ddd;border-radius:12px;padding:12px;margin-bottom:14px;background:#fff}
.customer-name{font-weight:bold;overflow-wrap:anywhere}
.message-list{height:250px;overflow-y:auto;background:#f5f5f5;padding:10px;border-radius:10px;margin:10px 0}
.msg{padding:9px 11px;border-radius:10px;margin:7px 0;max-width:88%;word-break:break-word;white-space:pre-wrap}
.msg.customer{background:white;border:1px solid #ddd}
.msg.operator{background:#dff5df;margin-left:auto}
.msg small{display:block;font-size:10px;opacity:.6;margin-bottom:4px}
.chat-input{display:flex;gap:7px;align-items:center}
.chat-input input{margin:0;flex:1;min-width:0}
.chat-input button{width:85px;flex-shrink:0;border:0;border-radius:9px;background:#16803c;color:white;font-weight:bold;padding:13px}
.empty{text-align:center;background:white;padding:20px;border-radius:12px}
.search{margin-bottom:14px}
.error{color:#c00;margin-top:10px}
</style>
</head>

<body>
<header>💬 Kənd məhsulları — Operator</header>

<div class="container">

<div id="loginBox" class="login-box">
<h2>Operator hesabına daxil olun</h2>
<p>Email və parolunuzu daxil edin.</p>

<form id="operatorLogin">
<input id="loginEmail" type="email" placeholder="Operator Gmail" autocomplete="username" required>
<input id="loginPassword" type="password" placeholder="Parol" autocomplete="current-password" required>
<button class="login-btn" type="submit">Daxil ol</button>
</form>

<div id="loginError" class="error"></div>
</div>

<div id="panel" class="hidden">

<div class="user-box">
<b>Operator:</b>
<div id="operatorEmail" class="user-email"></div>
<button id="logoutBtn" class="logout">Çıxış</button>
</div>

<div class="chat-box">
<div class="chat-title">💬 Müştərilərlə yazışma</div>
<input id="searchCustomer" class="search" type="search" placeholder="Müştəri emaili ilə axtar">
<div id="chats">Yazışmalar yüklənir...</div>
</div>

</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getDatabase,ref,onValue,push
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",
 authDomain:"kendmehsullari-6a53d.firebaseapp.com",
 databaseURL:"https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",
 projectId:"kendmehsullari-6a53d",
 storageBucket:"kendmehsullari-6a53d.firebasestorage.app",
 messagingSenderId:"551607499773",
 appId:"1:551607499773:web:a84aa63dc5b55c38687794"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

/* Operator giriş məlumatları */
const operators={
 "ttik66006@gmail.com":"a1m2i3d42006",
 "amallizad72@gmail.com":"amal2005"
};

const $=id=>document.getElementById(id);

let currentOperator="";
let allMessages={};
let messagesListener=null;
let chatListenerStarted=false;

function esc(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[c]));
}

function getCustomerEmail(message){
 return String(
  message.email ||
  message.userEmail ||
  message.customerEmail ||
  ""
 ).trim().toLowerCase();
}

function isOperatorMessage(message){
 const sender=String(message.sender||message.from||"").toLowerCase();
 return ["operator","agent","admin"].includes(sender);
}

$("operatorLogin").addEventListener("submit",event=>{
 event.preventDefault();

 const email=$("loginEmail").value.trim().toLowerCase();
 const password=$("loginPassword").value;

 $("loginError").textContent="";

 if(!Object.prototype.hasOwnProperty.call(operators,email)){
  $("loginError").textContent="Bu email operator hesabı deyil.";
  return;
 }

 if(operators[email]!==password){
  $("loginError").textContent="Parol yanlışdır.";
  return;
 }

 currentOperator=email;
 $("operatorEmail").textContent=email;
 $("loginPassword").value="";
 $("loginBox").classList.add("hidden");
 $("panel").classList.remove("hidden");

 loadChats();
});

$("logoutBtn").addEventListener("click",()=>{
 currentOperator="";
 $("panel").classList.add("hidden");
 $("loginBox").classList.remove("hidden");
 $("chats").innerHTML="";
 $("loginEmail").value="";
 $("loginPassword").value="";
 $("loginError").textContent="";

 if(messagesListener){
  messagesListener();
  messagesListener=null;
 }
 chatListenerStarted=false;
});

function loadChats(){
 if(chatListenerStarted)return;
 chatListenerStarted=true;

 messagesListener=onValue(ref(db,"messages"),snapshot=>{
  allMessages=snapshot.val()||{};
  renderChats();
 },error=>{
  $("chats").innerHTML=
   '<div class="empty">Yazışmalar yüklənmədi. Firebase Database qaydalarını yoxlayın.</div>';
  console.error(error);
 });
}

function renderChats(){
 const chats=$("chats");
 const filter=$("searchCustomer").value.trim().toLowerCase();
 const groups={};

 Object.entries(allMessages).forEach(([id,message])=>{
  if(!message || typeof message!=="object")return;

  const email=getCustomerEmail(message);
  if(!email)return;

  if(!groups[email])groups[email]=[];

  groups[email].push({
   id,
   ...message
  });
 });

 const emails=Object.keys(groups)
  .filter(email=>email.includes(filter))
  .sort((a,b)=>{
   const ta=Math.max(...groups[a].map(m=>Number(m.time||m.timestamp||m.createdAt||0)));
   const tb=Math.max(...groups[b].map(m=>Number(m.time||m.timestamp||m.createdAt||0)));
   return tb-ta;
  });

 if(!emails.length){
  chats.innerHTML='<div class="empty">Hələ yazışma yoxdur.</div>';
  return;
 }

 chats.innerHTML=emails.map(email=>{
  const messages=groups[email].sort((a,b)=>
   Number(a.time||a.timestamp||a.createdAt||0)-
   Number(b.time||b.timestamp||b.createdAt||0)
  );

  const content=messages.map(m=>{
   const operator=isOperatorMessage(m);
   const text=m.message??m.text??m.content??"";
   const rawTime=Number(m.time||m.timestamp||m.createdAt||0);
   const date=rawTime
    ?new Date(rawTime).toLocaleString("az-AZ")
    :"";

   return `
    <div class="msg ${operator?"operator":"customer"}">
     <small>${operator?"Operator":"Müştəri"} ${esc(date)}</small>
     ${esc(text)}
    </div>`;
  }).join("");

  const safeEmail=esc(email);

  return `
   <div class="customer-chat">
    <div class="customer-name">👤 ${safeEmail}</div>
    <div class="message-list" id="list-${encodeURIComponent(email)}">
     ${content}
    </div>
    <form class="chat-input" data-email="${safeEmail}">
     <input type="text" name="message" placeholder="Mesajınızı yazın..." autocomplete="off" required>
     <button type="submit">Göndər</button>
    </form>
   </div>`;
 }).join("");

 chats.querySelectorAll(".message-list").forEach(list=>{
  list.scrollTop=list.scrollHeight;
 });

 chats.querySelectorAll(".chat-input").forEach(form=>{
  form.addEventListener("submit",sendMessage);
 });
}

async function sendMessage(event){
 event.preventDefault();

 if(!currentOperator){
  alert("Əvvəlcə operator hesabına daxil olun.");
  return;
 }

 const form=event.currentTarget;
 const email=form.dataset.email;
 const input=form.elements.message;
 const message=input.value.trim();

 if(!message || !email)return;

 const button=form.querySelector("button");
 button.disabled=true;

 const now=Date.now();

 try{
  await push(ref(db,"messages"),{
   sender:"agent",
   from:"operator",
   type:"text",
   message:message,
   text:message,
   email:email,
   customerEmail:email,
   operatorEmail:currentOperator,
   time:now,
   timestamp:now,
   createdAt:now
  });

  input.value="";
 }catch(error){
  console.error(error);
  alert("Mesaj göndərilmədi. Firebase Database qaydalarını yoxlayın.");
 }finally{
  button.disabled=false;
  input.focus();
 }
}

$("searchCustomer").addEventListener("input",renderChats);
</script>

</body>
</html>
