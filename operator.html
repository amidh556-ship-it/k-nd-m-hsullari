<!DOCTYPE html>
<html lang="az">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Operator Paneli</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f4f6;
}

#login{
    width:90%;
    max-width:400px;
    margin:100px auto;
    background:white;
    padding:30px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

#googleLogin{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#4285f4;
    color:white;
    font-size:16px;
}

#error{
    margin-top:15px;
    color:#d32f2f;
}

#operatorPanel{
    width:95%;
    max-width:700px;
    margin:20px auto;
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.header{
    background:#111827;
    color:white;
    padding:18px;
}

.header h2{
    margin:0 0 5px;
}

.header p{
    margin:0;
    font-size:13px;
}

#status{
    padding:10px 15px;
    color:#666;
    font-size:13px;
}

#messages{
    height:450px;
    overflow-y:auto;
    padding:15px;
    background:#f8fafc;
}

.message{
    max-width:80%;
    padding:11px 14px;
    margin-bottom:10px;
    border-radius:14px;
    word-break:break-word;
}

.customer{
    background:#e5e7eb;
    color:#111;
    margin-right:auto;
}

.agent{
    background:#2563eb;
    color:white;
    margin-left:auto;
}

.sender{
    font-size:11px;
    opacity:.7;
    margin-bottom:4px;
}

.bottom{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid #ddd;
}

#messageInput{
    flex:1;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

#sendMessage{
    padding:0 18px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
}

#logout{
    margin:0 12px 15px;
    padding:10px 18px;
    border:0;
    border-radius:9px;
    background:#ef4444;
    color:white;
}

</style>
</head>


<body>


<div id="login">

<h2>👨‍💼 Operator paneli</h2>

<p>
Yalnız operator hesabları daxil ola bilər.
</p>

<br>

<button id="googleLogin">
Google ilə daxil ol
</button>

<div id="error"></div>

</div>



<div id="operatorPanel" style="display:none;">

<div class="header">

<h2>Operator 💬</h2>

<p id="operatorEmail"></p>

</div>


<div id="status">
🟢 Yazışmalar aktivdir
</div>


<div id="messages"></div>


<div class="bottom">

<input
    id="messageInput"
    type="text"
    placeholder="Mesajınızı yazın..."
>

<button id="sendMessage">
Göndər
</button>

</div>


<button id="logout">
Çıxış
</button>

</div>



<script type="module">


import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    set
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",

    authDomain:
    "kendmehsullari-6a53d.firebaseapp.com",

    databaseURL:
    "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",

    projectId:
    "kendmehsullari-6a53d",

    storageBucket:
    "kendmehsullari-6a53d.firebasestorage.app",

    messagingSenderId:
    "551607499773",

    appId:
    "1:551607499773:web:a84aa63dc5b55c38687794"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getDatabase(app);


const provider =
new GoogleAuthProvider();



/* =========================
   YALNIZ 2 OPERATOR
========================= */

const OPERATOR_EMAILS = [

    "ttik66006@gmail.com",

    "amallizad72@gmail.com"

];



/* =========================
   ELEMENTLƏR
========================= */

const login =
document.getElementById("login");

const panel =
document.getElementById("operatorPanel");

const errorBox =
document.getElementById("error");

const emailText =
document.getElementById("operatorEmail");

const messages =
document.getElementById("messages");

const input =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendMessage");

const operatorRef =
ref(db,"operatorOnline");

const messagesRef =
ref(db,"messages");


let currentOperator = null;

let messagesStarted = false;



/* =========================
   GOOGLE GİRİŞ
========================= */

document
.getElementById("googleLogin")
.onclick = async function(){

    errorBox.textContent = "";

    try{

        const result =
        await signInWithPopup(
            auth,
            provider
        );


        const user =
        result.user;


        const email =
        (user.email || "")
        .trim()
        .toLowerCase();


        /* MÜŞTƏRİDİR? */

        if(
            !OPERATOR_EMAILS.includes(
                email
            )
        ){

            await signOut(auth);

            errorBox.textContent =
            "❌ Bu hesab operator hesabı deyil.";

            return;

        }


        /* OPERATORUDUR */

        openOperator(user);

    }

    catch(error){

        console.error(error);

        errorBox.textContent =
        "❌ Giriş xətası: " +
        error.message;

    }

};



/* =========================
   OPERATOR PANELİ
========================= */

function openOperator(user){

    currentOperator =
    user;


    login.style.display =
    "none";


    panel.style.display =
    "block";


    emailText.textContent =
    "Operator: " +
    user.email;


    set(
        operatorRef,
        true
    );


    loadMessages();

}



/* =========================
   MESAJLARI OXU
========================= */

function loadMessages(){

    if(messagesStarted)
    return;


    messagesStarted =
    true;


    onChildAdded(
        messagesRef,
        function(snapshot){

            const data =
            snapshot.val();


            if(!data)
            return;


            const text =
            data.message ||
            data.text ||
            "";


            if(!text)
            return;


            const div =
            document.createElement(
                "div"
            );


            const sender =
            document.createElement(
                "div"
            );


            const textDiv =
            document.createElement(
                "div"
            );


            if(
                data.sender ===
                "customer"
            ){

                div.className =
                "message customer";

                sender.className =
                "sender";

                sender.textContent =
                "Müştəri";

            }

            else if(
                data.sender ===
                "agent"
            ){

                div.className =
                "message agent";

                sender.className =
                "sender";

                sender.textContent =
                data.email ||
                "Operator";

            }

            else{

                return;

            }


            textDiv.textContent =
            text;


            div.appendChild(
                sender
            );


            div.appendChild(
                textDiv
            );


            messages.appendChild(
                div
            );


            messages.scrollTop =
            messages.scrollHeight;

        }
    );

}



/* =========================
   MESAJ GÖNDƏR
========================= */

async function sendMessage(){

    const text =
    input.value.trim();


    if(
        !text ||
        !currentOperator
    )
    return;


    try{

        await push(
            messagesRef,
            {

                message:
                text,

                sender:
                "agent",

                email:
                currentOperator.email,

                time:
                Date.now()

            }
        );


        input.value =
        "";

        input.focus();

    }

    catch(error){

        alert(
            "❌ Mesaj göndərilmədi."
        );

    }

}


sendButton.onclick =
sendMessage;


input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);



/* =========================
   ÇIXIŞ
========================= */

document
.getElementById("logout")
.onclick =
async function(){

    await set(
        operatorRef,
        false
    );


    await signOut(auth);


    currentOperator =
    null;


    panel.style.display =
    "none";


    login.style.display =
    "block";


    messages.innerHTML =
    "";

    messagesStarted =
    false;

};



/* =========================
   ƏVVƏLDƏN GİRİŞ
========================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            login.style.display =
            "block";

            panel.style.display =
            "none";

            return;

        }


        const email =
        (user.email || "")
        .trim()
        .toLowerCase();


        /* MÜŞTƏRİDİR */

        if(
            !OPERATOR_EMAILS.includes(
                email
            )
        ){

            await signOut(auth);

            login.style.display =
            "block";

            panel.style.display =
            "none";

            errorBox.textContent =
            "❌ Bu hesab operator hesabı deyil.";

            return;

        }


        /* OPERATOR */

        openOperator(user);

    }
);

</script>

</body>
</html>
