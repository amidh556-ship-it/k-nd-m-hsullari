<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Operator paneli</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        .header {
            background: #2196f3;
            color: white;
            padding: 15px;
            text-align: center;
        }

        #login {
            text-align: center;
            padding: 30px;
        }

        #chat {
            display: none;
            max-width: 600px;
            margin: auto;
            background: white;
            height: 100vh;
            box-sizing: border-box;
        }

        #messages {
            height: calc(100vh - 150px);
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            padding: 10px;
            margin: 8px 0;
            border-radius: 10px;
            max-width: 80%;
        }

        .customer {
            background: #e0e0e0;
            margin-right: auto;
        }

        .agent {
            background: #2196f3;
            color: white;
            margin-left: auto;
        }

        .send {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        #sendButton {
            margin-left: 8px;
            padding: 12px 18px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 8px;
        }

        #loginButton {
            padding: 12px 20px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>Operator paneli</h2>
</div>

<div id="login">
    <p>Operator hesabı ilə daxil olun.</p>
    <button id="loginButton">Google ilə daxil ol</button>
</div>

<div id="chat">

    <div id="messages"></div>

    <div class="send">
        <input
            id="messageInput"
            type="text"
            placeholder="Mesaj yaz..."
        >

        <button id="sendButton">
            Göndər
        </button>
    </div>

</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {
    apiKey: "AIzaSyBDKe-57avB_Oajvq7PemHcl4LIxIv0ziY",
    authDomain: "kendmehsullari-6a53d.firebaseapp.com",
    databaseURL: "https://kendmehsullari-6a53d-default-rtdb.firebaseio.com",
    projectId: "kendmehsullari-6a53d",
    storageBucket: "kendmehsullari-6a53d.firebasestorage.app",
    messagingSenderId: "551607499773",
    appId: "1:551607499773:web:a84aa63dc5b55c38687794"
};


// OPERATOR HESABI
const OPERATOR_EMAIL = "ttik66006@gmail.com";


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();


const login = document.getElementById("login");

const chat = document.getElementById("chat");

const messages = document.getElementById("messages");

const messageInput = document.getElementById("messageInput");

const sendButton = document.getElementById("sendButton");

const loginButton = document.getElementById("loginButton");


/* GOOGLE İLƏ GİRİŞ */

loginButton.onclick = async () => {

    try {

        await signInWithPopup(auth, provider);

    } catch (error) {

        alert("Giriş alınmadı: " + error.message);

    }

};


/* HESAB YOXLAMASI */

onAuthStateChanged(auth, async (user) => {

    if (!user) {
        return;
    }

    if (
        user.email.toLowerCase() !==
        OPERATOR_EMAIL.toLowerCase()
    ) {

        alert("Bu hesab operator hesabı deyil.");

        return;
    }


    // Operator panelini göstər

    login.style.display = "none";

    chat.style.display = "block";


    // Operatorun online olduğunu bildir

    await set(
        ref(db, "operatorOnline"),
        true
    );


    // Mesajları göstər

    onChildAdded(
        ref(db, "messages"),
        (snapshot) => {

            const data = snapshot.val();

            if (!data || !data.message) {
                return;
            }


            const div =
                document.createElement("div");


            div.classList.add("message");


            if (data.sender === "agent") {

                div.classList.add("agent");

                div.textContent =
                    "Siz: " + data.message;

            } else {

                div.classList.add("customer");

                div.textContent =
                    "Müştəri: " + data.message;

            }


            messages.appendChild(div);


            messages.scrollTop =
                messages.scrollHeight;

        }
    );

});


/* MESAJ GÖNDƏR */

async function sendMessage() {

    const message =
        messageInput.value.trim();


    if (!message) {
        return;
    }


    await push(
        ref(db, "messages"),
        {
            message: message,
            sender: "agent",
            email: OPERATOR_EMAIL,
            time: Date.now()
        }
    );


    messageInput.value = "";

}


sendButton.onclick = sendMessage;


messageInput.addEventListener(
    "keydown",
    (event) => {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);

</script>

</body>
</html>
