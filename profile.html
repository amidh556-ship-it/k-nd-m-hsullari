<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profilim - Kənd məhsulları</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .profile-page {
            max-width: 500px;
            margin: auto;
            min-height: 100vh;
        }

        /* YUXARI PROFİL */

        .profile-top {
            background: white;
            padding: 30px 20px 25px;
            text-align: center;
        }

        #userPhoto {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 12px;
            border: 3px solid #eee;
        }

        #userName {
            display: block;
            font-size: 22px;
            font-weight: bold;
        }

        #userEmail {
            display: block;
            margin-top: 6px;
            color: #777;
            font-size: 14px;
        }

        /* MENYU */

        .menu {
            background: white;
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .menu a {
            text-decoration: none;
            color: #222;
            text-align: center;
            padding: 18px 5px;
            border-right: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .menu a:nth-child(3n) {
            border-right: none;
        }

        .menu-icon {
            display: block;
            font-size: 25px;
            margin-bottom: 7px;
        }

        .menu-text {
            font-size: 13px;
        }

        /* MƏLUMATLAR */

        .information {
            background: white;
            margin-top: 10px;
            padding: 20px;
        }

        .information h2 {
            margin-top: 0;
            font-size: 19px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        #saveBtn {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        #logoutBtn {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #e53935;
            color: white;
            font-size: 16px;
        }

        .back {
            display: block;
            text-align: center;
            padding: 20px;
            color: #333;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="profile-page">

    <!-- PROFİLİN YUXARISI -->

    <div class="profile-top">

        <img id="userPhoto" src="" alt="Profil şəkli">

        <span id="userName">Müştəri</span>

        <span id="userEmail"></span>

    </div>


    <!-- TEMU KİMİ MENYU -->

    <div class="menu">

        <a href="orders.html">

            <span class="menu-icon">📦</span>

            <span class="menu-text">
                Sifarişlərim
            </span>

        </a>


        <a href="sebet.html">

            <span class="menu-icon">🛒</span>

            <span class="menu-text">
                Səbətim
            </span>

        </a>


        <a href="comments.html">

            <span class="menu-icon">💬</span>

            <span class="menu-text">
                Yorumlarım
            </span>

        </a>


        <a href="#address">

            <span class="menu-icon">📍</span>

            <span class="menu-text">
                Ünvanlarım
            </span>

        </a>


        <a href="#favorites">

            <span class="menu-icon">❤️</span>

            <span class="menu-text">
                Seçilmişlər
            </span>

        </a>


        <a href="history.html">

            <span class="menu-icon">🕘</span>

            <span class="menu-text">
                Tarixçə
            </span>

        </a>

    </div>


    <!-- ŞƏXSİ MƏLUMATLAR -->

    <div class="information">

        <h2>👤 Şəxsi məlumatlar</h2>

        <input
            type="text"
            id="firstName"
            placeholder="Ad"
        >

        <input
            type="text"
            id="lastName"
            placeholder="Soyad"
        >

        <input
            type="tel"
            id="phone"
            placeholder="Telefon nömrəsi"
        >

        <input
            type="text"
            id="address"
            placeholder="Çatdırılma ünvanı"
        >

        <input
            type="text"
            id="city"
            placeholder="Şəhər / Rayon"
        >


        <button
            id="saveBtn"
            onclick="saveProfile()"
        >
            💾 Məlumatları yadda saxla
        </button>


        <button
            id="logoutBtn"
            onclick="logout()"
        >
            🚪 Çıxış et
        </button>

    </div>


    <a class="back" href="index.html">
        ← Ana səhifəyə qayıt
    </a>

</div>


<script>

window.onload = function () {

    const login =
        localStorage.getItem("login");

    const name =
        localStorage.getItem("userName");

    const email =
        localStorage.getItem("userEmail");

    const photo =
        localStorage.getItem("userPhoto");


    /* GİRİŞ YOXDURSA */

    if (login !== "true") {

        window.location.href = "kent.html";

        return;
    }


    /* PROFİL */

    document.getElementById("userName").innerText =
        name || "Müştəri";


    document.getElementById("userEmail").innerText =
        email || "";


    /* GOOGLE ŞƏKLİ */

    if (photo) {

        document.getElementById("userPhoto").src =
            photo;

    }


    /* YADDA SAXLANMIŞ MƏLUMATLAR */

    document.getElementById("firstName").value =
        localStorage.getItem("firstName") || name || "";


    document.getElementById("lastName").value =
        localStorage.getItem("lastName") || "";


    document.getElementById("phone").value =
        localStorage.getItem("phone") || "";


    document.getElementById("address").value =
        localStorage.getItem("address") || "";


    document.getElementById("city").value =
        localStorage.getItem("city") || "";

};


/* MƏLUMATLARI YADDA SAXLA */

function saveProfile() {

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const address =
        document.getElementById("address").value.trim();

    const city =
        document.getElementById("city").value.trim();


    localStorage.setItem(
        "firstName",
        firstName
    );

    localStorage.setItem(
        "lastName",
        lastName
    );

    localStorage.setItem(
        "phone",
        phone
    );

    localStorage.setItem(
        "address",
        address
    );

    localStorage.setItem(
        "city",
        city
    );


    alert("✅ Məlumatlar yadda saxlanıldı!");

}


/* ÇIXIŞ */

function logout() {

    localStorage.removeItem("login");
    localStorage.removeItem("userName");
    localStorage.removeItem("userEmail");
    localStorage.removeItem("userPhoto");

    localStorage.removeItem("firstName");
    localStorage.removeItem("lastName");
    localStorage.removeItem("phone");
    localStorage.removeItem("address");
    localStorage.removeItem("city");

    localStorage.removeItem("operator");

    window.location.href = "index.html";

}

</script>

</body>
</html>
